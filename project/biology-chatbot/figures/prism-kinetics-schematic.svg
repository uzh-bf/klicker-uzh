<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic qualitative kinetics teaching schematic</title>
  <desc id="desc">Two fictional series are plotted at six synthetic substrate-concentration positions. Points are connected by guide-to-eye lines with no fit, uncertainty, or statistical output.</desc>
  <rect width="900" height="540" fill="#f8fafc"/>
  <rect x="28" y="24" width="844" height="492" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="56" y="62" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Synthetic qualitative kinetics plot</text>
  <text x="56" y="88" font-family="Arial, sans-serif" font-size="15" fill="#475569">Defined fictional points; guide-to-eye lines only. No fit, error bars, or statistics.</text>

  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="140" y1="360" x2="760" y2="360"/><line x1="140" y1="280" x2="760" y2="280"/><line x1="140" y1="200" x2="760" y2="200"/><line x1="140" y1="120" x2="760" y2="120"/>
    <line x1="150" y1="100" x2="150" y2="360"/><line x1="170" y1="100" x2="170" y2="360"/><line x1="210" y1="100" x2="210" y2="360"/><line x1="290" y1="100" x2="290" y2="360"/><line x1="440" y1="100" x2="440" y2="360"/><line x1="740" y1="100" x2="740" y2="360"/>
  </g>
  <line x1="140" y1="360" x2="760" y2="360" stroke="#334155" stroke-width="2"/>
  <line x1="140" y1="100" x2="140" y2="360" stroke="#334155" stroke-width="2"/>
  <text x="450" y="410" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#334155">substrate concentration (linear synthetic units)</text>
  <text x="47" y="240" transform="rotate(-90 47 240)" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#334155">relative rate (synthetic units)</text>
  <text x="108" y="365" font-family="Arial, sans-serif" font-size="13" text-anchor="end" fill="#64748b">0</text>
  <text x="108" y="285" font-family="Arial, sans-serif" font-size="13" text-anchor="end" fill="#64748b">1</text>
  <text x="108" y="205" font-family="Arial, sans-serif" font-size="13" text-anchor="end" fill="#64748b">2</text>
  <text x="108" y="125" font-family="Arial, sans-serif" font-size="13" text-anchor="end" fill="#64748b">3</text>
  <g font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#64748b">
    <text x="150" y="380">0.1</text><text x="210" y="380">0.7</text><text x="290" y="380">1.5</text><text x="440" y="380">3</text><text x="740" y="380">6</text>
  </g>

  <polyline points="150,336 170,288 210,232 290,184 440,152 740,136" fill="none" stroke="#2563eb" stroke-width="3"/>
  <polyline points="150,344 170,312 210,272 290,232 440,208 740,200" fill="none" stroke="#ea580c" stroke-width="3"/>
  <g fill="#2563eb" stroke="#ffffff" stroke-width="2">
    <circle cx="150" cy="336" r="6"/><circle cx="170" cy="288" r="6"/><circle cx="210" cy="232" r="6"/><circle cx="290" cy="184" r="6"/><circle cx="440" cy="152" r="6"/><circle cx="740" cy="136" r="6"/>
  </g>
  <g fill="#ea580c" stroke="#ffffff" stroke-width="2">
    <circle cx="150" cy="344" r="6"/><circle cx="170" cy="312" r="6"/><circle cx="210" cy="272" r="6"/><circle cx="290" cy="232" r="6"/><circle cx="440" cy="208" r="6"/><circle cx="740" cy="200" r="6"/>
  </g>

  <rect x="590" y="54" width="210" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <circle cx="612" cy="78" r="6" fill="#2563eb"/><text x="628" y="83" font-family="Arial, sans-serif" font-size="14" fill="#1e3a8a">Series A</text>
  <circle cx="612" cy="99" r="6" fill="#ea580c"/><text x="628" y="104" font-family="Arial, sans-serif" font-size="14" fill="#9a3412">Series B</text>

  <rect x="56" y="438" width="764" height="54" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="76" y="471" font-family="Arial, sans-serif" font-size="14" fill="#1e3a8a">Synthetic fixture: guide-to-eye lines only; no fitted statistics.</text>
  <text x="56" y="505" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Fictional teaching diagram — not a screenshot, real experiment, or mechanism claim.</text>
</svg>
