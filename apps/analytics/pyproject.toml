[project]
name = "klicker-uzh-analytics"
version = "0.0.1"
description = "Learning analytics service for KlickerUZH."
authors = [
  { name = "Roland Schlaefli", email = "roland.schlaefli@df.uzh.ch" },
  { name = "Julius Schlapbach", email = "julius.schlapbach@df.uzh.ch" },
]
license = "AGPL-3.0"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
  "jinja2==3.1.6",
  "pandas==2.2.2",
  "prisma==0.15.0",
  "xlsxwriter==3.2.0",
]

[dependency-groups]
dev = [
  "ipykernel==6.29.5",
  "pyright==1.1.376",
]

[tool.uv]
package = false
exclude-newer = "14d"

[tool.pyright]
typeCheckingMode = "strict"
