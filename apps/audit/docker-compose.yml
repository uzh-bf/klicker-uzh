version: '3.8'

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: audit-azurite
    hostname: azurite
    restart: always
    ports:
      - "10000:10000"  # Blob service
      - "10001:10001"  # Queue service  
      - "10002:10002"  # Table service
    command: >
      azurite
      --tableHost 0.0.0.0
      --blobHost 0.0.0.0
      --queueHost 0.0.0.0
      --location /data
      --debug /data/debug.log
    volumes:
      - azurite-data:/data
    environment:
      - AZURITE_ACCOUNTS=devstoreaccount1

volumes:
  azurite-data:
    name: audit-azurite-data