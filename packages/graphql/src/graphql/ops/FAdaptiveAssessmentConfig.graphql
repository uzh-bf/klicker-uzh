fragment FAdaptiveAssessmentConfig on AdaptiveAssessment {
  id
  name
  displayName
  description
  status
  questionThreshold
  standardErrorThreshold
  discrimination
  thetaMin
  thetaMax
  topInformationRatio
  showTimer
  showCompetenceNames
  showFinalResult
  showSolutions
  levels {
    id
    label
    order
  }
  competences {
    id
    name
    tagName
    enabled
    order
    weight
    questionThreshold
    standardErrorThreshold
    subCompetences {
      id
      name
      tagName
      enabled
      order
      questionThreshold
      standardErrorThreshold
    }
  }
  elements {
    id
    enabled
    exposure
    discrimination
    elementId
    element {
      ... on ChoicesElement {
        id
        name
        type
        options {
          choices {
            ix
          }
        }
        createdAt
        updatedAt
        tags {
          id
          name
        }
      }
      ... on FreeTextElement {
        id
        name
        type
        createdAt
        updatedAt
        tags {
          id
          name
        }
      }
    }
    level {
      label
    }
    competence {
      name
    }
    subCompetence {
      name
    }
  }
  resultMessages {
    id
    order
    message
    minTheta
    maxTheta
    isFallback
    level {
      label
    }
  }
  updatedAt
}
