query GetPendingChatbotPublications {
  getPendingChatbotPublications {
    ownerShortname
    ownerEmail
    ownerPublishingEnabled
    disclaimerTitle
    disclaimerIntroText
    tools {
      serverName
      chatMode
      enabled
      allowedTools
    }
    chatbot {
      id
      name
      description
      status
      updatedAt
      publicationUseCase
      expectedStudentCount
      creditInitialCredits
      creditResetPeriod
      creditResetAmount
      creditMaxCredits
      modelSelection
      allowedModelIds
      allowedReasoningEffortsByModel {
        modelId
        efforts
      }
      standardModeConfig {
        tutorEnabled
        explainerEnabled
        quizzerEnabled
        courseName
        subjectDomain
        languageOfInstruction
        scopeNote
      }
      courses {
        id
        name
      }
    }
  }
  getChatModelRegistry {
    id
    name
  }
}
