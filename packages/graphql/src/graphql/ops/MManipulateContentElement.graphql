mutation ManipulateContentElement(
  $id: Int
  $status: ElementStatus
  $name: String
  $content: String
  $basePoints: Boolean
  $pointsMultiplier: Int
  $tags: [String!]
) {
  manipulateContentElement(
    id: $id
    status: $status
    name: $name
    content: $content
    basePoints: $basePoints
    pointsMultiplier: $pointsMultiplier
    tags: $tags
  ) {
    __typename
    ... on ContentElement {
      id
      name
      status
      type
      content
      basePoints
      pointsMultiplier
      tags {
        id
        name
      }
    }
  }
}
