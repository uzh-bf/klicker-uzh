query GetUserCourses {
  userCourses {
    id
    name
    displayName
    color
    pinCode
    isArchived
    isGamificationEnabled
    isAssessmentEnabled
    isGroupCreationEnabled
    description
    startDate
    endDate
    createdAt
    updatedAt

    derivedAccess
    numSharedUsers
    permissionLevel
    isOwner
    isManager
    isEditor
    isShared
    isRemovable
  }
}
