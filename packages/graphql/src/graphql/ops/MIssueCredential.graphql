mutation MIssueCredential($courseId: String!) {
  issueAssessmentReport(courseId: $courseId) {
    token
    status
    issuedAt
    snapshot {
      version
      subject {
        email
        source
      }
      course {
        id
        name
        displayName
      }
      results {
        basePoints
        availableBasePoints
        correctnessPoints
        availableCorrectnessPoints
        bonusPoints
        availableBonusPoints
        totalPoints
        availableTotalPoints
      }
      comparison {
        cohortSize
        percentile
        histogram {
          binStart
          binEnd
          count
        }
      }
    }
  }
}
