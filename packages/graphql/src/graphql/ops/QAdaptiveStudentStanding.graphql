query QAdaptiveStudentStanding($assessmentId: String!) {
  adaptiveStudentStanding(assessmentId: $assessmentId) {
    attemptId
    assessmentId
    assessmentName
    startedAt
    completedAt
    answeredQuestions
    theta
    standardError
    levelLabel
    message
    messages
    competences {
      competenceId
      competenceName
      weight
      theta
      standardError
      levelLabel
      answeredQuestions
      subCompetences {
        subCompetenceId
        subCompetenceName
        theta
        standardError
        levelLabel
        answeredQuestions
      }
    }
  }
}
