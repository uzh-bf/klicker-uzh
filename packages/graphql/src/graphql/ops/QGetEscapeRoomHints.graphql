query GetEscapeRoomHints(
  $practiceQuizId: String
  $microLearningId: String
  $groupActivityId: String
) {
  escapeRoomHints(
    practiceQuizId: $practiceQuizId
    microLearningId: $microLearningId
    groupActivityId: $groupActivityId
  ) {
    instanceId
    hint
    hints {
      text
      penalty
    }
  }
}
