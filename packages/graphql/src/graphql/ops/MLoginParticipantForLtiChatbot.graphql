mutation LoginParticipantForLtiChatbot(
  $signedLtiData: String!
  $courseId: String!
  $chatbotId: String!
  $participantToken: String
) {
  loginParticipantForLtiChatbot(
    signedLtiData: $signedLtiData
    courseId: $courseId
    chatbotId: $chatbotId
    participantToken: $participantToken
  ) {
    status
    participantId
    participantToken
  }
}
