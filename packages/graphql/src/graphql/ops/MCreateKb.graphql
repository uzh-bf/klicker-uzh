mutation CreateKb(
  $name: String!
  $description: String
  $domainPolicyId: String
  $domainPolicyVersion: Int
  $domainPolicyLanguage: String
) {
  createKb(
    name: $name
    description: $description
    domainPolicyId: $domainPolicyId
    domainPolicyVersion: $domainPolicyVersion
    domainPolicyLanguage: $domainPolicyLanguage
  ) {
    id
  }
}
