query GetCourseLeaderboard(
  $courseId: String!
  $courseSelection: Boolean!
  $weeklySelection: Boolean!
  $rollingSelection: Boolean!
  $customSelection: Boolean!
  $startDate: String
  $endDate: String
  $days: Int
) {
  getCourseLeaderboard(
    courseId: $courseId
    courseSelection: $courseSelection
    weeklySelection: $weeklySelection
    rollingSelection: $rollingSelection
    customSelection: $customSelection
    startDate: $startDate
    endDate: $endDate
    days: $days
  ) {
    leaderboard {
      id
      score
      rank
      username
      email
      avatar
    }

    numOfActiveParticipants
    averageActiveScore
    computedAt
  }
}
