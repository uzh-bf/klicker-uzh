query GetSingleElementInstance($id: Int!) {
  getSingleElementInstance(id: $id) {
    id
    type
    elementType
    ...ElementData

    codeAuthoringData {
      id
      elementId
      name
      type
      content
      explanation
      basePoints
      pointsMultiplier
      options {
        language
        starterCode
        sampleSolution
        entrypoint
        hasSampleSolution
        executionLimits {
          perTestTimeoutSeconds
        }
        testCases {
          id
          name
          args
          expectedOutput
          visibility
          weight
        }
      }
    }
  }
}
