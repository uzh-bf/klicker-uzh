query GetAssessmentParticipantInvitationPage(
  $courseId: String!
  $numEntries: Int
  $offset: Int
) {
  assessmentParticipantInvitationPage(
    courseId: $courseId
    numEntries: $numEntries
    offset: $offset
  ) {
    totalCount
    invitations {
      id
      email
      matriculationNumber
      status
      invitedAt
      acceptedAt
    }
  }
}
