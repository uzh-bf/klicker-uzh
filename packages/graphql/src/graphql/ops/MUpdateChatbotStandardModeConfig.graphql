mutation MUpdateChatbotStandardModeConfig(
  $chatbotId: String!
  $config: ChatbotStandardModeConfigInput!
) {
  updateChatbotStandardModeConfig(chatbotId: $chatbotId, config: $config) {
    id
    writingCoachUnavailableReason
    standardModeConfig {
      tutorEnabled
      explainerEnabled
      quizzerEnabled
      writingCoachEnabled
      courseName
      subjectDomain
      languageOfInstruction
      scopeNote
    }
  }
}
