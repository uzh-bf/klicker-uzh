mutation CreateLiveQuiz(
  $name: String!
  $displayName: String!
  $description: String
  $blocks: [ElementBlockInput!]!
  $courseId: String
  $multiplier: Int!
  $defaultPoints: Int!
  $defaultCorrectPoints: Int!
  $maxBonusPoints: Int!
  $timeToZeroBonus: Int!
  $isGamificationEnabled: Boolean!
  $isPinProtected: Boolean!
  $isConfusionFeedbackEnabled: Boolean!
  $isLiveQAEnabled: Boolean!
  $isModerationEnabled: Boolean!
  $responseCollectionMode: LiveQuizResponseCollectionMode
) {
  createLiveQuiz(
    name: $name
    displayName: $displayName
    description: $description
    blocks: $blocks
    courseId: $courseId
    multiplier: $multiplier
    defaultPoints: $defaultPoints
    defaultCorrectPoints: $defaultCorrectPoints
    maxBonusPoints: $maxBonusPoints
    timeToZeroBonus: $timeToZeroBonus
    isGamificationEnabled: $isGamificationEnabled
    isPinProtected: $isPinProtected
    isConfusionFeedbackEnabled: $isConfusionFeedbackEnabled
    isLiveQAEnabled: $isLiveQAEnabled
    isModerationEnabled: $isModerationEnabled
    responseCollectionMode: $responseCollectionMode
  ) {
    ...ActivityInfoData
  }
}
