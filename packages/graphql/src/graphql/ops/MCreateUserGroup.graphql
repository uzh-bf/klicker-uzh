mutation CreateUserGroup($name: String!, $members: [UserGroupMembersInput!]!) {
  createUserGroup(name: $name, members: $members) {
    id
    name
    members {
      id
      shortname
      email
    }
    admins {
      id
      shortname
      email
    }
    owner {
      id
      shortname
      email
    }
    numOfMembers
    isMember
    isAdmin
    isOwner
  }
}
