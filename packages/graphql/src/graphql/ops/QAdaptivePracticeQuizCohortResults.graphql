query QAdaptivePracticeQuizCohortResults($practiceQuizId: String!) {
  adaptivePracticeQuizCohortResults(practiceQuizId: $practiceQuizId) {
    practiceQuizId
    cohortSize
    suppressed
    attemptSummary {
      suppressed
      suppressions {
        field
        reason
      }
      classified
      capped
      poolExhausted
      stoppedInsufficientData
      insufficientData
      nearBoundary
    }
    pilotMetrics {
      suppressed
      suppressions {
        field
        reason
      }
      medianQuestionCount
      p95QuestionCount
      medianElapsedSeconds
      p95ElapsedSeconds
      nearBoundaryRate
      responseCountMismatchDetected
      durationMissingDetected
    }
    itemDiagnostics {
      poolItemId
      elementName
      elementType
      nodeNamePath
      levelLabel
      suppressed
      suppressions {
        field
        reason
      }
      responseCount
      exposureRate
      observedCorrectRate
      expectedCorrectRate
      residual
      highExposure
      misfitFlag
    }
    distributions {
      nodeId
      parentNodeId
      nodeName
      nodeKind
      depth
      order
      suppressed
      suppressions {
        field
        reason
      }
      insufficientDataCount
      buckets {
        levelLabel
        levelOrder
        count
      }
    }
  }
}
