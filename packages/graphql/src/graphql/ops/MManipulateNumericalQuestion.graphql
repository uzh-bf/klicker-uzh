mutation ManipulateNumericalQuestion(
  $id: Int
  $status: ElementStatus
  $name: String
  $content: String
  $explanation: String
  $options: OptionsNumericalInput
  $basePoints: Boolean
  $pointsMultiplier: Int
  $tags: [String!]
) {
  manipulateNumericalQuestion(
    id: $id
    status: $status
    name: $name
    content: $content
    explanation: $explanation
    options: $options
    basePoints: $basePoints
    pointsMultiplier: $pointsMultiplier
    tags: $tags
  ) {
    __typename
    ... on NumericalElement {
      id
      name
      status
      type
      content
      explanation
      basePoints
      pointsMultiplier
      options {
        hasSampleSolution
        accuracy
        placeholder
        unit
        restrictions {
          min
          max
        }
        solutionRanges {
          min
          max
        }
        exactSolutions
      }
      parametrization {
        variables {
          name
          kind
          min
          max
          step
          values
          decimals
        }
        derived {
          name
          formula
          decimals
        }
        solution {
          formula
          tolerance
        }
        numberFormat
      }
      mistakes {
        key
        label
        feedback
        formula
        tolerance
      }
      tags {
        id
        name
      }
    }
  }
}
