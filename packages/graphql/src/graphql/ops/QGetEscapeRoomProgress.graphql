query GetEscapeRoomProgress(
  $practiceQuizId: String
  $microLearningId: String
  $groupActivityId: String
  $liveQuizId: String
  $elementBlockId: Int
) {
  escapeRoomProgress(
    practiceQuizId: $practiceQuizId
    microLearningId: $microLearningId
    groupActivityId: $groupActivityId
    liveQuizId: $liveQuizId
    elementBlockId: $elementBlockId
  ) {
    activityId
    totalStacks
    timeLimit
    projectorDigest
    attempts {
      id
      participantId
      groupId
      displayName
      avatar
      status
      startedAt
      completedAt
      lockoutUntil
      penaltySeconds
      hintsUsedCount
      clearedStacks
      timeSpentSeconds
      rank
      solvedStages
      revealedStages
      skippedStages
      bonusCorrect
      rankedSeconds
    }
    stages {
      stageKey
      title
      isBonus
      solved
      revealed
      skipped
      attemptedNotCleared
      notReached
      wrongAttempts
      hintsUsed
      bonusCorrect
      bonusWrong
      debrief
    }
  }
}
