query GetAnswerCollections {
  getAnswerCollections {
    __typename
    answerCollections {
      id
      name
      access
      description
      numSharedUsers
      entries {
        id
        value
      }
    }
    sharedCollections {
      id
      name
      access
      description
      ownerShortname
      entries {
        id
        value
      }
    }
    requestedCollections {
      id
      name
      access
      description
      ownerShortname
    }
  }
}
