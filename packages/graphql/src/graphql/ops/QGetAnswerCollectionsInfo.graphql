query GetAnswerCollectionsInfo {
  getAnswerCollectionsInfo {
    id
    name
    description
    ownerShortname
    numSharedUsers
    numOfEntries
    permissionLevel

    isOwner
    isManager
    isEditor
    isImported
    isShared
    isDeletable
    isRemovable
    sharingType

    createdAt
    updatedAt
  }
}
