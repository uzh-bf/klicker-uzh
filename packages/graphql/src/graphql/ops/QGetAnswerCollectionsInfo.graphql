query GetAnswerCollectionsInfo {
  getAnswerCollectionsInfo {
    id
    name
    access
    accessType
    sharingStatus
    sharingLevel
    description
    ownerShortname
    numSharedUsers
    numOfEntries

    isOwner
    isImported
    isEditable
    isShareable
    isRemovable
    isDeletionAllowed
  }
}
