query GetUserKbs($first: Int, $after: String, $search: String) {
  getUserKbsConnection(first: $first, after: $after, search: $search) {
    items {
      id
      name
      description
      domainPolicyId
      domainPolicyLanguage
      metrics {
        visibleResourceCount
        visibleSizeBytes
        linkedConsumerCount
      }
      materialsReadiness {
        visibleResourceCount
        servingResourceCount
        processingResourceCount
        failedResourceCount
      }
      questionPreparation {
        state
        pendingReason
        hasBasis
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}
