query GetKbKnowledgeGraphDomainConfig($kbId: ID!) {
  getKbKnowledgeGraphDomainConfig(kbId: $kbId) {
    capabilityEnabled
    catalogRevision
    catalogDigest
    options {
      id
      version
      labelKey
      languages {
        language
        categories {
          name
          definition
        }
      }
    }
  }
  getKbKnowledgeGraphConfig(kbId: $kbId) {
    kbId
    isEnabled
    buildId
    status
    statusMessage
    qualityTier
    domainPolicyId
    domainPolicyVersion
    domainPolicyLanguage
    publishedDomainPolicyId
    publishedDomainPolicyVersion
    publishedDomainPolicyLanguage
    domainCategories {
      name
      definition
    }
    sourceContentDigest
    activeBuildId
    publishedBuildId
    elementGenerationReady
    isStale
    startedAt
    finishedAt
    createdAt
    updatedAt
    costConfigurationReady
    costCurrency
    quotaCurrency
    billingLabel
    standardEstimateMinorUnits
    highEstimateMinorUnits
    estimatedCostMinorUnits
    actualCostMinorUnits
    actualInputTokens
    actualOutputTokens
    actualEmbeddingTokens
    actualRequestCount
    maxCostMinorUnits
    costStatus
    semesterKey
    semesterQuotaMinorUnits
    semesterReservedMinorUnits
    semesterSettledMinorUnits
    remainingSemesterQuotaMinorUnits
    worstCaseRemainingMinorUnits
  }
}
