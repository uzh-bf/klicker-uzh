query ElementGenerationCapabilities {
  elementGenerationCapabilities {
    elementTypes
    languages
    bloomLevels
    difficultyLevels
    supportsIndividualRegeneration
    configured
    typeCapabilities {
      elementType
      reviewGates
      supportsSourceScopes
      supportsDifficulty
      supportsBloomLevels
      supportsRetry
      supportsIncompletePublication
    }
  }
}
