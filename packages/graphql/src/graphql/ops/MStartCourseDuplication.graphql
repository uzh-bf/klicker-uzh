mutation StartCourseDuplication(
  $name: String!
  $displayName: String!
  $description: String
  $color: String
  $startDate: Date!
  $endDate: Date!
  $isGroupCreationEnabled: Boolean!
  $groupDeadlineDate: Date!
  $maxGroupSize: Int!
  $preferredGroupSize: Int!
  $language: LocaleType!
  $notificationEmail: String
  $isGamificationEnabled: Boolean
  $sourceCourseId: String!
  $duplicateLiveQuizzes: Boolean
  $duplicatePracticeQuizzes: Boolean
  $duplicateMicrolearnings: Boolean
  $duplicateGroupActivities: Boolean
) {
  startCourseDuplication(
    name: $name
    displayName: $displayName
    description: $description
    color: $color
    startDate: $startDate
    endDate: $endDate
    isGroupCreationEnabled: $isGroupCreationEnabled
    groupDeadlineDate: $groupDeadlineDate
    maxGroupSize: $maxGroupSize
    preferredGroupSize: $preferredGroupSize
    language: $language
    notificationEmail: $notificationEmail
    isGamificationEnabled: $isGamificationEnabled
    sourceCourseId: $sourceCourseId
    duplicateLiveQuizzes: $duplicateLiveQuizzes
    duplicatePracticeQuizzes: $duplicatePracticeQuizzes
    duplicateMicrolearnings: $duplicateMicrolearnings
    duplicateGroupActivities: $duplicateGroupActivities
  ) {
    id
    status
    sourceCourseId
    sourceCourseName
    targetCourseName
    createdCourseId
    errorType
    errorMessage
    createdAt
    updatedAt
  }
}
