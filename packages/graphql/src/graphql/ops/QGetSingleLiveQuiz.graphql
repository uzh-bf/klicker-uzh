query GetSingleLiveQuiz($quizId: String!) {
  liveQuiz(id: $quizId) {
    id
    name
    status
    displayName
    description
    blocks {
      id
      order
      status
      timeLimit
      randomSelection
      elements {
        id
        type
        elementType
        ...ElementData
      }
    }
    course {
      id
    }
    pointsMultiplier
    defaultPoints
    defaultCorrectPoints
    maxBonusPoints
    timeToZeroBonus
    isGamificationEnabled
    isAssessmentEnabled
    responseCollectionMode
    pinCode
    isLiveQAEnabled
    isConfusionFeedbackEnabled
    isModerationEnabled
  }
}
