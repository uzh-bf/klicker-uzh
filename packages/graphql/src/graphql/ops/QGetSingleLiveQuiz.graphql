query GetSingleLiveQuiz($quizId: String!) {
  escapeRoomHints(liveQuizId: $quizId) {
    instanceId
    hint
  }
  liveQuiz(id: $quizId) {
    id
    name
    displayName
    description
    blocks {
      id
      order
      status
      timeLimit
      randomSelection
      escapeRoomConfig {
        timeLimit
        hintPenalty
        introText
      }
      elements {
        id
        type
        elementType
        ...ElementData
      }
    }
    course {
      id
    }
    pointsMultiplier
    defaultPoints
    defaultCorrectPoints
    maxBonusPoints
    timeToZeroBonus
    isGamificationEnabled
    isAssessmentEnabled
    pinCode
    isLiveQAEnabled
    isConfusionFeedbackEnabled
    isModerationEnabled
  }
}
