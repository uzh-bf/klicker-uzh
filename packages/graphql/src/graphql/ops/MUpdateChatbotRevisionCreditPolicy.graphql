mutation MUpdateChatbotRevisionCreditPolicy(
  $chatbotId: String!
  $expectedRevisionVersion: Int!
  $creditInitialCredits: Int!
  $creditResetPeriod: CreditResetPeriod!
  $creditResetAmount: Int!
  $creditMaxCredits: Int!
) {
  updateChatbotRevisionCreditPolicy(
    chatbotId: $chatbotId
    expectedRevisionVersion: $expectedRevisionVersion
    creditInitialCredits: $creditInitialCredits
    creditResetPeriod: $creditResetPeriod
    creditResetAmount: $creditResetAmount
    creditMaxCredits: $creditMaxCredits
  ) {
    id
    status
    revisionStatus
    revisionVersion
    authoringRevision {
      ...ChatbotAuthoringRevisionData
    }
  }
}
