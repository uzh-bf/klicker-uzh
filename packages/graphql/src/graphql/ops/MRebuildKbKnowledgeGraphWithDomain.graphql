mutation RebuildKbKnowledgeGraphWithDomain(
  $kbId: ID!
  $qualityTier: KBGraphQualityTier
  $focusTopic: String
) {
  rebuildKbKnowledgeGraphWithDomain(
    kbId: $kbId
    qualityTier: $qualityTier
    focusTopic: $focusTopic
  ) {
    kbId
    isEnabled
    buildId
    status
    statusMessage
    qualityTier
    domainPolicyId
    domainPolicyVersion
    domainPolicyLanguage
    focusTopic
    publishedDomainPolicyId
    publishedDomainPolicyVersion
    publishedDomainPolicyLanguage
    domainCategories {
      name
      definition
    }
    sourceContentDigest
    activeBuildId
    publishedBuildId
    elementGenerationReady
    isStale
    startedAt
    finishedAt
    createdAt
    updatedAt
    costConfigurationReady
    costCurrency
    quotaCurrency
    billingLabel
    standardEstimateMinorUnits
    highEstimateMinorUnits
    estimatedCostMinorUnits
    actualCostMinorUnits
    actualInputTokens
    actualOutputTokens
    actualEmbeddingTokens
    actualRequestCount
    maxCostMinorUnits
    costStatus
    semesterKey
    semesterQuotaMinorUnits
    semesterReservedMinorUnits
    semesterSettledMinorUnits
    remainingSemesterQuotaMinorUnits
    worstCaseRemainingMinorUnits
  }
}
