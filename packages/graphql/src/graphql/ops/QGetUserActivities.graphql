query GetUserActivities(
  $statusFilter: [PublicationStatus!]
  $activityTypeFilter: ActivityType
  $courseId: String
  $withoutCourse: Boolean
  $searchString: String
  $showOwned: Boolean
  $showShared: Boolean
  $showDependencies: Boolean
  $multiplier: Int
  $reviewStatus: ReviewStatus
  $sortByType: SortByType!
  $sortByAsc: Boolean!
  $numEntries: Int
  $offset: Int
) {
  userActivities(
    statusFilter: $statusFilter
    activityTypeFilter: $activityTypeFilter
    courseId: $courseId
    withoutCourse: $withoutCourse
    searchString: $searchString
    showOwned: $showOwned
    showShared: $showShared
    showDependencies: $showDependencies
    multiplier: $multiplier
    reviewStatus: $reviewStatus
    sortByType: $sortByType
    sortByAsc: $sortByAsc
    numEntries: $numEntries
    offset: $offset
  ) {
    numOfActivities
    activities {
      ...ActivityInfoData
    }
  }
}
