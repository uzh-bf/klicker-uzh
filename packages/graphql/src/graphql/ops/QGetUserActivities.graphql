query GetUserActivities(
  $statusFilter: [PublicationStatus!]!
  $activityTypeFilter: ActivityType
  $courseId: String
  $withoutCourse: Boolean
) {
  userActivities(
    statusFilter: $statusFilter
    activityTypeFilter: $activityTypeFilter
    courseId: $courseId
    withoutCourse: $withoutCourse
  ) {
    ...ActivityInfoData
  }
}
