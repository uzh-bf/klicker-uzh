query GetCockpitQuiz($id: String!) {
  cockpitQuiz(id: $id) {
    id
    isLiveQAEnabled
    isConfusionFeedbackEnabled
    isModerationEnabled
    isGamificationEnabled
    isAssessmentEnabled

    namespace
    name
    displayName
    pinCode
    status
    startedAt
    course {
      id
      displayName
      language
    }
    blocks {
      id
      numOfParticipants
      order
      status
      expiresAt
      timeLimit
      randomSelection
      execution
      elements {
        id
        type
        elementType
        numOfResponsesReceived
        numOfResponsesProcessed
        ...ElementDataInfo
      }
    }
    activeBlock {
      id
    }
    confusionSummary {
      speed
      difficulty
      numberOfParticipants
    }
    feedbacks {
      id
      isPublished
      isPinned
      isResolved
      content
      votes
      createdAt
      resolvedAt
      responses {
        id
        content
        positiveReactions
        negativeReactions
        createdAt
      }
    }
  }
}
