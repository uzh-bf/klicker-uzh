mutation EditGroupActivity(
  $id: String!
  $name: String!
  $displayName: String!
  $description: String
  $courseId: String!
  $multiplier: Int!
  $startDate: Date!
  $endDate: Date!
  $clues: [GroupActivityClueInput!]!
  $stack: ElementStackInput!
  $isEscapeRoom: Boolean
  $escapeRoomTimeLimit: Int
  $escapeRoomHintPenalty: Int
  $escapeRoomIntroText: String
) {
  editGroupActivity(
    id: $id
    name: $name
    displayName: $displayName
    description: $description
    courseId: $courseId
    multiplier: $multiplier
    startDate: $startDate
    endDate: $endDate
    clues: $clues
    stack: $stack
    isEscapeRoom: $isEscapeRoom
    escapeRoomTimeLimit: $escapeRoomTimeLimit
    escapeRoomHintPenalty: $escapeRoomHintPenalty
    escapeRoomIntroText: $escapeRoomIntroText
  ) {
    ...ActivityInfoData
  }
}
