mutation GradeGroupActivitySubmission(
  $id: Int!
  $gradingDecisions: GroupActivityGradingInput!
) {
  gradeGroupActivitySubmission(id: $id, gradingDecisions: $gradingDecisions) {
    id

    decisionsSubmittedAt
    decisions {
      instanceId
      type
      freeTextResponse
      choicesResponse
      numericalResponse
      contentResponse
      selectionResponse
      caseStudyResponse {
        caseId
        itemResponses {
          itemId
          criterionResponses {
            criterionId
            response
          }
        }
      }
    }

    resultsComputedAt
    results {
      passed
      points
      comment
      grading {
        instanceId
        score
        maxPoints
        feedback
      }
    }
  }
}
