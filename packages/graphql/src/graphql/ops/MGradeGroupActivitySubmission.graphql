mutation GradeGroupActivitySubmission(
  $id: Int!
  $groupActivityId: String!
  $gradingDecisions: GroupActivityGradingInput!
) {
  gradeGroupActivitySubmission(
    id: $id
    groupActivityId: $groupActivityId
    gradingDecisions: $gradingDecisions
  ) {
    id

    decisionsSubmittedAt
    decisions {
      instanceId
      type
      freeTextResponse
      choicesResponse
      numericalResponse
      contentResponse
      selectionResponse
      caseStudyResponse {
        caseId
        itemResponses {
          itemId
          criterionResponses {
            criterionId
            response
          }
        }
      }
    }

    resultsComputedAt
    results {
      passed
      points
      comment
      grading {
        instanceId
        score
        maxPoints
        feedback
      }
    }
  }
}
