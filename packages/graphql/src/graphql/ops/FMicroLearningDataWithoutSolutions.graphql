fragment MicroLearningDataWithoutSolutions on MicroLearning {
  id
  name
  status
  displayName
  description
  pointsMultiplier
  scheduledStartAt
  scheduledEndAt
  course {
    id
    displayName
    color
    isCourseQARolloutEnabled
    isCourseQAEnabled
  }
  stacks {
    id
    type
    displayName
    description
    order
    elements {
      id
      type
      elementType
      ...ElementDataWithoutSolutions
    }
  }
}
