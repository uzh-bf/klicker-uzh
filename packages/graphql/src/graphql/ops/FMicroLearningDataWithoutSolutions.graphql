fragment MicroLearningDataWithoutSolutions on MicroLearning {
  id
  name
  status
  displayName
  description
  pointsMultiplier
  scheduledStartAt
  scheduledEndAt
  escapeRoomConfig {
    id
    timeLimit
    hintPenalty
    lockoutSeconds
    introText
  }
  escapeRoomAttempts {
    id
    startedAt
    timeLimit
    penaltySeconds
    hintsUsed
    status
    completedAt
    lockoutUntil
    elementBlockId
  }
  course {
    id
    displayName
    color
  }
  stacks {
    id
    type
    displayName
    description
    order
    isCorrect
    elements {
      id
      type
      elementType
      ...ElementDataWithoutSolutions
    }
  }
}
