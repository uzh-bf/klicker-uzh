query GetCourseActivityIds($courseId: String) {
  getCourseActivityIds(courseId: $courseId) {
    liveQuizzes {
      id
      name
    }
    polls {
      id
      name
    }
    practiceQuizzes {
      id
      name
    }
    microLearnings {
      id
      name
    }
    groupActivities {
      id
      name
    }
  }
}
