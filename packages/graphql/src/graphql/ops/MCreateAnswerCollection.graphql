mutation CreateAnswerCollection(
  $name: String!
  $access: CollectionAccess!
  $description: String!
  $answers: [String!]!
) {
  createAnswerCollection(
    name: $name
    access: $access
    description: $description
    answers: $answers
  ) {
    id
    name
    access
    description
    accessType
    ownerShortname
    entries {
      id
      value
    }
  }
}
