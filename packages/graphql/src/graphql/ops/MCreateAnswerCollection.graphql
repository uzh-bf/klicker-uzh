mutation CreateAnswerCollection(
  $name: String!
  $description: String!
  $answers: [String!]!
) {
  createAnswerCollection(
    name: $name
    description: $description
    answers: $answers
  ) {
    id
    name
    description
    ownerShortname
    numSharedUsers
    numOfEntries
    permissionLevel

    isOwner
    isManager
    isEditor
    isImported
    isShared
    isRemovable
  }
}
