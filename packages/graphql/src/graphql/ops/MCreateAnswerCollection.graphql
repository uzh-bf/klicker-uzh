mutation CreateAnswerCollection(
  $name: String!
  $description: String!
  $answers: [String!]!
) {
  createAnswerCollection(
    name: $name
    description: $description
    answers: $answers
  ) {
    id
    name
    accessType
    sharingStatus
    sharingLevel
    description
    ownerShortname
    numSharedUsers
    numOfEntries

    isOwner
    isImported
    isEditable
    isShareable
    isRemovable
    isDeletionAllowed
  }
}
