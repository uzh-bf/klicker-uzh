mutation MUpdateChatbotModelPolicy(
  $chatbotId: String!
  $modelSelection: Boolean!
  $allowedModelIds: [String!]!
  $allowedReasoningEffortsByModel: [ChatbotReasoningConfigInput!]
  $answerPreferencesEnabled: Boolean
) {
  updateChatbotModelPolicy(
    chatbotId: $chatbotId
    modelSelection: $modelSelection
    allowedModelIds: $allowedModelIds
    allowedReasoningEffortsByModel: $allowedReasoningEffortsByModel
    answerPreferencesEnabled: $answerPreferencesEnabled
  ) {
    id
    modelSelection
    allowedModelIds
    allowedReasoningEffortsByModel {
      modelId
      efforts
    }
    answerPreferencesEnabled
    updatedAt
  }
}
