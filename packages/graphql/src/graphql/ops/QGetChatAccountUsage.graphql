query GetChatAccountUsage($ownerId: String) {
  getChatAccountUsage(ownerId: $ownerId) {
    authorized
    subscriptionTier
    baseModelUsage {
      usageClass
      entitled
      budgetCredits
      usedCredits
      remainingCredits
      resetAt
    }
    advancedModelUsage {
      usageClass
      entitled
      budgetCredits
      usedCredits
      remainingCredits
      resetAt
    }
  }
}
