fragment PracticeQuizDataWithoutSolutions on PracticeQuiz {
  id
  status
  name
  displayName
  description
  pointsMultiplier
  resetTimeDays
  availableFrom
  orderType
  numOfStacks
  escapeRoomConfig {
    id
    timeLimit
    hintPenalty
    lockoutSeconds
    introText
  }
  escapeRoomAttempts {
    id
    startedAt
    timeLimit
    penaltySeconds
    hintsUsed
    status
    completedAt
    lockoutUntil
    elementBlockId
  }
  # previouslyAnswered
  # previousScore
  # previousPointsAwarded
  # totalTrials
  # stacksWithQuestions
  # numOfQuestions

  course {
    id
    displayName
    color
  }

  stacks {
    id
    type
    displayName
    description
    order
    isCorrect
    elements {
      id
      type
      elementType
      options {
        hasHint
      }
      ...ElementDataWithoutSolutions
    }
  }
}
