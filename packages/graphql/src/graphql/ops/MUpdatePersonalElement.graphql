mutation MUpdatePersonalElement(
  $id: String!
  $expectedVersion: Int!
  $name: String
  $content: String
  $explanation: String
  $sources: [PersonalElementSourceInput!]
) {
  updatePersonalElement(
    id: $id
    expectedVersion: $expectedVersion
    name: $name
    content: $content
    explanation: $explanation
    sources: $sources
  ) {
    ...FPersonalElement
  }
}
