mutation StartEscapeRoomAttempt(
  $practiceQuizId: String
  $microLearningId: String
  $groupActivityId: String
  $groupId: String
  $elementBlockId: Int
) {
  startEscapeRoomAttempt(
    practiceQuizId: $practiceQuizId
    microLearningId: $microLearningId
    groupActivityId: $groupActivityId
    groupId: $groupId
    elementBlockId: $elementBlockId
  ) {
    id
    startedAt
    timeLimit
    penaltySeconds
    remainingSeconds
    expiresInSeconds
    lockoutUntil
    hintsUsed
    stageOutcomes {
      stageKey
      wrongAttempts
      outcome
      at
    }
    status
    completedAt
  }
}
