query GetKb($id: ID!) {
  getKb(id: $id) {
    id
    name
    description
    domainPolicyId
    domainPolicyVersion
    domainPolicyLanguage
    questionPreparation {
      state
      pendingReason
      hasBasis
    }
    metrics {
      visibleResourceCount
      visibleSizeBytes
      unknownSizeResourceCount
      quotaResourceCount
      quotaSizeBytes
      resourceLimit
      storageLimitBytes
      pendingCleanupCount
      pendingCleanupSizeBytes
      reservedResourceCount
      reservedSizeBytes
      linkedConsumerCount
    }
  }
}
