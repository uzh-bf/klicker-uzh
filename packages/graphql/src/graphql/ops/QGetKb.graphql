query GetKb($id: ID!) {
  getKb(id: $id) {
    id
    name
    description
    resources {
      id
      type
      title
      sourceUrl
      originalFilename
      mimeType
      sizeBytes
      status
      statusMessage
      ingestedAt
      resourceVersion
      activeResourceVersion
      activeContentSha256
      errorCode
      ingestionRuns {
        id
        status
        resourceVersion
        contentSha256
        statusMessage
        errorCode
        startedAt
        finishedAt
        createdAt
        updatedAt
      }
      createdAt
      updatedAt
    }
  }
}
