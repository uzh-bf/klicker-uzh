query GetKb($id: ID!) {
  getKb(id: $id) {
    id
    name
    description
    resources {
      id
      type
      title
      sourceUrl
      originalFilename
      mimeType
      sizeBytes
      status
      ingestedAt
      resourceVersion
      activeResourceVersion
      latestIngestionRun {
        id
        status
        errorCode
      }
      createdAt
      updatedAt
    }
  }
}
