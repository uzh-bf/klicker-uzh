query GetSingleAnswerCollection($id: Int!) {
  getSingleAnswerCollection(id: $id) {
    id
    name
    accessType
    sharingStatus
    sharingLevel
    description
    ownerShortname
    numSharedUsers

    isOwner
    isEditable

    entries {
      id
      value
      numSolutionUsages
    }
  }
}
