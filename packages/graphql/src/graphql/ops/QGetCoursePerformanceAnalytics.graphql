query GetCoursePerformanceAnalytics($courseId: String!) {
  getCoursePerformanceAnalytics(courseId: $courseId) {
    name
    totalParticipants
    activityProgresses {
      activityId
      activityName
      activityType
      startedCount
      completedCount
      repeatedCount
    }
    activityPerformances {
      __typename
      id
      activityName
      activityType
      rates {
        firstErrorRate
        lastErrorRate
        errorRate
        firstPartialRate
        lastPartialRate
        partialRate
        firstCorrectRate
        lastCorrectRate
        correctRate
      }
    }
    instancePerformances {
      __typename
      id
      elementName
      elementType
      rates {
        firstErrorRate
        lastErrorRate
        errorRate
        firstPartialRate
        lastPartialRate
        partialRate
        firstCorrectRate
        lastCorrectRate
        correctRate
      }
    }
    participantPerformances {
      __typename
      id
      firstErrorRate
      firstPerformance
      lastErrorRate
      lastPerformance
      totalErrorRate
      totalPerformance
    }
    participantActivityPerformances {
      __typename
      participantId
      participantUsername
      participantEmail
      performances {
        id
        activityId
        totalScore
        completion
      }
    }
    instanceFeedbacks {
      __typename
      id
      activityType
      instanceName
      instanceType
      upvoteRate
      downvoteRate
      feedbackCount
    }
    activityFeedbacks {
      __typename
      id
      activityType
      activityName
      upvoteRate
      downvoteRate
      feedbackCount
    }
  }
}
