query GetCoursePerformanceAnalytics($courseId: String!) {
  getCoursePerformanceAnalytics(courseId: $courseId) {
    name
    totalParticipants
    activityProgresses {
      activityName
      activityType
      startedCount
      completedCount
      repeatedCount
    }
    activityPerformances {
      __typename
      id
      activityName
      activityType
      rates {
        firstErrorRate
        lastErrorRate
        errorRate
        firstPartialRate
        lastPartialRate
        partialRate
        firstCorrectRate
        lastCorrectRate
        correctRate
      }
    }
    instancePerformances {
      __typename
      id
      elementName
      elementType
      rates {
        firstErrorRate
        lastErrorRate
        errorRate
        firstPartialRate
        lastPartialRate
        partialRate
        firstCorrectRate
        lastCorrectRate
        correctRate
      }
    }
  }
}
