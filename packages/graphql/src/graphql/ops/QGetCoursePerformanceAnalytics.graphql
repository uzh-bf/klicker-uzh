query GetCoursePerformanceAnalytics($courseId: String!) {
  getCoursePerformanceAnalytics(courseId: $courseId) {
    name
    totalParticipants
    activityProgresses {
      activityName
      activityType
      startedCount
      completedCount
      repeatedCount
    }
    activityErrorRates {
      activityName
      activityType
      errorRate
      partialRate
      correctRate
    }
    instanceErrorRates {
      elementName
      elementType
      errorRate
      partialRate
      correctRate
    }
  }
}
