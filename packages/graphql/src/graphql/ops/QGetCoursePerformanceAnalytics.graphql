query GetCoursePerformanceAnalytics($courseId: String!) {
  getCoursePerformanceAnalytics(courseId: $courseId) {
    name
    totalParticipants
    isSuppressed
    participantActivityPerformanceN
    activityProgresses {
      activityName
      activityType
      startedCount
      completedCount
      repeatedCount
    }
    activityPerformances {
      __typename
      id
      participantCount
      activityName
      activityType
      rates {
        firstErrorRate
        lastErrorRate
        errorRate
        firstPartialRate
        lastPartialRate
        partialRate
        firstCorrectRate
        lastCorrectRate
        correctRate
      }
    }
    instancePerformances {
      __typename
      id
      participantCount
      elementName
      elementType
      rates {
        firstErrorRate
        lastErrorRate
        errorRate
        firstPartialRate
        lastPartialRate
        partialRate
        firstCorrectRate
        lastCorrectRate
        correctRate
      }
    }
    participantActivityPerformances {
      __typename
      studentLabel
      coverage
      completedActivities
      meanCompletion
    }
    instanceFeedbacks {
      __typename
      id
      activityType
      instanceName
      instanceType
      participantCount
      upvoteRate
      downvoteRate
      feedbackCount
    }
    activityFeedbacks {
      __typename
      id
      activityType
      activityName
      participantCount
      upvoteRate
      downvoteRate
      feedbackCount
    }
  }
}
