fragment ElementDataWithoutSolutions on ElementInstance {
  elementData {
    ... on ChoicesElementData {
      __typename
      id
      elementId
      name
      type
      content
      explanation
      pointsMultiplier
      options {
        displayMode
        choices {
          ix
          value
        }
      }
    }

    ... on NumericalElementData {
      __typename
      id
      elementId
      name
      type
      content
      explanation
      pointsMultiplier
      options {
        accuracy
        placeholder
        unit
        restrictions {
          min
          max
        }
      }
    }

    ... on FreeTextElementData {
      __typename
      id
      elementId
      name
      type
      content
      explanation
      pointsMultiplier
      options {
        restrictions {
          maxLength
        }
      }
    }

    ... on SelectionElementData {
      __typename
      id
      elementId
      name
      type
      content
      explanation
      pointsMultiplier
      options {
        numberOfInputs
        answerCollection {
          id
          entries {
            id
            value
          }
        }
      }
    }

    ... on FlashcardElementData {
      id
      elementId
      name
      type
      content
      explanation
      pointsMultiplier
    }

    ... on ContentElementData {
      __typename
      id
      elementId
      name
      type
      content
      explanation
      pointsMultiplier
    }
  }
}
