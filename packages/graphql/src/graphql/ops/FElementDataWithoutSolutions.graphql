fragment ElementDataWithoutSolutions on ElementInstance {
  elementData {
    ... on ChoicesElementData {
      __typename
      id
      elementId
      name
      type
      content
      explanation
      basePoints
      pointsMultiplier
      options {
        hasSampleSolution
        displayMode
        choices {
          ix
          value
        }
      }
    }

    ... on NumericalElementData {
      __typename
      id
      elementId
      name
      type
      content
      explanation
      basePoints
      pointsMultiplier
      options {
        hasSampleSolution
        accuracy
        placeholder
        unit
        restrictions {
          min
          max
        }
      }
    }

    ... on FreeTextElementData {
      __typename
      id
      elementId
      name
      type
      content
      explanation
      basePoints
      pointsMultiplier
      options {
        hasSampleSolution
        hasSemanticEvaluation
        restrictions {
          maxLength
        }
      }
    }

    ... on SelectionElementData {
      __typename
      id
      elementId
      name
      type
      content
      explanation
      basePoints
      pointsMultiplier
      options {
        hasSampleSolution
        numberOfInputs
        answerCollection {
          id
          entries {
            id
            value
          }
        }
      }
    }

    ... on CaseStudyElementData {
      __typename
      id
      elementId
      name
      type
      content
      explanation
      basePoints
      pointsMultiplier
      options {
        hasSampleSolution
        items {
          id
          value
        }
        criteria {
          id
          name
          min
          max
          step
          unit
          labels {
            min
            mid
            max
          }
        }
        cases {
          id
          title
          description
        }
      }
    }

    ... on FlashcardElementData {
      __typename
      id
      elementId
      name
      type
      content
      explanation
      basePoints
      pointsMultiplier
    }

    ... on ContentElementData {
      __typename
      id
      elementId
      name
      type
      content
      explanation
      basePoints
      pointsMultiplier
    }
  }
}
