query GetOwnerProviderCredentials {
  getOwnerProviderCredentials {
    id
    profileKey
    profileVersion
    status
    validatedModelAlias
    safeFingerprint
    vaultSecretVersion
    createdAt
    updatedAt
    bindings {
      id
      chatbotId
      allowedModelAlias
      isActive
      participantQuotaLimit
      aggregateQuotaLimit
      currentNoticeVersion
    }
  }
}
