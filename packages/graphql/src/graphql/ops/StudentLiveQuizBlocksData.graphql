fragment StudentLiveQuizBlocksData on LiveQuiz {
  blocks {
    id
    status
    expiresAt
    timeLimit
    randomSelection
    isPeerInstructionEnabled
    execution
    elements {
      id
      type
      elementType
      ...ElementDataWithoutSolutions
    }
  }

  activeBlock {
    id
    status
    expiresAt
    timeLimit
    randomSelection
    isPeerInstructionEnabled
    execution
    elements {
      id
      type
      elementType
      correlationKey
      ...ElementDataWithoutSolutions
    }
  }
}
