fragment StudentLiveQuizBlocksData on LiveQuiz {
  blocks {
    id
    status
    expiresAt
    timeLimit
    randomSelection
    execution
    escapeRoomTotalInstances
    escapeRoomClearedInstances
    escapeRoomConfig {
      timeLimit
      hintPenalty
      hintPenalties
      wrongAnswerPenalty
      maxWrongAttempts
      revealPenalty
      skipPenalty
      bonusSeconds
      lockoutSeconds
      introText
    }
    escapeRoomAttempts {
      id
      startedAt
      timeLimit
      penaltySeconds
      remainingSeconds
      expiresInSeconds
      hintsUsed
      stageOutcomes {
        stageKey
        wrongAttempts
        outcome
        at
      }
      lockoutUntil
      status
      completedAt
    }
    elements {
      id
      type
      elementType
      revealedHint
      revealedHints
      options {
        hasHint
        hintCount
      }
      ...ElementDataWithoutSolutions
    }
  }

  activeBlock {
    id
    status
    expiresAt
    timeLimit
    randomSelection
    execution
    escapeRoomTotalInstances
    escapeRoomClearedInstances
    escapeRoomConfig {
      timeLimit
      hintPenalty
      hintPenalties
      wrongAnswerPenalty
      maxWrongAttempts
      revealPenalty
      skipPenalty
      bonusSeconds
      lockoutSeconds
      introText
    }
    escapeRoomAttempts {
      id
      startedAt
      timeLimit
      penaltySeconds
      remainingSeconds
      expiresInSeconds
      hintsUsed
      stageOutcomes {
        stageKey
        wrongAttempts
        outcome
        at
      }
      lockoutUntil
      status
      completedAt
    }
    elements {
      id
      type
      elementType
      revealedHint
      revealedHints
      options {
        hasHint
        hintCount
      }
      correlationKey
      ...ElementDataWithoutSolutions
    }
  }
}
