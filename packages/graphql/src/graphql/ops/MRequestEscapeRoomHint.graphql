mutation RequestEscapeRoomHint(
  $practiceQuizId: String
  $microLearningId: String
  $groupActivityId: String
  $groupId: String
  $elementBlockId: Int
  $instanceId: Int!
) {
  requestEscapeRoomHint(
    practiceQuizId: $practiceQuizId
    microLearningId: $microLearningId
    groupActivityId: $groupActivityId
    groupId: $groupId
    elementBlockId: $elementBlockId
    instanceId: $instanceId
  ) {
    hint
    hints
    hasMoreHints
    attempt {
      id
      startedAt
      timeLimit
      penaltySeconds
      remainingSeconds
      expiresInSeconds
      lockoutUntil
      hintsUsed
      status
      completedAt
      stageOutcomes {
        stageKey
        wrongAttempts
        outcome
      }
    }
  }
}
