query GetChatbotKnowledgeGraphConfig($chatbotId: ID!) {
  getChatbotKnowledgeGraphConfig(chatbotId: $chatbotId) {
    id
    chatbotId
    status
    statusMessage
    selectionRevision
    builtRevision
    activeBuildRevision
    externalWorkflowRunId
    externalStartedAt
    lastBuiltAt
    lastBuildSpeedMode
    selectedResourceIds
    createdAt
    updatedAt
  }
  getAvailableChatbotKnowledgeGraphResources(chatbotId: $chatbotId) {
    id
    name
    description
    resources {
      id
      type
      title
      status
      assignmentChatbotId
      assignmentChatbotName
    }
  }
}
