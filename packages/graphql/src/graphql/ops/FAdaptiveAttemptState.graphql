fragment FAdaptiveAttemptState on AdaptiveAttemptState {
  attempt {
    id
    status
    startedAt
    completedAt
  }
  assessment {
    id
    displayName
    description
    thetaMin
    thetaMax
    standardErrorThreshold
    showTimer
    showCompetenceNames
    showFinalResult
    showSolutions
    levels {
      label
      order
    }
    competences {
      id
      name
      order
      weight
      questionThreshold
      standardErrorThreshold
    }
  }
  nextAdaptiveElementId
  nextCompetenceName
  nextSubCompetenceName
  nextElement {
    ...FAdaptiveElementFields
  }
  progress {
    answeredQuestions
    maxQuestions
    standardError
    theta
    levelLabel
    completed
    elapsedSeconds
    message
    messages
  }
}
