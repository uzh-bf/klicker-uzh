query GetActivityAnalytics($activityId: String!) {
  getActivityAnalytics(activityId: $activityId) {
    __typename
    activityName
    activityType
    courseParticipants
    isSuppressed
    instanceQuizAnalytics {
      __typename
      id
      elementName
      elementType
      numberOfAnswers
      uniqueParticipants
      averageTimeSpent
      firstErrorRate
      firstPartialRate
      firstCorrectRate
      lastErrorRate
      lastPartialRate
      lastCorrectRate
      totalErrorRate
      totalPartialRate
      totalCorrectRate
      upvoteRate
      downvoteRate
      feedbackCount
      feedbackSuppressed
    }
    activityQuizAnalytics {
      __typename
      id
      participantCount
      numberOfAnswers
      averageTimeSpent
      firstErrorRate
      firstPartialRate
      firstCorrectRate
      lastErrorRate
      lastPartialRate
      lastCorrectRate
      totalErrorRate
      totalPartialRate
      totalCorrectRate
    }
  }
}
