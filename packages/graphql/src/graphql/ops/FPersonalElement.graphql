fragment FPersonalElement on PersonalElement {
  id
  courseId
  type
  version
  name
  content
  explanation
  sources {
    sourceId
    kind
    title
    canonicalUrl
    chunkIds
    locators {
      type
      pageFrom
      pageTo
      labelFrom
      labelTo
      url
      label
    }
  }
  origin
  sourceMessageId
  sourceToolCallId
  candidateId
  eFactor
  interval
  correctCountStreak
  correctCount
  partialCorrectCount
  wrongCount
  nextDueAt
  lastAnsweredAt
  lastCorrectAt
  lastPartialCorrectAt
  lastWrongAt
  lastResponseCorrectness
  createdAt
  updatedAt
}
