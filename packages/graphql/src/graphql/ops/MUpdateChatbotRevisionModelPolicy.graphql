mutation MUpdateChatbotRevisionModelPolicy(
  $chatbotId: String!
  $expectedRevisionVersion: Int!
  $modelSelection: Boolean!
  $allowedModelIds: [String!]!
  $allowedReasoningEffortsByModel: [ChatbotReasoningConfigInput!]
) {
  updateChatbotRevisionModelPolicy(
    chatbotId: $chatbotId
    expectedRevisionVersion: $expectedRevisionVersion
    modelSelection: $modelSelection
    allowedModelIds: $allowedModelIds
    allowedReasoningEffortsByModel: $allowedReasoningEffortsByModel
  ) {
    id
    status
    revisionStatus
    revisionVersion
    authoringRevision {
      ...ChatbotAuthoringRevisionData
    }
  }
}
