mutation AddObjectToCatalog(
  $objectId: String!
  $objectType: ObjectType!
  $access: ObjectAccess!
  $catalogCollectionId: String
) {
  addObjectToCatalog(
    objectId: $objectId
    objectType: $objectType
    access: $access
    catalogCollectionId: $catalogCollectionId
  ) {
    ...CatalogObjectData
  }
}
