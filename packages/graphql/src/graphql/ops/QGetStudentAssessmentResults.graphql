query GetStudentAssessmentResults($courseId: String!) {
  studentAssessmentResults(courseId: $courseId) {
    liveQuizzes {
      ...ActivityStudentPerformanceData
    }
    practiceQuizzes {
      ...ActivityStudentPerformanceData
    }
    microLearnings {
      ...ActivityStudentPerformanceData
    }
    groupActivities {
      ...ActivityStudentPerformanceData
    }
    percentile
    hasEnoughData
    histogram {
      binStart
      binEnd
      count
    }
    participantEmail
    courseName
  }
}
