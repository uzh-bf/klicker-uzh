query SearchKbKnowledgeGraphWithRelations($kbId: ID!, $query: String!) {
  searchKbKnowledgeGraph(kbId: $kbId, query: $query) {
    kbId
    buildId
    isStale
    nodes {
      id
      labels
      kind
      displayLabel
      summary
      content
      degree
      sourceReferences {
        resourceId
        title
        reference
        pages
      }
    }
    edges {
      id
      source
      target
      type
      label
      relationType
      relationStatus
      sourceReferences {
        resourceId
        title
        reference
        pages
      }
      properties
    }
    truncated
  }
}
