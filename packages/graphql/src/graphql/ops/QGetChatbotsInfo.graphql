query GetChatbotsInfo {
  getChatbotsInfo {
    id
    name
    description
    avatar
    status
    modelSelection
    allowedModelIds
    allowedReasoningEffortsByModel {
      modelId
      efforts
    }
    creditInitialCredits
    creditResetPeriod
    creditResetAmount
    creditMaxCredits
    courses {
      id
      name
    }
    usageSummary {
      threadCount
      messageCount
      participantCount
      lastActivityAt
      totalCredits
      currentCredits
      totalResets
      lastResetAt
    }
    disclaimerSummary {
      id
      name
      title
      acceptedCount
      declinedCount
      pendingCount
    }
    mcpConfigurations {
      serverId
      serverName
      serverDescription
      serverIsActive
      chatMode
      isEnabled
      priority
      allowedToolsCount
    }
    createdAt
    updatedAt
  }
}
