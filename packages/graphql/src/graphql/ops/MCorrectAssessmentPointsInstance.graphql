mutation CorrectAssessmentPointsInstance(
  $instanceId: Int!
  $awardBasePoints: Boolean
  $awardCorrectnessPoints: Boolean
  $awardBonusPoints: Boolean
  $deductBasePoints: Boolean
  $deductCorrectnessPoints: Boolean
  $deductBonusPoints: Boolean
  $reason: String!
  $studentReason: String!
  $scope: PointCorrectionType!
  $participantId: String
) {
  correctAssessmentPointsInstance(
    instanceId: $instanceId
    awardBasePoints: $awardBasePoints
    awardCorrectnessPoints: $awardCorrectnessPoints
    awardBonusPoints: $awardBonusPoints
    deductBasePoints: $deductBasePoints
    deductCorrectnessPoints: $deductCorrectnessPoints
    deductBonusPoints: $deductBonusPoints
    reason: $reason
    studentReason: $studentReason
    scope: $scope
    participantId: $participantId
  ) {
    ...PointCorrectionData
  }
}
