query Self($liveQuizId: String) {
  self(liveQuizId: $liveQuizId) {
    id
    role
    scopeQuizId
    isCourseParticipant
    isCourseParticipationActive

    email
    institutionalEmail

    username
    locale
    avatar
    avatarSettings {
      skinTone
      eyes
      mouth
      hair
      facialHair
      accessory
      hairColor
      clothing
      clothingColor
    }
    isActive
    isProfilePublic
    xp
    level
    levelData {
      id
      index
      name
      avatar
      requiredXp
      nextLevel {
        id
        index
        requiredXp
        avatar
        name
      }
    }
  }
}
