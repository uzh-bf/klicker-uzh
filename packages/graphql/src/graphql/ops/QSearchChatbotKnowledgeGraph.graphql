query SearchChatbotKnowledgeGraph($chatbotId: ID!, $query: String!) {
  searchChatbotKnowledgeGraph(chatbotId: $chatbotId, query: $query) {
    chatbotId
    builtRevision
    truncated
    nodes {
      id
      labels
      kind
      displayLabel
      summary
      content
      degree
      sourceReferences {
        resourceId
        title
        reference
      }
    }
    edges {
      id
      source
      target
      type
      label
      properties
    }
  }
}
