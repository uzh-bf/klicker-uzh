mutation ChangePermissionLevel(
  $objectId: String!
  $objectType: SharingObjectType!
  $permissionId: Int!
  $permissionLevel: PermissionLevel!
  $propagation: Boolean!
) {
  changePermissionLevel(
    objectId: $objectId
    objectType: $objectType
    permissionId: $permissionId
    permissionLevel: $permissionLevel
    propagation: $propagation
  )
}
