mutation CreateChatbot(
  $name: String!
  $description: String
  $courseId: String!
  $disclaimerTitle: String
  $disclaimerIntroText: String
) {
  createChatbot(
    name: $name
    description: $description
    courseId: $courseId
    disclaimerTitle: $disclaimerTitle
    disclaimerIntroText: $disclaimerIntroText
  ) {
    id
  }
}
