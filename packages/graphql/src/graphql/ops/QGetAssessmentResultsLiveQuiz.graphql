query GetAssessmentResultsLiveQuiz($liveQuizId: String!) {
  assessmentResultsLiveQuiz(liveQuizId: $liveQuizId) {
    name
    quizBasePoints
    quizCorrectnessPoints
    quizBonusPoints
    availableBasePoints
    availableCorrectnessPoints
    availableBonusPoints
    numberOfCorrections

    studentResults {
      participantId
      participantEmail
      assessmentGivenName
      assessmentSurname
      assessmentMatriculationNumber
      basePoints
      correctnessPoints
      bonusPoints
    }
  }
}
