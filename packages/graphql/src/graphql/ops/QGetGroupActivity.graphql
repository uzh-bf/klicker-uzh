query GetGroupActivity($id: String!) {
  groupActivity(id: $id) {
    id
    name
    displayName
    description
    pointsMultiplier
    scheduledStartAt
    scheduledEndAt
    escapeRoomConfig {
      id
      timeLimit
      hintPenalty
      lockoutSeconds
      hintPenalties
      wrongAnswerPenalty
      maxWrongAttempts
      revealPenalty
      skipPenalty
      bonusSeconds
      introText
    }
    clues {
      id
      type
      name
      displayName
      value
      unit
    }

    stacks {
      id
      displayName
      description
      isCorrect
      elements {
        id
        type
        elementType
        ...ElementDataWithoutSolutions
      }
    }

    course {
      id
      displayName
    }
  }
}
