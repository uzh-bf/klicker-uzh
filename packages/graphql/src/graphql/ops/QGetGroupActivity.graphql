query GetGroupActivity($id: String!, $withEscapeRoomHints: Boolean! = false) {
  escapeRoomHints(groupActivityId: $id) @include(if: $withEscapeRoomHints) {
    instanceId
    hint
  }
  groupActivity(id: $id) {
    id
    name
    displayName
    description
    pointsMultiplier
    scheduledStartAt
    scheduledEndAt
    escapeRoomConfig {
      id
      timeLimit
      hintPenalty
      lockoutSeconds
      introText
    }
    escapeRoomAttempts {
      id
      startedAt
      timeLimit
      penaltySeconds
      remainingSeconds
      expiresInSeconds
      hintsUsed
      status
      completedAt
      lockoutUntil
    }

    clues {
      id
      type
      name
      displayName
      value
      unit
    }

    stacks {
      id
      displayName
      description
      isCorrect
      elements {
        id
        type
        elementType
        ...ElementDataWithoutSolutions
      }
    }

    course {
      id
      displayName
    }
  }
}
