mutation CreateKbUrlResource(
  $kbId: ID!
  $url: String!
  $title: String!
  $materialType: KBResourceMaterialType
  $rightsConfirmed: Boolean!
  $personalDataConfirmed: Boolean!
) {
  createKbUrlResource(
    kbId: $kbId
    url: $url
    title: $title
    materialType: $materialType
    rightsConfirmed: $rightsConfirmed
    personalDataConfirmed: $personalDataConfirmed
  ) {
    id
  }
}
