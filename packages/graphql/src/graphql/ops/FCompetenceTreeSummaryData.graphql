fragment CompetenceTreeSummaryData on CompetenceTreeSummary {
  id
  name
  displayName
  description
  maxDepth
  thetaMin
  thetaMax
  defaultDiscrimination
  levelMappingRule
  levelCount
  nodeCount
  assignmentCount
  isOwner
