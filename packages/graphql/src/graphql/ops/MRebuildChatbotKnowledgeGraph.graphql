mutation RebuildChatbotKnowledgeGraph(
  $chatbotId: ID!
  $speedMode: KBSpeedMode!
  $generationModel: String!
  $cleaningModel: String!
) {
  rebuildChatbotKnowledgeGraph(
    chatbotId: $chatbotId
    speedMode: $speedMode
    generationModel: $generationModel
    cleaningModel: $cleaningModel
  ) {
    id
    chatbotId
    status
    statusMessage
    selectionRevision
    builtRevision
    activeBuildRevision
    externalWorkflowRunId
    externalStartedAt
    lastBuiltAt
    lastBuildSpeedMode
    selectedResourceIds
    createdAt
    updatedAt
  }
}
