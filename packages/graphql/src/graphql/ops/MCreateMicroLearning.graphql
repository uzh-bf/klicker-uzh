mutation CreateMicroLearning(
  $name: String!
  $displayName: String!
  $description: String
  $stacks: [ElementStackInput!]!
  $courseId: String!
  $multiplier: Int!
  $startDate: Date!
  $endDate: Date!
  $isEscapeRoom: Boolean
  $escapeRoomTimeLimit: Int
  $escapeRoomHintPenalty: Int
  $escapeRoomIntroText: String
) {
  createMicroLearning(
    name: $name
    displayName: $displayName
    description: $description
    stacks: $stacks
    courseId: $courseId
    multiplier: $multiplier
    startDate: $startDate
    endDate: $endDate
    isEscapeRoom: $isEscapeRoom
    escapeRoomTimeLimit: $escapeRoomTimeLimit
    escapeRoomHintPenalty: $escapeRoomHintPenalty
    escapeRoomIntroText: $escapeRoomIntroText
  ) {
    ...ActivityInfoData
  }
}
