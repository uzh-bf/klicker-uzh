fragment StackFeedbackEvaluations on StackFeedback {
  evaluations {
    __typename

    ... on ChoicesInstanceEvaluation {
      __typename
      elementType
      instanceId
      pointsMultiplier
      explanation
      feedbacks {
        ix
        feedback
        correct
        value
      }
      choices {
        ix
        count
      }
      numAnswers
      score
      xp
      pointsAwarded
      percentile
      newPointsFrom
      xpAwarded
      newXpFrom
      correctness
      lastResponse {
        __typename
        choices {
          ix
          selected
        }
      }
    }

    ... on NumericalInstanceEvaluation {
      __typename
      elementType
      instanceId
      pointsMultiplier
      explanation
      feedbacks {
        ix
        feedback
        correct
        value
      }
      numAnswers
      responses {
        value
        count
      }
      score
      xp
      pointsAwarded
      percentile
      newPointsFrom
      xpAwarded
      newXpFrom
      solutionRanges {
        __typename
        min
        max
      }
      exactSolutions
      lastResponse {
        __typename
        value
      }
      correctness
    }

    ... on FreeTextInstanceEvaluation {
      instanceId
      elementType
      pointsMultiplier
      explanation
      feedbacks {
        ix
        feedback
        correct
        value
      }
      numAnswers
      answers {
        value
        count
      }
      score
      xp
      pointsAwarded
      percentile
      newPointsFrom
      xpAwarded
      newXpFrom
      solutions
      lastResponse {
        __typename
        value
      }
      correctness
      semanticState {
        ...FreeTextPracticeStateData
      }
    }

    ... on SelectionInstanceEvaluation {
      instanceId
      elementType
      pointsMultiplier
      explanation
      feedbacks {
        ix
        feedback
        correct
        value
      }
      numAnswers
      selectionResponses {
        __typename
        answerId
        value
        count
      }
      score
      xp
      pointsAwarded
      percentile
      newPointsFrom
      xpAwarded
      newXpFrom
      answerSolutionIds
      lastResponse {
        __typename
        selection
      }
      correctness
    }

    ... on CaseStudyInstanceEvaluation {
      instanceId
      elementType
      pointsMultiplier
      explanation
      feedbacks {
        ix
        feedback
        correct
        value
      }
      numAnswers
      assessments {
        __typename
        caseId
        itemId
        criterionId
        responseValues
      }
      score
      xp
      pointsAwarded
      percentile
      newPointsFrom
      xpAwarded
      newXpFrom
      studySolutions {
        __typename
        caseId
        solutions {
          itemId
          criteriaSolutions {
            criterionId
            min
            max
          }
        }
      }
      lastResponse {
        __typename
        assessment {
          caseId
          itemResponses {
            itemId
            criterionResponses {
              criterionId
              response
              correct
            }
          }
        }
      }
      correctness
    }

    ... on FlashcardInstanceEvaluation {
      instanceId
      elementType
      pointsMultiplier
      explanation
      feedbacks {
        ix
        feedback
        correct
        value
      }
      numAnswers
      score
      xp
      pointsAwarded
      percentile
      newPointsFrom
      xpAwarded
      newXpFrom
      lastResponse {
        __typename
        correctness
      }
      correctness
    }

    ... on ContentInstanceEvaluation {
      instanceId
      elementType
      pointsMultiplier
      explanation
      feedbacks {
        ix
        feedback
        correct
        value
      }
      numAnswers
      score
      xp
      pointsAwarded
      percentile
      newPointsFrom
      xpAwarded
      newXpFrom
      lastResponse {
        __typename
        viewed
      }
      correctness
    }
  }
}
