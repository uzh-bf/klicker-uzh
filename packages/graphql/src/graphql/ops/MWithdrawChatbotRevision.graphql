mutation MWithdrawChatbotRevision(
  $chatbotId: String!
  $expectedRevisionVersion: Int!
) {
  withdrawChatbotRevision(
    chatbotId: $chatbotId
    expectedRevisionVersion: $expectedRevisionVersion
  ) {
    id
    status
    revisionStatus
    revisionVersion
    reviewComment
    authoringRevision {
      ...ChatbotAuthoringRevisionData
    }
  }
}
