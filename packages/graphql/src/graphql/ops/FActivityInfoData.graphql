fragment ActivityInfoData on ActivityInfo {
  id
  templateId
  type
  status
  courseId
  courseName
  courseStartDate
  numOfStacks
  numOfElements

  stacks {
    id
    numOfParticipants
    elements {
      id
      name
      type
    }
  }

  name
  displayName

  permissionLevel
  derivedAccess
  numSharedUsers
  isOwner
  isManager
  isEditor
  isExecutor
  isShared
  isRemovable
  updatedAt
}
