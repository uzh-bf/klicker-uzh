query GetInstanceUpdateActivities(
  $elementId: Int!
  $hasSampleSolution: Boolean
  $includeTemplateInstances: Boolean!
) {
  getInstanceUpdateActivities(
    elementId: $elementId
    hasSampleSolution: $hasSampleSolution
    includeTemplateInstances: $includeTemplateInstances
  ) {
    activityId
    activityName
    courseName
    activityType
    status
  }
}
