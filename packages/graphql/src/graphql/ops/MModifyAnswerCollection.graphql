mutation ModifyAnswerCollection(
  $id: Int!
  $name: String
  $access: ObjectAccess
  $description: String
) {
  modifyAnswerCollection(
    id: $id
    name: $name
    access: $access
    description: $description
  ) {
    id
    name
    access
    description
    numSharedUsers
    entries {
      id
      value
    }
  }
}
