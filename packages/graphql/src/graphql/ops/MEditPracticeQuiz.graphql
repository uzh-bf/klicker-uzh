mutation EditPracticeQuiz(
  $id: String!
  $name: String!
  $displayName: String!
  $description: String
  $stacks: [ElementStackInput!]!
  $courseId: String!
  $multiplier: Int!
  $order: ElementOrderType!
  $resetTimeDays: Int!
  $mode: PracticeQuizMode
  $adaptiveConfig: AdaptivePracticeQuizConfigInput
) {
  editPracticeQuiz(
    id: $id
    name: $name
    displayName: $displayName
    description: $description
    stacks: $stacks
    courseId: $courseId
    multiplier: $multiplier
    order: $order
    resetTimeDays: $resetTimeDays
    mode: $mode
    adaptiveConfig: $adaptiveConfig
  ) {
    ...ActivityInfoData
  }
}
