mutation RespondToFeedback(
  $id: Int!
  $responseContent: String!
  $liveQuizId: String!
) {
  respondToFeedback(
    id: $id
    responseContent: $responseContent
    liveQuizId: $liveQuizId
  ) {
    id
    isPublished
    isPinned
    isResolved
    content
    votes
    resolvedAt
    createdAt
    responses {
      id
      content
      positiveReactions
      negativeReactions
    }
  }
}
