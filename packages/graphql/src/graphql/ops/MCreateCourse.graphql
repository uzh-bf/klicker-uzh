mutation CreateCourse(
  $name: String!
  $displayName: String!
  $description: String
  $color: String
  $startDate: Date!
  $endDate: Date!
  $isGroupCreationEnabled: Boolean!
  $groupDeadlineDate: Date!
  $maxGroupSize: Int!
  $preferredGroupSize: Int!
  $language: LocaleType!
  $notificationEmail: String
  $isGamificationEnabled: Boolean!
  $isLearningAnalyticsEnabled: Boolean!
) {
  createCourse(
    name: $name
    displayName: $displayName
    description: $description
    color: $color
    startDate: $startDate
    endDate: $endDate
    isGroupCreationEnabled: $isGroupCreationEnabled
    groupDeadlineDate: $groupDeadlineDate
    maxGroupSize: $maxGroupSize
    preferredGroupSize: $preferredGroupSize
    language: $language
    notificationEmail: $notificationEmail
    isGamificationEnabled: $isGamificationEnabled
    isLearningAnalyticsEnabled: $isLearningAnalyticsEnabled
  ) {
    id
    name
    displayName
    description
    color
    startDate
    endDate
    groupDeadlineDate
    maxGroupSize
    preferredGroupSize
    language
    notificationEmail
    isArchived
    isGamificationEnabled
    isAssessmentEnabled
    isLearningAnalyticsEnabled
    isGroupCreationEnabled
    randomAssignmentFinalized
    createdAt
    updatedAt

    derivedAccess
    numSharedUsers
    permissionLevel
    isOwner
    isManager
    isEditor
    isShared
    isRemovable
  }
}
