query GetUserElements(
  $status: ElementStatus
  $type: ElementType
  $hasSampleSolution: Boolean!
  $hasAnswerFeedbacks: Boolean!
  $searchString: String
  $showOwned: Boolean
  $showShared: Boolean
  $showDependencies: Boolean
  $tagIds: [Int!]!
  $activityId: String
  $multiplier: Int
  $showUntagged: Boolean!
  $sortByType: SortByType!
  $sortByAsc: Boolean!
  $showArchived: Boolean!
  $numEntries: Int!
  $offset: Int!
) {
  userElements(
    status: $status
    type: $type
    hasSampleSolution: $hasSampleSolution
    hasAnswerFeedbacks: $hasAnswerFeedbacks
    searchString: $searchString
    showOwned: $showOwned
    showShared: $showShared
    showDependencies: $showDependencies
    tagIds: $tagIds
    activityId: $activityId
    multiplier: $multiplier
    showUntagged: $showUntagged
    sortByType: $sortByType
    sortByAsc: $sortByAsc
    showArchived: $showArchived
    numEntries: $numEntries
    offset: $offset
  ) {
    numOfElements
    elements {
      __typename

      ... on ChoicesElement {
        id
        name
        status
        type
        content

        basePoints
        pointsMultiplier
        version

        isArchived
        isDeleted
        createdAt
        updatedAt

        derivedAccess
        numSharedUsers
        permissionLevel
        isOwner
        isManager
        isEditor
        isImported
        isShared
        isRemovable
        sharingType

        options {
          __typename
          hasSampleSolution
          hasAnswerFeedbacks
          displayMode
          choices {
            ix
            correct
            feedback
            value
          }
        }

        tags {
          id
          name
          order
        }
      }

      ... on NumericalElement {
        id
        name
        status
        type
        content

        basePoints
        pointsMultiplier
        version

        isArchived
        isDeleted
        createdAt
        updatedAt

        derivedAccess
        numSharedUsers
        permissionLevel
        isOwner
        isManager
        isEditor
        isImported
        isShared
        isRemovable
        sharingType

        options {
          __typename
          hasSampleSolution
          hasAnswerFeedbacks
          placeholder
          accuracy
          unit
          solutionRanges {
            __typename
            min
            max
          }
          exactSolutions
          restrictions {
            __typename
            min
            max
          }
        }

        tags {
          id
          name
          order
        }
      }

      ... on FreeTextElement {
        id
        name
        status
        type
        content

        basePoints
        pointsMultiplier
        version

        isArchived
        isDeleted
        createdAt
        updatedAt

        derivedAccess
        numSharedUsers
        permissionLevel
        isOwner
        isManager
        isEditor
        isImported
        isShared
        isRemovable
        sharingType

        options {
          __typename
          hasSampleSolution
          hasAnswerFeedbacks
          solutions
          restrictions {
            __typename
            maxLength
          }
        }

        tags {
          id
          name
          order
        }
      }

      ... on SelectionElement {
        id
        name
        status
        type
        content

        basePoints
        pointsMultiplier
        version

        isArchived
        isDeleted
        createdAt
        updatedAt

        derivedAccess
        numSharedUsers
        permissionLevel
        isOwner
        isManager
        isEditor
        isImported
        isShared
        isRemovable
        sharingType

        options {
          __typename
          hasSampleSolution
          numberOfInputs
        }

        tags {
          id
          name
          order
        }
      }

      ... on CaseStudyElement {
        id
        name
        status
        type
        content

        basePoints
        pointsMultiplier
        version

        isArchived
        isDeleted
        createdAt
        updatedAt

        derivedAccess
        numSharedUsers
        permissionLevel
        isOwner
        isManager
        isEditor
        isImported
        isShared
        isRemovable
        sharingType

        options {
          __typename
          hasSampleSolution
          criteria {
            id
            name
            order
            min
            max
            step
            unit
            labels {
              min
              mid
              max
            }
          }
          cases {
            id
            title
            description
            order
          }
        }

        tags {
          id
          name
          order
        }
      }

      ... on FlashcardElement {
        id
        name
        status
        type
        content

        basePoints
        pointsMultiplier
        version

        isArchived
        isDeleted
        createdAt
        updatedAt

        derivedAccess
        numSharedUsers
        permissionLevel
        isOwner
        isManager
        isEditor
        isImported
        isShared
        isRemovable
        sharingType

        tags {
          id
          name
          order
        }
      }

      ... on ContentElement {
        id
        name
        status
        type
        content

        basePoints
        pointsMultiplier
        version

        isArchived
        isDeleted
        createdAt
        updatedAt

        derivedAccess
        numSharedUsers
        permissionLevel
        isOwner
        isManager
        isEditor
        isImported
        isShared
        isRemovable
        sharingType

        tags {
          id
          name
          order
        }
      }

      ... on QrScanElement {
        id
        name
        status
        type
        content

        basePoints
        pointsMultiplier
        version

        isArchived
        isDeleted
        createdAt
        updatedAt

        derivedAccess
        numSharedUsers
        permissionLevel
        isOwner
        isManager
        isEditor
        isImported
        isShared
        isRemovable
        sharingType

        tags {
          id
          name
          order
        }
      }
    }
  }
}
