fragment ActivityDetailsData on ActivityDetails {
  id
  metadata {
    name
    displayName
    type
    pointsMultiplier
    totalBasePoints
    totalCorrectnessPoints
    totalBonusPoints
    totalPoints
  }
  stacks {
    id
    numOfParticipants
    timeLimit
    stackPoints
    elements {
      id
      name
      type
      pointsMultiplier
      basePoints
      correctnessPoints
      bonusPoints
      totalPoints
      instance {
        id
        type
        elementType
        ...ElementData
      }
    }
  }
}
