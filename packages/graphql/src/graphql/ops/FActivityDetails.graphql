fragment ActivityDetailsData on ActivityDetails {
  id
  name
  displayName

  arePointsAwarded
  pointsMultiplier
  totalBasePoints
  totalCorrectnessPoints
  totalBonusPoints
  totalPoints

  stacks {
    id
    numOfParticipants
    timeLimit
    stackPoints
    elements {
      basePoints
      correctnessPoints
      bonusPoints
      totalPoints
      hasSampleSolution
      instance {
        id
        type
        elementType
        options {
          pointsMultiplier
        }
        ...ElementData
      }
    }
  }
}
