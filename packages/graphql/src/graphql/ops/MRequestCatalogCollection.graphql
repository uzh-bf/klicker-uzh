mutation RequestCatalogCollection(
  $catalogCollectionId: String!
  $requestedPermissionLevel: PermissionLevel
) {
  requestCatalogCollection(
    catalogCollectionId: $catalogCollectionId
    requestedPermissionLevel: $requestedPermissionLevel
  ) {
    id
    name
    access
    ownerShortname
    isOwner
    isManager
    isRequested
    isShared
  }
}
