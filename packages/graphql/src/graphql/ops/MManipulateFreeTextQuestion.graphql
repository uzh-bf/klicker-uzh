mutation ManipulateFreeTextQuestion(
  $id: Int
  $status: ElementStatus
  $name: String
  $content: String
  $explanation: String
  $options: OptionsFreeTextInput
  $basePoints: Boolean
  $pointsMultiplier: Int
  $tags: [String!]
  $initialCompetenceTreeAssignment: CompetenceTreeElementAssignmentCreateInput
  $creationRequestId: String
) {
  manipulateFreeTextQuestion(
    id: $id
    status: $status
    name: $name
    content: $content
    explanation: $explanation
    options: $options
    basePoints: $basePoints
    pointsMultiplier: $pointsMultiplier
    tags: $tags
    initialCompetenceTreeAssignment: $initialCompetenceTreeAssignment
    creationRequestId: $creationRequestId
  ) {
    __typename
    ... on FreeTextElement {
      id
      name
      status
      type
      content
      explanation
      basePoints
      pointsMultiplier
      options {
        hasSampleSolution
        restrictions {
          maxLength
        }
        solutions
      }
      tags {
        id
        name
      }
    }
  }
}
