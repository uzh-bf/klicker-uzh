query Participations($endpoint: String, $assessmentOnly: Boolean) {
  participations(endpoint: $endpoint, assessmentOnly: $assessmentOnly) {
    id
    completedMicroLearnings
    subscriptions {
      id
      endpoint
    }
    course {
      id
      displayName
      startDate
      endDate
      description
      isGamificationEnabled
      microLearnings {
        id
        displayName
        scheduledStartAt
        scheduledEndAt
      }
      liveQuizzes {
        id
        displayName
      }
    }
  }
}
