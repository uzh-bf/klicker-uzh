query GetControlLiveQuizFeedbacks($id: String!) {
  controlLiveQuizFeedbacks(id: $id) {
    id
    isLiveQAEnabled
    isModerationEnabled
    isConfusionFeedbackEnabled
    confusionSummary {
      speed
      difficulty
      numberOfParticipants
    }
    feedbacks {
      id
      isPublished
      isPinned
      isResolved
      content
      votes
      createdAt
      resolvedAt
      responses {
        id
        content
        createdAt
      }
    }
  }
}
