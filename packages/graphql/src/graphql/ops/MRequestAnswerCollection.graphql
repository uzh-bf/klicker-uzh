mutation RequestAnswerCollection(
  $collectionId: Int!
  $catalogCollectionId: String
) {
  requestAnswerCollection(
    collectionId: $collectionId
    catalogCollectionId: $catalogCollectionId
  ) {
    id
    uuid
    name
    objectType
    assignmentId
    access
    ownerShortname
    isOwner
    isManager
    isRequested
    isShared
  }
}
