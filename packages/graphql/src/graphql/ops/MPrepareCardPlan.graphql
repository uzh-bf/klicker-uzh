mutation MPrepareCardPlan($input: PrepareCardPlanInput!) {
  prepareCardPlan(input: $input) {
    planId
    courseLanguage
    existingTitles
    cards {
      type
      candidateId
      title
      intent
      query
    }
    discardedDuplicates {
      title
      matchedTitle
      similarity
    }
  }
}
