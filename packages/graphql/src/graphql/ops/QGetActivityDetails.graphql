query GetActivityDetails($activityId: String!, $activityType: ActivityType!) {
  activityDetails(activityId: $activityId, activityType: $activityType) {
    id
    name
    displayName

    arePointsAwarded
    pointsMultiplier
    totalBasePoints
    totalCorrectnessPoints
    totalBonusPoints
    totalPoints

    stacks {
      id
      numOfParticipants
      timeLimit
      stackPoints
      elements {
        basePoints
        correctnessPoints
        bonusPoints
        totalPoints
        hasSampleSolution
        isEditor

        instance {
          id
          type
          elementType
          options {
            pointsMultiplier
          }
          ...ElementData
        }
      }
    }
  }
}
