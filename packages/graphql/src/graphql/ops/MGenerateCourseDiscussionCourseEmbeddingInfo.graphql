mutation GenerateCourseDiscussionCourseEmbeddingInfo(
  $courseId: String!
  $allowAnonymous: Boolean
  $expiresInHours: Int
) {
  generateCourseDiscussionEmbeddingInfo(
    courseId: $courseId
    allowAnonymous: $allowAnonymous
    expiresInHours: $expiresInHours
  ) {
    courseId
    scopeKey
    scopeLabel
    allowAnonymous
    expiresAt
    embedToken
    embedUrl
  }
}
