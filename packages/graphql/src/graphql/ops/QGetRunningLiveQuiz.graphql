query GetRunningLiveQuiz($id: String!) {
  studentLiveQuiz(id: $id) {
    id
    status
    isLiveQAEnabled
    isConfusionFeedbackEnabled
    isModerationEnabled
    isGamificationEnabled
    isAssessmentEnabled
    responseCollectionMode
    isPartOfGamifiedCourse
    beforeFirstBlock

    namespace
    displayName
    description

    course {
      id
      displayName
      color
    }

    ...StudentLiveQuizBlocksData
  }
}
