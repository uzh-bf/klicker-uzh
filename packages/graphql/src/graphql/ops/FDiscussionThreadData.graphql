fragment DiscussionThreadData on DiscussionThread {
  id
  spaceId
  scopeId
  content
  isAnonymous
  isDeleted
  authorParticipantId
  upvotes
  hasUpvoted
  replyCount
  lastActivityAt
  sourceKey
  sourceLabel
  liveQuizId
  liveQuizName
  createdAt
  updatedAt
