query GetActiveUserCourses($activityId: String, $activityType: ActivityType) {
  getActiveUserCourses(activityId: $activityId, activityType: $activityType) {
    id
    name
    displayName
    color
    pinCode
    isArchived
    isGamificationEnabled
    isAssessmentEnabled
    isAdaptiveLearningEnabled
    isGroupCreationEnabled
    description
    startDate
    endDate
    groupDeadlineDate
    isOwner
    isManager
    isEditor
    isShared
    createdAt
    updatedAt
  }
}
