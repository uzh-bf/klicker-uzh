query GetSingleCourse($courseId: String!) {
  course(id: $courseId) {
    id
    isArchived
    isGamificationEnabled
    pinCode
    name
    displayName
    description
    color
    numOfParticipants
    numOfParticipantGroups
    averageScore
    startDate
    endDate

    isGroupCreationEnabled
    groupDeadlineDate
    maxGroupSize
    preferredGroupSize
    randomAssignmentFinalized

    derivedAccess
    numSharedUsers
    permissionLevel
    isOwner
    isManager
    isEditor
    isShared
    isRemovable

    liveQuizzesInfo {
      ...ActivityInfoData
    }
    practiceQuizzesInfo {
      ...ActivityInfoData
    }
    microLearningsInfo {
      ...ActivityInfoData
    }
    groupActivitiesInfo {
      ...ActivityInfoData
    }
  }
}
