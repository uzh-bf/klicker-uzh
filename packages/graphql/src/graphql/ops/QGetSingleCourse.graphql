query GetSingleCourse($courseId: String!) {
  course(id: $courseId) {
    id
    isArchived
    isGamificationEnabled
    pinCode
    name
    displayName
    description
    color
    numOfParticipants
    numOfParticipantGroups
    averageScore
    startDate
    endDate

    isGroupCreationEnabled
    groupDeadlineDate
    maxGroupSize
    preferredGroupSize
    randomAssignmentFinalized

    derivedAccess
    numSharedUsers
    permissionLevel
    isOwner
    isManager
    isEditor
    isShared
    isRemovable

    liveQuizActivities {
      ...ActivityInfoData
    }
    practiceQuizActivities {
      ...ActivityInfoData
    }
    microLearningActivities {
      ...ActivityInfoData
    }
    groupActivityActivities {
      ...ActivityInfoData
    }
  }
}
