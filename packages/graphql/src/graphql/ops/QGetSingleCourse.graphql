query GetSingleCourse($courseId: String!) {
  course(id: $courseId) {
    id
    isArchived
    isGamificationEnabled
    isAssessmentEnabled
    isCourseQARolloutEnabled
    isCourseQAEnabled
    isCourseQAAnonymousEnabled
    pinCode
    name
    displayName
    description
    language
    notificationEmail
    color
    numOfParticipants
    numOfParticipantGroups
    averageScore
    startDate
    endDate

    isGroupCreationEnabled
    groupDeadlineDate
    maxGroupSize
    preferredGroupSize
    randomAssignmentFinalized
    derivedAccess
    numSharedUsers
    permissionLevel
    isOwner
    isManager
    isEditor
    isShared
    isRemovable

    liveQuizzesInfo {
      ...ActivityInfoData
    }
    practiceQuizzesInfo {
      ...ActivityInfoData
    }
    microLearningsInfo {
      ...ActivityInfoData
    }
    groupActivitiesInfo {
      ...ActivityInfoData
    }
  }
}
