query GetSingleCourse($courseId: String!) {
  course(id: $courseId) {
    id
    isArchived
    isGamificationEnabled
    pinCode
    name
    displayName
    description
    color
    numOfParticipants
    numOfActiveParticipants
    numOfParticipantGroups
    averageScore
    averageActiveScore
    startDate
    endDate

    isGroupCreationEnabled
    groupDeadlineDate
    maxGroupSize
    preferredGroupSize
    randomAssignmentFinalized

    liveQuizzes {
      id
      name
      displayName
      isGamificationEnabled
      isLiveQAEnabled
      isConfusionFeedbackEnabled
      isModerationEnabled
      pinCode
      accessMode
      status
      pointsMultiplier
      createdAt
      numOfBlocks
      numOfInstances
    }
    practiceQuizzes {
      id
      name
      displayName
      status
      availableFrom
      orderType
      pointsMultiplier
      resetTimeDays
      numOfStacks
    }
    groupActivities {
      id
      name
      displayName
      status
      scheduledStartAt
      scheduledEndAt
      numOfQuestions
    }
    microLearnings {
      id
      name
      displayName
      status
      scheduledStartAt
      scheduledEndAt
      pointsMultiplier
      numOfStacks
    }
    leaderboard {
      id
      score
      rank
      username
      email
      avatar
    }
  }
}
