mutation MUpdateChatbotRevisionMetadata(
  $chatbotId: String!
  $expectedRevisionVersion: Int!
  $name: String
  $description: String
  $avatar: String
) {
  updateChatbotRevisionMetadata(
    chatbotId: $chatbotId
    expectedRevisionVersion: $expectedRevisionVersion
    name: $name
    description: $description
    avatar: $avatar
  ) {
    id
    name
    description
    avatar
    status
    revisionStatus
    revisionVersion
    authoringRevision {
      ...ChatbotAuthoringRevisionData
    }
  }
}
