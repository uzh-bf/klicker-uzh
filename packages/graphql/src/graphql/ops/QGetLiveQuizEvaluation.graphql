query GetLiveQuizEvaluation($id: String!, $hmac: String) {
  liveQuizEvaluation(id: $id, hmac: $hmac) {
    id
    name
    displayName
    description
    courseLanguage
    status
    responseCollectionMode
    canExportCorrelatedResponses

    isAssessmentEnabled
    pinCode

    ...EvaluationResults

    feedbacks {
      id
      isPublished
      isPinned
      isResolved
      content
      votes
      resolvedAt
      createdAt
      responses {
        id
        content
        positiveReactions
        negativeReactions
        createdAt
      }
    }
    confusionFeedbacks {
      speed
      difficulty
      createdAt
    }
  }
  liveQuizLeaderboard(quizId: $id, hmac: $hmac) {
    id
    participantId
    rank
    username
    avatar
    score
    isTemporary
  }
}
