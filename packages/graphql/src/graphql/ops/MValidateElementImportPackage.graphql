mutation ValidateElementImportPackage($blobName: String!) {
  validateElementImportPackage(blobName: $blobName) {
    importToken
    warnings
    errors
    answerCollections {
      ref
      name
      description
      alreadyImported
      existingAnswerCollectionId
      entries {
        id
        value
      }
    }
    elements {
      ref
      name
      content
      type
      options
      pointsMultiplier
      basePoints
      explanation
      status
      tags
      alreadyImported
      existingElementId
      answerCollectionId
      answerCollectionRef
      answerCollectionItems {
        id
        value
      }
      answerCollectionEntries {
        id
        value
      }
    }
  }
}
