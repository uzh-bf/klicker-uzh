mutation DeleteFeedbackResponse($id: Int!, $liveQuizId: String!) {
  deleteFeedbackResponse(id: $id, liveQuizId: $liveQuizId) {
    id
    isPublished
    isPinned
    isResolved
    content
    votes
    createdAt
    resolvedAt
    responses {
      id
      content
      positiveReactions
      negativeReactions
      createdAt
    }
  }
}
