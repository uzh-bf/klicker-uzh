mutation AddAnswerCollectionToCatalog(
  $collectionId: Int!
  $access: ObjectAccess!
  $catalogCollectionId: String
) {
  addAnswerCollectionToCatalog(
    collectionId: $collectionId
    access: $access
    catalogCollectionId: $catalogCollectionId
  ) {
    id
    uuid
    name
    objectType
    access
    ownerShortname
    isRequested
    isShared
    isOwner
  }
}
