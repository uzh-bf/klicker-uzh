mutation TransferCollectionOwnership(
  $collectionId: Int!
  $usernameOrEmail: String!
) {
  transferCollectionOwnership(
    collectionId: $collectionId
    usernameOrEmail: $usernameOrEmail
  ) {
    permissionId
    userId
    username
    userEmail
    userGroupName
    accessLevel
    isRevokable
    isOwn
  }
}
