mutation ShareObject(
  $objectId: String!
  $objectType: SharingObjectType!
  $permissionLevel: PermissionLevel!
  $shortnameOrEmail: String
  $userGroupId: Int
) {
  shareObject(
    objectId: $objectId
    objectType: $objectType
    permissionLevel: $permissionLevel
    shortnameOrEmail: $shortnameOrEmail
    userGroupId: $userGroupId
  ) {
    ...PermissionInfoData
  }
}
