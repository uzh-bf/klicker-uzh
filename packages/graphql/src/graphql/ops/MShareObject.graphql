mutation ShareObject(
  $objectId: String!
  $objectType: CatalogObjectType!
  $permissionLevel: PermissionLevel!
  $usernameOrEmail: String
  $userGroupId: Int
) {
  shareObject(
    objectId: $objectId
    objectType: $objectType
    permissionLevel: $permissionLevel
    usernameOrEmail: $usernameOrEmail
    userGroupId: $userGroupId
  ) {
    ...PermissionInfoData
  }
}
