fragment MicroLearningData on MicroLearning {
  id
  name
  status
  displayName
  description
  pointsMultiplier
  scheduledStartAt
  scheduledEndAt
  escapeRoomConfig {
    id
    timeLimit
    hintPenalty
    lockoutSeconds
    hintPenalties
    wrongAnswerPenalty
    maxWrongAttempts
    revealPenalty
    skipPenalty
    bonusSeconds
    introText
  }
  escapeRoomAttempts {
    id
    startedAt
    timeLimit
    penaltySeconds
    remainingSeconds
    expiresInSeconds
    hintsUsed
    stageOutcomes {
      stageKey
      wrongAttempts
      outcome
      at
    }
    status
    completedAt
    lockoutUntil
  }
  course {
    id
    displayName
    color
  }
  stacks {
    id
    type
    displayName
    description
    order
    isCorrect
    elements {
      id
      type
      elementType
      revealedHint
      ...ElementData
    }
  }
}
