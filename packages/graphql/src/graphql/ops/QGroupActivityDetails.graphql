query GroupActivityDetails($activityId: String!, $groupId: String!) {
  groupActivityDetails(activityId: $activityId, groupId: $groupId) {
    id
    displayName
    status
    description
    scheduledStartAt
    scheduledEndAt
    escapeRoomConfig {
      id
      timeLimit
      hintPenalty
      lockoutSeconds
      introText
    }
    escapeRoomAttempts {
      id
      startedAt
      timeLimit
      penaltySeconds
      remainingSeconds
      expiresInSeconds
      hintsUsed
      status
      completedAt
      lockoutUntil
      elementBlockId
    }

    clues {
      id
      displayName
    }

    stacks {
      id
      isCorrect
      type
      displayName
      description
      order
      elements {
        id
        revealedHint
        type
        elementType
        options {
          hasHint
        }
        ...ElementDataWithoutSolutions
      }
    }

    course {
      id
      displayName
      color
    }

    group {
      id
      name
      participants {
        id
        username
        avatar
        isSelf
      }
    }

    activityInstance {
      id

      clues {
        id
        displayName
        type
        unit
        value

        participant {
          id
          username
          avatar
          isSelf
        }
      }

      decisionsSubmittedAt
      decisions {
        instanceId
        type
        freeTextResponse
        choicesResponse {
          ix
          selected
        }
        numericalResponse
        contentResponse
        selectionResponse
        caseStudyResponse {
          caseId
          itemResponses {
            itemId
            criterionResponses {
              criterionId
              response
            }
          }
        }
      }

      resultsComputedAt
      results {
        passed
        points
        comment
        grading {
          instanceId
          score
          maxPoints
          feedback
        }
      }
    }
  }
}
