mutation DeleteElement($id: Int!) {
  deleteElement(id: $id) {
    ... on ChoicesElement {
      id
    }
    ... on NumericalElement {
      id
    }
    ... on FreeTextElement {
      id
    }
    ... on SelectionElement {
      id
    }
    ... on CaseStudyElement {
      id
    }
    ... on FlashcardElement {
      id
    }
    ... on ContentElement {
      id
    }
  }
}
