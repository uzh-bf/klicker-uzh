mutation ChangeCollectionPermissionLevel(
  $collectionId: Int!
  $permissionId: Int!
  $permissionLevel: PermissionLevel!
) {
  changeCollectionPermissionLevel(
    collectionId: $collectionId
    permissionId: $permissionId
    permissionLevel: $permissionLevel
  ) {
    permissionId
    permissionLevel
  }
}
