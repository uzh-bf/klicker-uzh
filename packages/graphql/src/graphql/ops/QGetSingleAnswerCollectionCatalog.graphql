query GetSingleAnswerCollectionCatalog(
  $collectionId: Int!
  $catalogCollectionId: String
) {
  getSingleAnswerCollectionCatalog(
    collectionId: $collectionId
    catalogCollectionId: $catalogCollectionId
  ) {
    id
    name
    description
    objectAccess
    ownerShortname
    entries {
      id
      value
    }
  }
}
