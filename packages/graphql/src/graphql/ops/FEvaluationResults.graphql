fragment EvaluationResults on ActivityEvaluation {
  results {
    stackId
    stackName
    stackDescription
    stackOrder

    instances {
      ... on ChoicesElementInstanceEvaluation {
        __typename
        id
        type
        name
        content
        explanation

        hasSampleSolution
        hasAnswerFeedbacks

        results {
          totalAnswers
          anonymousAnswers
          choices {
            value
            count
            correct
            feedback
          }
        }
      }

      ... on NumericalElementInstanceEvaluation {
        __typename
        id
        type
        name
        content
        explanation

        hasSampleSolution
        hasAnswerFeedbacks

        results {
          totalAnswers
          anonymousAnswers
          maxValue
          minValue
          solutionRanges {
            min
            max
          }
          exactSolutions
          responseValues {
            value
            correct
            count
          }
        }

        statistics {
          max
          mean
          median
          min
          q1
          q3
          sd
        }
      }

      ... on FreeElementInstanceEvaluation {
        __typename
        id
        type
        name
        content
        explanation

        hasSampleSolution
        hasAnswerFeedbacks

        results {
          totalAnswers
          anonymousAnswers
          maxLength
          solutions
          responses {
            value
            correct
            count
          }
        }
      }

      ... on SelectionElementInstanceEvaluation {
        __typename
        id
        type
        name
        content
        explanation

        hasSampleSolution
        hasAnswerFeedbacks

        results {
          totalAnswers
          anonymousAnswers
          numberOfInputs
          answerSolutionIds
          selectionResponses {
            answerId
            value
            count
          }
        }
      }

      ... on FlashcardElementInstanceEvaluation {
        __typename
        id
        type
        name
        content
        explanation

        hasSampleSolution
        hasAnswerFeedbacks

        results {
          totalAnswers
          anonymousAnswers
          correctCount
          partialCount
          incorrectCount
        }
      }

      ... on ContentElementInstanceEvaluation {
        __typename
        id
        type
        name
        content
        explanation

        hasSampleSolution
        hasAnswerFeedbacks

        results {
          totalAnswers
          anonymousAnswers
        }
      }
    }
  }
}
