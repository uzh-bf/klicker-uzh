fragment EvaluationResults on ActivityEvaluation {
  results {
    stackId
    stackName
    stackDescription
    stackOrder
    stackActive
    instanceCount

    # live quiz specific information
    status
    expiresAt
    closedAt
    timeLimit

    instances {
      ... on ChoicesActivityEvaluationData {
        __typename
        id
        type
        name
        content
        explanation

        hasSampleSolution
        hasAnswerFeedbacks

        results {
          totalAnswers
          anonymousAnswers
          choices {
            value
            count
            correct
            feedback
          }
        }
      }

      ... on NumericalActivityEvaluationData {
        __typename
        id
        type
        name
        content
        explanation

        hasSampleSolution
        hasAnswerFeedbacks

        results {
          totalAnswers
          anonymousAnswers
          maxValue
          minValue
          solutionRanges {
            min
            max
          }
          exactSolutions
          responseValues {
            value
            correct
            count
          }
        }

        statistics {
          max
          mean
          median
          min
          q1
          q3
          sd
        }
      }

      ... on FreeTextActivityEvaluationData {
        __typename
        id
        type
        name
        content
        explanation

        hasSampleSolution
        hasAnswerFeedbacks

        results {
          totalAnswers
          anonymousAnswers
          maxLength
          solutions
          responses {
            value
            correct
            count
          }
        }
      }

      ... on SelectionActivityEvaluationData {
        __typename
        id
        type
        name
        content
        explanation

        hasSampleSolution
        hasAnswerFeedbacks

        results {
          totalAnswers
          anonymousAnswers
          numberOfInputs
          answerSolutionIds
          selectionResponses {
            answerId
            value
            count
          }
        }
      }

      ... on CaseStudyActivityEvaluationData {
        __typename
        id
        type
        name
        content
        explanation

        hasSampleSolution
        hasAnswerFeedbacks

        cases {
          id
          name
          description
        }
        items {
          id
          name
        }
        criteria {
          id
          name
          labels {
            min
            mid
            max
          }
        }

        results {
          totalAnswers
          anonymousAnswers
          caseResults {
            caseId
            items {
              itemId
              criteria {
                criterionId
                name
                min
                max
                step
                unit

                solutionMin
                solutionMax

                statistics {
                  min
                  max
                  mean
                  median
                  q1
                  q3
                  sd
                }

                responses {
                  value
                  count
                }
              }
            }
          }
        }
      }

      ... on FlashcardActivityEvaluationData {
        __typename
        id
        type
        name
        content
        explanation

        hasSampleSolution
        hasAnswerFeedbacks

        results {
          totalAnswers
          anonymousAnswers
          correctCount
          partialCount
          incorrectCount
        }
      }

      ... on ContentActivityEvaluationData {
        __typename
        id
        type
        name
        content
        explanation

        hasSampleSolution
        hasAnswerFeedbacks

        results {
          totalAnswers
          anonymousAnswers
        }
      }
    }
  }
}
