mutation RequestKbFileUpload(
  $kbId: ID!
  $fileName: String!
  $contentType: String!
  $sizeBytes: Int!
  $rightsConfirmed: Boolean!
  $personalDataConfirmed: Boolean!
) {
  requestKbFileUpload(
    kbId: $kbId
    fileName: $fileName
    contentType: $contentType
    sizeBytes: $sizeBytes
    rightsConfirmed: $rightsConfirmed
    personalDataConfirmed: $personalDataConfirmed
  ) {
    uploadSasURL
    containerName
    blobName
  }
}
