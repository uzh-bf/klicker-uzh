mutation CreateParticipantAccountWithDataUse(
  $email: String!
  $username: String!
  $password: String!
  $isProfilePublic: Boolean!
  $courseId: String
  $signedLtiData: String
  $dataUse: ParticipantInitialDataUseInput!
) {
  createParticipantAccount(
    email: $email
    username: $username
    password: $password
    isProfilePublic: $isProfilePublic
    courseId: $courseId
    signedLtiData: $signedLtiData
    dataUse: $dataUse
  ) {
    participantToken
    participant {
      id
      email
      username
    }
  }
}
