mutation UpdateCourseSettings(
  $id: String!
  $name: String
  $displayName: String
  $description: String
  $color: String
  $startDate: Date
  $endDate: Date
  $isGroupCreationEnabled: Boolean
  $groupDeadlineDate: Date
  $language: LocaleType!
  $notificationEmail: String
  $isGamificationEnabled: Boolean
  $isCourseQAEnabled: Boolean
  $isCourseQAAnonymousEnabled: Boolean
) {
  updateCourseSettings(
    id: $id
    name: $name
    displayName: $displayName
    description: $description
    color: $color
    startDate: $startDate
    endDate: $endDate
    isGroupCreationEnabled: $isGroupCreationEnabled
    groupDeadlineDate: $groupDeadlineDate
    language: $language
    notificationEmail: $notificationEmail
    isGamificationEnabled: $isGamificationEnabled
    isCourseQAEnabled: $isCourseQAEnabled
    isCourseQAAnonymousEnabled: $isCourseQAAnonymousEnabled
  ) {
    id
    name
    displayName
    description
    color
    startDate
    endDate
    groupDeadlineDate
    maxGroupSize
    preferredGroupSize
    language
    notificationEmail
    isArchived
    isGamificationEnabled
    isAssessmentEnabled
    isCourseQAEnabled
    isCourseQAAnonymousEnabled
    isGroupCreationEnabled
    randomAssignmentFinalized
    createdAt
    updatedAt
  }
}
