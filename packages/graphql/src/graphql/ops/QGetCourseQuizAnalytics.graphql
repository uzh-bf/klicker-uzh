query GetCourseQuizAnalytics($courseId: String!) {
  getCourseQuizAnalytics(courseId: $courseId) {
    name
    totalParticipants
    instanceFeedbacks {
      __typename
      id
      activityType
      instanceName
      instanceType
      upvoteRate
      downvoteRate
      feedbackCount
    }
    activityFeedbacks {
      __typename
      id
      activityType
      activityName
      upvoteRate
      downvoteRate
      feedbackCount
    }
  }
}
