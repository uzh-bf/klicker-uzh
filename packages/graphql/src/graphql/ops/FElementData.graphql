fragment ElementData on ElementInstance {
  elementData {
    ... on ChoicesElementData {
      __typename
      id
      elementId
      name
      type
      content
      explanation
      basePoints
      pointsMultiplier
      options {
        hasSampleSolution
        hasAnswerFeedbacks
        displayMode
        choices {
          ix
          correct
          feedback
          value
        }
      }
    }

    ... on NumericalElementData {
      __typename
      id
      elementId
      name
      type
      content
      explanation
      basePoints
      pointsMultiplier
      options {
        hasSampleSolution
        accuracy
        placeholder
        unit
        restrictions {
          min
          max
        }
        solutionRanges {
          min
          max
        }
        exactSolutions
      }
    }

    ... on FreeTextElementData {
      __typename
      id
      elementId
      name
      type
      content
      explanation
      basePoints
      pointsMultiplier
      options {
        hasSampleSolution
        restrictions {
          maxLength
        }
        solutions
      }
    }

    ... on SelectionElementData {
      __typename
      id
      elementId
      name
      type
      content
      explanation
      basePoints
      pointsMultiplier
      options {
        hasSampleSolution
        numberOfInputs
        answerCollection {
          id
          entries {
            id
            value
          }
        }
        answerCollectionSolutionIds
      }
    }

    ... on CaseStudyElementData {
      __typename
      id
      elementId
      name
      type
      content
      explanation
      basePoints
      pointsMultiplier
      options {
        hasSampleSolution
        answerCollectionId
        items {
          id
          value
        }
        criteria {
          id
          name
          min
          max
          step
          unit
          labels {
            min
            mid
            max
          }
        }
        cases {
          id
          title
          description
          solutions {
            itemId
            criteriaSolutions {
              criterionId
              min
              max
            }
          }
        }
      }
    }

    ... on FlashcardElementData {
      __typename
      id
      elementId
      name
      type
      content
      explanation
      basePoints
      pointsMultiplier
    }

    ... on ContentElementData {
      __typename
      id
      elementId
      name
      type
      content
      explanation
      basePoints
      pointsMultiplier
    }

    ... on QrScanElementData {
      __typename
      id
      elementId
      name
      type
      content
      explanation
      basePoints
      pointsMultiplier
    }
  }
}
