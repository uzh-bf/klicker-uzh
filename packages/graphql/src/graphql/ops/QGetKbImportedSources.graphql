query GetKbImportedSources($kbId: ID!, $first: Int, $after: String) {
  getKbImportedSources(kbId: $kbId, first: $first, after: $after) {
    items {
      id
      title
      sourceType
      sourceUrl
      ingestedAt
      observedAt
      chunkCount
      origin
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalSourcesInScan
    incomplete
    unidentifiedChunks
  }
}
