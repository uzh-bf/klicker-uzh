mutation ManipulateSelectionQuestion(
  $id: Int
  $status: ElementStatus
  $name: String
  $content: String
  $explanation: String
  $options: OptionsSelectionInput
  $basePoints: Boolean
  $pointsMultiplier: Int
  $tags: [String!]
) {
  manipulateSelectionQuestion(
    id: $id
    status: $status
    name: $name
    content: $content
    explanation: $explanation
    options: $options
    basePoints: $basePoints
    pointsMultiplier: $pointsMultiplier
    tags: $tags
  ) {
    __typename
    ... on SelectionElement {
      id
      name
      status
      type
      content
      explanation
      basePoints
      pointsMultiplier
      options {
        hasSampleSolution
        numberOfInputs
        answerCollection {
          id
        }
        answerCollectionSolutionIds
      }
      tags {
        id
        name
      }
    }
  }
}
