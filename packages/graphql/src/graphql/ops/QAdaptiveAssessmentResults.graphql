query QAdaptiveAssessmentResults(
  $assessmentId: String!
  $attemptMode: AdaptiveOverviewAttemptMode
) {
  adaptiveAssessmentResults(
    assessmentId: $assessmentId
    attemptMode: $attemptMode
  ) {
    assessmentId
    participantCount
    completedCount
    inProgressCount
    attemptCount
    completedAttemptCount
    completionRate
    classMeanTheta
    meanStandardError
    averageAnsweredQuestions
    distribution {
      levelLabel
      minTheta
      maxTheta
      count
    }
    competences {
      competenceId
      competenceName
      weight
      theta
      standardError
      levelLabel
      answeredQuestions
      subCompetences {
        subCompetenceId
        subCompetenceName
        theta
        standardError
        levelLabel
        answeredQuestions
      }
    }
    students {
      attemptId
      attemptNumber
      isLatestAttempt
      participantId
      participantUsername
      participantEmail
      status
      startedAt
      completedAt
      answeredQuestions
      theta
      standardError
      levelLabel
      message
      messages
      competences {
        competenceId
        competenceName
        weight
        theta
        standardError
        levelLabel
        answeredQuestions
        subCompetences {
          subCompetenceId
          subCompetenceName
          theta
          standardError
          levelLabel
          answeredQuestions
        }
      }
    }
    items {
      adaptiveElementId
      elementId
      elementName
      competenceName
      subCompetenceName
      levelLabel
      difficulty
      discrimination
      guessing
      exposure
      responseCount
      correctCount
      accuracy
    }
  }
}
