services:
  reverse_proxy_docker:
    build:
      context: ../../../../util/traefik
      dockerfile: Dockerfile
    command:
      # Rules
      - --providers.file=true
      - --providers.file.filename=/etc/traefik/rules.yaml
      - --providers.file.watch=true

      # API and dashboard
      - '--api.insecure=true'
      - '--api.dashboard=true'

      # Entry points configuration
      - '--entrypoints.web.address=:80'
      - '--entrypoints.websecure.address=:443'

      # HTTP/2 configuration (critical for subscriptions)
      - '--entrypoints.websecure.http.tls=true'
      - '--entrypoints.websecure.http2.maxConcurrentStreams=250'

      # HTTP to HTTPS redirect
      # - '--entrypoints.web.http.redirections.entrypoint.to=websecure'
      # - '--entrypoints.web.http.redirections.entrypoint.scheme=https'
    ports:
      - 80:80
      - 443:443
      - 8090:8080
    volumes:
      - '../../../../util/traefik/rules_docker.yaml:/etc/traefik/rules.yaml'
      - '../../../../util/traefik/ssl:/etc/certs:ro'
    networks:
      - klicker
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  # main database
  postgres:
    image: docker.io/library/postgres:15
    environment:
      POSTGRES_USER: klicker
      POSTGRES_PASSWORD: klicker
      POSTGRES_DB: klicker-prod
    ports:
      - 5432:5432
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'klicker', '-d', 'klicker-prod']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - klicker
    volumes:
      - klicker_data:/var/lib/postgresql/data
      - ../../../../util/init.sql:/docker-entrypoint-initdb.d/init.sql

  # hatchet services and services
  hatchet_postgres:
    image: postgres:15.6
    command: postgres -c 'max_connections=1000'
    restart: always
    hostname: 'postgres'
    environment:
      - POSTGRES_USER=hatchet
      - POSTGRES_PASSWORD=hatchet
      - POSTGRES_DB=hatchet
    ports:
      - '5435:5432'
    volumes:
      - hatchet_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d hatchet -U hatchet']
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - klicker

  hatchet_rabbitmq:
    image: 'rabbitmq:3-management'
    hostname: 'rabbitmq'
    ports:
      - '5673:5672' # RabbitMQ
      - '15673:15672' # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: 'user'
      RABBITMQ_DEFAULT_PASS: 'password'
    volumes:
      - 'hatchet_rabbitmq_data:/var/lib/rabbitmq'
      - 'hatchet_rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf' # Configuration file mount
    healthcheck:
      test: ['CMD', 'rabbitmqctl', 'status']
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - klicker

  hatchet_migration:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-migrate:latest
    command: /hatchet/hatchet-migrate
    environment:
      DATABASE_URL: 'postgres://hatchet:hatchet@hatchet_postgres:5432/hatchet'
    depends_on:
      hatchet_postgres:
        condition: service_healthy
    networks:
      - klicker

  hatchet_setup_config:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-admin:latest
    command: /hatchet/hatchet-admin quickstart --skip certs --generated-config-dir /hatchet/config --overwrite=false
    environment:
      DATABASE_URL: 'postgres://hatchet:hatchet@hatchet_postgres:5432/hatchet'
      SERVER_TASKQUEUE_RABBITMQ_URL: amqp://user:password@hatchet_rabbitmq:5672/
      SERVER_AUTH_COOKIE_DOMAIN: localhost:8080
      SERVER_AUTH_COOKIE_INSECURE: 't'
      SERVER_GRPC_BIND_ADDRESS: '0.0.0.0'
      SERVER_GRPC_INSECURE: 't'
      SERVER_GRPC_BROADCAST_ADDRESS: localhost:7077
      SERVER_DEFAULT_ENGINE_VERSION: 'V1'
      SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS: hatchet_engine:7077
    volumes:
      - hatchet_certs:/hatchet/certs
      - hatchet_config:/hatchet/config
    depends_on:
      hatchet_migration:
        condition: service_completed_successfully
      hatchet_rabbitmq:
        condition: service_healthy
      hatchet_postgres:
        condition: service_healthy
    networks:
      - klicker

  hatchet_engine:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-engine:latest
    command: /hatchet/hatchet-engine --config /hatchet/config
    restart: on-failure
    depends_on:
      hatchet_setup_config:
        condition: service_completed_successfully
      hatchet_migration:
        condition: service_completed_successfully
    ports:
      - '7077:7070'
    environment:
      DATABASE_URL: postgres://hatchet:hatchet@hatchet_postgres:5432/hatchet
      SERVER_GRPC_BIND_ADDRESS: '0.0.0.0'
      SERVER_GRPC_INSECURE: 't'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'test -S /tmp/.s.PGSQL.7070 || nc -z localhost 7070 || true',
        ]
      interval: 10s
      timeout: 10s
      retries: 10
    volumes:
      - hatchet_certs:/hatchet/certs
      - hatchet_config:/hatchet/config
    networks:
      - klicker

  hatchet_token_generator:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-admin:latest
    command: >
      sh -c "
        echo 'Waiting for Hatchet config to be ready...';
        while ! test -f /hatchet/config/server.yaml; do
          echo 'Config not ready yet, waiting...';
          sleep 2;
        done;
        echo 'Config found, waiting for engine to be ready...';
        sleep 20;
        echo 'Generating Hatchet client token...';
        TOKEN=$$(/hatchet/hatchet-admin token create --config /hatchet/config --tenant-id 707d0855-80ab-4e1f-a156-f1c4546cbf52 --name klicker-test | grep '^eyJ' | head -n1 | xargs);
        if [ -z \"$$TOKEN\" ]; then
          echo 'ERROR: Failed to generate token';
          exit 1;
        fi;
        echo 'Token generated successfully';
        echo \"HATCHET_CLIENT_TOKEN=$$TOKEN\" > /hatchet/env/token.env;
        echo \"HATCHET_CLIENT_TLS_STRATEGY=none\" >> /hatchet/env/token.env;
        echo \"$$TOKEN\" > /hatchet/env/token.txt;
        echo 'Token saved to /hatchet/env/token.env';
        cat /hatchet/env/token.env;
      "
    environment:
      DATABASE_URL: postgres://hatchet:hatchet@hatchet_postgres:5432/hatchet
    volumes:
      - hatchet_certs:/hatchet/certs
      - hatchet_config:/hatchet/config
      - hatchet_env:/hatchet/env
    depends_on:
      hatchet_setup_config:
        condition: service_completed_successfully
      hatchet_migration:
        condition: service_completed_successfully
      hatchet_engine:
        condition: service_healthy
    networks:
      - klicker

  test:
    build:
      context: ../..
      dockerfile: test/docker/Dockerfile.test
    environment:
      DATABASE_URL: postgres://klicker:klicker@postgres:5432/klicker-prod
      NODE_ENV: test
      PNPM_HOME: '/tmp/.pnpm'
      # FORCE_COLOR: '1' # enable color output in logs
      # JEST_SILENT: 'false' # disable jest silent mode
      # DEBUG: '*' # enable debugging messages
      NODE_NO_WARNINGS: '0' # warnings should not be suppressed
    volumes:
      - ../../../../:/usr/src/app
      - hatchet_env:/hatchet/env
    depends_on:
      postgres:
        condition: service_healthy
      hatchet_postgres:
        condition: service_healthy
      hatchet_token_generator:
        condition: service_completed_successfully
    networks:
      - klicker

networks:
  klicker:
    driver: bridge

volumes:
  klicker_data:
  hatchet_postgres_data:
  hatchet_rabbitmq_data:
  hatchet_rabbitmq.conf:
  hatchet_config:
  hatchet_certs:
  hatchet_env:
