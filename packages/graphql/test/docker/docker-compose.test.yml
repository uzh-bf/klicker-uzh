services:
  reverse_proxy_macos:
    profiles:
      - dependencies
      - test
    build:
      context: ../../../../util/traefik
      dockerfile: Dockerfile
    command:
      # Rules
      - --providers.file=true
      - --providers.file.filename=/etc/traefik/rules.yaml
      - --providers.file.watch=true

      # API and dashboard
      - '--api.insecure=true'
      - '--api.dashboard=true'

      # Entry points configuration
      - '--entrypoints.web.address=:80'
      - '--entrypoints.websecure.address=:443'

      # HTTP/2 configuration (critical for subscriptions)
      - '--entrypoints.websecure.http.tls=true'
      - '--entrypoints.websecure.http2.maxConcurrentStreams=250'

      # HTTP to HTTPS redirect
      # - '--entrypoints.web.http.redirections.entrypoint.to=websecure'
      # - '--entrypoints.web.http.redirections.entrypoint.scheme=https'
    ports:
      - 80:80
      - 443:443
      - 8090:8080
    volumes:
      - '../../../../util/traefik/rules_docker.yaml:/etc/traefik/rules.yaml'
      - '../../../../util/traefik/ssl:/etc/certs:ro'
    networks:
      - klicker

  # main database
  postgres:
    profiles:
      - dependencies
      - test
    image: docker.io/library/postgres:15
    environment:
      POSTGRES_USER: klicker
      POSTGRES_PASSWORD: klicker
      POSTGRES_DB: klicker-prod
    ports:
      - 5432:5432
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'klicker', '-d', 'klicker-prod']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - klicker
    volumes:
      - klicker_data:/var/lib/postgresql/data
      - ../../../../util/init.sql:/docker-entrypoint-initdb.d/init.sql

  # Hatchet service
  hatchet:
    profiles:
      - dependencies
      - test
    image: ghcr.io/hatchet-dev/hatchet/hatchet-lite:latest
    ports:
      - '8888:8888'
      - '7077:7077'
    environment:
      DATABASE_URL: 'postgresql://hatchet:hatchet@postgres:5432/hatchet?sslmode=disable'
      SERVER_AUTH_COOKIE_DOMAIN: localhost
      SERVER_AUTH_COOKIE_INSECURE: 't'
      SERVER_GRPC_BIND_ADDRESS: '0.0.0.0'
      SERVER_GRPC_INSECURE: 't'
      SERVER_GRPC_BROADCAST_ADDRESS: localhost:7077
      SERVER_GRPC_PORT: '7077'
      SERVER_URL: http://localhost:8888
      SERVER_AUTH_SET_EMAIL_VERIFIED: 't'
      SERVER_DEFAULT_ENGINE_VERSION: 'V1'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8888/healthz']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - 'hatchet_lite_config:/config'
    networks:
      - klicker

  test:
    profiles:
      - test
    build:
      context: ../..
      dockerfile: test/docker/Dockerfile.test
    environment:
      DATABASE_URL: postgres://klicker:klicker@postgres:5432/klicker-prod
      NODE_ENV: test
      PNPM_HOME: '/tmp/.pnpm'
      # FORCE_COLOR: '1' # enable color output in logs
      # JEST_SILENT: 'false' # disable jest silent mode
      # DEBUG: '*' # enable debugging messages
      NODE_NO_WARNINGS: '0' # warnings should not be suppressed
    env_file:
      - ./.env
    volumes:
      - ../../../../:/usr/src/app
    depends_on:
      postgres:
        condition: service_healthy
      hatchet:
        condition: service_healthy
    networks:
      - klicker

networks:
  klicker:
    driver: bridge

volumes:
  klicker_data:
  hatchet_lite_config:
