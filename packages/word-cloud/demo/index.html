<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Cloud Demo</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      body {
        margin: 0;
        padding: 24px;
        background: linear-gradient(160deg, #f8fbff, #edf3f9);
      }

      .page {
        max-width: 1200px;
        margin: 0 auto;
      }

      .title {
        margin-top: 0;
        margin-bottom: 16px;
      }

      .layout {
        display: grid;
        gap: 16px;
        grid-template-columns: 330px 1fr;
      }

      .panel {
        background: #ffffff;
        border-radius: 12px;
        border: 1px solid #d4ddea;
        padding: 16px;
        box-shadow: 0 6px 14px rgba(10, 33, 51, 0.06);
      }

      .controls {
        display: grid;
        gap: 10px;
      }

      .controls label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 13px;
      }

      .controls input,
      .controls select {
        border: 1px solid #b7c7da;
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 14px;
      }

      .controls button {
        border: 0;
        border-radius: 9px;
        padding: 10px 12px;
        color: #fff;
        background: #0f5b78;
        font-size: 14px;
        cursor: pointer;
      }

      .controls button:hover {
        background: #117899;
      }

      .cloud-container {
        min-height: 620px;
      }

      #cloud {
        width: 100%;
        height: 620px;
        border: 1px solid #d6e0ec;
        border-radius: 10px;
        background: #ffffff;
      }

      .cloud-host {
        position: relative;
      }

      .empty-state {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 20px;
        color: #31485f;
        pointer-events: none;
      }

      .empty-state.visible {
        display: flex;
      }

      .stats {
        margin-top: 10px;
        font-size: 13px;
        color: #31485f;
      }

      @media (max-width: 980px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .cloud-container {
          min-height: 420px;
        }

        #cloud {
          height: 420px;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "d3-scale": "https://cdn.jsdelivr.net/npm/d3-scale@4.0.2/+esm",
          "d3-selection": "https://cdn.jsdelivr.net/npm/d3-selection@3.0.0/+esm",
          "d3-transition": "https://cdn.jsdelivr.net/npm/d3-transition@3.0.1/+esm"
        }
      }
    </script>
  </head>
  <body>
    <main class="page">
      <h1 class="title">Native D3 Word Cloud Demo</h1>
      <div class="layout">
        <section class="panel">
          <div class="controls">
            <label>
              Seed
              <input id="seed" type="text" value="42" />
            </label>
            <label>
              Scale
              <select id="scale">
                <option value="log" selected>log</option>
                <option value="sqrt">sqrt</option>
                <option value="linear">linear</option>
              </select>
            </label>
            <label>
              Width
              <input id="width" type="number" min="180" value="860" />
            </label>
            <label>
              Height
              <input id="height" type="number" min="180" value="620" />
            </label>
            <label>
              Min font size
              <input id="minFontSize" type="number" min="1" value="16" />
            </label>
            <label>
              Max font size
              <input id="maxFontSize" type="number" min="1" value="48" />
            </label>
            <label>
              Rotations
              <input id="rotations" type="number" min="1" value="2" />
            </label>
            <button id="render">Render</button>
            <button id="shuffle">Shuffle Weights</button>
            <button id="clear">Render Empty</button>
          </div>
        </section>
        <section class="panel cloud-container">
          <div class="cloud-host">
            <div id="cloud"></div>
            <div id="empty-state" class="empty-state">
              No responses displayed
            </div>
          </div>
          <div id="stats" class="stats"></div>
        </section>
      </div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
