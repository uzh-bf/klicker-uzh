query QAdaptivePracticeQuizDryRuns($practiceQuizId: String!) {
  adaptivePracticeQuizDryRuns(practiceQuizId: $practiceQuizId) {
    available
    unavailableReason
    publicationId
    levels {
      id
      label
      order
    }
    competences {
      nodeId
      name
    }
    subcompetences {
      nodeId
      rootId
      name
    }
    items {
      poolItemId
      elementName
      levelId
      rootId
      nodeNames
    }
    defaults
    maxStudents
    maxDecisions
    runs {
      ...AdaptiveDryRunData
    }
  }
}
