fragment AdaptivePracticeQuizPreviewData on AdaptivePracticeQuizPreview {
  practiceQuizId
  mode
  publishedPoolSize
  config {
    competenceTreeId
    scaleVersionId
    measurementVersion
    calibrationPolicyVersion
    preset
    attemptSelectionPolicy
    totalQuestionCap
    perLeafQuestionCap
    minQuestionsPerLeaf
    minItemsPerCoverageCell
    classificationToleranceBands
    classificationZ
    topInformationRatio
    defaultDiscrimination
    levelMappingRule
    showTimer
    retakeStartFromPreviousResult
    retakeStartMaxAgeDays
    retakePreferNewQuestions
  }
  competenceTree {
    id
    name
    displayName
    description
    maxDepth
    thetaMin
    thetaMax
    levels {
      id
      label
      order
      theta
      lowerBound
      upperBound
    }
  }
  nodes {
    id
    parentId
    kind
    name
    depth
    order
    enabled
    overrideEnabled
    effectiveEnabled
    weight
    questionCap
  }
  assignments {
    id
    elementId
    elementName
    elementVersion
    elementType
    leafNodeId
    additionalLeafNodeIds
    levelId
    enabled
    sourceEnabled
    overrideEnabled
    effectiveEnabled
    overrideDiscrimination
    available
    controlledAnswerReady
    choiceCount
    enablePercentInput
    a
    b
    c
  }
  readiness {
    ...AdaptivePracticeQuizReadinessData
  }
}
