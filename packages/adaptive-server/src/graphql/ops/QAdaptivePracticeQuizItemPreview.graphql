query QAdaptivePracticeQuizItemPreview(
  $practiceQuizId: String!
  $poolItemId: Int!
) {
  adaptivePracticeQuizItemPreview(
    practiceQuizId: $practiceQuizId
    poolItemId: $poolItemId
  ) {
    poolItemId
    elementId
    name
    type
    content
    options {
      __typename
      ... on AdaptivePracticeQuizChoicesOptions {
        displayMode
        choices {
          ix
          value
        }
      }
      ... on AdaptivePracticeQuizNumericalOptions {
        unit
        accuracy
        placeholder
        enablePercentInput
        restrictions {
          min
          max
        }
      }
      ... on AdaptivePracticeQuizFreeTextOptions {
        restrictions {
          maxLength
        }
      }
    }
  }
}
