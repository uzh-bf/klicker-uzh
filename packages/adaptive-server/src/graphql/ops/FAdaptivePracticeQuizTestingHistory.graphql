fragment FAdaptivePracticeQuizTestingHistory on AdaptivePracticeQuizTestingHistory {
  levelBands {
    label
    order
    startPosition
    endPosition
    color
    hasElements
  }
  entries {
    order
    elementTitle
    competenceName
    subcompetenceName
    itemLevelLabel
    itemLevelPosition
    result
    score
    overallTheta
    overallPosition
