fragment FAdaptivePracticeQuizAttemptState on AdaptivePracticeQuizAttemptState {
  attemptId
  practiceQuizId
  practiceQuizName
  status
  stopReason
  answeredQuestions
  questionNumber
  maximumQuestions
  startedAt
  completedAt
  elapsedSeconds
  showTimer
  nextAttemptAvailableAt
  canStartNewAttempt
  submittedResponseFeedback {
    correct
    score
    feedback
  }
  servedItem {
    poolItemId
    elementId
    name
    type
    content
    testingInfo {
      solution {
        choiceIndices
        answers
      }
      elementId
      elementVersion
      elementTitle
      elementTags
      competencePath
      subcompetenceName
      itemLevelLabel
      overallEstimate {
        ...FAdaptivePracticeQuizTestingEstimate
      }
      competenceEstimate {
        ...FAdaptivePracticeQuizTestingEstimate
      }
      subcompetenceEstimate {
        ...FAdaptivePracticeQuizTestingEstimate
      }
      history {
        levelBands {
          label
          order
          startPosition
          endPosition
        }
        entries {
          order
          elementTitle
          competenceName
          subcompetenceName
          itemLevelLabel
          itemLevelPosition
          result
          score
          overallTheta
          overallPosition
        }
        competenceEstimates {
          name
          responseCount
          theta
          levelLabel
          levelIsTentative
          position
          lowerPosition
          upperPosition
        }
      }
    }
    options {
      __typename
      ... on AdaptivePracticeQuizChoicesOptions {
        displayMode
        choices {
          ix
          value
        }
      }
      ... on AdaptivePracticeQuizNumericalOptions {
        unit
        accuracy
        placeholder
        enablePercentInput
        restrictions {
          min
          max
        }
      }
      ... on AdaptivePracticeQuizFreeTextOptions {
        restrictions {
          maxLength
        }
      }
    }
  }
}
