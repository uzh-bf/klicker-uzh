name: klicker-devrouter

services:
  postgres:
    image: docker.io/library/postgres:15
    environment:
      POSTGRES_USER: klicker-prod
      POSTGRES_PASSWORD: klicker
      POSTGRES_DB: klicker-prod
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U klicker-prod -d klicker-prod']
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - klicker
    volumes:
      - klicker_data:/var/lib/postgresql/data
      - ./util/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis_exec:
    image: docker.io/library/redis:7
    ports:
      - 6379:6379
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - klicker
    volumes:
      - redis_data:/data

  redis_assessment:
    image: docker.io/library/redis:7
    ports:
      - 6381:6379
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - klicker
    volumes:
      - redis_data_assessment:/data

  redis_cache:
    image: docker.io/library/redis:7
    ports:
      - 6380:6379
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - klicker

  hatchet:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-lite:v0.73.1
    ports:
      - '8888:8888'
      - '7077:7077'
    environment:
      DATABASE_URL: 'postgresql://hatchet:hatchet@postgres:5432/hatchet?sslmode=disable'
      SERVER_AUTH_COOKIE_DOMAIN: localhost
      SERVER_AUTH_COOKIE_INSECURE: 't'
      SERVER_GRPC_BIND_ADDRESS: '0.0.0.0'
      SERVER_GRPC_INSECURE: 't'
      SERVER_GRPC_BROADCAST_ADDRESS: localhost:7077
      SERVER_GRPC_PORT: '7077'
      SERVER_URL: http://localhost:8888
      SERVER_AUTH_SET_EMAIL_VERIFIED: 't'
      SERVER_DEFAULT_ENGINE_VERSION: 'V1'
    volumes:
      - hatchet_lite_config:/config
    networks:
      - klicker

networks:
  klicker:
    driver: bridge

volumes:
  klicker_data:
  redis_data:
  redis_data_assessment:
  hatchet_lite_config:
