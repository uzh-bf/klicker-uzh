sonar.projectKey=uzh-bf_klicker-uzh
sonar.organization=uzh-bf

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=klicker-uzh
sonar.projectVersion=2.0

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

sonar.sources=apps,packages,deploy

sonar.exclusions=apps/frontend-pwa/android/**,apps/frontend-pwa/ios/**,

# This deployment artifact is generated from the Office Add-in source template.
# Locale catalogs are parallel translations of the same key structure —
# copy-paste detection reads that as duplication by construction, and any
# string-heavy PR then fails the new-code duplication gate. Duplication
# analysis only; the files stay in scope for all other rules.
# The PRD proof is intentionally environment-sealed from the established STG
# operator so their endpoints, credentials, limits, and receipts remain
# independently reviewable. It remains in scope for every non-CPD rule.
sonar.cpd.exclusions=apps/docs/static/office-addin/content.html,packages/i18n/messages/**,apps/chat/scripts/prd-doc-query-proof.mjs

# S3776 is reported on the function declaration line, and Biome always moves a
# trailing NOSONAR comment off that line onto its own, so an inline suppression
# is not expressible here. The chat POST handler's complexity predates the
# Manage assistant work; this scoped ignore replaces the former NOSONAR marker.
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=apps/chat/src/app/api/chatbots/**/chat/route.ts

# These MD5 values are persisted, non-security response grouping keys. Changing
# their format without migrating stored JSON would split historical buckets.
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S4790
sonar.issue.ignore.multicriteria.e2.resourceKey=packages/graphql/src/services/questionResponsePersistence.ts
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S4790
sonar.issue.ignore.multicriteria.e3.resourceKey=packages/graphql/src/services/questionResponseResults.ts
