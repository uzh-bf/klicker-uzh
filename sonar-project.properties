sonar.projectKey=uzh-bf_klicker-uzh
sonar.organization=uzh-bf

# This is the name displayed in the SonarCloud UI. The version is supplied by
# the analysis workflow from the root package.json; the previous hard-coded
# "2.0" had not tracked the repository version (3.4.0-alpha.75) for a long time.
sonar.projectName=klicker-uzh

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

# Production sources. The root utilities and CI scripts are analyzed because
# they run with repository credentials or shape every build, and were previously
# outside the analysis scope entirely.
sonar.sources=apps,packages,deploy,util,.github/scripts

# Test classification. Test roots live inside the source trees above, so they
# are classified here instead of relying on the analyzer's name heuristics.
# sonar.test.inclusions filters files out of production metrics without adding an
# entry to sonar.tests, which the scanner rejects when it overlaps sonar.sources.
# Test files stay analyzed as tests: they keep their coverage mapping and stop
# distorting production duplication.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test.cjs,**/*.test.mjs,**/*.spec.ts,**/*.spec.tsx,apps/chat/test/**,apps/olat-api/test/**,apps/office-addin/tests/**,packages/*/test/**

# The analytics service requires Python 3.12 (apps/analytics/pyproject.toml).
# Without this the Python analyzer assumes its own default runtime and reports
# code the supported interpreter accepts as unknown.
sonar.python.version=3.12

sonar.exclusions=apps/frontend-pwa/android/**,apps/frontend-pwa/ios/**,

# This deployment artifact is generated from the Office Add-in source template.
# Locale catalogs are parallel translations of the same key structure —
# copy-paste detection reads that as duplication by construction, and any
# string-heavy PR then fails the new-code duplication gate. Duplication
# analysis only; the files stay in scope for all other rules.
sonar.cpd.exclusions=apps/docs/static/office-addin/content.html,packages/i18n/messages/**
