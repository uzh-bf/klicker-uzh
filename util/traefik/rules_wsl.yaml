http:
  routers:
    api:
      rule: 'Host(`api.klicker.com`)'
      entrypoints:
        - 'web'
        - 'websecure'
      service: 'api'

    assessment-api:
      rule: 'Host(`assessment-api.klicker.com`)'
      entrypoints:
        - 'web'
        - 'websecure'
      service: 'api'

    pwa:
      rule: 'Host(`pwa.klicker.com`)'
      entrypoints:
        - 'web'
        - 'websecure'
      service: 'pwa'
      middlewares:
        - 'csp-frame-ancestors-pwa'

    assessment:
      rule: 'Host(`assessment.klicker.com`)'
      entrypoints:
        - 'web'
        - 'websecure'
      service: 'pwa'
      middlewares:
        - 'csp-frame-ancestors-pwa'

    manage:
      rule: 'Host(`manage.klicker.com`)'
      entrypoints:
        - 'web'
        - 'websecure'
      service: 'manage'

    control:
      rule: 'Host(`control.klicker.com`)'
      entrypoints:
        - 'web'
        - 'websecure'
      service: 'control'
      middlewares:
        - 'csp-frame-ancestors'

    chat:
      rule: 'Host(`chat.klicker.com`)'
      entrypoints:
        - 'web'
        - 'websecure'
      service: 'chat'
      middlewares:
        - 'csp-frame-ancestors'

    auth:
      rule: 'Host(`auth.klicker.com`)'
      entrypoints:
        - 'web'
        - 'websecure'
      service: 'auth'

    response-api:
      rule: 'Host(`response-api.klicker.com`)'
      entrypoints:
        - 'web'
        - 'websecure'
      service: 'response-api'

    response-api-assessment:
      rule: 'Host(`response-api-assessment.klicker.com`)'
      entrypoints:
        - 'web'
        - 'websecure'
      service: 'response-api'

  middlewares:
    csp-frame-ancestors:
      headers:
        customResponseHeaders:
          Content-Security-Policy: "frame-ancestors 'self' https://*.klicker.com *.uzh.ch"
    csp-frame-ancestors-pwa:
      headers:
        customResponseHeaders:
          Content-Security-Policy: "frame-ancestors 'self' *.uzh.ch *.localhost"

  services:
    api:
      loadBalancer:
        servers:
          - url: 'http://172.25.8.0:3000'

    pwa:
      loadBalancer:
        servers:
          - url: 'http://172.25.8.0:3001'

    manage:
      loadBalancer:
        servers:
          - url: 'http://172.25.8.0:3002'

    control:
      loadBalancer:
        servers:
          - url: 'http://172.25.8.0:3003'

    chat:
      loadBalancer:
        servers:
          - url: 'http://172.25.8.0:3004'

    auth:
      loadBalancer:
        servers:
          - url: 'http://172.25.8.0:3010'

    response-api:
      loadBalancer:
        servers:
          - url: 'http://172.25.8.0:7078'

tls:
  certificates:
    - certFile: /etc/certs/klicker.com+1.pem
      keyFile: /etc/certs/klicker.com+1-key.pem
