# Overlay to enable devrouter routing (https://*.klicker.localhost) and local trust of mkcert root CA.

services:
  postgres:
    networks:
      devnet:
        aliases:
          - '${WORKSPACE:-klicker-uzh}-db'

  azurite:
    # Keep the browser-facing Blob route on DevRouter while exposing the same
    # container to host-side graph workers through loopback only.
    ports:
      - '127.0.0.1:${KB_GRAPH_BLOB_HOST_PORT:-10003}:10000'
    networks:
      devnet:
        aliases:
          - '${WORKSPACE:-klicker-uzh}-azurite'

  app:
    environment:
      DEVROUTER_WORKSPACE: '${DEVROUTER_WORKSPACE:-}'
      BLOB_STORAGE_ACCOUNT_URL: 'https://blob.klicker.${WORKSPACE:-klicker-uzh}.localhost/klickerdev'
      BLOB_STORAGE_INTERNAL_ACCOUNT_URL: 'http://${WORKSPACE:-klicker-uzh}-azurite:10000/klickerdev'
      KB_GRAPH_BLOB_HOST_PORT: '${KB_GRAPH_BLOB_HOST_PORT:-10003}'
      KB_GRAPH_BLOB_ACCOUNT_URL: 'http://127.0.0.1:${KB_GRAPH_BLOB_HOST_PORT:-10003}/klickerdev/'
      KB_INGESTION_LOCAL_PORT: '${KB_INGESTION_LOCAL_PORT:-18081}'
      KB_INGESTION_API_URL: 'http://host.docker.internal:${KB_INGESTION_LOCAL_PORT:-18081}'
    extra_hosts:
      - 'api.klicker.${WORKSPACE:-klicker-uzh}.localhost:host-gateway'
      - 'auth.klicker.${WORKSPACE:-klicker-uzh}.localhost:host-gateway'
      - 'pwa.klicker.${WORKSPACE:-klicker-uzh}.localhost:host-gateway'
      - 'manage.klicker.${WORKSPACE:-klicker-uzh}.localhost:host-gateway'
      - 'control.klicker.${WORKSPACE:-klicker-uzh}.localhost:host-gateway'
      - 'olat-api.klicker.${WORKSPACE:-klicker-uzh}.localhost:host-gateway'
      - 'response-api.klicker.${WORKSPACE:-klicker-uzh}.localhost:host-gateway'
      - 'lti.klicker.${WORKSPACE:-klicker-uzh}.localhost:host-gateway'
      - 'chat.klicker.${WORKSPACE:-klicker-uzh}.localhost:host-gateway'
      - 'blob.klicker.${WORKSPACE:-klicker-uzh}.localhost:host-gateway'
    networks:
      devnet:
        aliases:
          - '${WORKSPACE:-klicker-uzh}-app'
    volumes:
      # Linked worktree .git files point into this absolute host path. workspace
      # ensure supplies it and validates the same-path mount inside the container.
      - type: bind
        source: '${DEVROUTER_GIT_COMMON_DIR:?DEVROUTER_GIT_COMMON_DIR must be set by devrouter ensure}'
        target: '${DEVROUTER_GIT_COMMON_DIR:?DEVROUTER_GIT_COMMON_DIR must be set by devrouter ensure}'
