name: Playwright execution envelope

on:
  workflow_call:
    inputs:
      route_hint:
        description: Must remain auto so the trusted workflow recomputes routing
        required: false
        type: string
        default: auto
      allow_push_reuse:
        description: >-
          Caller accepts a reused merged pull-request validation for an
          integration-branch push. Older callers reject any push reuse.
        required: false
        type: boolean
        default: false
    outputs:
      duplicate_run_id:
        description: Successful equivalent PR validation run, when reused
        value: ${{ jobs.prepare.outputs.duplicate_run_id }}
      should_run:
        description: Whether the canonical Playwright plan contains tests
        value: ${{ (jobs.prepare.outputs.provider != 'warpbuild' || jobs.prepare.outputs.admission_attempt == format('{0}', github.run_attempt)) && jobs.prepare.outputs.should_run || 'false' }}
      route:
        description: Selected backend route
        value: ${{ jobs.prepare.outputs.route }}
      provider:
        description: Execution provider selected by trusted preparation
        value: ${{ jobs.prepare.outputs.provider }}
      admission_attempt:
        description: Exact run attempt admitted for paid execution
        value: ${{ jobs.prepare.outputs.admission_attempt }}
      mode:
        description: Canonical selector mode
        value: ${{ jobs.prepare.outputs.mode }}
      envelope_class:
        description: >-
          Change class the trusted minimum-validation classifier proved for the
          planned diff; only its bounded classes may narrow the ready state
        value: ${{ jobs.prepare.outputs.envelope_class }}
      shard_matrix:
        description: Canonical shard matrix
        value: ${{ jobs.prepare.outputs.shard_matrix }}

env:
  PLAYWRIGHT_CACHE_ENABLED: ${{ github.event_name != 'pull_request' || vars.PUBLIC_PR_PLAYWRIGHT_CACHE_ENABLED == 'true' || vars.PUBLIC_PR_PLAYWRIGHT_CACHE_CANARY_PR == format('{0}', github.event.pull_request.number) }}

jobs:
  prepare:
    # Inherit the caller token so older contents-only callers remain compatible.
    # Missing API scopes make the optional reuse lookup fall back to validation.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      duplicate_run_id: ${{ steps.equivalent.outputs.duplicate_run_id }}
      should_run: ${{ steps.metadata.outputs.should_run }}
      route: ${{ steps.metadata.outputs.route }}
      provider: ${{ steps.metadata.outputs.provider }}
      admission_attempt: ${{ steps.metadata.outputs.admission_attempt }}
      build_runner: ${{ steps.metadata.outputs.build_runner }}
      shard_runner: ${{ steps.metadata.outputs.shard_runner }}
      job_timeout: ${{ steps.metadata.outputs.job_timeout }}
      mode: ${{ steps.metadata.outputs.mode }}
      envelope_class: ${{ steps.metadata.outputs.envelope_class }}
      selector_pr_state: ${{ steps.metadata.outputs.selector_pr_state }}
      shard_matrix: ${{ steps.metadata.outputs.shard_matrix }}
      reason_codes: ${{ steps.metadata.outputs.reason_codes }}
    steps:
      - name: Check out trusted CI control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-control
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /playwright/
            /.devrouter.yml
          persist-credentials: false

      - name: Check out candidate as data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: .candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Decide backend and selector state
        id: route
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUBLIC_ROLLOUT_ENABLED: ${{ vars.PUBLIC_PR_ARM64_PLAYWRIGHT_ENABLED }}
          PUBLIC_ROLLOUT_CANARY_PR: ${{ vars.PUBLIC_PR_ARM64_PLAYWRIGHT_CANARY_PR }}
          SMART_DRAFT_ENABLED: ${{ vars.PUBLIC_PR_PLAYWRIGHT_SMART_DRAFT_ENABLED }}
          SMART_DRAFT_CANARY_PR: ${{ vars.PUBLIC_PR_PLAYWRIGHT_SMART_DRAFT_CANARY_PR }}
          FORCE_HOSTED_CANARY_PR: ${{ vars.PUBLIC_PR_ARM64_PLAYWRIGHT_FORCE_HOSTED_CANARY_PR }}
          ROUTE_HINT: ${{ inputs.route_hint }}
          WARPBUILD_ADMISSIONS: ${{ vars.PUBLIC_PR_PLAYWRIGHT_WARPBUILD_ADMISSIONS }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CONTROL_SHA: ${{ job.workflow_sha }}
        run: node .ci-control/.github/scripts/playwright-route.cjs --output route.json

      - name: Fetch the exact base object
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'pull_request' ]; then
            git -C .candidate remote add base "https://github.com/$BASE_REPOSITORY.git"
            # Preserve ancestry from the full candidate checkout for merge-base.
            git -C .candidate fetch --no-tags base "$BASE_SHA"
          fi
          test "$(git -C .candidate rev-parse HEAD)" = "$HEAD_SHA"

      - name: Build canonical execution plan
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          PR_STATE=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("route.json", "utf8")).selectorPrState)')
          node .ci-control/.github/scripts/playwright-selector.cjs \
            --control-root .ci-control \
            --candidate-root .candidate \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --pr-state "$PR_STATE" \
            --output playwright-execution-plan.json

      - name: Build opposite-state selector shadow plan
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # The shadow records the plan this draft did not run, so the
          # qualification comparison keeps measuring both directions: the full
          # wave while smart drafts are off, and the deferred full coverage
          # while an enabled control narrows the executed plan.
          RAN_STATE=$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync("route.json", "utf8")).selectorPrState)')
          if [ "$RAN_STATE" = 'draft' ]; then SHADOW_STATE=ready; else SHADOW_STATE=draft; fi
          node .ci-control/.github/scripts/playwright-selector.cjs \
            --control-root .ci-control \
            --candidate-root .candidate \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --pr-state "$SHADOW_STATE" \
            --output playwright-selector-shadow.json

      - name: Validate plan and expose workflow outputs
        id: metadata
        shell: bash
        run: |
          node .ci-control/.github/scripts/playwright-plan-metadata.cjs \
            --plan playwright-execution-plan.json \
            --route route.json \
            --output "$GITHUB_OUTPUT"

      - name: Reuse proven equivalent PR validation
        id: equivalent
        # New receipts and independent provenance are mandatory. The rollout
        # is opt-in; misses retain actual execution, including architecture changes.
        if: >-
          steps.metadata.outputs.provider != 'warpbuild' &&
          ((github.event_name == 'push' && inputs.allow_push_reuse) ||
          (github.event_name == 'pull_request' && contains(fromJSON('["ready_for_review","edited","reopened"]'), github.event.action)))
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CONTROL_SHA: ${{ job.workflow_sha }}
          ALLOW_PUSH_REUSE: ${{ inputs.allow_push_reuse }}
          CI_VERIFIED_REUSE_ENABLED: ${{ vars.CI_VERIFIED_REUSE_ENABLED }}
          PUBLIC_WORKERS: ${{ vars.PUBLIC_PR_PLAYWRIGHT_WORKERS || '1' }}
        with:
          script: |
            const fs = require('node:fs')
            await require('./.ci-control/.github/scripts/ci-verified-reuse.cjs').reportVerifiedRun({
              github, context, core, kind: 'playwright',
              controlSha: process.env.CONTROL_SHA,
              allowPushReuse: process.env.ALLOW_PUSH_REUSE === 'true',
              enabled: process.env.CI_VERIFIED_REUSE_ENABLED === 'true',
              workers: JSON.parse(fs.readFileSync('route.json', 'utf8')).route === 'hosted' ? '1' : process.env.PUBLIC_WORKERS,
              plan: JSON.parse(fs.readFileSync('playwright-execution-plan.json', 'utf8')),
              route: JSON.parse(fs.readFileSync('route.json', 'utf8')).route,
            })

      - name: Summarize canonical plan
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const route = JSON.parse(fs.readFileSync('route.json', 'utf8'))
          const plan = JSON.parse(fs.readFileSync('playwright-execution-plan.json', 'utf8'))
          const summary = [
            '### Playwright execution envelope',
            '',
            `- Route: \`${route.route}\``,
            `- Provider: \`${route.provider || (route.route === 'hosted' ? 'github' : 'public-pool')}\``,
            `- Selector state: \`${route.selectorPrState}\``,
            `- Mode: \`${plan.mode}\``,
            `- Change class: \`${plan.envelopeClass}\``,
            `- Reasons: \`${plan.reasonCodes.join(',')}\``,
            `- Candidate specs: \`${plan.candidateSpecs.length}\``,
            `- Selected specs: \`${plan.selectedSpecs.length}\``,
            `- Shards: \`${plan.shardCount}\``,
            '',
            'Hosted and public execution jobs consume this same plan artifact.',
          ]
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary.join('\n')}\n`)
          NODE

      - name: Upload canonical execution plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-execution-plan
          path: playwright-execution-plan.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload route metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-route-metadata
          path: route.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload selector shadow plan
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-selector-shadow
          path: playwright-selector-shadow.json
          if-no-files-found: error
          retention-days: 7

  build-and-compile-hosted:
    permissions:
      contents: read
    needs: prepare
    if: needs.prepare.outputs.duplicate_run_id == '' && needs.prepare.outputs.should_run == 'true' && needs.prepare.outputs.route == 'hosted'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
    steps:
      - name: Check out repository code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Record tested source tree
        continue-on-error: true
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SOURCE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CONTROL_SHA: ${{ job.workflow_sha }}
          EXECUTION_ROUTE: hosted
          EXECUTION_WORKERS: '1'
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const { execFileSync } = require('node:child_process')
          fs.writeFileSync('ci-validation-receipt.json', JSON.stringify({
            schemaVersion: 2,
            repository: process.env.GITHUB_REPOSITORY,
            route: process.env.EXECUTION_ROUTE,
            runnerOs: process.env.RUNNER_OS,
            runnerArch: process.env.RUNNER_ARCH,
            workers: process.env.EXECUTION_WORKERS,
            testedSha: execFileSync('git', ['-c', `safe.directory=${process.env.GITHUB_WORKSPACE}`, 'rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            event: process.env.GITHUB_EVENT_NAME,
            runId: Number(process.env.GITHUB_RUN_ID),
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            headSha: process.env.SOURCE_HEAD_SHA,
            baseSha: process.env.SOURCE_BASE_SHA,
            controlSha: process.env.CONTROL_SHA,
            treeSha: execFileSync('git', ['-c', `safe.directory=${process.env.GITHUB_WORKSPACE}`, 'rev-parse', 'HEAD^{tree}'], { encoding: 'utf8' }).trim(),
          }))
          NODE

      - name: Upload tested source receipt
        continue-on-error: true
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-validation-receipt
          path: ci-validation-receipt.json
          retention-days: 7

      - name: Reserve trusted action path
        shell: bash
        run: rm -rf -- "$GITHUB_WORKSPACE/.ci-action"

      - name: Check out immutable execution actions
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-action
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /playwright/
            /.devrouter.yml
          persist-credentials: false

      - name: Build shared Playwright artifact
        uses: ./.ci-action/.github/actions/playwright-build
        with:
          route: hosted
          mode: ${{ needs.prepare.outputs.mode }}
          cache-enabled: ${{ env.PLAYWRIGHT_CACHE_ENABLED }}

  build-and-compile-public-pr:
    permissions:
      contents: read
    needs: prepare
    if: needs.prepare.outputs.duplicate_run_id == '' && needs.prepare.outputs.should_run == 'true' && needs.prepare.outputs.route == 'public-pr' && (needs.prepare.outputs.provider != 'warpbuild' || needs.prepare.outputs.admission_attempt == format('{0}', github.run_attempt))
    runs-on:
      group: ${{ fromJSON(needs.prepare.outputs.build_runner).group }}
      labels: ${{ fromJSON(needs.prepare.outputs.build_runner).labels }}
    timeout-minutes: ${{ fromJSON(needs.prepare.outputs.job_timeout) }}
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
    steps:
      - name: Check out repository code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Record tested source tree
        continue-on-error: true
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SOURCE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CONTROL_SHA: ${{ job.workflow_sha }}
          EXECUTION_ROUTE: public-pr
          EXECUTION_WORKERS: ${{ needs.prepare.outputs.provider == 'warpbuild' && '1' || vars.PUBLIC_PR_PLAYWRIGHT_WORKERS || '1' }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const { execFileSync } = require('node:child_process')
          fs.writeFileSync('ci-validation-receipt.json', JSON.stringify({
            schemaVersion: 2,
            repository: process.env.GITHUB_REPOSITORY,
            route: process.env.EXECUTION_ROUTE,
            runnerOs: process.env.RUNNER_OS,
            runnerArch: process.env.RUNNER_ARCH,
            workers: process.env.EXECUTION_WORKERS,
            testedSha: execFileSync('git', ['-c', `safe.directory=${process.env.GITHUB_WORKSPACE}`, 'rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            event: process.env.GITHUB_EVENT_NAME,
            runId: Number(process.env.GITHUB_RUN_ID),
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            headSha: process.env.SOURCE_HEAD_SHA,
            baseSha: process.env.SOURCE_BASE_SHA,
            controlSha: process.env.CONTROL_SHA,
            treeSha: execFileSync('git', ['-c', `safe.directory=${process.env.GITHUB_WORKSPACE}`, 'rev-parse', 'HEAD^{tree}'], { encoding: 'utf8' }).trim(),
          }))
          NODE

      - name: Upload tested source receipt
        continue-on-error: true
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-validation-receipt
          path: ci-validation-receipt.json
          retention-days: 7

      - name: Reserve trusted action path
        shell: bash
        run: rm -rf -- "$GITHUB_WORKSPACE/.ci-action"

      - name: Check out immutable execution actions
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-action
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /playwright/
            /.devrouter.yml
          persist-credentials: false

      - name: Build shared Playwright artifact
        uses: ./.ci-action/.github/actions/playwright-build
        with:
          route: public-pr
          mode: ${{ needs.prepare.outputs.mode }}
          cache-enabled: ${{ env.PLAYWRIGHT_CACHE_ENABLED }}

  test-playwright-hosted:
    permissions:
      contents: read
    needs: [prepare, build-and-compile-hosted]
    if: needs.prepare.outputs.duplicate_run_id == '' && needs.prepare.outputs.should_run == 'true' && needs.prepare.outputs.route == 'hosted'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
      volumes:
        - hatchet_lite_config_${{ github.run_id }}_${{ github.run_attempt }}_${{ matrix.shardIndex }}:/config
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.shard_matrix) }}
    services:
      postgres:
        image: postgres:15@sha256:c99dd5066e988cd61a72ffe962da08e277eecaba000bbdda0bdaf9f63b56c174
        env:
          POSTGRES_USER: klicker-prod
          POSTGRES_PASSWORD: klicker #ggignore: fixed local test-service credential
          POSTGRES_DB: klicker-prod
        options: >-
          --health-cmd "pg_isready -U klicker-prod -d klicker-prod"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      postgres_hatchet:
        image: postgres:15@sha256:c99dd5066e988cd61a72ffe962da08e277eecaba000bbdda0bdaf9f63b56c174
        env:
          POSTGRES_USER: hatchet
          POSTGRES_PASSWORD: hatchet
          POSTGRES_DB: hatchet
        options: >-
          --health-cmd "pg_isready -U hatchet -d hatchet"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s
      redis_cache:
        image: redis:7@sha256:44960b3100c48159a66d28c18b0588c193492e25f7551d60e51dd464fc3eca5b
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis_exec:
        image: redis:7@sha256:44960b3100c48159a66d28c18b0588c193492e25f7551d60e51dd464fc3eca5b
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis_assessment_exec:
        image: redis:7@sha256:44960b3100c48159a66d28c18b0588c193492e25f7551d60e51dd464fc3eca5b
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      # SMTP sink for the one-time login link test; the image ships no shell
      # or HTTP client, so it carries no health check and the test polls.
      mailhog:
        image: mailhog/mailhog:v1.0.1@sha256:8d76a3d4ffa32a3661311944007a415332c4bb855657f4f6c57996405c009bea
      hatchet:
        image: ghcr.io/hatchet-dev/hatchet/hatchet-lite-dev:v0.101.0@sha256:7dfc696a6f2e45f510002ac395f110f404e2207fb867b4e8d4412ae31ceb1ee5
        env:
          DATABASE_URL: 'postgresql://hatchet:hatchet@postgres_hatchet:5432/hatchet?sslmode=disable'
          SERVER_AUTH_COOKIE_DOMAIN: hatchet
          SERVER_AUTH_COOKIE_INSECURE: 't'
          SERVER_GRPC_BIND_ADDRESS: '0.0.0.0'
          SERVER_GRPC_INSECURE: 't'
          SERVER_GRPC_BROADCAST_ADDRESS: hatchet:7077
          SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS: hatchet:7077
          SERVER_GRPC_PORT: '7077'
          SERVER_URL: http://hatchet:8888
          SERVER_AUTH_SET_EMAIL_VERIFIED: 't'
          SERVER_DEFAULT_ENGINE_VERSION: 'V1'
          SERVER_LOGGER_LEVEL: debug
          SERVER_LOGGER_FORMAT: console
        options: >-
          --health-cmd "curl -f http://localhost:8888/healthz"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s
        volumes:
          - hatchet_lite_config_${{ github.run_id }}_${{ github.run_attempt }}_${{ matrix.shardIndex }}:/config
    steps:
      - name: Check out repository code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Reserve trusted action path
        shell: bash
        run: rm -rf -- "$GITHUB_WORKSPACE/.ci-action"

      - name: Check out immutable execution actions
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-action
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /playwright/
            /.devrouter.yml
          persist-credentials: false

      - name: Run shared Playwright shard
        uses: ./.ci-action/.github/actions/playwright-shard
        with:
          route: hosted
          mode: ${{ needs.prepare.outputs.mode }}
          shard-index: ${{ matrix.shardIndex }}
          shard-total: ${{ matrix.shardTotal }}
          cache-enabled: ${{ env.PLAYWRIGHT_CACHE_ENABLED }}

  test-playwright-public-pr:
    permissions:
      contents: read
    needs: [prepare, build-and-compile-public-pr]
    if: needs.prepare.outputs.duplicate_run_id == '' && needs.prepare.outputs.should_run == 'true' && needs.prepare.outputs.route == 'public-pr' && (needs.prepare.outputs.provider != 'warpbuild' || needs.prepare.outputs.admission_attempt == format('{0}', github.run_attempt))
    runs-on:
      group: ${{ fromJSON(needs.prepare.outputs.shard_runner).group }}
      labels: ${{ fromJSON(needs.prepare.outputs.shard_runner).labels }}
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
      volumes:
        - hatchet_lite_config_${{ github.run_id }}_${{ github.run_attempt }}_${{ matrix.shardIndex }}:/config
    timeout-minutes: ${{ fromJSON(needs.prepare.outputs.job_timeout) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.shard_matrix) }}
    services:
      postgres:
        image: postgres:15@sha256:c99dd5066e988cd61a72ffe962da08e277eecaba000bbdda0bdaf9f63b56c174
        env:
          POSTGRES_USER: klicker-prod
          POSTGRES_PASSWORD: klicker #ggignore: fixed local test-service credential
          POSTGRES_DB: klicker-prod
        options: >-
          --health-cmd "pg_isready -U klicker-prod -d klicker-prod"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      postgres_hatchet:
        image: postgres:15@sha256:c99dd5066e988cd61a72ffe962da08e277eecaba000bbdda0bdaf9f63b56c174
        env:
          POSTGRES_USER: hatchet
          POSTGRES_PASSWORD: hatchet
          POSTGRES_DB: hatchet
        options: >-
          --health-cmd "pg_isready -U hatchet -d hatchet"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s
      redis_cache:
        image: redis:7@sha256:44960b3100c48159a66d28c18b0588c193492e25f7551d60e51dd464fc3eca5b
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis_exec:
        image: redis:7@sha256:44960b3100c48159a66d28c18b0588c193492e25f7551d60e51dd464fc3eca5b
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis_assessment_exec:
        image: redis:7@sha256:44960b3100c48159a66d28c18b0588c193492e25f7551d60e51dd464fc3eca5b
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      hatchet:
        image: ghcr.io/hatchet-dev/hatchet/hatchet-lite-dev:v0.101.0@sha256:7dfc696a6f2e45f510002ac395f110f404e2207fb867b4e8d4412ae31ceb1ee5
        env:
          DATABASE_URL: 'postgresql://hatchet:hatchet@postgres_hatchet:5432/hatchet?sslmode=disable'
          SERVER_AUTH_COOKIE_DOMAIN: hatchet
          SERVER_AUTH_COOKIE_INSECURE: 't'
          SERVER_GRPC_BIND_ADDRESS: '0.0.0.0'
          SERVER_GRPC_INSECURE: 't'
          SERVER_GRPC_BROADCAST_ADDRESS: hatchet:7077
          SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS: hatchet:7077
          SERVER_GRPC_PORT: '7077'
          SERVER_URL: http://hatchet:8888
          SERVER_AUTH_SET_EMAIL_VERIFIED: 't'
          SERVER_DEFAULT_ENGINE_VERSION: 'V1'
          SERVER_LOGGER_LEVEL: debug
          SERVER_LOGGER_FORMAT: console
        options: >-
          --health-cmd "curl -f http://localhost:8888/healthz"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s
        volumes:
          - hatchet_lite_config_${{ github.run_id }}_${{ github.run_attempt }}_${{ matrix.shardIndex }}:/config
    steps:
      - name: Check out repository code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Reserve trusted action path
        shell: bash
        run: rm -rf -- "$GITHUB_WORKSPACE/.ci-action"

      - name: Check out immutable execution actions
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-action
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /playwright/
            /.devrouter.yml
          persist-credentials: false

      - name: Run shared Playwright shard
        uses: ./.ci-action/.github/actions/playwright-shard
        with:
          route: public-pr
          mode: ${{ needs.prepare.outputs.mode }}
          shard-index: ${{ matrix.shardIndex }}
          shard-total: ${{ matrix.shardTotal }}
          cache-enabled: ${{ env.PLAYWRIGHT_CACHE_ENABLED }}
          workers: ${{ needs.prepare.outputs.provider == 'warpbuild' && '1' || vars.PUBLIC_PR_PLAYWRIGHT_WORKERS || '1' }}
