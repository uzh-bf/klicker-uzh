name: Build Docker image for community (Discourse)

on:
  push:
    branches: [v3]
    paths:
      - 'deploy/community/**'
      - '.github/workflows/community-image.yml'
  pull_request:
    paths:
      - 'deploy/community/**'
      - '.github/workflows/community-image.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/community
  LAUNCHER_VERSION: v2.6.7
  # discourse_docker revision providing the pups templates
  DISCOURSE_DOCKER_REF: 00595119c368c0aef7d7019ec66ffc8fa51cce79

jobs:
  build-arm:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout discourse_docker templates
        uses: actions/checkout@v4
        with:
          repository: discourse/discourse_docker
          ref: ${{ env.DISCOURSE_DOCKER_REF }}
          path: discourse_docker

      - name: Install launcher
        run: |
          curl -fsSL -o launcher.tar.gz "https://github.com/discourse/launcher/releases/download/${LAUNCHER_VERSION}/launcher-linux-arm64.tar.gz"
          curl -fsSL -o launcher.tar.gz.md5 "https://github.com/discourse/launcher/releases/download/${LAUNCHER_VERSION}/launcher-linux-arm64.tar.gz.md5"
          echo "$(cut -d' ' -f1 launcher.tar.gz.md5)  launcher.tar.gz" | md5sum -c -
          tar -xzf launcher.tar.gz
          ./launcher --version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          VERSION=$(grep -E '^\s+version:' deploy/community/containers/app.yml | awk '{print $2}')
          TAG="${REGISTRY}/${IMAGE_NAME}:${VERSION}"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          # Plugin asset compilation boots Rails. SKIP_DB_AND_REDIS lets it run
          # without Postgres or Redis, and a throwaway secret key base stops it
          # reading one from Redis. Both apply to the build only; the cluster
          # supplies the real configuration at runtime.
          BUILD_SECRET=$(openssl rand -hex 64)
          ./launcher --conf-dir deploy/community/containers --templates-dir discourse_docker \
            build --tag "${TAG}" \
            --set "env.SKIP_DB_AND_REDIS=1" \
            --set "env.DISCOURSE_SECRET_KEY_BASE=${BUILD_SECRET}" \
            app --platform linux/arm64 --load

      - name: Check that build-only settings are not in the image
        run: |
          docker image inspect "${TAG}" --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | cut -d= -f1 | sort | tee /tmp/env-names
          if grep -qxE 'SKIP_DB_AND_REDIS|DISCOURSE_SECRET_KEY_BASE' /tmp/env-names; then
            echo "Build-only settings leaked into the image environment" >&2
            exit 1
          fi
          docker image inspect "${TAG}" --format '{{.Architecture}} {{json .Config.Cmd}}'

      - name: Push image
        if: github.event_name != 'pull_request'
        run: docker push "${TAG}"
