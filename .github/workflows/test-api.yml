name: Test tRPC API package logic functionalities

on:
  push:
    branches: ['v3', 'v3*']
    paths:
      - 'packages/api/**'
      - 'packages/graphql/**'
      - 'packages/grading/**'
      - 'packages/prisma/**'
      - 'packages/types/**'
      - 'packages/util/**'
      - '.github/workflows/test-api.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'packages/api/**'
      - 'packages/graphql/**'
      - 'packages/grading/**'
      - 'packages/prisma/**'
      - 'packages/types/**'
      - 'packages/util/**'
      - '.github/workflows/test-api.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: packages/api tRPC Vitest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: true

      - name: Build dependency packages
        shell: bash
        run: |
          cd packages/prisma
          pnpm run build
          cd ../types
          pnpm run build
          cd ../grading
          pnpm run build
          cd ../util
          pnpm run build
          cd ../api
          pnpm run build

      - name: Run tRPC API tests
        shell: bash
        run: |
          cd packages/api
          pnpm vitest run
