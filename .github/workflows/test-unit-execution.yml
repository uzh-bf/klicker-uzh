# Generated by .github/scripts/priority-ci-workflows.cjs; edit the canonical workflow.
name: Test lightweight unit suites priority execution
on:
  workflow_call:
    outputs:
      required_result:
        description: Actual required terminal job result
        value: ${{ jobs.test-unit-status.outputs.required_result }}
      run_label_event:
        description: Whether label-only work was admitted
        value: ${{ jobs.priority-route.outputs.run_label_event }}
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  TURBO_REMOTE_ONLY: true
permissions:
  contents: read
  checks: read
jobs:
  priority-route:
    if: vars.PRIORITY_CI_ENABLED == 'true' && github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && github.event.pull_request.draft == false && github.event.repository.private == false && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot' && contains(github.event.pull_request.labels.*.name, 'ci:priority')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      admitted: ${{ steps.route.outputs.admitted }}
      run_label_event: ${{ steps.route.outputs.run_label_event }}
      run_attempt: ${{ steps.route.outputs.run_attempt }}
      job_timeout: ${{ steps.route.outputs.job_timeout }}
      runner_x64: ${{ steps.route.outputs.runner_x64 }}
      runner_build: ${{ steps.route.outputs.runner_build }}
      runner_arm: ${{ steps.route.outputs.runner_arm }}
    steps:
      - name: Check out the trusted priority router
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: uzh-bf/klicker-uzh
          ref: v3
          path: .ci-priority
          sparse-checkout: .github/actions/priority-ci-route
          persist-credentials: false
      - name: Route priority validation
        id: route
        uses: ./.ci-priority/.github/actions/priority-ci-route
  filter:
    needs: priority-route
    if: "!cancelled() && (github.event.action != 'labeled' || needs.priority-route.outputs.run_label_event == 'true')"
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ github.event_name == 'push' && 'true' || steps.check.outputs.should_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check for changes
        id: check
        uses: ./.github/actions/changed-paths
        with:
          pattern: ^(apps/auth/|apps/frontend-pwa/|apps/chat/|packages/feature-flags/|packages/grading/|packages/graphql/|packages/i18n/|packages/knowledge-graph/|packages/markdown/|packages/next-config/|packages/prisma/|packages/shared-components/|packages/types/|packages/util/|\.devcontainer/disposable-test-init\.sql$|\.github/scripts/provision-disposable-postgres\.sh$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|turbo\.json$|tsconfig\.json$|\.github/workflows/test-unit\.yml$|\.github/scripts/ci-equivalent-run\.cjs$|\.github/actions/setup-node-pnpm/|\.github/actions/changed-paths/|\.github/scripts/required-ci-status\.cjs$)
          prior-check-name: test-unit-status
  test-unit:
    needs:
      - filter
      - priority-route
    if: "!cancelled() && (github.event.action != 'labeled' || needs.priority-route.outputs.run_label_event == 'true') && (needs.priority-route.outputs.admitted != 'true' || needs.priority-route.outputs.run_attempt == format('{0}', github.run_attempt)) && needs.filter.outputs.should_run == 'true'"
    runs-on: ${{ needs.priority-route.outputs.runner_x64 || 'ubuntu-latest' }}
    timeout-minutes: ${{ needs.priority-route.outputs.admitted == 'true' && fromJSON(needs.priority-route.outputs.job_timeout || '60') || 360 }}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: klicker
          POSTGRES_PASSWORD: klicker
          POSTGRES_DB: klicker-prod
        options: --health-cmd "pg_isready -U klicker -d klicker-prod" --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Record tested source tree
        continue-on-error: true
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SOURCE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CONTROL_SHA: ${{ github.workflow_sha }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const { execFileSync } = require('node:child_process')
          fs.writeFileSync('ci-validation-receipt.json', JSON.stringify({
            schemaVersion: 1,
            event: process.env.GITHUB_EVENT_NAME,
            runId: Number(process.env.GITHUB_RUN_ID),
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            headSha: process.env.SOURCE_HEAD_SHA,
            baseSha: process.env.SOURCE_BASE_SHA,
            controlSha: process.env.CONTROL_SHA,
            treeSha: execFileSync('git', ['-c', `safe.directory=${process.env.GITHUB_WORKSPACE}`, 'rev-parse', 'HEAD^{tree}'], { encoding: 'utf8' }).trim(),
          }))
          NODE
      - name: Upload tested source receipt
        continue-on-error: true
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ci-validation-receipt
          path: ci-validation-receipt.json
          retention-days: 7
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - name: Set up Node.js with pnpm cache
        uses: ./.github/actions/setup-node-pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test Prisma disposable guard
        run: pnpm --filter @klicker-uzh/prisma test:disposable
      - name: Build unit-test dependencies
        id: build
        shell: bash
        run: pnpm exec turbo run build --filter=@klicker-uzh/prisma --filter=@klicker-uzh/types --filter=@klicker-uzh/grading --filter=@klicker-uzh/util --filter=@klicker-uzh/graphql --filter=@klicker-uzh/markdown --filter=@klicker-uzh/feature-flags --concurrency=4
      - name: Provision disposable PostgreSQL
        id: provision_db
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bash .github/scripts/provision-disposable-postgres.sh "${{ job.services.postgres.id }}"
      - name: Setup chat test database
        id: setup_chat_db
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.provision_db.outcome == 'success' }}
        run: pnpm --filter @klicker-uzh/prisma run prisma:reset:raw --force
        env:
          DATABASE_URL: postgresql://klicker_test:klicker@localhost:5432/klicker_test
          SHADOW_DATABASE_URL: postgresql://klicker_test:klicker@localhost:5432/klicker_test_shadow
      - name: Test chat app
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.setup_chat_db.outcome == 'success' }}
        run: pnpm --filter @klicker-uzh/chat test:run --coverage --coverage.provider=v8 --coverage.reporter=lcov --coverage.reportsDirectory=coverage
        env:
          CHAT_ACCOUNT_USAGE_INTEGRATION: "1"
          CHAT_ACCOUNT_USAGE_ENFORCEMENT_ENABLED: "false"
          DATABASE_URL: postgresql://klicker_test:klicker@localhost:5432/klicker_test
          SHADOW_DATABASE_URL: postgresql://klicker_test:klicker@localhost:5432/klicker_test_shadow
      - name: Test frontend PWA
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @klicker-uzh/frontend-pwa test:run
      - name: Test auth unit and handler integration suites
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @klicker-uzh/auth test:run --coverage --coverage.provider=v8 --coverage.reporter=lcov --coverage.reportsDirectory=coverage
      - name: Build auth for production HTTP integration tests
        id: build_auth
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm exec turbo run build --filter=@klicker-uzh/auth... --concurrency=4
        env:
          APP_SECRET: synthetic-auth-built-test-secret
          APP_ORIGIN_AUTH: https://auth.example.test
          NEXTAUTH_URL: https://auth.example.test
      - name: Test built auth under HTTP and HTTPS deployment policies
        if: ${{ !cancelled() && steps.build_auth.outcome == 'success' }}
        run: pnpm --filter @klicker-uzh/auth test:built
      - name: Test grading package
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @klicker-uzh/grading test --coverage --coverage.provider=v8 --coverage.reporter=lcov --coverage.reportsDirectory=coverage
      - name: Test markdown package
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @klicker-uzh/markdown test --coverage --coverage.provider=v8 --coverage.reporter=lcov --coverage.reportsDirectory=coverage
      - name: Test util package
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @klicker-uzh/util test --coverage --coverage.provider=v8 --coverage.reporter=lcov --coverage.reportsDirectory=coverage
      - name: Upload LCOV coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          overwrite: true
          path: |
            apps/*/coverage/lcov.info
            packages/*/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7
  test-unit-status:
    name: ${{ (github.event.action != 'labeled' || needs.priority-route.outputs.run_label_event == 'true') && 'test-unit-status' || 'test-unit-status (priority not admitted)' }}
    needs:
      - filter
      - test-unit
      - priority-route
    if: always() && (github.event.action != 'labeled' || needs.priority-route.outputs.run_label_event == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Report required status
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true }}
          FILTER_RESULT: ${{ needs.filter.result }}
          SHOULD_RUN: ${{ needs.filter.outputs.should_run }}
          TEST_RESULT: ${{ needs.test-unit.result }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_PATH: .github/workflows/test-unit.yml
          TERMINAL_JOB: test-unit-status
          EVIDENCE_PATH: required-ci-evidence.json
          SELECTION_JOB: filter
          SELECTION_JOB_RESULT: ${{ needs.filter.result }}
          SUITE_JOB: test-unit
          SUITE_JOB_RESULT: ${{ needs.test-unit.result }}
        run: node .github/scripts/required-ci-status.cjs report
      - name: Upload required CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: required-ci-evidence
          path: required-ci-evidence.json
          if-no-files-found: error
          retention-days: 7
      - id: priority_result
        if: always()
        env:
          TERMINAL_RESULT: ${{ job.status }}
        run: echo "result=$TERMINAL_RESULT" >> "$GITHUB_OUTPUT"
    outputs:
      required_result: ${{ steps.priority_result.outputs.result }}
  sonarcloud:
    name: SonarCloud
    needs:
      - filter
      - test-unit
      - test-unit-status
      - priority-route
    if: always() && !cancelled() && (github.event.action != 'labeled' || needs.priority-route.outputs.run_label_event == 'true') && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/sonar-analysis.yml
    secrets: inherit
