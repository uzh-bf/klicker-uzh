name: Klicker automated testing with playwright

on:
  push:
    branches: ['v3', 'v3*']
  pull_request:
    branches: ['v3', 'v3*']
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

jobs:
  # The called workflow is the only execution envelope. It recomputes the
  # route and selector state from the immutable event payload and exposes one
  # result to the required status job.
  test-playwright-execution:
    concurrency:
      group: ${{ github.workflow }}-playwright-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    uses: uzh-bf/klicker-uzh/.github/workflows/public-pr-playwright-shards.yml@refs/heads/v3
    with:
      route_hint: auto

  # Always reports a status even when the canonical plan skips all tests.
  # This job intentionally stays outside the reusable workflow's concurrency
  # group so a stale reporter cannot block the current invocation.
  test-playwright-status:
    needs: test-playwright-execution
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        shell: bash
        env:
          EXECUTION_RESULT: ${{ needs.test-playwright-execution.result }}
          ROUTE: ${{ needs.test-playwright-execution.outputs.route }}
          MODE: ${{ needs.test-playwright-execution.outputs.mode }}
          SHOULD_RUN: ${{ needs.test-playwright-execution.outputs.should_run }}
          SHARD_MATRIX: ${{ needs.test-playwright-execution.outputs.shard_matrix }}
        run: |
          set -euo pipefail
          {
            printf 'route=%s\n' "${ROUTE:-unknown}"
            printf 'mode=%s\n' "${MODE:-unknown}"
            printf 'should_run=%s\n' "${SHOULD_RUN:-unknown}"
            printf 'shard_matrix=%s\n' "${SHARD_MATRIX:-unknown}"
            printf 'execution_result=%s\n' "$EXECUTION_RESULT"
          } > playwright-run-metadata.txt

          {
            echo '### Playwright route status'
            echo
            echo "- Route: \`${ROUTE:-unknown}\`"
            echo "- Mode: \`${MODE:-unknown}\`"
            echo "- Tests selected: \`${SHOULD_RUN:-unknown}\`"
            echo "- Envelope result: \`$EXECUTION_RESULT\`"
          } >> "$GITHUB_STEP_SUMMARY"

          # A newer event cancels the old reusable invocation. The surviving
          # invocation is the required signal for the pull request.
          if [ "$EXECUTION_RESULT" = 'cancelled' ]; then
            echo 'Superseded by a newer Playwright invocation.'
            exit 0
          fi
          if [ "$EXECUTION_RESULT" != 'success' ]; then
            echo 'Playwright execution envelope failed.'
            exit 1
          fi
          if [ "$ROUTE" != 'hosted' ] && [ "$ROUTE" != 'public-pr' ]; then
            echo 'Playwright execution returned an invalid route.'
            exit 1
          fi
          if [ "$SHOULD_RUN" = 'false' ]; then
            echo 'No Playwright-relevant tests selected.'
            exit 0
          fi
          if [ "$SHOULD_RUN" != 'true' ]; then
            echo 'Playwright execution did not expose a valid selection result.'
            exit 1
          fi
          echo 'Playwright execution passed.'

      - name: Upload run metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-run-metadata
          path: playwright-run-metadata.txt
          retention-days: 1

  # Queue inspection is deliberately hosted and checkout-free. It has only
  # actions: read permission and never runs on the public self-hosted pool.
  playwright-queue-telemetry:
    needs: [test-playwright-execution, test-playwright-status]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
    steps:
      - name: Collect current-run queue telemetry
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('node:fs')

            const secondsBetween = (start, end) => {
              if (!start || !end) return null
              const seconds = (Date.parse(end) - Date.parse(start)) / 1000
              return Number.isFinite(seconds) && seconds >= 0 ? seconds : null
            }

            const percentile = (values, fraction) => {
              if (values.length === 0) return null
              const sorted = [...values].sort((a, b) => a - b)
              const index = Math.min(
                sorted.length - 1,
                Math.ceil(sorted.length * fraction) - 1
              )
              return sorted[index]
            }

            const jobClass = (name) => {
              const value = name.toLowerCase()
              if (value.includes('public-pr')) return 'public-pr'
              if (value.includes('hosted')) return 'hosted'
              if (value.includes('build')) return 'build'
              if (value.includes('status')) return 'status'
              if (value.includes('playwright')) return 'playwright'
              return 'other'
            }

            const runId = Number(process.env.GITHUB_RUN_ID)
            let report

            try {
              const jobs = await github.paginate(
                github.rest.actions.listJobsForWorkflowRun,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: runId,
                  per_page: 100,
                }
              )
              const records = jobs
                .filter(
                  (job) =>
                    !job.name.toLowerCase().includes('queue-telemetry')
                )
                .map((job) => ({
                  jobClass: jobClass(job.name),
                  status: job.status ?? 'unknown',
                  conclusion: job.conclusion ?? null,
                  runner: job.runner_name ?? null,
                  queueSeconds: secondsBetween(
                    job.created_at,
                    job.started_at
                  ),
                  durationSeconds: secondsBetween(
                    job.started_at,
                    job.completed_at
                  ),
                }))
              const queueSeconds = records
                .map((record) => record.queueSeconds)
                .filter((value) => value !== null)

              report = {
                schema: 1,
                phase: 'queue',
                route: 'envelope',
                runId,
                jobCount: records.length,
                queueObservedCount: queueSeconds.length,
                queueP50Seconds: percentile(queueSeconds, 0.5),
                queueP95Seconds: percentile(queueSeconds, 0.95),
                jobs: records,
              }
            } catch {
              core.warning('Current-run queue telemetry is unavailable')
              report = {
                schema: 1,
                phase: 'queue',
                route: 'envelope',
                runId,
                collection: 'unavailable',
                errorClass: 'actions-api',
              }
            }

            fs.writeFileSync(
              'playwright-queue-telemetry.json',
              `${JSON.stringify(report, null, 2)}\n`
            )
            await core.summary
              .addHeading('Playwright queue telemetry')
              .addRaw(
                report.collection === 'unavailable'
                  ? 'Collection unavailable; execution was not affected.'
                  : `Observed ${report.queueObservedCount} of ${report.jobCount} jobs; queue p50=${report.queueP50Seconds ?? 'n/a'}s, p95=${report.queueP95Seconds ?? 'n/a'}s.`
              )
              .write()

      - name: Upload queue telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-queue-telemetry
          path: playwright-queue-telemetry.json
          if-no-files-found: error
          retention-days: 1
