name: Klicker automated testing with playwright
on:
  push:
    branches: ['v3', 'v3*']
  pull_request:
    branches: ['v3', 'v3*']
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

env:
  REGISTRY: ghcr.io
  PLAYWRIGHT_CACHE_ENABLED: ${{ github.event_name != 'pull_request' || vars.PUBLIC_PR_PLAYWRIGHT_CACHE_ENABLED == 'true' || vars.PUBLIC_PR_PLAYWRIGHT_CACHE_CANARY_PR == format('{0}', github.event.pull_request.number) }}

jobs:
  # The hosted and public-PR predicates are intentional complements. Only the
  # exact lowercase value "true" or an exact canary PR number enables the
  # self-hosted path; every other value fails closed to GitHub-hosted runners.
  filter-hosted:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.repository.private != false ||
      github.event.pull_request.draft == true ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      endsWith(github.event.pull_request.user.login, '[bot]') ||
      (vars.PUBLIC_PR_ARM64_PLAYWRIGHT_ENABLED != 'true' &&
        vars.PUBLIC_PR_ARM64_PLAYWRIGHT_CANARY_PR != format('{0}', github.event.pull_request.number))
    concurrency:
      group: ${{ github.workflow }}-hosted-filter-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check for changes
        id: check
        uses: ./.github/actions/changed-paths
        with:
          pattern: '^(apps/|packages/|playwright/|\.devrouter\.yml|\.github/workflows/test-playwright\.yml|\.github/workflows/public-pr-playwright-shards\.yml|\.github/workflows/playwright-cache-seed\.yml|\.github/workflows/update-playwright-timings\.yml|\.github/actions/changed-paths/|\.github/scripts/get-shard-files\.(js|test\.cjs)|\.github/scripts/playwright-(cache-contract|selector|telemetry|turbo-telemetry)\.(cjs|test\.cjs)|\.github/scripts/update-playwright-timings\.py|\.github/scripts/wait-for-services\.sh|package\.json|pnpm-lock\.yaml|playwright/relevance-manifest\.json|util/_create_hatchet_token_test\.sh|util/_with_local_test_origins\.sh|util/_run_with_infisical\.sh|util/playwright-profile-runtime\.(mjs|test\.mjs))'

  build-and-compile-hosted:
    needs: filter-hosted
    if: needs.filter-hosted.outputs.should_run == 'true'
    concurrency:
      group: ${{ github.workflow }}-hosted-build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out trusted cache contract
        uses: actions/checkout@v4
        with:
          repository: uzh-bf/klicker-uzh
          ref: refs/heads/v3
          path: .ci-control
          persist-credentials: false

      - name: Define node version
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false

      - name: Compute cache contract
        id: cache-contract
        run: |
          control_root=.ci-control
          if [ ! -f "$control_root/.github/scripts/playwright-cache-contract.cjs" ]; then
            control_root="$GITHUB_WORKSPACE"
          fi
          node "$control_root/.github/scripts/playwright-cache-contract.cjs" --root "$GITHUB_WORKSPACE"

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        if: env.PLAYWRIGHT_CACHE_ENABLED == 'true'
        id: pnpm-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.STORE_PATH }}
          key: playwright-${{ runner.os }}-${{ runner.arch }}-pnpm-${{ steps.cache-contract.outputs.fingerprint }}-${{ github.sha }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ runner.arch }}-pnpm-${{ steps.cache-contract.outputs.fingerprint }}-

      - name: Cache turbo build artifacts
        if: env.PLAYWRIGHT_CACHE_ENABLED == 'true'
        id: turbo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .turbo
          key: playwright-${{ runner.os }}-${{ runner.arch }}-turbo-${{ steps.cache-contract.outputs.fingerprint }}-${{ github.sha }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ runner.arch }}-turbo-${{ steps.cache-contract.outputs.fingerprint }}-

      - name: Install dependencies
        run: pnpm install

      - name: Build all packages and apps
        id: build
        shell: bash
        run: |
          started=$(date +%s)
          set +e
          {
            pnpm run --filter @klicker-uzh/prisma build:test
            pnpm run build:test
          } 2>&1 | tee turbo-build.log
          status=${PIPESTATUS[0]}
          set -e
          echo "PLAYWRIGHT_DURATION_SECONDS=$(( $(date +%s) - started ))" >> "$GITHUB_ENV"
          exit "$status"
        env:
          APP_SECRET: abcd
          DATABASE_URL: postgres://klicker-prod:klicker@localhost:5432/klicker-prod
          NODE_ENV: test
          REDIS_HOST: localhost
          REDIS_PASS: ''
          REDIS_PORT: 6379
          REDIS_CACHE_HOST: localhost
          REDIS_CACHE_PORT: 6379
          REDIS_ASSESSMENT_PORT: 6379
          REDIS_ASSESSMENT_PASS: ''
          REDIS_ASSESSMENT_HOST: localhost
          APP_ORIGIN_API: http://127.0.0.1:3000
          APP_ORIGIN_AUTH: http://127.0.0.1:3010
          APP_ORIGIN_LTI: http://127.0.0.1:4000
          APP_ORIGIN_PWA: http://127.0.0.1:3001
          APP_ORIGIN_MANAGE: http://127.0.0.1:3002
          APP_ORIGIN_CONTROL: http://127.0.0.1:3003
          APP_ORIGIN_ASSESSMENT_API: http://127.0.0.1:3000
          APP_ORIGIN_ASSESSMENT_PWA: http://127.0.0.1:3001

      - name: Archive Next build outputs
        run: |
          tar -cf playwright-next-builds.tar \
            --exclude='apps/auth/.next/cache' \
            --exclude='apps/auth/.next/standalone' \
            --exclude='apps/chat/.next/cache' \
            --exclude='apps/chat/.next/standalone' \
            --exclude='apps/frontend-control/.next/cache' \
            --exclude='apps/frontend-control/.next/standalone' \
            --exclude='apps/frontend-manage/.next/cache' \
            --exclude='apps/frontend-manage/.next/standalone' \
            --exclude='apps/frontend-pwa/.next/cache' \
            --exclude='apps/frontend-pwa/.next/standalone' \
            apps/auth/.next \
            apps/chat/.next \
            apps/frontend-control/.next \
            apps/frontend-manage/.next \
            apps/frontend-pwa/.next

      - name: Upload Playwright build outputs
        uses: actions/upload-artifact@v4
        with:
          name: playwright-build-artifact
          path: |
            playwright-next-builds.tar
            apps/backend-docker/dist
            apps/hatchet-worker-general/dist
            apps/hatchet-worker-response-processor/dist
            apps/lti/dist
            apps/mcp-lecturer/dist
            apps/olat-api/dist
            apps/response-api/dist
            packages/export/dist
            packages/grading/dist
            packages/graphql/dist
            packages/hatchet/dist
            packages/markdown/dist
            packages/prisma/dist
            packages/types/dist
            packages/util/dist
          retention-days: 1

      - name: Extract Turbo build telemetry
        if: always()
        run: |
          control_root=.ci-control
          if [ ! -f "$control_root/.github/scripts/turbo-telemetry.cjs" ]; then
            control_root="$GITHUB_WORKSPACE"
          fi
          node "$control_root/.github/scripts/turbo-telemetry.cjs" --log turbo-build.log

      - name: Write build telemetry
        if: always()
        shell: bash
        env:
          PLAYWRIGHT_TELEMETRY_PHASE: build
          PLAYWRIGHT_ROUTE: hosted
          PLAYWRIGHT_MODE: full
          PLAYWRIGHT_CACHE_CONTRACT: ${{ steps.cache-contract.outputs.fingerprint }}
          PNPM_CACHE_HIT: ${{ steps.pnpm-cache.outputs.cache-hit }}
          PNPM_CACHE_KEY: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
          PNPM_CACHE_MATCHED_KEY: ${{ steps.pnpm-cache.outputs.cache-matched-key }}
          TURBO_CACHE_HIT: ${{ steps.turbo-cache.outputs.cache-hit }}
          TURBO_CACHE_KEY: ${{ steps.turbo-cache.outputs.cache-primary-key }}
          TURBO_CACHE_MATCHED_KEY: ${{ steps.turbo-cache.outputs.cache-matched-key }}
          PLAYWRIGHT_CONCLUSION: ${{ steps.build.outcome }}
        run: |
          control_root=.ci-control
          if [ ! -f "$control_root/.github/scripts/playwright-telemetry.cjs" ]; then
            control_root="$GITHUB_WORKSPACE"
          fi
          node "$control_root/.github/scripts/playwright-telemetry.cjs" --output playwright-build-telemetry.json

      - name: Upload build telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-build-telemetry
          path: playwright-build-telemetry.json
          if-no-files-found: error
          retention-days: 1

  test-playwright-hosted:
    needs: [filter-hosted, build-and-compile-hosted]
    if: >-
      needs.filter-hosted.outputs.should_run == 'true'
    concurrency:
      group: ${{ github.workflow }}-hosted-shard-${{ matrix.shardIndex }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
      # Shares /config with the hatchet service so this job can read the worker
      # API token that hatchet-lite-dev mints on boot. Reading it via `docker
      # exec` (as the non-containerized workflows do) is impossible here: the
      # Playwright image has no Docker CLI.
      volumes:
        - hatchet_lite_config:/config
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4, 5, 6, 7, 8]
        shardTotal: [8]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: klicker-prod
          POSTGRES_PASSWORD: klicker
          POSTGRES_DB: klicker-prod
        options: >-
          --health-cmd "pg_isready -U klicker-prod -d klicker-prod"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      postgres_hatchet:
        image: postgres:15
        env:
          POSTGRES_USER: hatchet
          POSTGRES_PASSWORD: hatchet
          POSTGRES_DB: hatchet
        options: >-
          --health-cmd "pg_isready -U hatchet -d hatchet"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s
        ports:
          - 5433:5432
      redis_cache:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6380:6379
      redis_exec:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      redis_assessment_exec:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6381:6379
      hatchet:
        image: ghcr.io/hatchet-dev/hatchet/hatchet-lite-dev:v0.101.0
        ports:
          - '8888:8888'
          - '7077:7077'
        env:
          DATABASE_URL: 'postgresql://hatchet:hatchet@postgres_hatchet:5432/hatchet?sslmode=disable'
          SERVER_AUTH_COOKIE_DOMAIN: hatchet
          SERVER_AUTH_COOKIE_INSECURE: 't'
          SERVER_GRPC_BIND_ADDRESS: '0.0.0.0'
          SERVER_GRPC_INSECURE: 't'
          SERVER_GRPC_BROADCAST_ADDRESS: hatchet:7077
          SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS: hatchet:7077
          SERVER_GRPC_PORT: '7077'
          SERVER_URL: http://hatchet:8888
          SERVER_AUTH_SET_EMAIL_VERIFIED: 't'
          SERVER_DEFAULT_ENGINE_VERSION: 'V1'
          SERVER_LOGGER_LEVEL: debug
          SERVER_LOGGER_FORMAT: console
        options: >-
          --health-cmd "curl -f http://localhost:8888/healthz"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 10
        volumes:
          - hatchet_lite_config:/config

    steps:
      - run: echo "Running Playwright tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})"

      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out trusted cache contract
        uses: actions/checkout@v4
        with:
          repository: uzh-bf/klicker-uzh
          ref: refs/heads/v3
          path: .ci-control
          persist-credentials: false

      - name: Define node version
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Compute cache contract
        id: cache-contract
        run: node .ci-control/.github/scripts/playwright-cache-contract.cjs --root "$GITHUB_WORKSPACE"

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        if: env.PLAYWRIGHT_CACHE_ENABLED == 'true'
        id: pnpm-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: playwright-${{ runner.os }}-${{ runner.arch }}-pnpm-${{ steps.cache-contract.outputs.fingerprint }}-${{ github.sha }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ runner.arch }}-pnpm-${{ steps.cache-contract.outputs.fingerprint }}-

      - name: Install dependencies
        run: pnpm install

      - name: Download Playwright build outputs
        uses: actions/download-artifact@v4
        with:
          name: playwright-build-artifact

      - name: Restore generated GraphQL client
        run: |
          mkdir -p packages/graphql/src/public
          test -s packages/graphql/dist/client.json
          cp packages/graphql/dist/client.json packages/graphql/src/public/client.json

      - name: Restore Next build outputs
        run: tar -xf playwright-next-builds.tar

      - name: Generate Prisma Client
        run: pnpm --filter @klicker-uzh/prisma generate
        env:
          DATABASE_URL: postgres://klicker-prod:klicker@postgres:5432/klicker-prod

      - name: Prepare .env files
        run: |
          ./util/_create_hatchet_token_test.sh
        env:
          HATCHET_API_URL: http://hatchet:8888
          HATCHET_TENANT_ID: 707d0855-80ab-4e1f-a156-f1c4546cbf52

      - name: Apply migrations and reset database
        run: |
          cd packages/prisma
          pnpm run prisma:reset:raw -f
        env:
          DATABASE_URL: postgres://klicker-prod:klicker@postgres:5432/klicker-prod

      - name: Seed test participants for Playwright
        run: pnpm --filter @klicker-uzh/prisma-data seed:test
        env:
          DATABASE_URL: postgres://klicker-prod:klicker@postgres:5432/klicker-prod

      - name: Start services, wait for readiness, and run Playwright tests
        timeout-minutes: 120
        shell: bash
        run: |
          set -euo pipefail
          echo "PLAYWRIGHT_STARTED_SECONDS=$(date +%s)" >> "$GITHUB_ENV"
          chmod +x .github/scripts/wait-for-services.sh
          PROFILE_RUNTIME_FILES=(
            playwright/profiles.json
            playwright/runtime-contract.yml
            util/playwright-profile-runtime.mjs
          )
          profile_file_count=0
          for profile_file in "${PROFILE_RUNTIME_FILES[@]}"; do
            if [ -f "$profile_file" ]; then
              profile_file_count=$((profile_file_count + 1))
            fi
          done

          if [ "$profile_file_count" -eq "${#PROFILE_RUNTIME_FILES[@]}" ]; then
            SHARD_PLAN=$(node .github/scripts/get-shard-files.js ${{ matrix.shardIndex }} ${{ matrix.shardTotal }} --json)
            PROFILE=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).profile)' "$SHARD_PLAN")
            mapfile -t TEST_FILES < <(node -e 'for (const file of JSON.parse(process.argv[1]).files) console.log(file)' "$SHARD_PLAN")
            RUNTIME_PLAN="${RUNNER_TEMP}/playwright-runtime-${{ matrix.shardIndex }}.json"
            node util/playwright-profile-runtime.mjs resolve \
              --profile "$PROFILE" \
              --output "$RUNTIME_PLAN"
            export PLAYWRIGHT_RUNTIME_PLAN="$RUNTIME_PLAN"
            SERVICE_ENDPOINTS=$(node util/playwright-profile-runtime.mjs endpoints --plan "$RUNTIME_PLAN")
            export SERVICE_ENDPOINTS
          elif [ "$profile_file_count" -eq 0 ]; then
            PROFILE=legacy-full-stack
            SHARD_FILES=$(node .github/scripts/get-shard-files.js ${{ matrix.shardIndex }} ${{ matrix.shardTotal }})
            read -r -a TEST_FILES <<< "$SHARD_FILES"
            echo "::notice::Using legacy full-stack Playwright startup because the caller checkout predates the profile runtime"
          else
            echo "Playwright profile runtime files are partially present; refusing mixed startup" >&2
            exit 1
          fi

          if [ "${#TEST_FILES[@]}" -eq 0 ]; then
            echo "Shard plan contains no test files" >&2
            exit 1
          fi
          echo "Running tests for shard ${{ matrix.shardIndex }} with profile $PROFILE: ${TEST_FILES[*]}"
          .github/scripts/wait-for-services.sh -- \
            env NODE_ENV=test \
            pnpm --filter @klicker-uzh/playwright exec playwright test \
              --project=chromium \
              "${TEST_FILES[@]}"
        env:
          APP_SECRET: abcd
          DATABASE_URL: postgres://klicker-prod:klicker@postgres:5432/klicker-prod
          NODE_ENV: production
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3001
          URL_AUTH: http://127.0.0.1:3010
          URL_CONTROL: http://127.0.0.1:3003
          URL_MANAGE: http://127.0.0.1:3002
          URL_STUDENT: http://127.0.0.1:3001
          URL_STUDENT_LOGIN: http://127.0.0.1:3001/login
          URL_CHAT: http://127.0.0.1:3004
          SERVICE_START_SCRIPT: start:playwright:ci
          TIMEOUT_SECONDS: '300'
          CHECK_INTERVAL: '5'
          POSTGRES_CHECK_HOST: postgres
          POSTGRES_CHECK_PORT: 5432
          POSTGRES_CHECK_USER: klicker-prod
          POSTGRES_CHECK_DATABASE: klicker-prod
          REDIS_HOST: redis_exec
          REDIS_PASS: ''
          REDIS_PORT: 6379
          REDIS_CACHE_HOST: redis_cache
          REDIS_CACHE_PORT: 6379
          REDIS_ASSESSMENT_PORT: 6379
          REDIS_ASSESSMENT_PASS: ''
          REDIS_ASSESSMENT_HOST: redis_assessment_exec
          HATCHET_CHECK_HOST: hatchet
          HATCHET_HTTP_PORT: 8888
          HATCHET_GRPC_PORT: 7077
          HATCHET_API_URL: http://hatchet:8888
          HATCHET_TENANT_ID: 707d0855-80ab-4e1f-a156-f1c4546cbf52
          HATCHET_CLIENT_HOST_PORT: hatchet:7077
          HATCHET_HOST_PORT: hatchet:7077
          HATCHET_CLIENT_TLS_STRATEGY: none
          APP_ORIGIN_API: http://127.0.0.1:3000
          APP_ORIGIN_AUTH: http://127.0.0.1:3010
          APP_ORIGIN_LTI: http://127.0.0.1:4000
          APP_ORIGIN_PWA: http://127.0.0.1:3001
          APP_ORIGIN_MANAGE: http://127.0.0.1:3002
          APP_ORIGIN_CONTROL: http://127.0.0.1:3003
          APP_ORIGIN_ASSESSMENT_API: http://127.0.0.1:3000
          APP_ORIGIN_ASSESSMENT_PWA: http://127.0.0.1:3001

      - name: Upload Playwright JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.shardIndex }}-of-${{ matrix.shardTotal }}
          path: playwright/test-results/junit.xml
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ matrix.shardIndex }}-of-${{ matrix.shardTotal }}
          path: |
            playwright/playwright-report
            playwright/test-results
            service.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Write shard telemetry
        if: always()
        shell: bash
        env:
          PLAYWRIGHT_TELEMETRY_PHASE: shard
          PLAYWRIGHT_ROUTE: hosted
          PLAYWRIGHT_MODE: full
          PLAYWRIGHT_CACHE_CONTRACT: ${{ steps.cache-contract.outputs.fingerprint }}
          PNPM_CACHE_HIT: ${{ steps.pnpm-cache.outputs.cache-hit }}
          PNPM_CACHE_KEY: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
          PNPM_CACHE_MATCHED_KEY: ${{ steps.pnpm-cache.outputs.cache-matched-key }}
          TURBO_TASKS_SUCCESSFUL: ${{ env.TURBO_TASKS_SUCCESSFUL }}
          TURBO_TASKS_TOTAL: ${{ env.TURBO_TASKS_TOTAL }}
          TURBO_TASKS_CACHED: ${{ env.TURBO_TASKS_CACHED }}
          TURBO_CACHED_TOTAL: ${{ env.TURBO_CACHED_TOTAL }}
          PLAYWRIGHT_SHARD_INDEX: ${{ matrix.shardIndex }}
          PLAYWRIGHT_SHARD_TOTAL: ${{ matrix.shardTotal }}
          PLAYWRIGHT_CONCLUSION: ${{ job.status }}
        run: |
          started="${PLAYWRIGHT_STARTED_SECONDS:-$(date +%s)}"
          export PLAYWRIGHT_DURATION_SECONDS="$(( $(date +%s) - started ))"
          control_root=.ci-control
          if [ ! -f "$control_root/.github/scripts/playwright-telemetry.cjs" ]; then
            control_root="$GITHUB_WORKSPACE"
          fi
          node "$control_root/.github/scripts/playwright-telemetry.cjs" --output "playwright-telemetry-${{ matrix.shardIndex }}.json"

      - name: Upload shard telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-hosted-telemetry-${{ matrix.shardIndex }}-of-${{ matrix.shardTotal }}
          path: playwright-telemetry-${{ matrix.shardIndex }}.json
          if-no-files-found: error
          retention-days: 1

  test-playwright-public-pr:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.repository.private == false &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !endsWith(github.event.pull_request.user.login, '[bot]') &&
      (vars.PUBLIC_PR_ARM64_PLAYWRIGHT_ENABLED == 'true' ||
        vars.PUBLIC_PR_ARM64_PLAYWRIGHT_CANARY_PR == format('{0}', github.event.pull_request.number))
    concurrency:
      group: ${{ github.workflow }}-public-pr-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    uses: uzh-bf/klicker-uzh/.github/workflows/public-pr-playwright-shards.yml@refs/heads/v3

  # Shadow planning is hosted-only and reads the PR checkout strictly as data.
  # It does not control execution or allocate a public self-hosted runner.
  playwright-selector-shadow:
    if: github.event_name == 'pull_request'
    concurrency:
      group: ${{ github.workflow }}-selector-shadow-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out trusted selector source
        uses: actions/checkout@v4
        with:
          repository: uzh-bf/klicker-uzh
          ref: refs/heads/v3
          path: .ci-control
          persist-credentials: false

      - name: Check out PR candidate as data
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: .candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the exact base object
        shell: bash
        env:
          BASE_REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git -C .candidate remote add base "https://github.com/$BASE_REPOSITORY.git"
          git -C .candidate fetch --no-tags base "$BASE_SHA" --depth=1
          test "$(git -C .candidate rev-parse HEAD)" = "$HEAD_SHA"

      - name: Build the shadow selection plan
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          if [ "$PR_DRAFT" = 'true' ]; then
            pr_state=draft
          else
            pr_state=ready
          fi
          node .ci-control/.github/scripts/playwright-selector.cjs \
            --control-root .ci-control \
            --candidate-root .candidate \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --pr-state "$pr_state" \
            --output playwright-selector-shadow.json

      - name: Summarize the shadow plan
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const plan = JSON.parse(fs.readFileSync('playwright-selector-shadow.json'))
          const summary = [
            '### Playwright selector shadow',
            '',
            `- Mode: \`${plan.mode}\``,
            `- Reasons: \`${plan.reasonCodes.join(',')}\``,
            `- Candidate specs: \`${plan.candidateSpecs.length}\``,
            `- Selected specs: \`${plan.selectedSpecs.length}\``,
            `- Shards: \`${plan.shardCount}\``,
            `- Selected groups: \`${plan.selectedGroupIds.join(',') || 'none'}\``,
            '',
            'This plan is observational; the existing full Playwright execution remains authoritative.',
          ]
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary.join('\\n')}\\n`)
          NODE

      - name: Upload selector shadow plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-selector-shadow
          path: playwright-selector-shadow.json
          if-no-files-found: error
          retention-days: 1

  # Always reports a status even when the tests are skipped by the path filter,
  # so this job can be used as a required check in branch protection.
  test-playwright-status:
    needs:
      [
        filter-hosted,
        build-and-compile-hosted,
        test-playwright-hosted,
        test-playwright-public-pr,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        run: |
          hosted_filter_result="${{ needs.filter-hosted.result }}"
          hosted_build_result="${{ needs.build-and-compile-hosted.result }}"
          hosted_test_result="${{ needs.test-playwright-hosted.result }}"
          public_pr_result="${{ needs.test-playwright-public-pr.result }}"
          should_run=''

          if [ "$hosted_filter_result" = 'success' ] && [ "$public_pr_result" = 'skipped' ]; then
            route='hosted'
            should_run="${{ needs.filter-hosted.outputs.should_run }}"
          elif [ "$hosted_filter_result" = 'skipped' ] && [ "$public_pr_result" = 'success' ]; then
            route='public-pr'
            should_run="${{ needs.test-playwright-public-pr.outputs.should_run }}"
          else
            route='invalid'
          fi

          {
            printf 'route=%s\n' "$route"
            printf 'should_run=%s\n' "$should_run"
            printf 'hosted_filter_result=%s\n' "$hosted_filter_result"
            printf 'hosted_build_result=%s\n' "$hosted_build_result"
            printf 'hosted_test_result=%s\n' "$hosted_test_result"
            printf 'public_pr_result=%s\n' "$public_pr_result"
          } > playwright-run-metadata.txt

          {
            echo '### Playwright route status'
            echo
            echo "- Route: \`$route\`"
            echo "- Relevant changes: \`${should_run:-unknown}\`"
            echo "- Hosted filter/build/tests: \`$hosted_filter_result/$hosted_build_result/$hosted_test_result\`"
            echo "- Public PR workflow: \`$public_pr_result\`"
          } >> "$GITHUB_STEP_SUMMARY"

          # A run cancelled by concurrency (duplicate push, quick re-push) must not
          # leave a red required check behind: the surviving run is the real signal.
          if [ "$hosted_filter_result" = 'cancelled' ] || \
             [ "$hosted_build_result" = 'cancelled' ] || \
             [ "$hosted_test_result" = 'cancelled' ] || \
             [ "$public_pr_result" = 'cancelled' ]; then
            echo 'Superseded by a newer run; jobs were cancelled by concurrency.'
            exit 0
          fi

          if [ "$route" = 'invalid' ]; then
            echo 'Routing error: expected exactly one Playwright route.'
            echo "Hosted filter result: $hosted_filter_result"
            echo "Public PR result: $public_pr_result"
            exit 1
          fi

          if [ "$should_run" != 'true' ]; then
            echo "Tests skipped by path filter on the $route route."
            exit 0
          fi

          if [ "$route" = 'public-pr' ]; then
            exit 0
          fi

          if [ "$hosted_build_result" = 'success' ] && [ "$hosted_test_result" = 'success' ]; then
            exit 0
          fi

          echo 'Hosted Playwright execution failed or produced an unexpected result.'
          echo "Hosted build result: $hosted_build_result"
          echo "Hosted test result: $hosted_test_result"
          exit 1

      - name: Upload run metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-run-metadata
          path: playwright-run-metadata.txt
          retention-days: 1

  # Queue inspection is deliberately hosted and checkout-free. It has only
  # actions: read permission and never runs on the public self-hosted pool.
  playwright-queue-telemetry:
    needs:
      [
        filter-hosted,
        build-and-compile-hosted,
        test-playwright-hosted,
        test-playwright-public-pr,
        test-playwright-status,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
    steps:
      - name: Collect current-run queue telemetry
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('node:fs')

            const secondsBetween = (start, end) => {
              if (!start || !end) return null
              const seconds = (Date.parse(end) - Date.parse(start)) / 1000
              return Number.isFinite(seconds) && seconds >= 0 ? seconds : null
            }

            const percentile = (values, fraction) => {
              if (values.length === 0) return null
              const sorted = [...values].sort((a, b) => a - b)
              const index = Math.min(
                sorted.length - 1,
                Math.ceil(sorted.length * fraction) - 1
              )
              return sorted[index]
            }

            const jobClass = (name) => {
              const value = name.toLowerCase()
              if (value.includes('public-pr')) return 'public-pr'
              if (value.includes('filter')) return 'filter'
              if (value.includes('build')) return 'hosted-build'
              if (value.includes('status')) return 'status'
              if (value.includes('playwright')) return 'hosted-shard'
              return 'other'
            }

            const runId = Number(process.env.GITHUB_RUN_ID)
            let report

            try {
              const jobs = await github.paginate(
                github.rest.actions.listJobsForWorkflowRun,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: runId,
                  per_page: 100,
                }
              )
              const records = jobs
                .filter(
                  (job) =>
                    !job.name.toLowerCase().includes('queue-telemetry')
                )
                .map((job) => ({
                  jobClass: jobClass(job.name),
                  status: job.status ?? 'unknown',
                  conclusion: job.conclusion ?? null,
                  runner: job.runner_name ?? null,
                  queueSeconds: secondsBetween(
                    job.created_at,
                    job.started_at
                  ),
                  durationSeconds: secondsBetween(
                    job.started_at,
                    job.completed_at
                  ),
                }))
              const queueSeconds = records
                .map((record) => record.queueSeconds)
                .filter((value) => value !== null)

              report = {
                schema: 1,
                phase: 'queue',
                route: 'mixed',
                runId,
                jobCount: records.length,
                queueObservedCount: queueSeconds.length,
                queueP50Seconds: percentile(queueSeconds, 0.5),
                queueP95Seconds: percentile(queueSeconds, 0.95),
                jobs: records,
              }
            } catch {
              core.warning('Current-run queue telemetry is unavailable')
              report = {
                schema: 1,
                phase: 'queue',
                route: 'mixed',
                runId,
                collection: 'unavailable',
                errorClass: 'actions-api',
              }
            }

            fs.writeFileSync(
              'playwright-queue-telemetry.json',
              `${JSON.stringify(report, null, 2)}\n`
            )
            await core.summary
              .addHeading('Playwright queue telemetry')
              .addRaw(
                report.collection === 'unavailable'
                  ? 'Collection unavailable; execution was not affected.'
                  : `Observed ${report.queueObservedCount} of ${report.jobCount} jobs; queue p50=${report.queueP50Seconds ?? 'n/a'}s, p95=${report.queueP95Seconds ?? 'n/a'}s.`
              )
              .write()

      - name: Upload queue telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-queue-telemetry
          path: playwright-queue-telemetry.json
          if-no-files-found: error
          retention-days: 1
