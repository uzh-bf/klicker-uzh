name: Sonar long-lived branch pattern apply

# Disposable one-shot workflow. Push-triggered on its own scratch branch only,
# so no other workflow runs.

on:
  push:
    branches:
      - rs/sonar-pattern-apply

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Apply the long-lived branch pattern and reset the branch analyses
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          KEY=uzh-bf_klicker-uzh
          API=https://sonarcloud.io/api

          echo '== pattern before =='
          curl -s -H "Authorization: Bearer $SONAR_TOKEN" \
            "$API/settings/values?component=$KEY&keys=sonar.branch.longLivedBranches.regex"
          echo

          echo '== set the pattern =='
          setcode=$(curl -s -o /tmp/set.json -w '%{http_code}' -X POST -H "Authorization: Bearer $SONAR_TOKEN" \
            --data-urlencode "component=$KEY" \
            --data-urlencode "key=sonar.branch.longLivedBranches.regex" \
            --data-urlencode "value=(branch|release)-.*|v3(-(ai|audit))?" \
            "$API/settings/set")
          echo "set http=$setcode"
          head -c 300 /tmp/set.json || true
          echo

          echo '== pattern after =='
          after=$(curl -s -H "Authorization: Bearer $SONAR_TOKEN" \
            "$API/settings/values?component=$KEY&keys=sonar.branch.longLivedBranches.regex")
          echo "$after"
          case "$after" in
            *'v3(-(ai|audit))?'*) echo 'RESULT: the pattern is set on the project.' ;;
            *) echo 'RESULT: the pattern did not change; the analysis token cannot administer'
               echo 'the project, so change 1 stays an operator action.'
               exit 0 ;;
          esac

          echo '== delete the branch analyses so the type is reassigned =='
          for B in v3 v3-ai v3-audit; do
            d=$(curl -s -o /tmp/d.json -w '%{http_code}' -X POST -H "Authorization: Bearer $SONAR_TOKEN" \
              --data-urlencode "project=$KEY" --data-urlencode "branch=$B" \
              "$API/project_branches/delete")
            echo "delete $B -> http=$d"
          done

          echo '== branch types recorded after the reset =='
          curl -s "$API/project_branches/list?project=$KEY" | grep -o '"name":"[^"]*"' | head -20
