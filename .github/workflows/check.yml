name: Check codebase

# The suite runs in one of two envelopes, decided by the repository-owned
# classifier from the same changed-path records the rest of CI selects on. A
# class that cannot affect the application build skips the application build, the
# type check, and the code-quality gates, and still runs every contract suite that
# can falsify that class. The class is a reviewable source change in
# .github/scripts/minimum-validation-class.cjs, and the classification receipt
# records the exact paths that justified it.
#
# Narrowing is limited to pull requests. A push validates a deployment candidate
# and always runs the full envelope, whatever the class of its changed paths.
#
# The envelope is computed inside the suite job rather than in a job of its own:
# it costs one diff on a checkout the suite already performs, so it never delays
# the suite behind a second runner allocation. An unresolvable classification
# leaves every class output empty, and a gated step runs whenever its class
# output is anything but the bounded decision, so a broken classification can only
# widen the suite.

on:
  push:
    branches: ['v3', 'v3*']
  pull_request:
    # "edited" re-validates the changed package set when a PR is retargeted;
    # "ready_for_review" recomputes the required context at the ready boundary
    # so a draft-era success cannot stand in for the ready state.
    types: [opened, synchronize, reopened, edited, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  # The selector reads this workflow's prior required-status result for the head
  # to decide whether a metadata-only edit may reuse the completed validation.
  checks: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  TURBO_REMOTE_ONLY: true

jobs:
  # A metadata-only edited event leaves the merge tree and the commit range
  # unchanged, so it reuses a completed successful check at the same head
  # instead of repeating the full validation. Every other event still selects
  # the suite, and the selector runs the suite when the prior result is missing,
  # pending, failed, or unavailable.
  select:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ github.event_name == 'push' && 'true' || steps.check.outputs.should_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check for changes
        id: check
        uses: ./.github/actions/changed-paths
        with:
          # The codebase check is not path-scoped, so every changed path matches
          # and only the validated metadata-only reuse selects nothing.
          pattern: '.'
          prior-check-name: check

  check-suite:
    needs: select
    if: >-
      !cancelled() &&
      needs.select.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The class comes from the one repository-owned classifier, which reads the
      # same rename-aware changed-path records the selectors decide on.
      - name: Classify the changed paths
        id: classify
        uses: ./.github/actions/change-envelope
        with:
          receipt-path: minimum-validation-classification.json

      - name: Upload the classification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimum-validation-classification
          path: minimum-validation-classification.json
          # An absent receipt means the classification failed, which the previous
          # step reports and which widens the suite instead of failing it.
          if-no-files-found: ignore
          retention-days: 14

      - name: Report the bounded codebase check
        if: >-
          github.event_name == 'pull_request' &&
          steps.classify.outputs.codebase_check == 'bounded'
        env:
          CHANGE_CLASS: ${{ steps.classify.outputs.change_class }}
          CHANGE_CLASS_REASON: ${{ steps.classify.outputs.change_class_reason }}
        run: |
          {
            echo "### Bounded codebase check"
            echo
            echo "Change class '$CHANGE_CLASS' ($CHANGE_CLASS_REASON) cannot affect the"
            echo "application build, so this run deliberately skips the turbo build, the type"
            echo "check, ESLint, Biome, knip, and the Prisma schema-sync drift check. Every"
            echo "contract suite that can falsify this class still runs, and the classification"
            echo "receipt names the paths that justified the class."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check pull request commit identities
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Bound the range at the merge base so commits that arrived through a
        # v3 sync merge are not re-scanned; range mode itself stays strict.
        run: |
          base=$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")
          bash util/check-git-identity.sh range "${base}..${PR_HEAD_SHA}"

      - name: Test Git identity guard
        run: node --test ./util/check-git-identity.test.mjs

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: false

      - name: Test Playwright timing aggregation
        run: uv run --no-project --python 3.12 python -m unittest discover -s .github/scripts -p test_update_playwright_timings.py

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Set up Node.js with pnpm cache
        uses: ./.github/actions/setup-node-pnpm
        with:
          cache-write: 'true'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Devrouter profile planner
        run: bash .github/scripts/install-devrouter.sh

      - name: Check hosted pnpm cache policy
        run: node --test ./.github/scripts/hosted-pnpm-cache.test.cjs

      - name: Check CI queue policy
        run: |
          node --test \
            .github/scripts/ci-equivalent-run.test.cjs \
            .github/scripts/ci-duplicate-audit.test.cjs \
            .github/scripts/minimum-validation-class.test.cjs \
            .github/scripts/changed-paths.test.cjs \
            .github/scripts/ci-obsolete-runs.test.cjs \
            .github/scripts/ci-event-gates.test.cjs \
            .github/scripts/draft-sync-prs.test.cjs \
            .github/scripts/required-ci-status.test.cjs \
            .github/scripts/ocr-self-update-guard.test.cjs \
            .github/scripts/stg-release-promoter.test.js \
            .github/scripts/staging-image-plan.test.cjs \
            .github/scripts/staging-image-status.test.cjs \
            .github/scripts/sonar-coverage-inputs.test.cjs \
            .github/scripts/sonar-new-code-boundary.test.cjs \
            .github/scripts/image-scan-admission.test.cjs \
            .github/scripts/sonar-coverage-transport.test.cjs \
            .github/scripts/image-scan-receipt.test.cjs \
            .github/scripts/image-input-fingerprint.test.cjs \
            .github/scripts/release-image-manifest.test.cjs \
            .github/scripts/deploy-parity.test.cjs

      # Production renders deploy/ from v3 while the release images are tagged
      # from v3-ai, so the two revisions must not drift apart. The gate names
      # the divergent paths; see docs/ci-and-deployment.md.
      - name: Check deploy parity across v3 and v3-ai
        if: >-
          (github.event_name == 'push' && github.ref_name == 'v3') ||
          (github.event_name == 'pull_request' && github.base_ref == 'v3')
        run: node ./.github/scripts/deploy-parity.cjs --other v3-ai

      - name: Check Playwright CI contracts
        run: |
          pnpm run check:playwright-ci
          node --test .github/scripts/playwright-pnpm-seed-fallback.test.cjs
          node --test .github/scripts/pnpm-install-retry.test.cjs
          node --test .github/scripts/playwright-resource-sampler.test.cjs

      - name: Check Playwright host launcher
        run: pnpm run check:playwright-host

      - name: Check Next.js development configuration and readiness
        run: |
          node --test ./util/next-pages-development-config.test.mjs
          pnpm run test:dev-runtime

      - name: Check workspace dependency mount generation
        run: node --test ./util/generate-dependency-mounts.test.mjs

      - name: Check file formatting
        shell: bash
        run: pnpm run format:check

      - name: Check syncpack conformity
        shell: bash
        run: pnpm run check:syncpack

      - name: Check linting (Biome, advisory)
        # Runs unless the class proved that linting the changed paths cannot
        # falsify the change. A missing class output runs it.
        if: >-
          github.event_name != 'pull_request' ||
          steps.classify.outputs.codebase_check != 'bounded'
        continue-on-error: true
        shell: bash
        run: pnpm run lint:biome

      - name: Check linting
        if: >-
          github.event_name != 'pull_request' ||
          steps.classify.outputs.codebase_check != 'bounded'
        shell: bash
        run: pnpm run lint

      - name: Check Prisma schema sync drift
        if: >-
          github.event_name != 'pull_request' ||
          steps.classify.outputs.codebase_check != 'bounded'
        run: pnpm run check:prisma-sync

      - name: Check AGENTS.md command smoke
        run: pnpm run check:agents-md

      - name: Check removed engineering-wiki paths
        run: pnpm run check:removed-doc-artifacts

      - name: Build packages for typecheck (turbo)
        if: >-
          github.event_name != 'pull_request' ||
          steps.classify.outputs.codebase_check != 'bounded'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }}
            pnpm exec turbo run build --filter="...[origin/${{ github.base_ref }}...HEAD]"
          else
            pnpm exec turbo run build
          fi

      - name: Check typescript types
        if: >-
          github.event_name != 'pull_request' ||
          steps.classify.outputs.codebase_check != 'bounded'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm exec turbo run check --filter="...[origin/${{ github.base_ref }}...HEAD]"
          else
            pnpm exec turbo run check
          fi

      - name: Check unused code and dependencies (knip, advisory)
        if: >-
          github.event_name != 'pull_request' ||
          steps.classify.outputs.codebase_check != 'bounded'
        continue-on-error: true
        shell: bash
        run: pnpm run knip

  # Always reports the required check context, including when the selector
  # reused the completed validation of an unchanged head. It runs
  # unconditionally: GitHub can treat a skipped required check as acceptable, so
  # an unexpected skip, a cancellation, a failed suite or a missing selection
  # must fail inside it.
  check:
    needs: [select, check-suite]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Report required status
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true }}
          FILTER_RESULT: ${{ needs.select.result }}
          SHOULD_RUN: ${{ needs.select.outputs.should_run }}
          TEST_RESULT: ${{ needs.check-suite.result }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_PATH: .github/workflows/check.yml
          TERMINAL_JOB: check
          EVIDENCE_PATH: required-ci-evidence.json
          SELECTION_JOB: select
          SELECTION_JOB_RESULT: ${{ needs.select.result }}
          SUITE_JOB: check-suite
          SUITE_JOB_RESULT: ${{ needs.check-suite.result }}
        run: node .github/scripts/required-ci-status.cjs report
      - name: Upload required CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: required-ci-evidence
          path: required-ci-evidence.json
          if-no-files-found: error
          retention-days: 7
