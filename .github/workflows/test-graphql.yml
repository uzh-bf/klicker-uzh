name: Test graphql package logic functionalities

on:
  push:
    branches: ['v3', 'v3*']
  pull_request:
    # "edited" re-evaluates the internal selector on a base retarget.
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ github.event_name == 'push' && 'true' || steps.check.outputs.should_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check for changes
        id: check
        uses: ./.github/actions/changed-paths
        with:
          pattern: '^(packages/graphql/|packages/feature-flags/|packages/prisma/|packages/grading/|packages/types/|packages/util/|packages/hatchet/|apps/hatchet-worker-general/|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|turbo\.json|tsconfig\.json|\.devcontainer/disposable-test-init\.sql$|\.github/workflows/test-graphql\.yml|\.github/actions/changed-paths/|\.github/actions/setup-node-pnpm/|\.github/scripts/provision-disposable-postgres\.sh)'

  test-graphql:
    needs: filter
    if: >-
      needs.filter.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: klicker
          POSTGRES_PASSWORD: klicker
          POSTGRES_DB: klicker-prod
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      postgres_hatchet:
        image: postgres:15
        env:
          POSTGRES_USER: hatchet
          POSTGRES_PASSWORD: hatchet
          POSTGRES_DB: hatchet
        options: >-
          --health-cmd "pg_isready -U hatchet -d hatchet"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s
        ports:
          - 5433:5432

      hatchet:
        image: ghcr.io/hatchet-dev/hatchet/hatchet-lite-dev:v0.101.0
        env:
          DATABASE_URL: 'postgresql://hatchet:hatchet@postgres_hatchet:5432/hatchet?sslmode=disable'
          SERVER_AUTH_COOKIE_DOMAIN: localhost
          SERVER_AUTH_COOKIE_INSECURE: 't'
          SERVER_GRPC_BIND_ADDRESS: '0.0.0.0'
          SERVER_GRPC_INSECURE: 't'
          SERVER_GRPC_BROADCAST_ADDRESS: localhost:7077
          SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS: localhost:7077
          SERVER_GRPC_PORT: '7077'
          SERVER_URL: http://localhost:8888
          SERVER_AUTH_SET_EMAIL_VERIFIED: 't'
          SERVER_DEFAULT_ENGINE_VERSION: 'V1'
          SERVER_LOGGER_LEVEL: debug
          SERVER_LOGGER_FORMAT: console
        options: >-
          --health-cmd "curl -f http://localhost:8888/healthz"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 10
        ports:
          - 8888:8888
          - 7077:7077

      redis_exec:
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        image: redis:7
        ports:
          - 6379:6379

      redis_assessment:
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        image: redis:7
        ports:
          - 6380:6379

      redis_cache:
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        image: redis:7
        ports:
          - 6381:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Record tested source tree
        continue-on-error: true
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SOURCE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CONTROL_SHA: ${{ github.workflow_sha }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const { execFileSync } = require('node:child_process')
          fs.writeFileSync('ci-validation-receipt.json', JSON.stringify({
            schemaVersion: 1,
            event: process.env.GITHUB_EVENT_NAME,
            runId: Number(process.env.GITHUB_RUN_ID),
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            headSha: process.env.SOURCE_HEAD_SHA,
            baseSha: process.env.SOURCE_BASE_SHA,
            controlSha: process.env.CONTROL_SHA,
            treeSha: execFileSync('git', ['-c', `safe.directory=${process.env.GITHUB_WORKSPACE}`, 'rev-parse', 'HEAD^{tree}'], { encoding: 'utf8' }).trim(),
          }))
          NODE

      - name: Upload tested source receipt
        continue-on-error: true
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ci-validation-receipt
          path: ci-validation-receipt.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Set up Node.js with pnpm cache
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependency packages
        run: pnpm exec turbo run build --filter=@klicker-uzh/graphql --filter=@klicker-uzh/hatchet-worker-general --concurrency=4

      - name: Provision disposable PostgreSQL
        id: provision_db
        run: bash .github/scripts/provision-disposable-postgres.sh "${{ job.services.postgres.id }}"

      - name: Setup database
        id: setup_db
        if: ${{ !cancelled() && steps.provision_db.outcome == 'success' }}
        run: |
          cd packages/prisma
          pnpm run prisma:reset:raw -f
        env:
          DATABASE_URL: postgresql://klicker_test:klicker@localhost:5432/klicker_test
          SHADOW_DATABASE_URL: postgresql://klicker_test:klicker@localhost:5432/klicker_test_shadow

      - name: Run tests
        if: ${{ !cancelled() && steps.setup_db.outcome == 'success' }}
        run: |
          set -euo pipefail

          . ./util/_create_hatchet_token_graphql.sh

          HATCHET_CLIENT_TOKEN=$(grep -m1 '^HATCHET_CLIENT_TOKEN=' packages/graphql/.env | cut -d'=' -f2-)
          if [[ -z "${HATCHET_CLIENT_TOKEN}" ]]; then
            echo "Failed to read HATCHET_CLIENT_TOKEN from packages/graphql/.env" >&2
            exit 1
          fi

          WORKER_ENV_FILE=apps/hatchet-worker-general/.env.test.ci

          cat <<EOF > "${WORKER_ENV_FILE}"
          HATCHET_CLIENT_TOKEN=${HATCHET_CLIENT_TOKEN}
          HATCHET_CLIENT_HOST_PORT=localhost:7077
          HATCHET_CLIENT_TLS_STRATEGY=none
          HATCHET_API_URL=http://localhost:8888
          HATCHET_HOST_PORT=localhost:7077
          HATCHET_LOG_LEVEL=DEBUG
          HATCHET_TENANT_ID=707d0855-80ab-4e1f-a156-f1c4546cbf52
          HATCHET_WORKER_NAME=hatchet-worker-general
          LOG_LEVEL=info
          NODE_ENV=test
          DATABASE_URL=postgresql://klicker_test:klicker@localhost:5432/klicker_test
          SHADOW_DATABASE_URL=postgresql://klicker_test:klicker@localhost:5432/klicker_test_shadow
          REDIS_HOST=localhost
          REDIS_PORT=6379
          REDIS_ASSESSMENT_HOST=localhost
          REDIS_ASSESSMENT_PORT=6380
          REDIS_CACHE_HOST=localhost
          REDIS_CACHE_PORT=6381
          APP_ORIGIN_API=http://api.klicker.com
          APP_ORIGIN_AUTH=http://auth.klicker.com
          APP_ORIGIN_LTI=http://lti.klicker.com
          APP_ORIGIN_PWA=http://pwa.klicker.com
          APP_ORIGIN_MANAGE=http://manage.klicker.com
          APP_ORIGIN_CONTROL=http://control.klicker.com
          APP_ORIGIN_ASSESSMENT_API=http://assessment-api.klicker.com
          APP_ORIGIN_ASSESSMENT_PWA=http://assessment.klicker.com
          EOF

          cleanup() {
            if [[ -n "${HATCHET_WORKER_PID:-}" ]]; then
              if kill -0 "${HATCHET_WORKER_PID}" >/dev/null 2>&1; then
                kill "${HATCHET_WORKER_PID}" >/dev/null 2>&1 || true
                wait "${HATCHET_WORKER_PID}" 2>/dev/null || true
              fi
            fi
            rm -f "${WORKER_ENV_FILE}"
          }
          trap cleanup EXIT

          node --env-file "${WORKER_ENV_FILE}" apps/hatchet-worker-general/dist/index.js &
          HATCHET_WORKER_PID=$!

          sleep 5
          if ! kill -0 "${HATCHET_WORKER_PID}" >/dev/null 2>&1; then
            echo "Hatchet worker failed to start. See logs above." >&2
            exit 1
          fi

          cd packages/graphql
          pnpm vitest run --coverage --coverage.provider=v8 --coverage.reporter=lcov --coverage.reportsDirectory=coverage
        env:
          DATABASE_URL: postgresql://klicker_test:klicker@localhost:5432/klicker_test
          SHADOW_DATABASE_URL: postgresql://klicker_test:klicker@localhost:5432/klicker_test_shadow
          HATCHET_CLIENT_TLS_STRATEGY: none
          HATCHET_CLIENT_HOST_PORT: localhost:7077
          NODE_ENV: test
          HATCHET_API_URL: http://localhost:8888
          HATCHET_TENANT_ID: 707d0855-80ab-4e1f-a156-f1c4546cbf52
          HATCHET_HOST_PORT: 7077
          # Provide all app origins for consistency
          APP_ORIGIN_API: http://api.klicker.com
          APP_ORIGIN_AUTH: http://auth.klicker.com
          APP_ORIGIN_LTI: http://lti.klicker.com
          APP_ORIGIN_PWA: http://pwa.klicker.com
          APP_ORIGIN_MANAGE: http://manage.klicker.com
          APP_ORIGIN_CONTROL: http://control.klicker.com
          APP_ORIGIN_ASSESSMENT_API: http://assessment-api.klicker.com
          APP_ORIGIN_ASSESSMENT_PWA: http://assessment.klicker.com

      - name: Upload LCOV coverage
        # Upload on every outcome so coverage from the suite is still available
        # to the Sonar analysis job even when the run fails. The path filter
        # legitimately selects no suites, so if-no-files-found: ignore keeps the
        # required status green when no lcov files exist.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: '**/coverage/lcov.info'
          if-no-files-found: ignore
          retention-days: 7

  # Always reports a status even when the tests are skipped by the path filter,
  # so this job is the required check. It runs unconditionally so a skipped
  # context can never read as acceptable; the shared helper fails on
  # cancellation, an unexpected skip, a missing selector result or a failed
  # suite, and records the selection evidence for the promoter.
  test-graphql-status:
    needs: [filter, test-graphql]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Report required status
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true }}
          FILTER_RESULT: ${{ needs.filter.result }}
          SHOULD_RUN: ${{ needs.filter.outputs.should_run }}
          TEST_RESULT: ${{ needs.test-graphql.result }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_PATH: .github/workflows/test-graphql.yml
          TERMINAL_JOB: test-graphql-status
          EVIDENCE_PATH: required-ci-evidence.json
          SELECTION_JOB: filter
          SELECTION_JOB_RESULT: ${{ needs.filter.result }}
          SUITE_JOB: test-graphql
          SUITE_JOB_RESULT: ${{ needs.test-graphql.result }}
        run: node .github/scripts/required-ci-status.cjs report
      - name: Upload required CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: required-ci-evidence
          path: required-ci-evidence.json
          if-no-files-found: error
          retention-days: 7
