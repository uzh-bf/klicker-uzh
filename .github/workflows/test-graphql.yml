name: Test graphql package logic functionalities

on:
  push:
    branches: ['v3', 'v3*']
    paths:
      - 'packages/graphql/**'
      - '.github/workflows/test-graphql.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'packages/graphql/**'
      - '.github/workflows/test-graphql.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: klicker
          POSTGRES_PASSWORD: klicker
          POSTGRES_DB: klicker-prod
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      postgres_hatchet:
        image: postgres:15
        env:
          POSTGRES_USER: hatchet
          POSTGRES_PASSWORD: hatchet
          POSTGRES_DB: hatchet
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

      hatchet:
        image: ghcr.io/hatchet-dev/hatchet/hatchet-lite:latest
        env:
          DATABASE_URL: 'postgresql://hatchet:hatchet@postgres_hatchet:5432/hatchet?sslmode=disable'
          SERVER_AUTH_COOKIE_DOMAIN: 127.0.0.1
          SERVER_AUTH_COOKIE_INSECURE: 't'
          SERVER_GRPC_BIND_ADDRESS: '0.0.0.0'
          SERVER_GRPC_INSECURE: 't'
          SERVER_GRPC_BROADCAST_ADDRESS: 127.0.0.1:7077
          SERVER_GRPC_PORT: '7077'
          SERVER_URL: http://127.0.0.1:8888
          SERVER_AUTH_SET_EMAIL_VERIFIED: 't'
          SERVER_DEFAULT_ENGINE_VERSION: 'V1'
        options: >-
          --health-cmd "curl -f http://127.0.0.1:8888/healthz"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 10
        ports:
          - 8888:8888
          - 7077:7077

      redis_exec:
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 10.15.0
          run_install: true

      - name: Build dependency packages
        run: |
          cd packages/prisma
          pnpm run build
          cd ../types
          pnpm run build
          cd ../util
          pnpm run build
          cd ../grading
          pnpm run build
          cd ../hatchet
          pnpm run build
          cd ../graphql
          pnpm run build
          cd ../../apps/hatchet-worker-general
          pnpm run build

      - name: Setup database
        run: |
          cd packages/prisma
          pnpm run prisma:reset:raw -f
        env:
          DATABASE_URL: postgresql://klicker:klicker@localhost:5432/klicker-prod

      - name: Wait for Hatchet health
        run: |
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8888/healthz >/dev/null; then
              echo "Hatchet is ready"; ready=1; break; fi
            echo "Waiting for Hatchet... ($i/30)"; sleep 2; done
          if [ "$ready" -ne 1 ]; then
            echo "ERROR: Hatchet did not become ready within 60 seconds" >&2
            exit 1
          fi

      - name: Prepare Hatchet tokens
        run: |
          ./util/_create_hatchet_token_cypress.sh
          ./util/_create_hatchet_token_graphql.sh

      - name: Start Hatchet worker
        run: |
          cd apps/hatchet-worker-general
          # Start the worker in background with CI hosts
          DATABASE_URL=${{ env.DATABASE_URL }} \
          HATCHET_API_URL=${{ env.HATCHET_API_URL }} \
          HATCHET_TENANT_ID=${{ env.HATCHET_TENANT_ID }} \
          HATCHET_HOST_PORT=${{ env.HATCHET_HOST_PORT }} \
          REDIS_HOST=127.0.0.1 REDIS_PORT=6379 \
          REDIS_CACHE_HOST=127.0.0.1 REDIS_CACHE_PORT=6380 \
          pnpm run start:test &
          sleep 3
        env:
          DATABASE_URL: postgresql://klicker:klicker@localhost:5432/klicker-prod
          HATCHET_API_URL: http://127.0.0.1:8888
          HATCHET_TENANT_ID: 707d0855-80ab-4e1f-a156-f1c4546cbf52
          HATCHET_HOST_PORT: 7077

      - name: Run tests
        run: |
          cd packages/graphql
          pnpm vitest run
        env:
          DATABASE_URL: postgresql://klicker:klicker@localhost:5432/klicker-prod
          HATCHET_CLIENT_TLS_STRATEGY: none
          NODE_ENV: test
          HATCHET_API_URL: http://127.0.0.1:8888
          HATCHET_TENANT_ID: 707d0855-80ab-4e1f-a156-f1c4546cbf52
          HATCHET_HOST_PORT: 7077
