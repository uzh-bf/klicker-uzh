name: Check unused code and dependencies (knip)

on:
  push:
    branches: ['v3', 'v3*']
  pull_request:
    branches: ['v3', 'v3*']
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  TURBO_REMOTE_ONLY: true

jobs:
  check-knip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for changes
        id: filter
        uses: ./.github/actions/changed-paths
        with:
          pattern: '^(apps/|packages/|util/|package\.json|pnpm-lock\.yaml|knip\.json|\.github/workflows/check-knip\.yml|\.github/actions/changed-paths/)'

      - name: Define node version
        if: steps.filter.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - uses: pnpm/action-setup@v4
        if: steps.filter.outputs.should_run == 'true'
        with:
          version: 11.5.0
          run_install: true

      # Advisory during the migration (D5): reports unused files, dependencies,
      # and exports in the logs without blocking the PR. Ratchet to blocking once
      # the per-workspace entry config is tuned and the backlog is worked down.
      - name: Check for unused code and dependencies
        if: steps.filter.outputs.should_run == 'true'
        continue-on-error: true
        shell: bash
        run: |
          pnpm run knip
