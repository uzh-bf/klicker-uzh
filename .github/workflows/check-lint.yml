name: Check linting

on:
  push:
    branches: ['v3', 'v3*']
    paths:
      - apps/**
      - packages/**
      - util/**
      - .github/workflows/**
      - AGENTS.md
      - project/2026-07-06-agent-readiness-improvement-plan.md
  pull_request:
    branches: ['v3', 'v3*']
    types: [opened, synchronize, reopened]
    paths:
      - apps/**
      - packages/**
      - util/**
      - .github/workflows/**
      - AGENTS.md
      - project/2026-07-06-agent-readiness-improvement-plan.md

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  TURBO_REMOTE_ONLY: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: true
      - name: Check linting
        shell: bash
        run: |
          pnpm run lint
      - name: Check Prisma schema sync drift
        run: pnpm run check:prisma-sync
      - name: Check AGENTS.md command smoke
        run: pnpm run check:agents-md
