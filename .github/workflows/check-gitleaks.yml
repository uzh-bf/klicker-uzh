name: Check for secrets (gitleaks)

run-name: >-
  ${{ vars.PRIORITY_CI_ENABLED == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == false &&
      github.event.repository.private == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot' &&
      contains(github.event.pull_request.labels.*.name, 'ci:priority') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ci:priority') &&
      format('priority:{0}:{1}:{2}', github.event.pull_request.number, github.event.pull_request.head.sha, github.event.pull_request.base.sha)
      || format('ordinary:{0}', github.run_id) }}

on:
  push:
    branches: ['v3', 'v3*']
  pull_request:
    # No "edited": a title or body edit never changes the tested tree, and a
    # base retarget is revalidated by the restack push or a close and reopen.
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: >-
    ${{ github.event.action == 'labeled' &&
        (vars.PRIORITY_CI_ENABLED == 'true' &&
         github.event.label.name == 'ci:priority' &&
         github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == false &&
         github.event.repository.private == false &&
         github.event.pull_request.head.repo.full_name == github.repository &&
         github.event.pull_request.user.type != 'Bot' &&
         format('{0}-priority-{1}-{2}-{3}', github.workflow, github.event.pull_request.number, github.event.pull_request.head.sha, github.event.pull_request.base.sha) ||
         format('{0}-ignored-{1}', github.workflow, github.run_id)) ||
        (vars.PRIORITY_CI_ENABLED == 'true' &&
         github.event_name == 'pull_request' &&
         github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == false &&
         github.event.repository.private == false &&
         github.event.pull_request.head.repo.full_name == github.repository &&
         github.event.pull_request.user.type != 'Bot' &&
         contains(github.event.pull_request.labels.*.name, 'ci:priority') &&
         format('{0}-priority-{1}-{2}-{3}', github.workflow, github.event.pull_request.number, github.event.pull_request.head.sha, github.event.pull_request.base.sha)) ||
        format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref_name) }}
  cancel-in-progress: >-
    ${{ github.event.action != 'labeled' &&
        !(vars.PRIORITY_CI_ENABLED == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == false &&
          github.event.repository.private == false &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.type != 'Bot' &&
          contains(github.event.pull_request.labels.*.name, 'ci:priority')) }}

# Least privilege: the job only checks out and scans; a compromised binary or
# dependency therefore cannot use the workflow token to write to the repo.
permissions:
  contents: read

jobs:
  priority-route:
    if: >-
      !(vars.PRIORITY_CI_ENABLED == 'true' && github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && github.event.pull_request.draft == false && github.event.repository.private == false && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot' && contains(github.event.pull_request.labels.*.name, 'ci:priority') && (github.event.action != 'labeled' || github.event.label.name == 'ci:priority')) &&
      (vars.PRIORITY_CI_ENABLED == 'true' && github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && github.event.pull_request.draft == false && github.event.repository.private == false && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot' && contains(github.event.pull_request.labels.*.name, 'ci:priority'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      admitted: ${{ steps.route.outputs.admitted }}
      run_label_event: ${{ steps.route.outputs.run_label_event }}
      run_attempt: ${{ steps.route.outputs.run_attempt }}
      runner_x64: ${{ steps.route.outputs.runner_x64 }}
      runner_build: ${{ steps.route.outputs.runner_build }}
      runner_arm: ${{ steps.route.outputs.runner_arm }}
    steps:
      - name: Check out the trusted priority router
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: uzh-bf/klicker-uzh
          ref: v3
          path: .ci-priority
          sparse-checkout: .github/actions/priority-ci-route
          persist-credentials: false
      - name: Route priority validation
        id: route
        uses: ./.ci-priority/.github/actions/priority-ci-route

  check-gitleaks:
    name: ${{ (vars.PRIORITY_CI_ENABLED == 'true' && github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && github.event.pull_request.draft == false && github.event.repository.private == false && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot' && contains(github.event.pull_request.labels.*.name, 'ci:priority') && (github.event.action != 'labeled' || github.event.label.name == 'ci:priority')) && 'check-gitleaks (delegated)' || ((github.event.action != 'labeled' || needs.priority-route.outputs.run_label_event == 'true') && 'check-gitleaks' || 'check-gitleaks (priority not admitted)') }}
    needs: priority-route
    if: >-
      !(vars.PRIORITY_CI_ENABLED == 'true' && github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && github.event.pull_request.draft == false && github.event.repository.private == false && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot' && contains(github.event.pull_request.labels.*.name, 'ci:priority') && (github.event.action != 'labeled' || github.event.label.name == 'ci:priority')) &&
      (!cancelled() && (github.event.action != 'labeled' || needs.priority-route.outputs.run_label_event == 'true'))
    runs-on: ${{ needs.priority-route.outputs.run_attempt == format('{0}', github.run_attempt) && needs.priority-route.outputs.runner_x64 || 'ubuntu-latest' }}
    timeout-minutes: ${{ needs.priority-route.outputs.admitted == 'true' && 15 || 360 }}
    steps:
      - name: Reject a stale paid preparation
        if: needs.priority-route.outputs.admitted == 'true' && needs.priority-route.outputs.run_attempt != format('{0}', github.run_attempt)
        run: exit 1
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Install the gitleaks binary directly (MIT-licensed release asset) instead
      # of gitleaks-action@v2, which requires a GITLEAKS_LICENSE for org-owned
      # repos. Version pinned to match the local hook and the plan.
      - name: Install gitleaks
        shell: bash
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            /tmp/gitleaks.tar.gz | sha256sum --check --status
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan introduced commits for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          if [[ -z "$BASE_SHA" || -z "$HEAD_SHA" ]]; then
            echo 'Unable to determine the commit range for the secret scan.'
            exit 1
          fi

          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'The secret scan received an invalid commit SHA.'
            exit 1
          fi

          if [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            if [[ -z "$DEFAULT_BRANCH" ]] || ! git check-ref-format --branch "$DEFAULT_BRANCH" >/dev/null 2>&1; then
              echo 'Unable to determine a valid default branch for the branch-creation scan.'
              exit 1
            fi

            if ! git fetch --no-tags origin "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"; then
              echo 'Unable to fetch the default branch for the branch-creation scan.'
              exit 1
            fi

            if ! BASE_SHA="$(git merge-base "$HEAD_SHA" "refs/remotes/origin/$DEFAULT_BRANCH")"; then
              echo 'Unable to resolve a merge base for the branch-creation scan.'
              exit 1
            fi

            if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo 'The branch-creation scan resolved an invalid merge base.'
              exit 1
            fi
          fi

          LOG_OPTS="$BASE_SHA..$HEAD_SHA"

          # Scan only commits introduced by this push or pull request so
          # historical findings are not re-reported as newly introduced leaks.
          gitleaks git --log-opts="$LOG_OPTS" --no-banner --redact --config .gitleaks.toml

  priority-execution:
    if: >-
      vars.PRIORITY_CI_ENABLED == 'true' && github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && github.event.pull_request.draft == false && github.event.repository.private == false && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot' && contains(github.event.pull_request.labels.*.name, 'ci:priority') && (github.event.action != 'labeled' || github.event.label.name == 'ci:priority')
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: read
    uses: uzh-bf/klicker-uzh/.github/workflows/check-gitleaks-execution.yml@aaf8d41393f9c5e51e0076827c80953afacb8c4a

  priority-status:
    name: ${{ (vars.PRIORITY_CI_ENABLED == 'true' && github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && github.event.pull_request.draft == false && github.event.repository.private == false && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot' && contains(github.event.pull_request.labels.*.name, 'ci:priority') && (github.event.action != 'labeled' || github.event.label.name == 'ci:priority')) && (github.event.action != 'labeled' || needs.priority-execution.outputs.run_label_event == 'true') && 'check-gitleaks' || 'check-gitleaks (priority not admitted)' }}
    needs: priority-execution
    if: >-
      always() && (vars.PRIORITY_CI_ENABLED == 'true' && github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && github.event.pull_request.draft == false && github.event.repository.private == false && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot' && contains(github.event.pull_request.labels.*.name, 'ci:priority') && (github.event.action != 'labeled' || github.event.label.name == 'ci:priority'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require the actual trusted terminal result
        if: github.event.action != 'labeled' || needs.priority-execution.outputs.run_label_event == 'true'
        env:
          EXECUTION_RESULT: ${{ needs.priority-execution.result }}
          REQUIRED_RESULT: ${{ needs.priority-execution.outputs.required_result }}
        run: test "$EXECUTION_RESULT" = success && test "$REQUIRED_RESULT" = success
