# Generated by .github/scripts/priority-ci-workflows.cjs; edit the canonical workflow.
name: Check codebase priority execution
on:
  workflow_call:
    outputs:
      required_result:
        description: Actual required terminal job result
        value: ${{ jobs.check.outputs.required_result }}
      run_label_event:
        description: Whether label-only work was admitted
        value: ${{ jobs.priority-route.outputs.run_label_event }}
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  TURBO_REMOTE_ONLY: true
permissions:
  contents: read
  checks: read
jobs:
  priority-route:
    if: vars.PRIORITY_CI_ENABLED == 'true' && github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && github.event.pull_request.draft == false && github.event.repository.private == false && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot' && contains(github.event.pull_request.labels.*.name, 'ci:priority')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      admitted: ${{ steps.route.outputs.admitted }}
      run_label_event: ${{ steps.route.outputs.run_label_event }}
      run_attempt: ${{ steps.route.outputs.run_attempt }}
      runner_x64: ${{ steps.route.outputs.runner_x64 }}
      runner_build: ${{ steps.route.outputs.runner_build }}
      runner_arm: ${{ steps.route.outputs.runner_arm }}
    steps:
      - name: Check out the trusted priority router
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: uzh-bf/klicker-uzh
          ref: v3
          path: .ci-priority
          sparse-checkout: .github/actions/priority-ci-route
          persist-credentials: false
      - name: Route priority validation
        id: route
        uses: ./.ci-priority/.github/actions/priority-ci-route
  select:
    needs: priority-route
    if: "!cancelled() && (github.event.action != 'labeled' || needs.priority-route.outputs.run_label_event == 'true')"
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ github.event_name == 'push' && 'true' || steps.check.outputs.should_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check for changes
        id: check
        uses: ./.github/actions/changed-paths
        with:
          pattern: .
          prior-check-name: check
  check-suite:
    needs:
      - select
      - priority-route
    if: "!cancelled() && (github.event.action != 'labeled' || needs.priority-route.outputs.run_label_event == 'true') && (needs.priority-route.outputs.admitted != 'true' || needs.priority-route.outputs.run_attempt == format('{0}', github.run_attempt)) && needs.select.outputs.should_run == 'true'"
    runs-on: ${{ needs.priority-route.outputs.runner_build || 'ubuntu-latest' }}
    timeout-minutes: ${{ needs.priority-route.outputs.admitted == 'true' && 60 || 360 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify the changed paths
        id: classify
        uses: ./.github/actions/change-envelope
        with:
          receipt-path: minimum-validation-classification.json
      - name: Upload the classification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimum-validation-classification
          path: minimum-validation-classification.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Report the bounded codebase check
        if: github.event_name == 'pull_request' && steps.classify.outputs.codebase_check == 'bounded'
        env:
          CHANGE_CLASS: ${{ steps.classify.outputs.change_class }}
          CHANGE_CLASS_REASON: ${{ steps.classify.outputs.change_class_reason }}
        run: |
          {
            echo "### Bounded codebase check"
            echo
            echo "Change class '$CHANGE_CLASS' ($CHANGE_CLASS_REASON) cannot affect the"
            echo "application build, so this run deliberately skips the turbo build, the type"
            echo "check, ESLint, Biome, knip, and the Prisma schema-sync drift check. Every"
            echo "contract suite that can falsify this class still runs, and the classification"
            echo "receipt names the paths that justified the class."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check pull request commit identities
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base=$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")
          bash util/check-git-identity.sh range "${base}..${PR_HEAD_SHA}"
      - name: Test Git identity guard
        run: node --test ./util/check-git-identity.test.mjs
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: false
      - name: Test Playwright timing aggregation
        run: uv run --no-project --python 3.12 python -m unittest discover -s .github/scripts -p test_update_playwright_timings.py
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - name: Set up Node.js with pnpm cache
        uses: ./.github/actions/setup-node-pnpm
        with:
          cache-write: 'true'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test evaluation launcher without private submodule access
        timeout-minutes: 10
        run: |
          node --test util/read-klicker-eval-config.test.mjs
          bash util/test-klicker-eval-wrapper.sh
          uv run --no-project --python 3.12 python -m unittest util/test-klicker-eval-judge.py
          judge_image="$(python3 -c "import runpy; print(runpy.run_path('util/klicker-eval-judge.py')['IMAGE'])")"
          docker run --rm --network none --env KLICKER_EVAL_GATEWAY_TEST=1 --env LITELLM_LOCAL_MODEL_COST_MAP=True --mount "type=bind,source=$GITHUB_WORKSPACE,target=/work,readonly" --workdir /work --entrypoint python3 "$judge_image" -m unittest util/test-klicker-eval-judge.py
          uv run --no-project --python 3.12 --with pytest==9.1.1 python -m pytest -q -p no:cacheprovider evaluation/tests/test_klicker_trajectories.py
          uv run --no-project --python 3.12 --with pytest==9.1.1 python -m pytest -q -p no:cacheprovider evaluation/tests/test_budget_admission.py
      - name: Install Devrouter profile planner
        run: bash .github/scripts/install-devrouter.sh
      - name: Check hosted pnpm cache policy
        run: node --test ./.github/scripts/hosted-pnpm-cache.test.cjs
      - name: Check CI and review contracts
        run: |
          node --test \
            .github/scripts/direct-script-invocations.test.cjs \
            .github/scripts/ci-equivalent-run.test.cjs \
            .github/scripts/ci-verified-reuse.test.cjs \
            .github/scripts/ci-reuse-policy.test.cjs \
            .github/scripts/install-devrouter-locked.test.cjs \
            .github/scripts/ci-duplicate-audit.test.cjs \
            .github/scripts/minimum-validation-class.test.cjs \
            .github/scripts/changed-paths.test.cjs \
            .github/scripts/ci-obsolete-runs.test.cjs \
            .github/scripts/ci-event-gates.test.cjs \
            .github/scripts/draft-sync-prs.test.cjs \
            .github/scripts/sync-pr-changelog.test.cjs \
            .github/scripts/sync-ancestry-guard.test.cjs \
            .github/scripts/required-ci-status.test.cjs \
            .github/scripts/ocr-self-update-guard.test.cjs \
            .github/scripts/ocr-mistral-adapter.test.cjs \
            .github/scripts/ocr-draft-review.test.cjs \
            .github/scripts/ocr-controller.test.cjs \
            .github/scripts/ocr-review-tools.test.cjs \
            .github/scripts/final-ai-review.test.js \
            .github/scripts/final-ai-stack-review.test.js \
            .github/scripts/stg-release-promoter.test.js \
            .github/scripts/staging-image-plan.test.cjs \
            .github/scripts/staging-image-status.test.cjs \
            .github/scripts/sonar-coverage-inputs.test.cjs \
            .github/scripts/sonar-new-code-boundary.test.cjs \
            .github/scripts/image-scan-admission.test.cjs \
            .github/scripts/sonar-coverage-transport.test.cjs \
            .github/scripts/image-scan-receipt.test.cjs \
            .github/scripts/image-input-fingerprint.test.cjs \
            .github/scripts/release-image-manifest.test.cjs \
            .github/scripts/deploy-parity.test.cjs \
            .github/actions/priority-ci-route/route.test.cjs
      - name: Select shared OCR runtime qualification
        id: ocr_shared
        uses: ./.github/actions/changed-paths
        with:
          pattern: ^\.github/(actions/ocr-review/|workflows/(check|check-ocr-review)\.yml|scripts/ocr-(controller|draft-review|review-shared|runtime-config|review-tools|mistral-adapter)(\.test)?\.cjs|open-code-review/runtime-manifest\.json)|^\.agents/skills/ocr-reviewer/
      - name: Qualify stock OCR runtime with synthetic providers
        if: steps.ocr_shared.outputs.should_run != 'false'
        timeout-minutes: 25
        env:
          OCR_NO_UPDATE: '1'
          TURBO_TOKEN: ''
          TURBO_TEAM: ''
        run: |
          set -euo pipefail
          ocr_package="$(node -p "require('./.github/scripts/ocr-controller.cjs').verifyRelease().manifest.draft.package")"
          ocr_revision="$(node -p "require('./.github/scripts/ocr-controller.cjs').verifyRelease().manifest.draft.publisher.revision")"
          npm install --prefix "${RUNNER_TEMP}/ocr-stock-qualification" "${ocr_package}"
          export OCR_TEST_BINARY="${RUNNER_TEMP}/ocr-stock-qualification/node_modules/.bin/ocr"
          publisher_root="${RUNNER_TEMP}/ocr-stock-publisher"
          git init "${publisher_root}"
          git -C "${publisher_root}" fetch --depth=1 https://github.com/alibaba/open-code-review.git "${ocr_revision}"
          git -C "${publisher_root}" checkout --detach FETCH_HEAD
          export OCR_TEST_PUBLISHER="${publisher_root}/scripts/github-actions/post-review-comments.js"
          export OCR_REQUIRE_STOCK_BINARY=1
          node --test .github/scripts/ocr-controller.test.cjs .github/scripts/ocr-draft-review.test.cjs
      - name: Select OCR engine qualification
        id: ocr_engine
        uses: ./.github/actions/changed-paths
        with:
          pattern: ^\.github/(scripts/install-patched-ocr\.cjs|open-code-review/ocr-compression\.patch|workflows/check(-ocr-final-review)?\.yml)$
      - name: Set up pinned OCR build toolchain
        if: steps.ocr_engine.outputs.should_run != 'false'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.9
          cache: false
      - name: Qualify the pinned OCR compression engine
        timeout-minutes: 25
        if: steps.ocr_engine.outputs.should_run != 'false'
        run: node .github/scripts/install-patched-ocr.cjs "${RUNNER_TEMP}/patched-ocr"
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v3.21.4
      - name: Check Helm chart scheduling contract
        run: |
          node --test deploy/scripts/verify-topology-spread.test.mjs
          node deploy/scripts/verify-topology-spread.mjs
      - name: Check deploy parity across v3 and v3-ai
        if: (github.event_name == 'push' && github.ref_name == 'v3') || (github.event_name == 'pull_request' && github.base_ref == 'v3')
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            node ./.github/scripts/deploy-parity.cjs --other v3-ai --base "$PR_BASE_SHA"
          else
            node ./.github/scripts/deploy-parity.cjs --other v3-ai
          fi
      - name: Check Playwright CI contracts
        run: |
          bash util/reconcile-public-pr-arm64-runner-group.test.sh
          pnpm run check:playwright-ci
          node --test .github/scripts/playwright-pnpm-seed-fallback.test.cjs
          node --test .github/scripts/pnpm-install-retry.test.cjs
          node --test .github/scripts/playwright-resource-sampler.test.cjs
      - name: Check Playwright host launcher
        run: pnpm run check:playwright-host
      - name: Check Next.js development configuration and readiness
        run: |
          node --test ./util/next-pages-development-config.test.mjs
          pnpm run test:dev-runtime
      - name: Check workspace dependency mount generation
        run: node --test ./util/generate-dependency-mounts.test.mjs
      - name: Check file formatting
        shell: bash
        run: pnpm run format:check
      - name: Check syncpack conformity
        shell: bash
        run: pnpm run check:syncpack
      - name: Check linting (Biome, advisory)
        if: github.event_name != 'pull_request' || steps.classify.outputs.codebase_check != 'bounded'
        continue-on-error: true
        shell: bash
        run: pnpm run lint:biome
      - name: Check linting
        if: github.event_name != 'pull_request' || steps.classify.outputs.codebase_check != 'bounded'
        shell: bash
        run: pnpm run lint
      - name: Check Prisma schema sync drift
        if: github.event_name != 'pull_request' || steps.classify.outputs.codebase_check != 'bounded'
        run: pnpm run check:prisma-sync
      - name: Check AGENTS.md command smoke
        run: pnpm run check:agents-md
      - name: Check removed engineering-wiki paths
        run: pnpm run check:removed-doc-artifacts
      - name: Build packages for typecheck (turbo)
        if: github.event_name != 'pull_request' || steps.classify.outputs.codebase_check != 'bounded'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }}
            pnpm exec turbo run build --filter="...[origin/${{ github.base_ref }}...HEAD]"
          else
            pnpm exec turbo run build
          fi
      - name: Check typescript types
        if: github.event_name != 'pull_request' || steps.classify.outputs.codebase_check != 'bounded'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm exec turbo run check --filter="...[origin/${{ github.base_ref }}...HEAD]"
          else
            pnpm exec turbo run check
          fi
      - name: Check unused code and dependencies (knip, advisory)
        if: github.event_name != 'pull_request' || steps.classify.outputs.codebase_check != 'bounded'
        continue-on-error: true
        shell: bash
        run: pnpm run knip
  check:
    name: ${{ (github.event.action != 'labeled' || needs.priority-route.outputs.run_label_event == 'true') && 'check' || 'check (priority not admitted)' }}
    needs:
      - select
      - check-suite
      - priority-route
    if: always() && (github.event.action != 'labeled' || needs.priority-route.outputs.run_label_event == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Report required status
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true }}
          FILTER_RESULT: ${{ needs.select.result }}
          SHOULD_RUN: ${{ needs.select.outputs.should_run }}
          TEST_RESULT: ${{ needs.check-suite.result }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_PATH: .github/workflows/check.yml
          TERMINAL_JOB: check
          EVIDENCE_PATH: required-ci-evidence.json
          SELECTION_JOB: select
          SELECTION_JOB_RESULT: ${{ needs.select.result }}
          SUITE_JOB: check-suite
          SUITE_JOB_RESULT: ${{ needs.check-suite.result }}
        run: node .github/scripts/required-ci-status.cjs report
      - name: Upload required CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: required-ci-evidence
          path: required-ci-evidence.json
          if-no-files-found: error
          retention-days: 7
      - id: priority_result
        if: always()
        env:
          TERMINAL_RESULT: ${{ job.status }}
        run: echo "result=$TERMINAL_RESULT" >> "$GITHUB_OUTPUT"
    outputs:
      required_result: ${{ steps.priority_result.outputs.result }}
