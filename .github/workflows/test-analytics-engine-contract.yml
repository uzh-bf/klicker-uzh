name: Test analytics engine contract

on:
  push:
    branches: ['v3']
    paths:
      - 'packages/analytics-engine-contract/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/test-analytics-engine-contract.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'packages/analytics-engine-contract/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/test-analytics-engine-contract.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  test-analytics-engine-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Define node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: package.json

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.5.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify analytics engine contract
        run: |
          pnpm --filter @klicker-uzh/analytics-engine-contract test
          pnpm --filter @klicker-uzh/analytics-engine-contract check
          pnpm --filter @klicker-uzh/analytics-engine-contract build
