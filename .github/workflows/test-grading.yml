name: Test grading package functionalities

on:
  push:
    branches: ['v3', 'v3*']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  test-grading:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for changes
        id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }} --depth=1
            diff=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          else
            diff=$(git diff --name-only HEAD~1...HEAD || true)
          fi
          echo "Files changed:"
          echo "$diff"

          if echo "$diff" | grep -qE '^(packages/grading/|package\.json|pnpm-lock\.yaml|tsconfig\.json|\.github/workflows/test-grading\.yml)'; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - uses: pnpm/action-setup@v4
        if: steps.filter.outputs.should_run == 'true'
        with:
          version: 11.5.0
          run_install: true

      - name: Build types package
        if: steps.filter.outputs.should_run == 'true'
        shell: bash
        run: |
          cd packages/prisma
          pnpm run build
          cd ../types
          pnpm run build

      - name: Test grading package
        if: steps.filter.outputs.should_run == 'true'
        shell: bash
        run: |
          cd packages/grading
          pnpm run test
