name: Test lightweight unit suites

on:
  workflow_dispatch:
  push:
    branches: ['v3', 'v3*']
  pull_request:
    # "edited" re-evaluates the internal selector on a base retarget; the path
    # filter is a job below so a required status always reports.
    types: [opened, synchronize, reopened, ready_for_review, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check for changes
        id: check
        uses: ./.github/actions/changed-paths
        with:
          pattern: '^(apps/frontend-pwa/|apps/chat/|packages/grading/|packages/graphql/|packages/i18n/|packages/markdown/|packages/next-config/|packages/prisma/|packages/shared-components/|packages/types/|packages/util/|\.devcontainer/disposable-test-init\.sql$|\.github/scripts/provision-disposable-postgres\.sh$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|turbo\.json$|tsconfig\.json$|\.github/workflows/test-unit\.yml$|\.github/scripts/ci-equivalent-run\.cjs$|\.github/actions/setup-node-pnpm/|\.github/actions/changed-paths/|\.github/scripts/required-ci-status\.cjs$)'

  equivalent-validation:
    # First attempts keep one runner allocation; reuse lookup is for reruns.
    if: github.event_name == 'push' && github.ref != 'refs/heads/v3' && github.run_attempt > 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      duplicate_run_id: ${{ steps.equivalent.outputs.duplicate_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - id: equivalent
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await require('./.github/scripts/ci-equivalent-run.cjs').reportEquivalentRun({
              github, context, core, kind: 'unit',
            })

  test-unit:
    needs: [equivalent-validation, filter]
    if: >-
      !cancelled() &&
      needs.equivalent-validation.outputs.duplicate_run_id == '' &&
      needs.filter.outputs.should_run == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: klicker
          POSTGRES_PASSWORD: klicker
          POSTGRES_DB: klicker-prod
        options: >-
          --health-cmd "pg_isready -U klicker -d klicker-prod"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Record tested source tree
        continue-on-error: true
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SOURCE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CONTROL_SHA: ${{ github.workflow_sha }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const { execFileSync } = require('node:child_process')
          fs.writeFileSync('ci-validation-receipt.json', JSON.stringify({
            schemaVersion: 1,
            event: process.env.GITHUB_EVENT_NAME,
            runId: Number(process.env.GITHUB_RUN_ID),
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            headSha: process.env.SOURCE_HEAD_SHA,
            baseSha: process.env.SOURCE_BASE_SHA,
            controlSha: process.env.CONTROL_SHA,
            treeSha: execFileSync('git', ['-c', `safe.directory=${process.env.GITHUB_WORKSPACE}`, 'rev-parse', 'HEAD^{tree}'], { encoding: 'utf8' }).trim(),
          }))
          NODE

      - name: Upload tested source receipt
        continue-on-error: true
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ci-validation-receipt
          path: ci-validation-receipt.json
          retention-days: 7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Set up Node.js with pnpm cache
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Prisma disposable guard
        run: pnpm --filter @klicker-uzh/prisma test:disposable

      - name: Build unit-test dependencies
        id: build
        shell: bash
        run: pnpm exec turbo run build --filter=@klicker-uzh/prisma --filter=@klicker-uzh/types --filter=@klicker-uzh/grading --filter=@klicker-uzh/util --concurrency=4

      - name: Provision disposable PostgreSQL
        id: provision_db
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bash .github/scripts/provision-disposable-postgres.sh "${{ job.services.postgres.id }}"

      - name: Setup chat test database
        id: setup_chat_db
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.provision_db.outcome == 'success' }}
        run: pnpm --filter @klicker-uzh/prisma run prisma:reset:raw --force
        env:
          DATABASE_URL: postgresql://klicker_test:klicker@localhost:5432/klicker_test
          SHADOW_DATABASE_URL: postgresql://klicker_test:klicker@localhost:5432/klicker_test_shadow

      - name: Test chat app
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.setup_chat_db.outcome == 'success' }}
        run: pnpm --filter @klicker-uzh/chat test:run
        env:
          CHAT_ACCOUNT_USAGE_INTEGRATION: '1'
          CHAT_ACCOUNT_USAGE_ENFORCEMENT_ENABLED: 'false'
          DATABASE_URL: postgresql://klicker_test:klicker@localhost:5432/klicker_test
          SHADOW_DATABASE_URL: postgresql://klicker_test:klicker@localhost:5432/klicker_test_shadow

      - name: Test frontend PWA
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @klicker-uzh/frontend-pwa test:run

      - name: Test grading package
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @klicker-uzh/grading test

      - name: Test markdown package
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @klicker-uzh/markdown test

      - name: Test util package
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @klicker-uzh/util test

  # Always reports a status even when the path filter selects nothing, so this
  # job is the required check. It runs unconditionally: GitHub can treat a
  # skipped required check as acceptable, so a draft, an unexpected skip, a
  # cancellation, a failed suite or a missing selection must fail inside it.
  test-unit-status:
    needs: [equivalent-validation, filter, test-unit]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Report required status
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true }}
          FILTER_RESULT: ${{ needs.filter.result }}
          SHOULD_RUN: ${{ needs.filter.outputs.should_run }}
          DUPLICATE_RUN_ID: ${{ needs.equivalent-validation.outputs.duplicate_run_id }}
          TEST_RESULT: ${{ needs.test-unit.result }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_PATH: .github/workflows/test-unit.yml
          TERMINAL_JOB: test-unit-status
          STAGING_SOURCE_BRANCH: ${{ vars.STG_SOURCE_BRANCH }}
          EVIDENCE_PATH: required-ci-evidence.json
          SELECTION_JOB: filter
          SELECTION_JOB_RESULT: ${{ needs.filter.result }}
          SUITE_JOB: test-unit
          SUITE_JOB_RESULT: ${{ needs.test-unit.result }}
        run: node .github/scripts/required-ci-status.cjs report
      - name: Upload required CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: required-ci-evidence
          path: required-ci-evidence.json
          if-no-files-found: error
          retention-days: 7
