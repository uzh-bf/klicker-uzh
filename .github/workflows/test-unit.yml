name: Mistral OCR live smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mistral-ocr-smoke:
    if: github.ref == 'refs/heads/rs/ocr-mistral-live-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned OCR without upstream credentials
        env:
          OCR_NO_UPDATE: '1'
        run: |
          npm install -g @alibaba-group/open-code-review@1.13.0
          ocr version
      - name: Run bounded synthetic Mistral qualification
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OCR_NO_UPDATE: '1'
        run: |
          umask 077
          node <<'NODE'
          const assert = require('node:assert/strict')
          const fs = require('node:fs')
          const path = require('node:path')
          const { spawn, execFileSync } = require('node:child_process')
          const helper = require('./.github/scripts/final-ai-review.js')
          const { startAdapter, callMistral, MISTRAL_MODEL, MISTRAL_URL } = require('./.github/scripts/ocr-mistral-adapter.cjs')
          const receipt = { source_sha: process.env.GITHUB_SHA, model: MISTRAL_MODEL, reasoning_effort: 'max', requests: 0, statuses: [], assistant_replays: 0 }
          let phase = 'tool_canary'
          let blocked = false
          const schemaFields = new Set(['body', 'messages', 'content', 'role', 'tool_calls', 'tool_call_id', 'function', 'name', 'arguments', 'id', 'index', 'type', 'thinking', 'text', 'signature', 'closed', 'prefix', 'reasoning_content', 'AssistantMessage', 'ToolMessage', 'UserMessage', 'SystemMessage', 'TextChunk', 'ThinkChunk', 'tools', 'model', 'response_format', 'json_schema', 'schema', 'strict'])
          const errorTypes = new Set(['missing', 'extra_forbidden', 'string_type', 'list_type', 'dict_type', 'literal_error', 'union_tag_invalid', 'union_tag_not_found', 'value_error', 'model_attributes_type', 'enum', 'json_invalid', 'string_pattern_mismatch', 'string_too_short', 'string_too_long'])
          function safeField(value) { return Number.isInteger(value) ? value : schemaFields.has(value) ? value : '_other' }
          function shape(message) {
            const content = message.content
            return { role: ['assistant', 'tool', 'user', 'system'].includes(message.role) ? message.role : '_other', fields: Object.keys(message).map(safeField), content_type: content === null ? 'null' : Array.isArray(content) ? 'array' : typeof content, chunks: Array.isArray(content) ? content.map(chunk => ({ type: ['thinking', 'text', 'image_url'].includes(chunk.type) ? chunk.type : '_other', fields: Object.keys(chunk).map(safeField) })) : undefined, tool_calls: message.tool_calls?.map(call => ({ fields: Object.keys(call).map(safeField), argument_type: typeof call.function?.arguments })) }
          }
          async function validationDiagnostics(response, body) {
            const reader = response.clone().body.getReader()
            const chunks = []
            let bytes = 0
            for (;;) {
              const { done, value } = await reader.read()
              if (done) break
              bytes += value.length
              if (bytes > 65536) { reader.cancel().catch(() => {}); return { truncated: true } }
              chunks.push(Buffer.from(value))
            }
            let payload
            try { payload = JSON.parse(Buffer.concat(chunks).toString('utf8')) } catch { return { non_json: true } }
            const details = Array.isArray(payload.detail) ? payload.detail : []
            return { errors: details.slice(0, 20).map(item => ({ location: Array.isArray(item.loc) ? item.loc.map(safeField) : [], type: errorTypes.has(item.type) ? item.type : '_other' })), detail_type: Array.isArray(payload.detail) ? 'array' : typeof payload.detail, messages: body.messages.map(shape) }
          }
          async function fetchImpl(url, init) {
            assert.equal(url, MISTRAL_URL)
            if (blocked || receipt.requests >= 8) throw new Error('smoke_admission_closed')
            const body = JSON.parse(init.body)
            assert.equal(body.model, MISTRAL_MODEL)
            assert.equal(body.reasoning_effort, 'max')
            receipt.requests += 1
            receipt.assistant_replays += body.messages.filter(message => message.role === 'assistant').length
            try {
              const response = await fetch(url, init)
              receipt.statuses.push(response.status)
              if (!response.ok) {
                blocked = true
                if (response.status === 422) receipt.validation = await validationDiagnostics(response, body)
              }
              return response
            } catch (error) {
              blocked = true
              throw error
            }
          }
          async function main() {
            await helper.verifyMistralToolAccess({ token: process.env.MISTRAL_API_KEY, fetchImpl })
            receipt.tool_canary = 'passed'
            phase = 'ocr'
            helper.writeOCRConfig()
            const repo = path.join(process.env.RUNNER_TEMP, 'ocr-synthetic-source')
            fs.mkdirSync(repo)
            function git(args) { return execFileSync('git', args, { cwd: repo, encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] }).trim() }
            git(['init', '-q'])
            git(['config', 'user.name', 'Synthetic Fixture'])
            git(['config', 'user.email', 'fixture@example.invalid'])
            const fixture = path.join(repo, 'total.js')
            fs.writeFileSync(fixture, 'export function total(quantity, unitPrice) {\n  return quantity * unitPrice\n}\n')
            git(['add', 'total.js'])
            git(['commit', '-qm', 'chore: initialize synthetic fixture'])
            const base = git(['rev-parse', 'HEAD'])
            fs.writeFileSync(fixture, 'export function total(quantity, unitPrice) {\n  return quantity + unitPrice\n}\n')
            git(['add', 'total.js'])
            git(['commit', '-qm', 'fix: introduce synthetic arithmetic regression'])
            const head = git(['rev-parse', 'HEAD'])
            const adapter = await startAdapter({ apiKey: process.env.MISTRAL_API_KEY, fetchImpl })
            let resultText = ''
            let timedOut = false
            const childEnv = { ...process.env, OCR_LLM_URL: `${adapter.url}/v1/chat/completions`, OCR_LLM_TOKEN: adapter.token, OCR_LLM_MODEL: MISTRAL_MODEL, OCR_LLM_PROTOCOL: 'openai', OCR_USE_ANTHROPIC: 'false' }
            delete childEnv.MISTRAL_API_KEY
            const child = spawn('ocr', ['review', '--repo', repo, '--from', base, '--to', head, '--audience', 'agent', '--effort', 'low', '--timeout', '3', '--concurrency', '1', '--max-tokens-budget', '30000', '--format', 'json', '--rule', path.resolve('.github/open-code-review/final-review-rules.json'), '--background', 'Public synthetic fixture: total computes an order value as quantity multiplied by unit price. Review the arithmetic change.'], { env: childEnv, stdio: ['ignore', 'pipe', 'ignore'] })
            child.stdout.on('data', chunk => { resultText += chunk })
            const timer = setTimeout(() => { timedOut = true; child.kill('SIGTERM') }, 180000)
            const killTimer = setTimeout(() => child.kill('SIGKILL'), 190000)
            try {
              const exitCode = await new Promise((resolve, reject) => { child.on('error', reject); child.on('close', resolve) })
              receipt.ocr_exit_code = exitCode
              receipt.ocr_timed_out = timedOut
              const produced = JSON.parse(resultText)
              receipt.ocr_producer_status = produced.status
              receipt.ocr_budget_exceeded = produced.summary?.budget_exceeded ?? false
              assert.equal(timedOut, false)
              assert.equal(exitCode, 0)
              phase = 'ocr_result'
              receipt.ocr_tokens = Number.isSafeInteger(produced.summary?.total_tokens) ? produced.summary.total_tokens : null
              receipt.findings = Array.isArray(produced.comments) ? produced.comments.length : null
              let result
              try { result = helper.validateOCRResult(produced) } catch (error) {
                receipt.result_validation_error = /^(?:OCR result|OCR exhausted|Complete OCR result|Finding [1-9][0-9]{0,2}) [a-zA-Z0-9 ;]+$/.test(error.message) ? error.message : 'unclassified_result_validation'
                throw error
              }
              assert.equal(result.summary.files_reviewed, 1)
              assert.ok(result.summary.total_tokens <= 30000)
              assert.ok(result.comments.some(comment => comment.path === 'total.js'))
              receipt.ocr = 'passed'
              receipt.coverage = { completed: result.manifest.coverage.completed.length, failed: result.manifest.coverage.failed.length }
              receipt.ocr_tokens = result.summary.total_tokens
              receipt.findings = result.comments.length
              receipt.ocr_tool_calls = result.tool_calls.total
            } finally {
              clearTimeout(timer)
              clearTimeout(killTimer)
              await adapter.close()
              receipt.adapter_closed = true
            }
            phase = 'structured_output'
            const structured = await callMistral({ apiKey: process.env.MISTRAL_API_KEY, fetchImpl, timeoutMs: 60000, body: { model: MISTRAL_MODEL, max_tokens: 2048, messages: [{ role: 'user', content: 'Return the object with ok set to true.' }], response_format: { type: 'json_schema', json_schema: { name: 'ocr_live_smoke', strict: true, schema: { type: 'object', properties: { ok: { type: 'boolean' } }, required: ['ok'], additionalProperties: false } } } } })
            assert.equal(structured.choices[0].finish_reason, 'stop')
            assert.deepEqual(JSON.parse(structured.choices[0].message.content), { ok: true })
            receipt.structured_output = 'passed'
            receipt.status = 'passed'
          }
          main().catch(error => {
            receipt.status = 'failed'
            receipt.failed_phase = phase
            receipt.error_code = error.code ?? 'validation_failed'
            if (Number.isInteger(error.status)) receipt.http_status = error.status
            process.exitCode = 1
          }).finally(() => {
            helper.removeOCRConfig()
            const output = JSON.stringify(receipt)
            console.log(output)
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\nSynthetic Mistral OCR receipt:\n\n\`\`\`json\n${output}\n\`\`\`\n`)
          })
          NODE
      - name: Remove ephemeral OCR configuration
        if: always()
        run: node .github/scripts/final-ai-review.js cleanup-ocr
