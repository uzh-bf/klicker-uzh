name: Final AI review

on:
  pull_request_target:
    types:
      [
        opened,
        synchronize,
        reopened,
        edited,
        closed,
        ready_for_review,
        converted_to_draft,
      ]
  issue_comment:
    types: [created]

jobs:
  initialize:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: final-ai-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Checkout trusted final-review policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Initialize final-review status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_BRANCH: ${{ vars.STG_SOURCE_BRANCH || 'v3' }}
        with:
          github-token: ${{ github.token }}
          script: |
            const helper = require('./.github/scripts/final-ai-review.js')
            await helper.initializeFinalReview({
              github,
              context,
              core,
              sourceBranch: process.env.SOURCE_BRANCH,
            })

  authorize:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/final-review'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
      statuses: read
      actions: read
    outputs:
      authorized: ${{ steps.authorize.outputs.authorized }}
      pr_number: ${{ steps.authorize.outputs.pr_number }}
      base_sha: ${{ steps.authorize.outputs.base_sha }}
      head_sha: ${{ steps.authorize.outputs.head_sha }}
      mode: ${{ steps.authorize.outputs.mode }}
      root_head: ${{ steps.authorize.outputs.root_head }}
      root_review_id: ${{ steps.authorize.outputs.root_review_id }}
      rules_digest: ${{ steps.authorize.outputs.rules_digest }}
      background_digest: ${{ steps.authorize.outputs.background_digest }}
      scope_kind: ${{ steps.authorize.outputs.scope_kind }}
      stack_id: ${{ steps.authorize.outputs.stack_id }}
      stack_position: ${{ steps.authorize.outputs.stack_position }}
      stack_order_digest: ${{ steps.authorize.outputs.stack_order_digest }}
      disposition_digest: ${{ steps.authorize.outputs.disposition_digest }}
      background: ${{ steps.authorize.outputs.background }}
    steps:
      - name: Checkout trusted final-review policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Authorize final review
        id: authorize
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const helper = require('./.github/scripts/final-ai-review.js')
            await helper.authorizeFinalReview({ github, context, core })

  review:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: final-ai-review-${{ needs.authorize.outputs.pr_number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
      pull-requests: write
      statuses: write
      actions: read
    steps:
      - name: Checkout trusted final-review implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted helper
        run: node --test .github/scripts/final-ai-review.test.js

      - name: Start final review
        id: start
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.authorize.outputs.pr_number }}
          BASE_SHA: ${{ needs.authorize.outputs.base_sha }}
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
          REVIEW_MODE: ${{ needs.authorize.outputs.mode }}
          ROOT_HEAD: ${{ needs.authorize.outputs.root_head }}
          ROOT_REVIEW_ID: ${{ needs.authorize.outputs.root_review_id }}
          RULES_DIGEST: ${{ needs.authorize.outputs.rules_digest }}
          BACKGROUND_DIGEST: ${{ needs.authorize.outputs.background_digest }}
          SCOPE_KIND: ${{ needs.authorize.outputs.scope_kind }}
          STACK_ID: ${{ needs.authorize.outputs.stack_id }}
          STACK_POSITION: ${{ needs.authorize.outputs.stack_position }}
          STACK_ORDER_DIGEST: ${{ needs.authorize.outputs.stack_order_digest }}
          DISPOSITION_DIGEST: ${{ needs.authorize.outputs.disposition_digest }}
        with:
          github-token: ${{ github.token }}
          script: |
            const helper = require('./.github/scripts/final-ai-review.js')
            const shouldRun = await helper.startFinalReview({
              github,
              context,
              prNumber: Number(process.env.PR_NUMBER),
              baseSha: process.env.BASE_SHA,
              headSha: process.env.HEAD_SHA,
              mode: process.env.REVIEW_MODE,
              rootHead: process.env.ROOT_HEAD,
              rootReviewId: process.env.ROOT_REVIEW_ID,
              rulesDigest: process.env.RULES_DIGEST,
              backgroundDigest: process.env.BACKGROUND_DIGEST,
              scopeKind: process.env.SCOPE_KIND,
              stackId: process.env.STACK_ID,
              stackPosition: process.env.STACK_POSITION,
              stackOrderDigest: process.env.STACK_ORDER_DIGEST,
              dispositionDigest: process.env.DISPOSITION_DIGEST,
              core,
            })
            core.setOutput('run_review', String(shouldRun))

      - name: Resolve immutable review range
        id: range
        if: steps.start.outputs.run_review == 'true'
        env:
          PR_NUMBER: ${{ needs.authorize.outputs.pr_number }}
          BASE_SHA: ${{ needs.authorize.outputs.base_sha }}
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
          REVIEW_MODE: ${{ needs.authorize.outputs.mode }}
          ROOT_HEAD: ${{ needs.authorize.outputs.root_head }}
        run: |
          set -euo pipefail
          [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]]
          [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${REVIEW_MODE}" == "full" || "${REVIEW_MODE}" == "incremental" ]]
          [[ "${ROOT_HEAD}" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "pull/${PR_NUMBER}/head"
          test "$(git rev-parse FETCH_HEAD)" = "${HEAD_SHA}"
          if [[ "${REVIEW_MODE}" == "incremental" ]]; then
            REVIEW_FROM="${ROOT_HEAD}"
          else
            git cat-file -e "${BASE_SHA}^{commit}"
            REVIEW_FROM="$(git merge-base "${BASE_SHA}" "${HEAD_SHA}")"
          fi
          git cat-file -e "${REVIEW_FROM}^{commit}"
          [[ "${REVIEW_FROM}" =~ ^[0-9a-f]{40}$ ]]
          echo "review_from=${REVIEW_FROM}" >>"${GITHUB_OUTPUT}"

      - name: Install pinned OpenCodeReview CLI
        if: steps.start.outputs.run_review == 'true'
        run: |
          npm install -g @alibaba-group/open-code-review@1.9.10
          ocr version

      - name: Configure ephemeral OpenRouter access
        id: configure
        if: steps.start.outputs.run_review == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "${OPENROUTER_API_KEY}" |
            node .github/scripts/final-ai-review.js configure-ocr

      - name: Run final review
        id: run_review
        if: steps.start.outputs.run_review == 'true'
        env:
          BACKGROUND: ${{ steps.start.outputs.background }}
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
          REVIEW_FROM: ${{ steps.range.outputs.review_from }}
          RESULT_PATH: ${{ runner.temp }}/final-ai-review-result.json
          STDERR_PATH: ${{ runner.temp }}/final-ai-review-stderr.log
        run: |
          set -euo pipefail
          ocr review \
            --from "${REVIEW_FROM}" \
            --to "${HEAD_SHA}" \
            --audience agent \
            --format json \
            --background "${BACKGROUND}" \
            --rule .github/open-code-review/final-review-rules.json \
            >"${RESULT_PATH}" 2>"${STDERR_PATH}"

      - name: Remove ephemeral OpenRouter access
        id: cleanup
        if: always() && steps.configure.outcome == 'success'
        run: node .github/scripts/final-ai-review.js cleanup-ocr

      - name: Publish consolidated final review
        id: publish
        if: >-
          steps.run_review.outcome == 'success' &&
          steps.cleanup.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.authorize.outputs.pr_number }}
          BASE_SHA: ${{ needs.authorize.outputs.base_sha }}
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
          REVIEW_MODE: ${{ needs.authorize.outputs.mode }}
          ROOT_HEAD: ${{ needs.authorize.outputs.root_head }}
          ROOT_REVIEW_ID: ${{ needs.authorize.outputs.root_review_id }}
          RULES_DIGEST: ${{ needs.authorize.outputs.rules_digest }}
          BACKGROUND_DIGEST: ${{ needs.authorize.outputs.background_digest }}
          SCOPE_KIND: ${{ needs.authorize.outputs.scope_kind }}
          STACK_ID: ${{ needs.authorize.outputs.stack_id }}
          STACK_POSITION: ${{ needs.authorize.outputs.stack_position }}
          STACK_ORDER_DIGEST: ${{ needs.authorize.outputs.stack_order_digest }}
          DISPOSITION_DIGEST: ${{ needs.authorize.outputs.disposition_digest }}
          RESULT_PATH: ${{ runner.temp }}/final-ai-review-result.json
        with:
          github-token: ${{ github.token }}
          script: |
            const helper = require('./.github/scripts/final-ai-review.js')
            const url = await helper.publishFinalReview({
              github,
              context,
              prNumber: Number(process.env.PR_NUMBER),
              baseSha: process.env.BASE_SHA,
              headSha: process.env.HEAD_SHA,
              mode: process.env.REVIEW_MODE,
              rootHead: process.env.ROOT_HEAD,
              rootReviewId: process.env.ROOT_REVIEW_ID,
              rulesDigest: process.env.RULES_DIGEST,
              backgroundDigest: process.env.BACKGROUND_DIGEST,
              scopeKind: process.env.SCOPE_KIND,
              stackId: process.env.STACK_ID,
              stackPosition: process.env.STACK_POSITION,
              stackOrderDigest: process.env.STACK_ORDER_DIGEST,
              dispositionDigest: process.env.DISPOSITION_DIGEST,
              resultPath: process.env.RESULT_PATH,
            })
            core.info(`Published ${url}`)

      - name: Finalize exact-head status
        if: always() && steps.start.outputs.run_review == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.authorize.outputs.pr_number }}
          BASE_SHA: ${{ needs.authorize.outputs.base_sha }}
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
          SCOPE_KIND: ${{ needs.authorize.outputs.scope_kind }}
          STACK_ID: ${{ needs.authorize.outputs.stack_id }}
          STACK_POSITION: ${{ needs.authorize.outputs.stack_position }}
          STACK_ORDER_DIGEST: ${{ needs.authorize.outputs.stack_order_digest }}
          REVIEW_OUTCOME: ${{ steps.run_review.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        with:
          github-token: ${{ github.token }}
          script: |
            const helper = require('./.github/scripts/final-ai-review.js')
            await helper.finalizeFinalReview({
              github,
              context,
              prNumber: Number(process.env.PR_NUMBER),
              baseSha: process.env.BASE_SHA,
              headSha: process.env.HEAD_SHA,
              scopeKind: process.env.SCOPE_KIND,
              stackId: process.env.STACK_ID,
              stackPosition: process.env.STACK_POSITION,
              stackOrderDigest: process.env.STACK_ORDER_DIGEST,
              reviewOutcome: process.env.REVIEW_OUTCOME,
              cleanupOutcome: process.env.CLEANUP_OUTCOME,
              publishOutcome: process.env.PUBLISH_OUTCOME,
            })
