name: Final AI review

on:
  pull_request_target:
    types:
      [
        opened,
        synchronize,
        reopened,
        edited,
        closed,
        ready_for_review,
        converted_to_draft,
      ]
  issue_comment:
    types: [created]

jobs:
  trusted_policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      trusted_sha: ${{ steps.resolve.outputs.trusted_sha }}
    steps:
      - name: Resolve trusted default-branch commit
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const workflowSha = process.env.GITHUB_WORKFLOW_SHA
            if (!/^[0-9a-f]{40}$/.test(workflowSha ?? '')) {
              core.setFailed('Workflow definition commit is missing')
              return
            }
            const response = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: workflowSha,
            })
            const sha = response.data?.sha
            if (sha !== workflowSha) {
              core.setFailed('Workflow definition commit could not be verified')
              return
            }
            core.setOutput('trusted_sha', workflowSha)

  resolve_lock:
    needs: trusted_policy
    if: >-
      needs.trusted_policy.result == 'success' &&
      github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      lock_key: ${{ steps.resolve.outputs.lock_key }}
    steps:
      - name: Checkout trusted final-review policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trusted_policy.outputs.trusted_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Resolve status-lock identity
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const helper = require('./.github/scripts/final-ai-review.js')
            const lockKey = await helper.resolveFinalReviewLockKey({
              github,
              context,
              pullNumber: context.payload.pull_request.number,
              pull: context.payload.pull_request,
            })
            core.setOutput('lock_key', lockKey)

  initialize:
    needs: [trusted_policy, resolve_lock]
    if: >-
      needs.trusted_policy.result == 'success' &&
      needs.resolve_lock.result == 'success' &&
      github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: final-ai-status-lock-${{ needs.resolve_lock.outputs.lock_key }}
      cancel-in-progress: false
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Checkout trusted final-review policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trusted_policy.outputs.trusted_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Initialize final-review status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_BRANCH: ${{ vars.STG_SOURCE_BRANCH || 'v3' }}
          TRUSTED_SHA: ${{ needs.trusted_policy.outputs.trusted_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const helper = require('./.github/scripts/final-ai-review.js')
            await helper.initializeFinalReview({
              github,
              context,
              core,
              sourceBranch: process.env.SOURCE_BRANCH,
              trustedSha: process.env.TRUSTED_SHA,
            })

  initialize_stack:
    needs: [trusted_policy, resolve_lock]
    if: >-
      needs.trusted_policy.result == 'success' &&
      needs.resolve_lock.result == 'success' &&
      github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: final-ai-status-lock-${{ needs.resolve_lock.outputs.lock_key }}
      cancel-in-progress: false
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Checkout trusted stack-review policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trusted_policy.outputs.trusted_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Re-resolve stack and invalidate top status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TRUSTED_SHA: ${{ needs.trusted_policy.outputs.trusted_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const helper = require('./.github/scripts/final-ai-stack-review.js')
            await helper.initializeStackReview({
              github,
              context,
              trustedSha: process.env.TRUSTED_SHA,
            })

  authorize:
    needs: trusted_policy
    if: >-
      needs.trusted_policy.result == 'success' &&
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/final-review'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      issues: read
      pull-requests: read
      statuses: read
      actions: read
    outputs:
      authorized: ${{ steps.authorize.outputs.authorized }}
      pr_number: ${{ steps.authorize.outputs.pr_number }}
      base_sha: ${{ steps.authorize.outputs.base_sha }}
      head_sha: ${{ steps.authorize.outputs.head_sha }}
      trusted_sha: ${{ steps.authorize.outputs.trusted_sha }}
      mode: ${{ steps.authorize.outputs.mode }}
      root_head: ${{ steps.authorize.outputs.root_head }}
      root_review_id: ${{ steps.authorize.outputs.root_review_id }}
      policy_digest: ${{ steps.authorize.outputs.policy_digest }}
      background_digest: ${{ steps.authorize.outputs.background_digest }}
      scope_kind: ${{ steps.authorize.outputs.scope_kind }}
      stack_id: ${{ steps.authorize.outputs.stack_id }}
      stack_position: ${{ steps.authorize.outputs.stack_position }}
      stack_order_digest: ${{ steps.authorize.outputs.stack_order_digest }}
      disposition_digest: ${{ steps.authorize.outputs.disposition_digest }}
      disposition_ids: ${{ steps.authorize.outputs.disposition_ids }}
      status_lock_key: ${{ steps.authorize.outputs.status_lock_key }}
      background: ${{ steps.authorize.outputs.background }}
    steps:
      - name: Checkout trusted final-review policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trusted_policy.outputs.trusted_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Authorize final review
        id: authorize
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TRUSTED_SHA: ${{ needs.trusted_policy.outputs.trusted_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const helper = require('./.github/scripts/final-ai-review.js')
            await helper.authorizeFinalReview({
              github,
              context,
              core,
              trustedSha: process.env.TRUSTED_SHA,
            })

  start:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: final-ai-status-lock-${{ needs.authorize.outputs.status_lock_key }}
      cancel-in-progress: false
    permissions:
      contents: read
      checks: read
      pull-requests: read
      statuses: write
      actions: read
    outputs:
      run_review: ${{ steps.start.outputs.run_review }}
      background: ${{ steps.start.outputs.background }}
    steps:
      - name: Checkout trusted final-review implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.trusted_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Start final review
        id: start
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.authorize.outputs.pr_number }}
          BASE_SHA: ${{ needs.authorize.outputs.base_sha }}
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
          REVIEW_MODE: ${{ needs.authorize.outputs.mode }}
          ROOT_HEAD: ${{ needs.authorize.outputs.root_head }}
          ROOT_REVIEW_ID: ${{ needs.authorize.outputs.root_review_id }}
          POLICY_DIGEST: ${{ needs.authorize.outputs.policy_digest }}
          BACKGROUND_DIGEST: ${{ needs.authorize.outputs.background_digest }}
          SCOPE_KIND: ${{ needs.authorize.outputs.scope_kind }}
          STACK_ID: ${{ needs.authorize.outputs.stack_id }}
          STACK_POSITION: ${{ needs.authorize.outputs.stack_position }}
          STACK_ORDER_DIGEST: ${{ needs.authorize.outputs.stack_order_digest }}
          DISPOSITION_DIGEST: ${{ needs.authorize.outputs.disposition_digest }}
          TRUSTED_SHA: ${{ needs.authorize.outputs.trusted_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const helper = require('./.github/scripts/final-ai-review.js')
            const shouldRun = await helper.startFinalReview({
              github,
              context,
              prNumber: Number(process.env.PR_NUMBER),
              baseSha: process.env.BASE_SHA,
              headSha: process.env.HEAD_SHA,
              mode: process.env.REVIEW_MODE,
              rootHead: process.env.ROOT_HEAD,
              rootReviewId: process.env.ROOT_REVIEW_ID,
              policyDigest: process.env.POLICY_DIGEST,
              backgroundDigest: process.env.BACKGROUND_DIGEST,
              scopeKind: process.env.SCOPE_KIND,
              stackId: process.env.STACK_ID,
              stackPosition: process.env.STACK_POSITION,
              stackOrderDigest: process.env.STACK_ORDER_DIGEST,
              dispositionDigest: process.env.DISPOSITION_DIGEST,
              trustedSha: process.env.TRUSTED_SHA,
              core,
            })
            core.setOutput('run_review', String(shouldRun))

  review:
    needs: [authorize, start]
    if: >-
      needs.authorize.outputs.authorized == 'true' &&
      needs.start.outputs.run_review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: final-ai-review-${{ needs.authorize.outputs.pr_number }}
      cancel-in-progress: true
    permissions:
      contents: read
      issues: read
      pull-requests: write
      actions: read
    outputs:
      review_outcome: ${{ steps.run_review.outcome }}
      cleanup_outcome: ${{ steps.cleanup.outcome }}
      publish_outcome: ${{ steps.publish.outcome }}
      clean_review: ${{ steps.publish.outputs.clean_review }}
    steps:
      - name: Checkout trusted final-review implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.trusted_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted helper
        env:
          TRUSTED_SHA: ${{ needs.authorize.outputs.trusted_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TRUSTED_SHA}"
          node --test .github/scripts/final-ai-review.test.js

      - name: Resolve immutable review range
        id: range
        if: needs.start.outputs.run_review == 'true'
        env:
          PR_NUMBER: ${{ needs.authorize.outputs.pr_number }}
          BASE_SHA: ${{ needs.authorize.outputs.base_sha }}
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
          REVIEW_MODE: ${{ needs.authorize.outputs.mode }}
          ROOT_HEAD: ${{ needs.authorize.outputs.root_head }}
        run: |
          set -euo pipefail
          [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]]
          [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${REVIEW_MODE}" == "full" || "${REVIEW_MODE}" == "incremental" ]]
          [[ "${ROOT_HEAD}" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "pull/${PR_NUMBER}/head"
          test "$(git rev-parse FETCH_HEAD)" = "${HEAD_SHA}"
          if [[ "${REVIEW_MODE}" == "incremental" ]]; then
            REVIEW_FROM="${ROOT_HEAD}"
          else
            git cat-file -e "${BASE_SHA}^{commit}"
            REVIEW_FROM="$(git merge-base "${BASE_SHA}" "${HEAD_SHA}")"
          fi
          git cat-file -e "${REVIEW_FROM}^{commit}"
          [[ "${REVIEW_FROM}" =~ ^[0-9a-f]{40}$ ]]
          echo "review_from=${REVIEW_FROM}" >>"${GITHUB_OUTPUT}"

      - name: Install pinned OpenCodeReview CLI
        if: needs.start.outputs.run_review == 'true'
        run: |
          npm install -g @alibaba-group/open-code-review@1.9.10
          ocr version

      - name: Configure ephemeral OpenRouter access
        id: configure
        if: needs.start.outputs.run_review == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OCR_CONFIG_PATH: ${{ runner.temp }}/final-ai-review-ocr-config.json
        run: |
          set -euo pipefail
          printf '%s' "${OPENROUTER_API_KEY}" |
            node .github/scripts/final-ai-review.js configure-ocr
          test -s "${OCR_CONFIG_PATH}"

      - name: Run final review
        id: run_review
        if: needs.start.outputs.run_review == 'true'
        env:
          BACKGROUND: ${{ needs.start.outputs.background }}
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
          OCR_CONFIG_PATH: ${{ runner.temp }}/final-ai-review-ocr-config.json
          OCR_LLM_URL: https://openrouter.ai/api/v1/chat/completions
          OCR_LLM_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
          OCR_LLM_MODEL: z-ai/glm-5.3-flash
          REVIEW_FROM: ${{ steps.range.outputs.review_from }}
          RESULT_PATH: ${{ runner.temp }}/final-ai-review-result.json
          STDERR_PATH: ${{ runner.temp }}/final-ai-review-stderr.log
        run: |
          set -euo pipefail
          ocr review \
            --from "${REVIEW_FROM}" \
            --to "${HEAD_SHA}" \
            --audience agent \
            --format json \
            --background "${BACKGROUND}" \
            --rule .github/open-code-review/final-review-rules.json \
            >"${RESULT_PATH}" 2>"${STDERR_PATH}"

      - name: Summarize final review failure output
        if: failure() && steps.run_review.outcome == 'failure'
        env:
          RESULT_PATH: ${{ runner.temp }}/final-ai-review-result.json
          STDERR_PATH: ${{ runner.temp }}/final-ai-review-stderr.log
        run: |
          set -euo pipefail
          echo '::group::Final review CLI failure output'
          cat "${STDERR_PATH}" 2>/dev/null || echo 'stderr log was not created'
          echo '::endgroup::'
          if [[ -f "${RESULT_PATH}" ]]; then
            echo '::group::Final review CLI result JSON'
            cat "${RESULT_PATH}"
            echo
            echo '::endgroup::'
          fi
          {
            echo '### Final review CLI failure'
            echo
            echo '```text'
            if [[ -f "${STDERR_PATH}" ]]; then
              tail -c 8000 "${STDERR_PATH}"
            else
              echo 'stderr log was not created'
            fi
            echo '```'
            if [[ -f "${RESULT_PATH}" ]]; then
              echo
              echo '```json'
              tail -c 8000 "${RESULT_PATH}"
              echo
              echo '```'
            fi
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Remove ephemeral OpenRouter access
        id: cleanup
        if: always() && needs.start.outputs.run_review == 'true'
        env:
          OCR_CONFIG_PATH: ${{ runner.temp }}/final-ai-review-ocr-config.json
        run: node .github/scripts/final-ai-review.js cleanup-ocr

      - name: Publish consolidated final review
        id: publish
        if: >-
          steps.run_review.outcome == 'success' &&
          steps.cleanup.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.authorize.outputs.pr_number }}
          BASE_SHA: ${{ needs.authorize.outputs.base_sha }}
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
          REVIEW_MODE: ${{ needs.authorize.outputs.mode }}
          ROOT_HEAD: ${{ needs.authorize.outputs.root_head }}
          ROOT_REVIEW_ID: ${{ needs.authorize.outputs.root_review_id }}
          POLICY_DIGEST: ${{ needs.authorize.outputs.policy_digest }}
          BACKGROUND_DIGEST: ${{ needs.authorize.outputs.background_digest }}
          SCOPE_KIND: ${{ needs.authorize.outputs.scope_kind }}
          STACK_ID: ${{ needs.authorize.outputs.stack_id }}
          STACK_POSITION: ${{ needs.authorize.outputs.stack_position }}
          STACK_ORDER_DIGEST: ${{ needs.authorize.outputs.stack_order_digest }}
          DISPOSITION_DIGEST: ${{ needs.authorize.outputs.disposition_digest }}
          TRUSTED_SHA: ${{ needs.authorize.outputs.trusted_sha }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          RESULT_PATH: ${{ runner.temp }}/final-ai-review-result.json
        with:
          github-token: ${{ github.token }}
          script: |
            const helper = require('./.github/scripts/final-ai-review.js')
            const url = await helper.publishFinalReview({
              github,
              context,
              prNumber: Number(process.env.PR_NUMBER),
              baseSha: process.env.BASE_SHA,
              headSha: process.env.HEAD_SHA,
              mode: process.env.REVIEW_MODE,
              rootHead: process.env.ROOT_HEAD,
              rootReviewId: process.env.ROOT_REVIEW_ID,
              policyDigest: process.env.POLICY_DIGEST,
              backgroundDigest: process.env.BACKGROUND_DIGEST,
              scopeKind: process.env.SCOPE_KIND,
              stackId: process.env.STACK_ID,
              stackPosition: process.env.STACK_POSITION,
              stackOrderDigest: process.env.STACK_ORDER_DIGEST,
              dispositionDigest: process.env.DISPOSITION_DIGEST,
              trustedSha: process.env.TRUSTED_SHA,
              workflowSha: process.env.GITHUB_WORKFLOW_SHA,
              resultPath: process.env.RESULT_PATH,
            })
            core.setOutput('clean_review', String(url == null))
            core.info(
              url
                ? `Published ${url}`
                : 'No actionable findings; skipped the pull-request comment'
            )

  finalize:
    needs: [authorize, start, review]
    if: >-
      always() &&
      needs.authorize.outputs.authorized == 'true' &&
      (needs.start.outputs.run_review == 'true' || needs.start.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: final-ai-status-lock-${{ needs.authorize.outputs.status_lock_key }}
      cancel-in-progress: false
    permissions:
      checks: write
      contents: read
      pull-requests: read
      statuses: write
      actions: read
    steps:
      - name: Checkout trusted final-review implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.trusted_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Finalize exact-head status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.authorize.outputs.pr_number }}
          BASE_SHA: ${{ needs.authorize.outputs.base_sha }}
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
          REVIEW_MODE: ${{ needs.authorize.outputs.mode }}
          ROOT_HEAD: ${{ needs.authorize.outputs.root_head }}
          ROOT_REVIEW_ID: ${{ needs.authorize.outputs.root_review_id }}
          BACKGROUND_DIGEST: ${{ needs.authorize.outputs.background_digest }}
          SCOPE_KIND: ${{ needs.authorize.outputs.scope_kind }}
          STACK_ID: ${{ needs.authorize.outputs.stack_id }}
          STACK_POSITION: ${{ needs.authorize.outputs.stack_position }}
          STACK_ORDER_DIGEST: ${{ needs.authorize.outputs.stack_order_digest }}
          DISPOSITION_DIGEST: ${{ needs.authorize.outputs.disposition_digest }}
          DISPOSITION_IDS: ${{ needs.authorize.outputs.disposition_ids }}
          REVIEW_OUTCOME: ${{ needs.review.outputs.review_outcome || needs.review.result }}
          CLEANUP_OUTCOME: ${{ needs.review.outputs.cleanup_outcome || needs.review.result }}
          PUBLISH_OUTCOME: ${{ needs.review.outputs.publish_outcome || needs.review.result }}
          CLEAN_REVIEW: ${{ needs.review.outputs.clean_review || 'false' }}
          POLICY_DIGEST: ${{ needs.authorize.outputs.policy_digest }}
          TRUSTED_SHA: ${{ needs.authorize.outputs.trusted_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const helper = require('./.github/scripts/final-ai-review.js')
            await helper.finalizeFinalReview({
              github,
              context,
              prNumber: Number(process.env.PR_NUMBER),
              baseSha: process.env.BASE_SHA,
              headSha: process.env.HEAD_SHA,
              mode: process.env.REVIEW_MODE,
              rootHead: process.env.ROOT_HEAD,
              rootReviewId: process.env.ROOT_REVIEW_ID,
              backgroundDigest: process.env.BACKGROUND_DIGEST,
              scopeKind: process.env.SCOPE_KIND,
              stackId: process.env.STACK_ID,
              stackPosition: process.env.STACK_POSITION,
              stackOrderDigest: process.env.STACK_ORDER_DIGEST,
              dispositionDigest: process.env.DISPOSITION_DIGEST,
              dispositionIds: JSON.parse(process.env.DISPOSITION_IDS || '[]'),
              reviewOutcome: process.env.REVIEW_OUTCOME,
              cleanupOutcome: process.env.CLEANUP_OUTCOME,
              publishOutcome: process.env.PUBLISH_OUTCOME,
              cleanReview: process.env.CLEAN_REVIEW,
              policyDigest: process.env.POLICY_DIGEST,
              trustedSha: process.env.TRUSTED_SHA,
            })

      - name: Finalize failure fallback
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const helper = require('./.github/scripts/final-ai-review.js')
            await helper.finalizeFinalReviewFailure({
              github,
              context,
              headSha: process.env.HEAD_SHA,
            })

  authorize_stack:
    needs: trusted_policy
    if: >-
      needs.trusted_policy.result == 'success' &&
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/final-review-stack'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: read
      statuses: read
    outputs:
      authorized: ${{ steps.authorize.outputs.authorized }}
      pr_number: ${{ steps.authorize.outputs.pr_number }}
      base_sha: ${{ steps.authorize.outputs.base_sha }}
      head_sha: ${{ steps.authorize.outputs.head_sha }}
      trusted_sha: ${{ steps.authorize.outputs.trusted_sha }}
      stack_id: ${{ steps.authorize.outputs.stack_id }}
      stack_order_digest: ${{ steps.authorize.outputs.stack_order_digest }}
      stack_identity_digest: ${{ steps.authorize.outputs.stack_identity_digest }}
      member_numbers: ${{ steps.authorize.outputs.member_numbers }}
      mode: ${{ steps.authorize.outputs.mode }}
      root_head: ${{ steps.authorize.outputs.root_head }}
      root_review_id: ${{ steps.authorize.outputs.root_review_id }}
      policy_digest: ${{ steps.authorize.outputs.policy_digest }}
      disposition_digest: ${{ steps.authorize.outputs.disposition_digest }}
      review_ranges: ${{ steps.authorize.outputs.review_ranges }}
      status_lock_key: ${{ steps.authorize.outputs.status_lock_key }}
      background: ${{ steps.authorize.outputs.background }}
    steps:
      - name: Checkout trusted stack-review policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trusted_policy.outputs.trusted_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Authorize stack review
        id: authorize
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TRUSTED_SHA: ${{ needs.trusted_policy.outputs.trusted_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const helper = require('./.github/scripts/final-ai-stack-review.js')
            await helper.authorizeStackReview({
              github,
              context,
              core,
              trustedSha: process.env.TRUSTED_SHA,
            })

  start_stack:
    needs: authorize_stack
    if: needs.authorize_stack.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: final-ai-status-lock-${{ needs.authorize_stack.outputs.status_lock_key }}
      cancel-in-progress: false
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      run_review: ${{ steps.start.outputs.run_review }}
      background: ${{ steps.start.outputs.background }}
      manifest_digest: ${{ steps.start.outputs.manifest_digest }}
    steps:
      - name: Checkout trusted stack-review implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize_stack.outputs.trusted_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Freeze verified stack snapshot
        id: start
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.authorize_stack.outputs.pr_number }}
          BASE_SHA: ${{ needs.authorize_stack.outputs.base_sha }}
          HEAD_SHA: ${{ needs.authorize_stack.outputs.head_sha }}
          STACK_ID: ${{ needs.authorize_stack.outputs.stack_id }}
          STACK_ORDER_DIGEST: ${{ needs.authorize_stack.outputs.stack_order_digest }}
          STACK_IDENTITY_DIGEST: ${{ needs.authorize_stack.outputs.stack_identity_digest }}
          MEMBER_NUMBERS: ${{ needs.authorize_stack.outputs.member_numbers }}
          REVIEW_MODE: ${{ needs.authorize_stack.outputs.mode }}
          ROOT_HEAD: ${{ needs.authorize_stack.outputs.root_head }}
          ROOT_REVIEW_ID: ${{ needs.authorize_stack.outputs.root_review_id }}
          POLICY_DIGEST: ${{ needs.authorize_stack.outputs.policy_digest }}
          DISPOSITION_DIGEST: ${{ needs.authorize_stack.outputs.disposition_digest }}
          REVIEW_RANGES: ${{ needs.authorize_stack.outputs.review_ranges }}
          TRUSTED_SHA: ${{ needs.authorize_stack.outputs.trusted_sha }}
          MANIFEST_PATH: ${{ runner.temp }}/final-ai-stack-manifest.json
        with:
          github-token: ${{ github.token }}
          script: |
            const helper = require('./.github/scripts/final-ai-stack-review.js')
            const memberNumbers = process.env.MEMBER_NUMBERS.split(',').map(Number)
            const shouldRun = await helper.startStackReview({
              github,
              context,
              prNumber: Number(process.env.PR_NUMBER),
              baseSha: process.env.BASE_SHA,
              headSha: process.env.HEAD_SHA,
              stackId: process.env.STACK_ID,
              stackOrderDigest: process.env.STACK_ORDER_DIGEST,
              stackIdentityDigest: process.env.STACK_IDENTITY_DIGEST,
              memberNumbers,
              mode: process.env.REVIEW_MODE,
              rootHead: process.env.ROOT_HEAD,
              rootReviewId: process.env.ROOT_REVIEW_ID,
              policyDigest: process.env.POLICY_DIGEST,
              dispositionDigest: process.env.DISPOSITION_DIGEST,
              reviewRanges: JSON.parse(process.env.REVIEW_RANGES || '[]'),
              trustedSha: process.env.TRUSTED_SHA,
              manifestPath: process.env.MANIFEST_PATH,
              statusLockHeld: true,
              core,
            })
            core.setOutput('run_review', String(shouldRun))

      - name: Upload frozen stack snapshot
        if: steps.start.outputs.run_review == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: final-ai-stack-manifest-${{ github.run_id }}
          path: ${{ runner.temp }}/final-ai-stack-manifest.json
          if-no-files-found: error
          retention-days: 1

  review_stack:
    needs: [authorize_stack, start_stack]
    if: >-
      needs.authorize_stack.outputs.authorized == 'true' &&
      needs.start_stack.outputs.run_review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: final-ai-stack-review-${{ needs.authorize_stack.outputs.pr_number }}
      cancel-in-progress: true
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: write
    outputs:
      code_outcome: ${{ steps.code_review.outcome }}
      topology_outcome: ${{ steps.topology_review.outcome }}
      cleanup_outcome: ${{ steps.cleanup.outcome }}
      publish_outcome: ${{ steps.publish.outcome }}
      clean_review: ${{ steps.publish.outputs.clean_review }}
    steps:
      - name: Checkout trusted stack-review implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize_stack.outputs.trusted_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted stack helper
        env:
          TRUSTED_SHA: ${{ needs.authorize_stack.outputs.trusted_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TRUSTED_SHA}"
          node --test .github/scripts/final-ai-review.test.js .github/scripts/final-ai-stack-review.test.js

      - name: Download frozen stack snapshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: final-ai-stack-manifest-${{ github.run_id }}
          path: ${{ runner.temp }}

      - name: Resolve immutable stack range
        id: range
        if: needs.start_stack.outputs.run_review == 'true'
        env:
          BASE_SHA: ${{ needs.authorize_stack.outputs.base_sha }}
          HEAD_SHA: ${{ needs.authorize_stack.outputs.head_sha }}
          REVIEW_MODE: ${{ needs.authorize_stack.outputs.mode }}
          ROOT_HEAD: ${{ needs.authorize_stack.outputs.root_head }}
          REVIEW_RANGES: ${{ needs.authorize_stack.outputs.review_ranges }}
          MANIFEST_DIGEST: ${{ needs.start_stack.outputs.manifest_digest }}
          MANIFEST_PATH: ${{ runner.temp }}/final-ai-stack-manifest.json
        run: |
          set -euo pipefail
          [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${REVIEW_MODE}" == "full" || "${REVIEW_MODE}" == "incremental" ]]
          [[ "${ROOT_HEAD}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${MANIFEST_DIGEST}" =~ ^[0-9a-f]{64}$ ]]
          node -e 'const b = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); if (b.manifest_digest !== process.env.MANIFEST_DIGEST) process.exit(1)' "${MANIFEST_PATH}"
          node -e 'const b = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); if (b.manifest.ultimate_base?.sha !== process.env.BASE_SHA) process.exit(1)' "${MANIFEST_PATH}"
          node -e 'const ranges = JSON.parse(process.env.REVIEW_RANGES || "[]"); if (process.env.REVIEW_MODE === "incremental" && (!Array.isArray(ranges) || ranges.length === 0 || ranges.some((r) => !Number.isSafeInteger(r.layer_number) || r.layer_number < 1 || !/^[0-9a-f]{40}$/.test(r.base_sha ?? "") || !/^[0-9a-f]{40}$/.test(r.head_sha ?? "") || r.base_sha === r.head_sha))) process.exit(1)'
          git cat-file -e "${BASE_SHA}^{commit}"
          while read -r NUMBER EXPECTED_SHA; do
            [[ "${NUMBER}" =~ ^[0-9]+$ ]]
            [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]
            git fetch --no-tags origin "pull/${NUMBER}/head"
            test "$(git rev-parse FETCH_HEAD)" = "${EXPECTED_SHA}"
          done < <(node -e 'const m = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).manifest; for (const l of m.layers) console.log(`${l.pull_request} ${l.head_sha}`)' "${MANIFEST_PATH}")
          if [[ "${REVIEW_MODE}" == "incremental" ]]; then
            REVIEW_FROM="per-layer"
            while IFS=$'\t' read -r LAYER BASE HEAD; do
              git cat-file -e "${BASE}^{commit}"
              git cat-file -e "${HEAD}^{commit}"
            done < <(node -e 'for (const r of JSON.parse(process.env.REVIEW_RANGES || "[]")) console.log(`${r.layer_number}\t${r.base_sha}\t${r.head_sha}`)')
          else
            REVIEW_FROM="${BASE_SHA}"
            git cat-file -e "${REVIEW_FROM}^{commit}"
          fi
          [[ "${REVIEW_MODE}" == "incremental" && "${REVIEW_FROM}" == "per-layer" || "${REVIEW_MODE}" == "full" && "${REVIEW_FROM}" =~ ^[0-9a-f]{40}$ ]]
          echo "review_from=${REVIEW_FROM}" >>"${GITHUB_OUTPUT}"

      - name: Install pinned OpenCodeReview CLI
        if: needs.start_stack.outputs.run_review == 'true'
        run: |
          npm install -g @alibaba-group/open-code-review@1.9.10
          ocr version

      - name: Configure ephemeral OpenRouter access
        id: configure
        if: needs.start_stack.outputs.run_review == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OCR_CONFIG_PATH: ${{ runner.temp }}/final-ai-stack-ocr-config.json
        run: |
          set -euo pipefail
          printf '%s' "${OPENROUTER_API_KEY}" |
            node .github/scripts/final-ai-review.js configure-ocr
          test -s "${OCR_CONFIG_PATH}"

      - name: Run cumulative code review
        id: code_review
        if: needs.start_stack.outputs.run_review == 'true'
        env:
          BACKGROUND: ${{ needs.start_stack.outputs.background }}
          HEAD_SHA: ${{ needs.authorize_stack.outputs.head_sha }}
          REVIEW_FROM: ${{ steps.range.outputs.review_from }}
          REVIEW_MODE: ${{ needs.authorize_stack.outputs.mode }}
          REVIEW_RANGES: ${{ needs.authorize_stack.outputs.review_ranges }}
          RESULT_PATH: ${{ runner.temp }}/final-ai-stack-code-result.json
          RANGE_DIR: ${{ runner.temp }}/final-ai-stack-code-ranges
          STDERR_PATH: ${{ runner.temp }}/final-ai-stack-code-stderr.log
          OCR_CONFIG_PATH: ${{ runner.temp }}/final-ai-stack-ocr-config.json
          OCR_LLM_URL: https://openrouter.ai/api/v1/chat/completions
          OCR_LLM_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
          OCR_LLM_MODEL: z-ai/glm-5.3-flash
        run: |
          set -euo pipefail
          if [[ "${REVIEW_MODE}" == "incremental" ]]; then
            mkdir -p "${RANGE_DIR}"
            while IFS=$'\t' read -r LAYER BASE HEAD; do
              ocr review \
                --from "${BASE}" \
                --to "${HEAD}" \
                --audience agent \
                --format json \
                --background "${BACKGROUND}" \
                --rule .github/open-code-review/final-review-rules.json \
                >"${RANGE_DIR}/${LAYER}.json" \
                2>>"${STDERR_PATH}"
            done < <(node -e 'for (const r of JSON.parse(process.env.REVIEW_RANGES || "[]")) console.log(`${r.layer_number}\t${r.base_sha}\t${r.head_sha}`)')
            node .github/scripts/final-ai-stack-review.js combine-ocr \
              "${RESULT_PATH}" "${RANGE_DIR}"/*.json
          else
            ocr review \
              --from "${REVIEW_FROM}" \
              --to "${HEAD_SHA}" \
              --audience agent \
              --format json \
              --background "${BACKGROUND}" \
              --rule .github/open-code-review/final-review-rules.json \
              >"${RESULT_PATH}" 2>"${STDERR_PATH}"
          fi

      - name: Summarize cumulative review failure output
        if: failure() && steps.code_review.outcome == 'failure'
        env:
          RESULT_PATH: ${{ runner.temp }}/final-ai-stack-code-result.json
          STDERR_PATH: ${{ runner.temp }}/final-ai-stack-code-stderr.log
        run: |
          set -euo pipefail
          echo '::group::Cumulative review CLI failure output'
          cat "${STDERR_PATH}" 2>/dev/null || echo 'stderr log was not created'
          echo '::endgroup::'
          if [[ -f "${RESULT_PATH}" ]]; then
            echo '::group::Cumulative review CLI result JSON'
            cat "${RESULT_PATH}"
            echo
            echo '::endgroup::'
          fi
          {
            echo '### Cumulative review CLI failure'
            echo
            echo '```text'
            if [[ -f "${STDERR_PATH}" ]]; then
              tail -c 8000 "${STDERR_PATH}"
            else
              echo 'stderr log was not created'
            fi
            echo '```'
            if [[ -f "${RESULT_PATH}" ]]; then
              echo
              echo '```json'
              tail -c 8000 "${RESULT_PATH}"
              echo
              echo '```'
            fi
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Remove ephemeral OpenRouter access after code review
        id: cleanup
        if: always() && needs.start_stack.outputs.run_review == 'true'
        env:
          OCR_CONFIG_PATH: ${{ runner.temp }}/final-ai-stack-ocr-config.json
        run: node .github/scripts/final-ai-review.js cleanup-ocr

      - name: Run strict topology review
        id: topology_review
        if: steps.code_review.outcome == 'success' && steps.cleanup.outcome == 'success'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MANIFEST_DIGEST: ${{ needs.start_stack.outputs.manifest_digest }}
          MANIFEST_PATH: ${{ runner.temp }}/final-ai-stack-manifest.json
          CODE_RESULT_PATH: ${{ runner.temp }}/final-ai-stack-code-result.json
          TOPOLOGY_RESULT_PATH: ${{ runner.temp }}/final-ai-stack-topology-result.json
          REVIEW_MODE: ${{ needs.authorize_stack.outputs.mode }}
          REVIEW_RANGES: ${{ needs.authorize_stack.outputs.review_ranges }}
        run: |
          set -euo pipefail
          node .github/scripts/final-ai-stack-review.js topology \
            "${MANIFEST_PATH}" "${CODE_RESULT_PATH}" "${TOPOLOGY_RESULT_PATH}" \
            "${MANIFEST_DIGEST}" "${REVIEW_MODE}" "${REVIEW_RANGES}"

      - name: Publish consolidated stack review
        id: publish
        if: >-
          steps.code_review.outcome == 'success' &&
          steps.cleanup.outcome == 'success' &&
          steps.topology_review.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.authorize_stack.outputs.pr_number }}
          BASE_SHA: ${{ needs.authorize_stack.outputs.base_sha }}
          HEAD_SHA: ${{ needs.authorize_stack.outputs.head_sha }}
          STACK_ID: ${{ needs.authorize_stack.outputs.stack_id }}
          STACK_ORDER_DIGEST: ${{ needs.authorize_stack.outputs.stack_order_digest }}
          STACK_IDENTITY_DIGEST: ${{ needs.authorize_stack.outputs.stack_identity_digest }}
          MEMBER_NUMBERS: ${{ needs.authorize_stack.outputs.member_numbers }}
          REVIEW_MODE: ${{ needs.authorize_stack.outputs.mode }}
          ROOT_HEAD: ${{ needs.authorize_stack.outputs.root_head }}
          ROOT_REVIEW_ID: ${{ needs.authorize_stack.outputs.root_review_id }}
          POLICY_DIGEST: ${{ needs.authorize_stack.outputs.policy_digest }}
          DISPOSITION_DIGEST: ${{ needs.authorize_stack.outputs.disposition_digest }}
          REVIEW_RANGES: ${{ needs.authorize_stack.outputs.review_ranges }}
          TRUSTED_SHA: ${{ needs.authorize_stack.outputs.trusted_sha }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          MANIFEST_DIGEST: ${{ needs.start_stack.outputs.manifest_digest }}
          MANIFEST_PATH: ${{ runner.temp }}/final-ai-stack-manifest.json
          RESULT_PATH: ${{ runner.temp }}/final-ai-stack-code-result.json
          TOPOLOGY_RESULT_PATH: ${{ runner.temp }}/final-ai-stack-topology-result.json
        with:
          github-token: ${{ github.token }}
          script: |
            const helper = require('./.github/scripts/final-ai-stack-review.js')
            const memberNumbers = process.env.MEMBER_NUMBERS.split(',').map(Number)
            const url = await helper.publishStackReview({
              github,
              context,
              prNumber: Number(process.env.PR_NUMBER),
              baseSha: process.env.BASE_SHA,
              headSha: process.env.HEAD_SHA,
              stackId: process.env.STACK_ID,
              stackOrderDigest: process.env.STACK_ORDER_DIGEST,
              stackIdentityDigest: process.env.STACK_IDENTITY_DIGEST,
              memberNumbers,
              mode: process.env.REVIEW_MODE,
              rootHead: process.env.ROOT_HEAD,
              rootReviewId: process.env.ROOT_REVIEW_ID,
              policyDigest: process.env.POLICY_DIGEST,
              dispositionDigest: process.env.DISPOSITION_DIGEST,
              reviewRanges: JSON.parse(process.env.REVIEW_RANGES || '[]'),
              trustedSha: process.env.TRUSTED_SHA,
              workflowSha: process.env.GITHUB_WORKFLOW_SHA,
              expectedManifestDigest: process.env.MANIFEST_DIGEST,
              manifestPath: process.env.MANIFEST_PATH,
              resultPath: process.env.RESULT_PATH,
              topologyResultPath: process.env.TOPOLOGY_RESULT_PATH,
            })
            core.setOutput('clean_review', String(url == null))
            core.info(
              url
                ? `Published ${url}`
                : 'No actionable findings; skipped the pull-request comment'
            )

  finalize_stack:
    needs: [authorize_stack, start_stack, review_stack]
    if: >-
      always() &&
      needs.authorize_stack.outputs.authorized == 'true' &&
      (needs.start_stack.outputs.run_review == 'true' ||
      needs.start_stack.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: final-ai-status-lock-${{ needs.authorize_stack.outputs.status_lock_key }}
      cancel-in-progress: false
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Checkout trusted stack-review implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize_stack.outputs.trusted_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Finalize exact stack status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.authorize_stack.outputs.pr_number }}
          BASE_SHA: ${{ needs.authorize_stack.outputs.base_sha }}
          HEAD_SHA: ${{ needs.authorize_stack.outputs.head_sha }}
          STACK_ID: ${{ needs.authorize_stack.outputs.stack_id }}
          STACK_ORDER_DIGEST: ${{ needs.authorize_stack.outputs.stack_order_digest }}
          STACK_IDENTITY_DIGEST: ${{ needs.authorize_stack.outputs.stack_identity_digest }}
          MEMBER_NUMBERS: ${{ needs.authorize_stack.outputs.member_numbers }}
          REVIEW_MODE: ${{ needs.authorize_stack.outputs.mode }}
          ROOT_HEAD: ${{ needs.authorize_stack.outputs.root_head }}
          ROOT_REVIEW_ID: ${{ needs.authorize_stack.outputs.root_review_id }}
          POLICY_DIGEST: ${{ needs.authorize_stack.outputs.policy_digest }}
          DISPOSITION_DIGEST: ${{ needs.authorize_stack.outputs.disposition_digest }}
          REVIEW_RANGES: ${{ needs.authorize_stack.outputs.review_ranges }}
          TRUSTED_SHA: ${{ needs.authorize_stack.outputs.trusted_sha }}
          CODE_OUTCOME: ${{ needs.review_stack.outputs.code_outcome || needs.review_stack.result }}
          TOPOLOGY_OUTCOME: ${{ needs.review_stack.outputs.topology_outcome || needs.review_stack.result }}
          CLEANUP_OUTCOME: ${{ needs.review_stack.outputs.cleanup_outcome || needs.review_stack.result }}
          PUBLISH_OUTCOME: ${{ needs.review_stack.outputs.publish_outcome || needs.review_stack.result }}
          CLEAN_REVIEW: ${{ needs.review_stack.outputs.clean_review || 'false' }}
        with:
          github-token: ${{ github.token }}
          script: |
            const helper = require('./.github/scripts/final-ai-stack-review.js')
            const memberNumbers = process.env.MEMBER_NUMBERS.split(',').map(Number)
            await helper.finalizeStackReview({
              github,
              context,
              prNumber: Number(process.env.PR_NUMBER),
              baseSha: process.env.BASE_SHA,
              headSha: process.env.HEAD_SHA,
              stackId: process.env.STACK_ID,
              stackOrderDigest: process.env.STACK_ORDER_DIGEST,
              stackIdentityDigest: process.env.STACK_IDENTITY_DIGEST,
              memberNumbers,
              mode: process.env.REVIEW_MODE,
              rootHead: process.env.ROOT_HEAD,
              rootReviewId: process.env.ROOT_REVIEW_ID,
              policyDigest: process.env.POLICY_DIGEST,
              dispositionDigest: process.env.DISPOSITION_DIGEST,
              reviewRanges: JSON.parse(process.env.REVIEW_RANGES || '[]'),
              trustedSha: process.env.TRUSTED_SHA,
              codeOutcome: process.env.CODE_OUTCOME,
              topologyOutcome: process.env.TOPOLOGY_OUTCOME,
              cleanupOutcome: process.env.CLEANUP_OUTCOME,
              publishOutcome: process.env.PUBLISH_OUTCOME,
              cleanReview: process.env.CLEAN_REVIEW,
            })
