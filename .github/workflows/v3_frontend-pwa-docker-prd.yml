name: Build Docker image for frontend-pwa (prd)

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/frontend-pwa

jobs:
  build-arm:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Prepare filesystem
        shell: bash
        run: |
          rm apps/frontend-pwa/.env.production
          mv apps/frontend-pwa/.env.prd apps/frontend-pwa/.env.production

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-arm

      - name: Resolve the previous release image
        id: previous_release
        shell: bash
        run: |
          set -euo pipefail
          # The image pinned in the production values is what production runs.
          # Without a usable image the build starts a fresh asset history.
          tag="$(awk '/^[^ #]/{top=($0=="frontendPWA:")} top&&/^  image:/{i=1;next} i&&/^  [^ ]/{i=0} i&&/^    tag:/{print $2;exit}' deploy/env-uzh-prd/values.yaml | tr -d "\"'")"
          image=""
          if [ -n "$tag" ] && docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-arm:${tag}" >/dev/null 2>&1; then
            image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-arm:${tag}"
          else
            echo "::warning::no pinned production image found; building without release history"
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/frontend-pwa/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/arm64
          no-cache: true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_ENV=${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'staging' }}
            NEXT_PUBLIC_GROWTHBOOK_API_HOST=${{ vars.NEXT_PUBLIC_GROWTHBOOK_API_HOST_PRD }}
            NEXT_PUBLIC_GROWTHBOOK_CLIENT_KEY=${{ vars.NEXT_PUBLIC_GROWTHBOOK_CLIENT_KEY_PRD }}
            PREVIOUS_IMAGE=${{ steps.previous_release.outputs.image }}
  build-amd:
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Prepare filesystem
        shell: bash
        run: |
          rm apps/frontend-pwa/.env.production
          mv apps/frontend-pwa/.env.prd apps/frontend-pwa/.env.production

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-amd

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/frontend-pwa/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_ENV=${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'staging' }}
            NEXT_PUBLIC_GROWTHBOOK_API_HOST=${{ vars.NEXT_PUBLIC_GROWTHBOOK_API_HOST_PRD }}
            NEXT_PUBLIC_GROWTHBOOK_CLIENT_KEY=${{ vars.NEXT_PUBLIC_GROWTHBOOK_CLIENT_KEY_PRD }}
