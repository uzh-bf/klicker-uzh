name: AI code review (OpenCodeReview)

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

# The runner checks out only trusted policy and reads PR-head objects for the diff.
# Do not add checkout, build, test, install, or execution steps for PR-head content here.
permissions:
  contents: read
  pull-requests: write

jobs:
  ocr-review:
    # The CLI spawns a detached `npm i -g` self-update on its first invocation
    # unless this is set. That global reinstall removes and re-extracts the
    # package while the review is starting, so the job dies on a
    # module-resolution error instead of reviewing the pull request.
    env:
      OCR_NO_UPDATE: '1'
      OCR_ADAPTER_PROVIDER: mistral-flash
    if: >-
      (github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.draft == true) &&
      (github.event.action != 'synchronize' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !startsWith(github.event.pull_request.head.ref, 'sync/'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Run pinned OCR draft review
        uses: uzh-bf/klicker-uzh/.github/actions/ocr-review@70317b0a34f900df66e4e5d48a4347e6460081b0
        with:
          mistral-api-key: ${{ secrets.MISTRAL_API_KEY }}
          context7-api-key: ${{ secrets.CONTEXT7_API_KEY }}
          github-token: ${{ github.token }}
          provider-paused: ${{ vars.OCR_PROVIDER_PAUSED }}
