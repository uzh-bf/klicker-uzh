name: AI code review (OpenCodeReview)

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

# The action checks out only the trusted base and reads PR-head objects for the diff.
# Do not add checkout, build, test, install, or execution steps for PR-head content here.
permissions:
  contents: read
  pull-requests: write

jobs:
  ocr-review:
    # The CLI spawns a detached `npm i -g` self-update on its first invocation
    # unless this is set. That global reinstall removes and re-extracts the
    # package while the review is starting, so the job dies on a
    # module-resolution error instead of reviewing the pull request.
    env:
      OCR_NO_UPDATE: '1'
      OCR_ADAPTER_PROVIDER: openrouter
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout trusted review policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Prepare bounded review context
        id: context
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          node - <<'NODE'
          const { randomUUID } = require('node:crypto')
          const fs = require('node:fs')
          const { buildReviewBackground } = require('./.github/scripts/final-ai-review.js')
          const background = buildReviewBackground(process.env.PR_TITLE, process.env.PR_BODY)
          const delimiter = randomUUID()
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `background<<${delimiter}\n${background}\n${delimiter}\n`)
          NODE

      - name: Start draft review adapter
        id: adapter
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ADAPTER_PATH: ${{ runner.temp }}/ocr-mistral-adapter.cjs
          ADAPTER_STATE: ${{ runner.temp }}/ocr-mistral-adapter.json
          OCR_ADAPTER_DIAGNOSTICS_PATH: ${{ runner.temp }}/draft-ai-review-adapter-diagnostics.jsonl
        run: |
          set -euo pipefail
          cp .github/scripts/ocr-mistral-adapter.cjs "${ADAPTER_PATH}"
          node "${ADAPTER_PATH}" start "${ADAPTER_STATE}"

      - name: Run OpenCodeReview
        uses: alibaba/open-code-review@1672852136fc87748249d22bce0819f33419ea79 # v1.13.0
        with:
          llm_url: ${{ steps.adapter.outputs.url }}/v1/chat/completions
          llm_auth_token: ${{ steps.adapter.outputs.token }}
          llm_model: deepseek/deepseek-v4.1-flash-1017
          llm_extra_body: '{"reasoning_effort":"max","prompt_cache_key":"{ocr_session_key}"}'
          background: ${{ steps.context.outputs.background }}
          llm_use_anthropic: 'false'
          llm_timeout: '480'
          ocr_version: '1.13.0'
          review_concurrency: '4'
          sticky_summary: 'true'
          incremental: 'true'
          stream_progress: 'true'
          route_severity_below: 'low'
          upload_artifacts: 'false'

      - name: Stop draft review adapter
        if: always() && steps.adapter.outcome == 'success'
        env:
          ADAPTER_PATH: ${{ runner.temp }}/ocr-mistral-adapter.cjs
          ADAPTER_STATE: ${{ runner.temp }}/ocr-mistral-adapter.json
        run: node "${ADAPTER_PATH}" stop "${ADAPTER_STATE}"

      - name: Upload sanitized draft adapter diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: draft-ai-review-adapter-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/draft-ai-review-adapter-diagnostics.jsonl
          if-no-files-found: warn
          retention-days: 7

      - name: Summarize OCR estimated cost and caching savings
        if: always()
        continue-on-error: true
        env:
          ADAPTER_PATH: ${{ runner.temp }}/ocr-mistral-adapter.cjs
          DIAGNOSTICS_PATH: ${{ runner.temp }}/draft-ai-review-adapter-diagnostics.jsonl
        run: node "${ADAPTER_PATH}" summary "${DIAGNOSTICS_PATH}"
