name: Check typescript types

on:
  push:
    branches: ['v3', 'v3*']
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  TURBO_REMOTE_ONLY: true

jobs:
  check-types:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for changes
        id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }} --depth=1
            diff=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          else
            diff=$(git diff --name-only HEAD~1...HEAD || true)
          fi
          echo "Files changed:"
          echo "$diff"

          if echo "$diff" | grep -qE '^(apps/|packages/|package\.json|pnpm-lock\.yaml|tsconfig\.json|.*/tsconfig\.json|\.github/workflows/check-types\.yml)'; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - uses: pnpm/action-setup@v4
        if: steps.filter.outputs.should_run == 'true'
        with:
          version: 11.5.0
          run_install: true

      - name: Build relevant packages
        if: steps.filter.outputs.should_run == 'true'
        run: |
          cd packages/markdown
          pnpm run build
          cd ../grading
          pnpm run build
          cd ../prisma
          pnpm run build
          cd ../types
          pnpm run build
          cd ../util
          pnpm run build
          cd ../graphql
          pnpm run build
          cd ../hatchet
          pnpm run build
          cd ../word-cloud
          pnpm run build

      - name: Check the typescript types of all packages and apps
        if: steps.filter.outputs.should_run == 'true'
        shell: bash
        run: |
          pnpm run check
