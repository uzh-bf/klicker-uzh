name: Perform sonarcloud analysis

on:
  push:
    branches: ['v3', 'v3*']
  pull_request:
    branches: ['v3', 'v3*']
    # "edited" re-runs the analysis when a pull request is retargeted, so the
    # new-code comparison cannot stay bound to a previous base branch.
    types: [opened, synchronize, reopened, ready_for_review, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

# Reading the analyzed revision and the artifacts of the test workflows is the
# whole job. The analysis upload itself is authorized by the Sonar credential,
# never by the workflow token.
permissions:
  contents: read
  actions: read

jobs:
  # A documentation-and-planning pull request changes no analyzed source, so its
  # analysis would re-report an unchanged tree and wait for coverage of code it
  # does not contain. One classification decides that, and it narrows pull
  # requests only.
  #
  # The analysis is not a required status check, so a skip cannot leave a
  # required context unreported; branch pushes and the CI class still analyze.
  classify:
    name: Classify
    runs-on: ubuntu-latest
    # Shares the workflow-level contents/actions read permissions, and neither the
    # classification nor a skip needs the analysis credential.
    timeout-minutes: 10
    outputs:
      change_class: ${{ steps.classify.outputs.change_class }}
      static_analysis: ${{ steps.classify.outputs.static_analysis }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The classification reads changed-path records, not sources.
          sparse-checkout: .github

      - name: Classify the change
        id: classify
        uses: ./.github/actions/change-envelope

  sonarcloud:
    # Draft pull requests keep their previous behaviour: they are analyzed when
    # they become ready for review. The condition is written against the event
    # so a push run can never be skipped by an absent draft field.
    # A class that cannot be computed leaves the analysis in place, so the
    # envelope can only ever remove analysis it proved unnecessary.
    needs: classify
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event_name != 'pull_request' || needs.classify.outputs.static_analysis != 'skip')
    name: SonarCloud
    runs-on: ubuntu-latest
    # The ceiling must fit the whole job: the shared coverage window, the
    # awaited quality gate, and the scan itself. A tighter ceiling lets a queued
    # test run consume the analysis before the scanner ever starts.
    timeout-minutes: 45
    steps:
      - name: Check out the analyzed revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      # Fork and Dependabot pull requests never receive repository secrets, so a
      # trusted analysis path for untrusted contributors is still pending. Until
      # it exists this fails with a named reason instead of an opaque
      # authorization error, and the check stays non-green rather than pretending
      # that an unavailable analysis succeeded.
      - name: Require the analysis credential
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "${SONAR_TOKEN}" ]; then
            exit 0
          fi
          {
            echo '### SonarCloud analysis unavailable'
            echo
            echo 'No SONAR_TOKEN is available for this event. Fork and Dependabot'
            echo 'pull requests do not receive repository secrets, so the analysis'
            echo 'cannot run. See docs/ci-and-deployment.md.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::SONAR_TOKEN is not available for this event; SonarCloud analysis cannot run."
          exit 1

      - name: Resolve the project version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "value=${version}" >> "$GITHUB_OUTPUT"

      # Coverage is imported only from test runs bound to this exact revision,
      # and only when the producing run recorded the tested source tree. Every
      # producer is reported in the step summary, so a missing report is visible
      # as absent coverage instead of a silently green metric.
      - name: Collect verified coverage inputs
        if: github.event_name == 'pull_request'
        id: coverage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          COVERAGE_PRODUCER_WORKFLOWS: .github/workflows/test-unit.yml,.github/workflows/test-graphql.yml
          # One bounded window shared by every producer and well inside the job
          # timeout, so a queued or slow test run cannot consume the analysis.
          COVERAGE_WAIT_SECONDS: '600'
        run: node .github/scripts/sonar-coverage-inputs.cjs

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # The quality gate is awaited on a pull request, where new code is the
          # diff against the base and the gate is meaningful, so a failing gate
          # fails this workflow instead of leaving a green run next to a red
          # one. Merge enforcement stays a separate, separately authorized
          # change.
          # A branch analysis is published without awaiting the gate: SonarCloud
          # fixes a branch's type at its first analysis, so on this project's
          # short-lived integration branches nearly the whole repository is new
          # code and the gate fails on historical findings. The boundary step
          # below names that condition instead of turning every branch analysis
          # into a failure.
          args: >-
            -Dsonar.projectVersion=${{ steps.version.outputs.value }}
            ${{ github.event_name == 'pull_request' && '-Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=600' || '' }}
            ${{ steps.coverage.outputs.scannerArgs }}

      # SonarCloud fixes a branch's type at its first analysis, and the type
      # decides what new code means. This project keeps the former default
      # branch `dev` as its main branch, so `v3` is a short-lived branch whose
      # new code is everything that differs from `dev`; nearly the whole
      # repository enters new code and the branch gate fails on historical
      # findings while the pull-request analysis of the same code is healthy.
      # This diagnostic names that cause.
      # It runs after the scan so the analysis is always published, and carries
      # `always()` because the awaited pull-request gate can already have failed
      # this job. Only the pull-request analysis is gated here, so only there
      # may this check fail the workflow; on a branch it reports the signal
      # without failing a run that the promotion controller requires to be
      # green.
      - name: Check the new-code boundary
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/scripts/sonar-new-code-boundary.cjs
