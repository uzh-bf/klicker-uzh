# Dependency supply-chain review for pull requests. This check complements the
# repository's existing GitHub dependency graph and Dependabot alerts.
#
# Compatibility note: this repository pins pnpm 12.11.2. Recognition of the
# previous pnpm 11 lockfile does not verify the upgraded graph or PR-time
# blocking. Confirm both before treating this check as complete CVE coverage.
#
# Only the severity policy is set below; dependency scope and license options stay
# at the action defaults.
name: Dependency Review

on:
  pull_request:
    # No "ready_for_review": a ready transition does not change the dependency
    # diff, and the repository contract reserves that event for workflows with a
    # documented lifecycle role (see ci-event-gates.test.cjs).
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  # The action publishes its findings summary as a comment on the pull request.
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Roadmap policy blocks High and Critical severities.
          fail-on-severity: high
          # The permission above exists for this PR comment; the input must
          # stay enabled so the job does not carry an unused write scope.
          comment-summary-in-pr: true
