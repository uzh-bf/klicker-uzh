# Generated by .github/scripts/priority-ci-workflows.cjs; edit the canonical workflow.
name: Production translation context priority execution
on:
  workflow_call:
    outputs:
      required_result:
        description: Actual required terminal job result
        value: ${{ jobs.test-intl-production-status.outputs.required_result }}
      run_label_event:
        description: Whether label-only work was admitted
        value: ${{ jobs.priority-route.outputs.run_label_event }}
permissions:
  contents: read
  checks: read
jobs:
  priority-route:
    if: vars.PRIORITY_CI_ENABLED == 'true' && github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && github.event.pull_request.draft == false && github.event.repository.private == false && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot' && contains(github.event.pull_request.labels.*.name, 'ci:priority')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      admitted: ${{ steps.route.outputs.admitted }}
      run_label_event: ${{ steps.route.outputs.run_label_event }}
      run_attempt: ${{ steps.route.outputs.run_attempt }}
      runner_x64: ${{ steps.route.outputs.runner_x64 }}
      runner_build: ${{ steps.route.outputs.runner_build }}
      runner_arm: ${{ steps.route.outputs.runner_arm }}
    steps:
      - name: Check out the trusted priority router
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: uzh-bf/klicker-uzh
          ref: v3
          path: .ci-priority
          sparse-checkout: .github/actions/priority-ci-route
          persist-credentials: false
      - name: Route priority validation
        id: route
        uses: ./.ci-priority/.github/actions/priority-ci-route
  filter:
    needs: priority-route
    if: "!cancelled() && (github.event.action != 'labeled' || needs.priority-route.outputs.run_label_event == 'true')"
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ github.event_name == 'push' && 'true' || steps.check.outputs.should_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check for changes
        id: check
        uses: ./.github/actions/changed-paths
        with:
          pattern: ^(apps/frontend-pwa/|apps/frontend-manage/|apps/frontend-control/|apps/auth/|apps/chat/|packages/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.npmrc$|turbo\.json$|tsconfig\.json$|\.github/workflows/test-intl-production\.yml$|\.github/scripts/intl-production-smoke\.mjs$|\.github/fixtures/intl-production/|util/test-intl-resolution\.mjs$|\.github/actions/changed-paths/|\.github/scripts/required-ci-status\.cjs$)
          prior-check-name: test-intl-production-status
  intl-production-smoke:
    name: intl-production-smoke (${{ matrix.app }})
    needs:
      - filter
      - priority-route
    if: "!cancelled() && (github.event.action != 'labeled' || needs.priority-route.outputs.run_label_event == 'true') && (needs.priority-route.outputs.admitted != 'true' || needs.priority-route.outputs.run_attempt == format('{0}', github.run_attempt)) && needs.filter.outputs.should_run == 'true'"
    runs-on: ${{ needs.priority-route.outputs.runner_x64 || 'ubuntu-24.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app:
          - frontend-pwa
          - frontend-manage
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build and render through the production provider
        run: node .github/scripts/intl-production-smoke.mjs '${{ matrix.app }}' '${{ github.event.pull_request.head.sha || github.sha }}'
  test-intl-production-status:
    name: ${{ (github.event.action != 'labeled' || needs.priority-route.outputs.run_label_event == 'true') && 'test-intl-production-status' || 'test-intl-production-status (priority not admitted)' }}
    needs:
      - filter
      - intl-production-smoke
      - priority-route
    if: always() && (github.event.action != 'labeled' || needs.priority-route.outputs.run_label_event == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Report required status
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true }}
          FILTER_RESULT: ${{ needs.filter.result }}
          SHOULD_RUN: ${{ needs.filter.outputs.should_run }}
          TEST_RESULT: ${{ needs.intl-production-smoke.result }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_PATH: .github/workflows/test-intl-production.yml
          TERMINAL_JOB: test-intl-production-status
          EVIDENCE_PATH: required-ci-evidence.json
          SELECTION_JOB: filter
          SELECTION_JOB_RESULT: ${{ needs.filter.result }}
          SUITE_JOBS: '["intl-production-smoke (frontend-pwa)","intl-production-smoke (frontend-manage)"]'
          SUITE_JOB_RESULT: ${{ needs.intl-production-smoke.result }}
        run: node .github/scripts/required-ci-status.cjs report
      - name: Upload required CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: required-ci-evidence
          path: required-ci-evidence.json
          if-no-files-found: error
          retention-days: 7
      - id: priority_result
        if: always()
        env:
          TERMINAL_RESULT: ${{ job.status }}
        run: echo "result=$TERMINAL_RESULT" >> "$GITHUB_OUTPUT"
    outputs:
      required_result: ${{ steps.priority_result.outputs.result }}
