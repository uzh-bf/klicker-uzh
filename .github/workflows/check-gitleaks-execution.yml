# Generated by .github/scripts/priority-ci-workflows.cjs; edit the canonical workflow.
name: Check for secrets (gitleaks) priority execution
on:
  workflow_call:
    outputs:
      required_result:
        description: Actual required terminal job result
        value: ${{ jobs.check-gitleaks.outputs.required_result }}
      run_label_event:
        description: Whether label-only work was admitted
        value: ${{ jobs.priority-route.outputs.run_label_event }}
permissions:
  contents: read
jobs:
  priority-route:
    if: vars.PRIORITY_CI_ENABLED == 'true' && github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && github.event.pull_request.draft == false && github.event.repository.private == false && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot' && contains(github.event.pull_request.labels.*.name, 'ci:priority')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      admitted: ${{ steps.route.outputs.admitted }}
      run_label_event: ${{ steps.route.outputs.run_label_event }}
      run_attempt: ${{ steps.route.outputs.run_attempt }}
      runner_x64: ${{ steps.route.outputs.runner_x64 }}
      runner_build: ${{ steps.route.outputs.runner_build }}
      runner_arm: ${{ steps.route.outputs.runner_arm }}
    steps:
      - name: Check out the trusted priority router
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: uzh-bf/klicker-uzh
          ref: v3
          path: .ci-priority
          sparse-checkout: .github/actions/priority-ci-route
          persist-credentials: false
      - name: Route priority validation
        id: route
        uses: ./.ci-priority/.github/actions/priority-ci-route
  check-gitleaks:
    name: ${{ (github.event.action != 'labeled' || needs.priority-route.outputs.run_label_event == 'true') && 'check-gitleaks' || 'check-gitleaks (priority not admitted)' }}
    needs: priority-route
    if: "!cancelled() && (github.event.action != 'labeled' || needs.priority-route.outputs.run_label_event == 'true')"
    runs-on: ${{ needs.priority-route.outputs.run_attempt == format('{0}', github.run_attempt) && needs.priority-route.outputs.runner_x64 || 'ubuntu-latest' }}
    timeout-minutes: ${{ needs.priority-route.outputs.admitted == 'true' && 15 || 360 }}
    steps:
      - name: Reject a stale paid preparation
        if: needs.priority-route.outputs.admitted == 'true' && needs.priority-route.outputs.run_attempt != format('{0}', github.run_attempt)
        run: exit 1
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        shell: bash
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            /tmp/gitleaks.tar.gz | sha256sum --check --status
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan introduced commits for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          if [[ -z "$BASE_SHA" || -z "$HEAD_SHA" ]]; then
            echo 'Unable to determine the commit range for the secret scan.'
            exit 1
          fi

          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'The secret scan received an invalid commit SHA.'
            exit 1
          fi

          if [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            if [[ -z "$DEFAULT_BRANCH" ]] || ! git check-ref-format --branch "$DEFAULT_BRANCH" >/dev/null 2>&1; then
              echo 'Unable to determine a valid default branch for the branch-creation scan.'
              exit 1
            fi

            if ! git fetch --no-tags origin "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"; then
              echo 'Unable to fetch the default branch for the branch-creation scan.'
              exit 1
            fi

            if ! BASE_SHA="$(git merge-base "$HEAD_SHA" "refs/remotes/origin/$DEFAULT_BRANCH")"; then
              echo 'Unable to resolve a merge base for the branch-creation scan.'
              exit 1
            fi

            if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo 'The branch-creation scan resolved an invalid merge base.'
              exit 1
            fi
          fi

          LOG_OPTS="$BASE_SHA..$HEAD_SHA"

          # Scan only commits introduced by this push or pull request so
          # historical findings are not re-reported as newly introduced leaks.
          gitleaks git --log-opts="$LOG_OPTS" --no-banner --redact --config .gitleaks.toml
      - id: priority_result
        if: always()
        env:
          TERMINAL_RESULT: ${{ job.status }}
        run: echo "result=$TERMINAL_RESULT" >> "$GITHUB_OUTPUT"
    outputs:
      required_result: ${{ steps.priority_result.outputs.result }}
