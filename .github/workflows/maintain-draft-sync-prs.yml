name: Maintain draft sync PRs

on:
  # Run from v3 even before the controller has propagated to v3-ai.
  workflow_run:
    workflows: ['Check codebase']
    types: [completed]
    branches: ['v3', 'v3-ai']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview missing sync PRs without creating them'
        type: boolean
        default: true
        required: true

concurrency:
  group: maintain-draft-sync-prs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  maintain:
    if: >-
      github.repository == 'uzh-bf/klicker-uzh' &&
      github.ref == 'refs/heads/v3' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      # Sync-branch updates must come from a non-GITHUB_TOKEN identity, because
      # GITHUB_TOKEN pushes start no workflows and the PR would never get CI.
      - name: Maintain draft sync PRs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          HAS_SYNC_TOKEN: ${{ secrets.SYNC_PR_BOT_TOKEN != '' }}
        with:
          github-token: ${{ secrets.SYNC_PR_BOT_TOKEN || github.token }}
          script: |
            const { maintainDraftSyncPrs } = require('./.github/scripts/draft-sync-prs.cjs')
            const dryRun = process.env.DRY_RUN !== 'false'
            if (!dryRun && process.env.HAS_SYNC_TOKEN !== 'true') {
              core.setFailed('secrets.SYNC_PR_BOT_TOKEN is not set')
              return
            }
            const results = await maintainDraftSyncPrs({ github, context, dryRun })
            for (const { branch, base, action, number } of results) {
              core.info(`${branch} -> ${base}: ${action}${number ? ` #${number}` : ''}`)
              if (action === 'conflict') {
                core.warning(`${branch} conflicts with its source; resolve it on #${number}.`)
              }
            }
