name: Build Docker image for lti (stg)

on:
  push:
    branches:
      - 'v3'
      - 'v3*'
  pull_request:
    # branches: [ "v3" ]
    # "edited" re-evaluates the path filter when a pull request is retargeted,
    # so newly applicable images are built instead of keeping the old result.
    types: [opened, synchronize, reopened, edited, ready_for_review]
    paths:
      # The Dockerfile runs 'turbo prune --scope=@klicker-uzh/lti-service'. Only that
      # workspace dependency closure reaches the image, so a change outside
      # it cannot alter this build and must not trigger it.
      - 'apps/lti/**'
      - 'packages/grading/**'
      - 'packages/prisma/**'
      - 'packages/types/**'
      - 'packages/util/**'
      - 'packages/logging/**'
      # Root dependency and build inputs: the image build runs turbo prune
      # against these files, so a root dependency change can alter any image.
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.dockerignore'
      - '.github/workflows/v3_lti-stg**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/lti

jobs:
  build-arm:
    runs-on: ubuntu-24.04-arm
    # draft pull requests defer their image builds; marking the
    # pull request ready re-runs this build on the unchanged head
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-arm
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=${{ github.sha }}

      - name: Check full-SHA image tag
        id: publish_guard
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-arm
          SHA: ${{ github.sha }}
        shell: bash
        run: .github/scripts/stg-image-publish-guard.sh

      - name: Build and push Docker image
        if: github.event_name == 'pull_request' || steps.publish_guard.outputs.publish == 'true'
        uses: docker/build-push-action@v3
        with:
          context: .
          file: apps/lti/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/arm64
          no-cache: ${{ github.event_name == 'push' }}
          cache-from: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && format('type=registry,ref={0}/{1}-arm:buildcache', env.REGISTRY, env.IMAGE_NAME) || '' }}
          cache-to: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && format('type=registry,ref={0}/{1}-arm:buildcache,mode=max', env.REGISTRY, env.IMAGE_NAME) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
  build-amd:
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-amd
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=${{ github.sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          file: apps/lti/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
