name: Diagnose stack topology request

on:
  push:
    branches: [rs/final-stack-topology-openrouter]
    paths: [.github/workflows/diagnose-stack-topology.yml]

permissions:
  actions: read
  contents: read

jobs:
  probe:
    if: github.repository == 'uzh-bf/klicker-uzh'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/open-code-review
      - name: Download fixed public stack snapshot
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: final-ai-stack-manifest-39148616893
          run-id: 39148616893
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/topology-manifest
      - name: Download completed public code review
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: final-ai-stack-publisher-failure-39148616893-1
          run-id: 39148616893
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/topology-code
      - name: Validate full topology through Mistral
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const { callTopologyModel, readSnapshotBundle, FINAL_STACK_REVIEW_MODEL } = require('./.github/scripts/final-ai-stack-review.js')
          async function main() {
            const root = process.env.RUNNER_TEMP
            const result = await callTopologyModel({
              apiKey: process.env.MISTRAL_API_KEY,
              manifestBundle: readSnapshotBundle(`${root}/topology-manifest/final-ai-stack-manifest.json`, '9ecdb31e9930306ad5243a8c674873b5bb8310bcc577913f9184f0377c3ec6bf'),
              codeResult: JSON.parse(fs.readFileSync(`${root}/topology-code/final-ai-stack-code-result.json`, 'utf8')),
              fetchImpl: async (url, options) => {
                const response = await fetch(url, options)
                const payload = await response.clone().json()
                const errorText = response.ok ? '' : JSON.stringify(payload).toLowerCase()
                const markers = ['uniqueItems', 'maxItems', 'minItems', 'minLength', 'maxLength', 'minimum', 'const', '$schema', 'max_tokens', 'reasoning_effort', 'json_schema', 'response_format', 'strict', 'unsupported', 'invalid', 'context', 'quota', 'credits', 'balance', 'budget', 'tokens', 'schema', 'grammar', 'too large', 'too small'].filter(word => errorText.includes(word.toLowerCase()))
                const choice = payload?.choices?.[0]
                console.log(JSON.stringify({ status: response.status, error_markers: markers, model_matches: payload.model === FINAL_STACK_REVIEW_MODEL, finish_reason: ['stop', 'length'].includes(choice?.finish_reason) ? choice.finish_reason : 'other', completion_tokens: payload.usage?.completion_tokens }))
                return response
              },
            })
            console.log(JSON.stringify({ validated: true, findings: result.comments.length, usage: result.usage }))
          }
          main().catch(() => { console.error('topology_diagnostic_failed'); process.exitCode = 1 })
          NODE
