        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}

  # Scans the exact digest its build published. Only a push publishes an image,
  # so the job is limited to non-pull-request events. The digest arrives through
  # an artifact rather than a matrix job output, because a matrix job reports
  # only the outputs of its last completed leg.
  scan:
    needs: [plan, build-migrator, build, build-after-migrator]
    if: >-
      needs.plan.outputs.scan-build == 'true' &&
      github.event_name != 'pull_request'
    name: ${{ matrix.jobName }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      # Both arm images publish a single-platform index whose only child is
      # linux/arm64. Trivy derives an unspecified --platform from the scanner
      # it happens to run as, which selected linux/amd64 on this runner and
      # failed with "no child with platform linux/amd64 in index". The platform
      # is part of the scan contract the receipt records below.
      TRIVY_PLATFORM: linux/arm64
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.scan-matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download the published digest
        uses: actions/download-artifact@v4
        with:
          name: build-digest-${{ matrix.id }}
          path: ${{ runner.temp }}/digest

      - name: Require the digest from the build job
        env:
          DIGEST_PATH: ${{ runner.temp }}/digest/digest.txt
        run: |
          set -euo pipefail
          if [ ! -s "$DIGEST_PATH" ]; then
            echo "::error::the scan leg received no image digest, so there is nothing immutable to scan."
            exit 1
          fi
          printf 'DIGEST=%s\n' "$(cat "$DIGEST_PATH")" >> "$GITHUB_ENV"

      - name: Log into registry
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan the pushed image for vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: ${{ format('{0}/{1}/{2}-arm@{3}', 'ghcr.io', github.repository, matrix.image, env.DIGEST) }}
          format: json
          # ignore-unfixed keeps its false default so the report also shows
          # unfixed findings; the policy step below decides the exit code.
          severity: HIGH,CRITICAL
          exit-code: '0'
          output: image-scan-${{ matrix.jobBase }}-arm-findings.json
          timeout: 10m

      - name: Generate a CycloneDX SBOM
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: ${{ format('{0}/{1}/{2}-arm@{3}', 'ghcr.io', github.repository, matrix.image, env.DIGEST) }}
          # Without an explicit scanners input Trivy builds the SBOM from the
          # image packages and adds no vulnerability findings to it.
          format: cyclonedx
          exit-code: '0'
          output: image-scan-${{ matrix.jobBase }}-arm-sbom.cdx.json
          timeout: 10m

      # The engine version and action ref below must stay identical to the two
      # scan steps above; the receipt records what actually scanned the image.
      - name: Write the scan receipt
        run: |
          node .github/scripts/image-scan-receipt.cjs receipt \
            --output image-scan-${{ matrix.jobBase }}-arm-receipt.json \
            --image "${{ format('{0}/{1}/{2}-arm@{3}', 'ghcr.io', github.repository, matrix.image, env.DIGEST) }}" \
            --digest "$DIGEST" \
            --architecture linux/arm64 \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --git-sha "$GITHUB_SHA" \
            --engine-version v0.74.0 \
            --action-ref aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 \
            --findings image-scan-${{ matrix.jobBase }}-arm-findings.json \
            --sbom image-scan-${{ matrix.jobBase }}-arm-sbom.cdx.json

      - name: Upload the scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-scan-${{ matrix.jobBase }}-arm
          path: |
            image-scan-${{ matrix.jobBase }}-arm-findings.json
            image-scan-${{ matrix.jobBase }}-arm-sbom.cdx.json
            image-scan-${{ matrix.jobBase }}-arm-receipt.json
          if-no-files-found: warn

      - name: Enforce the fixable HIGH/CRITICAL policy
        run: |
          node .github/scripts/image-scan-receipt.cjs check \
            --report image-scan-${{ matrix.jobBase }}-arm-findings.json

  # The single required status context for affected image builds. It is reported
  # for every v3 / v3-* pull request and push without a path filter, so the
  # required check can never be satisfied by a workflow-level path skip. It
  # requires every actually affected image build to succeed in this run and
  # passes only a validated no-change selection. Draft pull requests defer their
  # image builds, so a draft evaluation passes without polling and marks the
  # evidence as a draft skip; marking the pull request ready fires
  # ready_for_review on the unchanged head, restores the deferred builds, and
  # this required context recomputes against them.
  build-images-status:
    needs:
      - plan
      - build
      - build-after-migrator
      - build-amd
      - build-migrator
      - scan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Report affected image build status
        if: ${{ !cancelled() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BUILD_STATUS_EVIDENCE_PATH: ${{ runner.temp }}/required-ci-evidence.json
          PLAN_AMD_JOB_NAMES: ${{ needs.plan.outputs.amd-job-names }}
          PLAN_BUILD_JOB_NAMES: ${{ needs.plan.outputs.build-job-names }}
          PLAN_CHANGED_FILE_COUNT: ${{ needs.plan.outputs.changed-file-count }}
          PLAN_MODE: ${{ needs.plan.outputs.mode }}
          PLAN_REASON: ${{ needs.plan.outputs.reason }}
          PLAN_RESULT: ${{ needs.plan.result }}
          PLAN_SCAN_JOB_NAMES: ${{ needs.plan.outputs.scan-job-names }}
          PLAN_SELECTED: ${{ needs.plan.outputs.selected }}
          PLAN_STATE: ${{ needs.plan.outputs.state }}
          PLAN_UNAVAILABLE: ${{ needs.plan.outputs.unavailable }}
        with:
          script: |
            const {
              evaluateStagingImageStatus,
            } = require('./.github/scripts/staging-image-status.cjs')
            await evaluateStagingImageStatus({ github, context, core })

      - name: Upload build status evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: required-ci-evidence
          path: ${{ runner.temp }}/required-ci-evidence.json
