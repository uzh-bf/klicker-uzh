name: Build staging images
run-name: ${{ inputs.correlationId }}

# One workflow replaces the thirteen per-image staging publications and the
# separate Build Fallback reporter. It resolves the changed-image selection
# inside the run instead of through per-image path filters, so a single run
# covers every affected image, and its terminal job owns the required
# 'build-images-status' context together with the 'required-ci-evidence'
# artifact the staging promotion controller admits.
#
# The image inventory is trusted controller input:
# .github/scripts/staging-image-targets.cjs is read from the same revision as
# this workflow, and the promotion controller validates the candidate against
# its own copy of that inventory before it promotes anything.
#
# A publication and a pull request use different BuildKit registry caches. A
# pull request reads and writes only the untrusted namespace, which no
# publication reads, so no unreviewed revision can seed a published image. A
# publication reads and writes only the trusted namespace of the current epoch:
# it reuses the install and build layers the branch has already produced, while
# the 'apk upgrade' base layer of every image is rebuilt at least once per epoch
# instead of aging indefinitely behind a permanent cache hit. The previous
# epoch is deliberately not imported, and nothing here replaces the fixable
# HIGH/CRITICAL admission the scan job still enforces on the pushed digest.
on:
  push:
    branches:
      - 'v3'
      - 'v3*'
  pull_request:
    branches:
      - 'v3'
      - 'v3*'
    # No "edited": a title or body edit never changes the tested tree, and a
    # base retarget is revalidated by the restack push or a close and reopen.
    # ready_for_review recomputes the required context against the builds that
    # the ready boundary restores.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      buildConfigurationJson:
        description: Canonical non-secret deployment build configuration JSON
        required: true
        type: string
      correlationId:
        description: Unique preview publication correlation ID
        required: true
        type: string
      platform:
        description: Native platform to build
        required: true
        type: choice
        options:
          - linux/amd64
          - linux/arm64
      sourceSha:
        description: Exact candidate commit SHA to check out and publish
        required: true
        type: string
      targets:
        description: Comma-separated logical preview targets
        required: true
        type: string

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('{0}-preview-{1}', github.workflow, inputs.correlationId) || format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref_name) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  actions: read
  contents: read

jobs:
  plan:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      after-migrator-build: ${{ steps.plan.outputs.after-migrator-build }}
      after-migrator-matrix: ${{ steps.plan.outputs.after-migrator-matrix }}
      amd-build: ${{ steps.plan.outputs.amd-build }}
      amd-job-names: ${{ steps.plan.outputs.amd-job-names }}
      amd-matrix: ${{ steps.plan.outputs.amd-matrix }}
      build: ${{ steps.plan.outputs.build }}
      build-job-names: ${{ steps.plan.outputs.build-job-names }}
      cache-epoch: ${{ steps.cache_epoch.outputs.epoch }}
      changed-file-count: ${{ steps.plan.outputs.changed-file-count }}
      matrix: ${{ steps.plan.outputs.matrix }}
      migrator-build: ${{ steps.plan.outputs.migrator-build }}
      migrator-matrix: ${{ steps.plan.outputs.migrator-matrix }}
      mode: ${{ steps.plan.outputs.mode }}
      reason: ${{ steps.plan.outputs.reason }}
      scan-build: ${{ steps.plan.outputs.scan-build }}
      scan-job-names: ${{ steps.plan.outputs.scan-job-names }}
      scan-matrix: ${{ steps.plan.outputs.scan-matrix }}
      selected: ${{ steps.plan.outputs.selected }}
      state: ${{ steps.plan.outputs.state }}
      unavailable: ${{ steps.plan.outputs.unavailable }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The trusted cache namespace is scoped to one epoch so a publication can
      # reuse install and build layers within the epoch but can never inherit
      # the base packages of an older one. See the workflow header.
      - name: Resolve the trusted cache epoch
        id: cache_epoch
        run: |
          set -euo pipefail
          epoch="$(date -u +%G-W%V)"
          printf 'epoch=%s\n' "$epoch" >> "$GITHUB_OUTPUT"
          printf 'Publication image cache epoch: %s\n' "$epoch" >> "$GITHUB_STEP_SUMMARY"

      - name: Determine changed files
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGED_FILES_PATH: ${{ runner.temp }}/changed-files.txt
        run: |
          set -uo pipefail
          rm -f "$CHANGED_FILES_PATH"
          # Fetch the immutable event endpoints and their ancestry without
          # replacing the merge-tree checkout used by the reporting scripts.
          fetch_args=(--no-tags)
          if [ "$(git rev-parse --is-shallow-repository)" = 'true' ]; then
            fetch_args+=(--unshallow)
          fi
          if ! git fetch "${fetch_args[@]}" origin "$BASE_SHA" "$HEAD_SHA"; then
            echo "::error::unable to fetch pull-request comparison ancestry"
            exit 1
          fi
          # Publisher path filters use the PR head's changes since the merge
          # base. Base-only changes must not require undispatched publishers.
          if ! merge_base=$(git merge-base --all "$BASE_SHA" "$HEAD_SHA") ||
            [[ -z "$merge_base" || "$merge_base" == *$'\n'* ]]; then
            echo "::error::pull-request comparison requires one unambiguous merge base"
            exit 1
          fi
          if ! git diff --name-only "$merge_base" "$HEAD_SHA" \
            > "$CHANGED_FILES_PATH"; then
            rm -f "$CHANGED_FILES_PATH"
            echo "::error::unable to establish pull-request merge-base comparison"
            exit 1
          fi
          echo "changed files: event head compared with event merge base"

      - name: Resolve the affected staging images
        id: plan
        env:
          CHANGED_FILES_PATH: ${{ runner.temp }}/changed-files.txt
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_DRAFT: ${{ github.event.pull_request.draft }}
        run: node .github/scripts/staging-image-plan.cjs

  build-migrator:
    needs: plan
    if: >-
      github.event_name != 'workflow_dispatch' &&
      needs.plan.outputs.migrator-build == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.draft == false)
    name: ${{ matrix.jobName }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.migrator-matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run util/sync-schema.sh
        if: matrix.syncSchema
        run: util/sync-schema.sh

      - name: Prepare the staging environment
        if: matrix.prep != ''
        shell: bash
        run: |
          set -euo pipefail
          ${{ matrix.prep }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve input fingerprint reuse
        id: fingerprint
        if: github.event_name != 'pull_request' && matrix.reuse == true
        uses: ./.github/actions/staging-image-input-fingerprint
        with:
          fingerprint-output: ${{ runner.temp }}/image-input-fingerprint-${{ matrix.id }}.json
          image: ${{ format('{0}/{1}/{2}-arm', 'ghcr.io', github.repository, matrix.image) }}
          reuse-record: ${{ runner.temp }}/image-reuse-${{ matrix.id }}.json
          sha: ${{ github.sha }}
          target: ${{ matrix.id }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ format('{0}/{1}/{2}-arm', 'ghcr.io', github.repository, matrix.image) }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=${{ github.sha }}

      - name: Check full-SHA image tag
        id: publish_guard
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ format('{0}/{1}/{2}-arm', 'ghcr.io', github.repository, matrix.image) }}
          SHA: ${{ github.sha }}
        shell: bash
        run: .github/scripts/stg-image-publish-guard.sh

      - name: Build and push Docker image
        id: build
        if: github.event_name == 'pull_request' || steps.publish_guard.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/arm64
          # A publication reads and writes only the trusted namespace of the
          # current epoch; a pull request reads and writes only the untrusted
          # one. See the workflow header for the freshness contract.
          cache-from: ${{ github.event_name == 'push' && format('type=registry,ref=ghcr.io/{0}/{1}-arm:buildcache-trusted-{2}', github.repository, matrix.image, needs.plan.outputs.cache-epoch) || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && format('type=registry,ref=ghcr.io/{0}/{1}-arm:buildcache', github.repository, matrix.image) || '' }}
          cache-to: ${{ github.event_name == 'push' && format('type=registry,ref=ghcr.io/{0}/{1}-arm:buildcache-trusted-{2},mode=max', github.repository, matrix.image, needs.plan.outputs.cache-epoch) || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && format('type=registry,ref=ghcr.io/{0}/{1}-arm:buildcache,mode=max', github.repository, matrix.image) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
      # A publication that built an image publishes its input fingerprint under
      # the fingerprint tag, which is what lets a later commit with the same
      # inputs adopt this digest instead of rebuilding it.
      - name: Publish the input fingerprint tag
        if: >-
          github.event_name != 'pull_request' &&
          matrix.reuse == true &&
          steps.publish_guard.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ format('{0}/{1}/{2}-arm', 'ghcr.io', github.repository, matrix.image) }}
          MODE: write
          TAG: ${{ steps.fingerprint.outputs.tag }}
        shell: bash
        run: .github/scripts/stg-image-reuse-guard.sh

      # Only a push publishes, so only a push produces a digest; the scan that
      # consumes it is likewise limited to publish events.
      - name: Record the published digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.publish_guard.outputs.digest || steps.build.outputs.digest }}
          DIGEST_PATH: ${{ runner.temp }}/digest.txt
        run: |
          set -euo pipefail
          if [ -z "$DIGEST" ]; then
            echo "::error::the build produced no digest, so nothing immutable can be scanned"
            exit 1
          fi
          printf '%s\n' "$DIGEST" > "$DIGEST_PATH"

      - name: Upload the published digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: build-digest-${{ matrix.id }}
          # The fingerprint record travels with the digest so the promotion
          # controller can bind a reused digest to its input identity.
          path: |
            ${{ runner.temp }}/digest.txt
            ${{ runner.temp }}/image-input-fingerprint-${{ matrix.id }}.json
            ${{ runner.temp }}/image-reuse-${{ matrix.id }}.json

  build:
    needs: plan
    if: >-
      github.event_name != 'workflow_dispatch' &&
      needs.plan.outputs.build == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.draft == false)
    name: ${{ matrix.jobName }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run util/sync-schema.sh
        if: matrix.syncSchema
        run: util/sync-schema.sh

      - name: Prepare the staging environment
        if: matrix.prep != ''
        shell: bash
        run: |
          set -euo pipefail
          ${{ matrix.prep }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
