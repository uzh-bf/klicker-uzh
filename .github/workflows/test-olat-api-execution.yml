# Generated by .github/scripts/priority-ci-workflows.cjs; edit the canonical workflow.
name: Test OLAT-API functionalities priority execution
on:
  workflow_call:
    outputs:
      required_result:
        description: Actual required terminal job result
        value: ${{ jobs.test-olat-api-status.outputs.required_result }}
      run_label_event:
        description: Whether label-only work was admitted
        value: ${{ jobs.priority-route.outputs.run_label_event }}
permissions:
  contents: read
  checks: read
jobs:
  priority-route:
    if: vars.PRIORITY_CI_ENABLED == 'true' && github.event_name == 'pull_request' && github.event.pull_request.state == 'open' && github.event.pull_request.draft == false && github.event.repository.private == false && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot' && contains(github.event.pull_request.labels.*.name, 'ci:priority')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      admitted: ${{ steps.route.outputs.admitted }}
      run_label_event: ${{ steps.route.outputs.run_label_event }}
      run_attempt: ${{ steps.route.outputs.run_attempt }}
      job_timeout: ${{ steps.route.outputs.job_timeout }}
      runner_x64: ${{ steps.route.outputs.runner_x64 }}
      runner_build: ${{ steps.route.outputs.runner_build }}
      runner_arm: ${{ steps.route.outputs.runner_arm }}
    steps:
      - name: Check out the trusted priority router
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: uzh-bf/klicker-uzh
          ref: v3
          path: .ci-priority
          sparse-checkout: .github/actions/priority-ci-route
          persist-credentials: false
      - name: Route priority validation
        id: route
        uses: ./.ci-priority/.github/actions/priority-ci-route
  filter:
    needs: priority-route
    if: "!cancelled() && (github.event.action != 'labeled' || needs.priority-route.outputs.run_label_event == 'true')"
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ github.event_name == 'push' && 'true' || steps.check.outputs.should_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check for changes
        id: check
        uses: ./.github/actions/changed-paths
        with:
          pattern: ^(apps/olat-api/|packages/prisma/|packages/grading/|packages/util/|package\.json$|pnpm-lock\.yaml$|tsconfig\.json$|\.github/workflows/test-olat-api\.yml$|\.github/actions/changed-paths/|\.github/scripts/required-ci-status\.cjs$)
          prior-check-name: test-olat-api-status
  test-olat-api:
    needs:
      - filter
      - priority-route
    if: "!cancelled() && (github.event.action != 'labeled' || needs.priority-route.outputs.run_label_event == 'true') && (needs.priority-route.outputs.admitted != 'true' || needs.priority-route.outputs.run_attempt == format('{0}', github.run_attempt)) && needs.filter.outputs.should_run == 'true'"
    runs-on: ${{ needs.priority-route.outputs.runner_x64 || 'ubuntu-latest' }}
    timeout-minutes: ${{ needs.priority-route.outputs.admitted == 'true' && fromJSON(needs.priority-route.outputs.job_timeout || '60') || 360 }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Define node version
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: true
      - name: Run tests using Docker
        run: |
          cd packages/prisma
          pnpm run build
          cd ../grading
          pnpm run build
          cd ../util
          pnpm run build
          cd ../../apps/olat-api
          pnpm run test
  test-olat-api-status:
    name: ${{ (github.event.action != 'labeled' || needs.priority-route.outputs.run_label_event == 'true') && 'test-olat-api-status' || 'test-olat-api-status (priority not admitted)' }}
    needs:
      - filter
      - test-olat-api
      - priority-route
    if: always() && (github.event.action != 'labeled' || needs.priority-route.outputs.run_label_event == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Report required status
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true }}
          FILTER_RESULT: ${{ needs.filter.result }}
          SHOULD_RUN: ${{ needs.filter.outputs.should_run }}
          TEST_RESULT: ${{ needs.test-olat-api.result }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_PATH: .github/workflows/test-olat-api.yml
          TERMINAL_JOB: test-olat-api-status
          EVIDENCE_PATH: required-ci-evidence.json
          SELECTION_JOB: filter
          SELECTION_JOB_RESULT: ${{ needs.filter.result }}
          SUITE_JOB: test-olat-api
          SUITE_JOB_RESULT: ${{ needs.test-olat-api.result }}
        run: node .github/scripts/required-ci-status.cjs report
      - name: Upload required CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: required-ci-evidence
          path: required-ci-evidence.json
          if-no-files-found: error
          retention-days: 7
      - id: priority_result
        if: always()
        env:
          TERMINAL_RESULT: ${{ job.status }}
        run: echo "result=$TERMINAL_RESULT" >> "$GITHUB_OUTPUT"
    outputs:
      required_result: ${{ steps.priority_result.outputs.result }}
