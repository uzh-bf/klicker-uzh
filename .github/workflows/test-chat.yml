name: Test chat app functionalities

on:
  push:
    branches: ['v3', 'v3*']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  test-chat:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for changes
        id: filter
        uses: ./.github/actions/changed-paths
        with:
          pattern: '^(apps/chat/|packages/(i18n|prisma|graphql|types|grading|util|shared-components|markdown|next-config)/|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.json|\.github/workflows/test-chat\.yml|\.github/actions/changed-paths/)'

      - name: Define node version
        if: steps.filter.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - uses: pnpm/action-setup@v4
        if: steps.filter.outputs.should_run == 'true'
        with:
          version: 11.5.0
          run_install: true

      # The chat tests import workspace packages whose package entries point
      # at generated dist files, so the whole dependency closure must be built
      # first. The filter builds exactly chat's workspace dependencies in
      # topological order, so a newly added dependency needs no change here.
      - name: Build chat dependencies
        if: steps.filter.outputs.should_run == 'true'
        shell: bash
        run: pnpm --filter "@klicker-uzh/chat^..." run build

      - name: Test chat app
        if: steps.filter.outputs.should_run == 'true'
        shell: bash
        run: pnpm --filter @klicker-uzh/chat test:run
