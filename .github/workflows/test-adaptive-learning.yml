name: Rehearse Catalyst adaptive migrations

# Standalone feature tests run in Catalyst. This host rehearsal is deliberately
# manual until private-checkout access is wired into the trusted CI envelope.
# Configure required reviewers on this environment before adding its credential.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  migration-rehearsal:
    environment: catalyst-integration
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: klicker-prod
          POSTGRES_USER: klicker
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U klicker -d klicker-prod"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Require approved Catalyst access
        env:
          CATALYST_READ_TOKEN: ${{ secrets.CATALYST_READ_TOKEN }}
        run: |
          if [ -z "$CATALYST_READ_TOKEN" ]; then
            echo 'Configure a read-only Catalyst token in the protected catalyst-integration environment.' >&2
            exit 1
          fi
      - name: Resolve the pinned Catalyst revision
        id: catalyst
        run: |
          revision=$(git rev-parse HEAD:external/catalyst)
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned Catalyst packages
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: uzh-bf/klicker-uzh-catalyst
          ref: ${{ steps.catalyst.outputs.revision }}
          path: external/catalyst
          token: ${{ secrets.CATALYST_READ_TOKEN }}
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.5.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Rehearse adaptive IRT v2 migrations
        run: pnpm --filter @klicker-uzh/prisma verify:adaptive-irt-v2-migration
        env:
          DATABASE_URL: postgresql://klicker:${{ github.run_id }}@localhost:5432/klicker-prod
