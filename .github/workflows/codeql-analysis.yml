# CodeQL static security analysis, scoped to security queries. Sonar keeps the
# maintainability and duplication role for this repository.
#
# Languages: JavaScript/TypeScript, the analytics Python sources, and the GitHub
# Actions workflows themselves. All three are interpreted, so the analysis needs
# no build step.
#
# The `security-extended` query suite is a PILOT: this workflow is not a required
# status check yet, and its blocking policy is decided from the representative
# findings and the analysis runtime it produces.
name: 'CodeQL'

on:
  push:
    branches: ['v3', 'v3*']
  pull_request:
    # The branches below must be a subset of the branches above
    branches: ['v3', 'v3*']
    # "edited" re-analyzes when a pull request is retargeted to another base
    # branch, so a stale result cannot stand in for the new base.
    types: [opened, synchronize, reopened, edited, ready_for_review]
  schedule:
    - cron: '21 7 * * 3'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  analyze:
    # Event-aware draft handling: push and schedule runs carry no
    # `pull_request.draft` field, so a bare draft check would skip them.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # Interpreted languages only. "actions" analyzes the workflow files in
        # this repository.
        language: ['javascript-typescript', 'python', 'actions']

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@311b4ee155dcdab395044f00946f664bd51ff173 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          # PILOT: the broader security-extended suite runs here to measure
          # representative findings and runtime cost. The workflow is not a
          # required check yet, so the suite has no blocking policy.
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@311b4ee155dcdab395044f00946f664bd51ff173 # v4.38.0
