name: Build Fallback

# The single required status context for affected image builds. This workflow
# runs for every v3 / v3-* pull request and push without a path filter, so the
# required 'build-images-status' check is always reported and can never be
# satisfied by a workflow-level path skip. It requires every actually affected
# v3_*-stg.yml image build to succeed for the same event, branch and commit, and
# passes only a validated no-change selection. Draft pull requests defer their
# image builds, so a draft evaluation passes without polling and marks the
# evidence as a draft skip; marking the pull request ready fires
# ready_for_review on the unchanged head, restores the deferred builds, and this
# required context recomputes against them.
on:
  push:
    branches:
      - 'v3'
      - 'v3*'
  pull_request:
    branches:
      - 'v3'
      - 'v3*'
    # "edited" re-evaluates the selection when a pull request is retargeted;
    # ready_for_review recomputes the required context against the builds that
    # the ready boundary restores.
    types: [opened, synchronize, reopened, edited, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  build-images-status:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Polling delays take up to 29.5 minutes; API time also counts toward
      # the job timeout. A timeout blocks qualification.
      BUILD_STATUS_MAX_ATTEMPTS: '60'
      BUILD_STATUS_RETRY_DELAY_MS: '30000'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine changed files
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGED_FILES_PATH: ${{ runner.temp }}/changed-files.txt
        run: |
          set -uo pipefail
          rm -f "$CHANGED_FILES_PATH"
          # Fetch the immutable event endpoints and their ancestry without
          # replacing the merge-tree checkout used by the reporting scripts.
          fetch_args=(--no-tags)
          if [ "$(git rev-parse --is-shallow-repository)" = 'true' ]; then
            fetch_args+=(--unshallow)
          fi
          if ! git fetch "${fetch_args[@]}" origin "$BASE_SHA" "$HEAD_SHA"; then
            echo "::error::unable to fetch pull-request comparison ancestry"
            exit 1
          fi
          # Publisher path filters use the PR head's changes since the merge
          # base. Base-only changes must not require undispatched publishers.
          if ! merge_base=$(git merge-base --all "$BASE_SHA" "$HEAD_SHA") ||
            [[ -z "$merge_base" || "$merge_base" == *$'\n'* ]]; then
            echo "::error::pull-request comparison requires one unambiguous merge base"
            exit 1
          fi
          if ! git diff --name-only "$merge_base" "$HEAD_SHA" \
            > "$CHANGED_FILES_PATH"; then
            rm -f "$CHANGED_FILES_PATH"
            echo "::error::unable to establish pull-request merge-base comparison"
            exit 1
          fi
          echo "changed files: event head compared with event merge base"

      - name: Report affected image build status
        if: ${{ !cancelled() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BUILD_STATUS_EVIDENCE_PATH: ${{ runner.temp }}/required-ci-evidence.json
          CHANGED_FILES_PATH: ${{ runner.temp }}/changed-files.txt
        with:
          script: |
            const {
              evaluateBuildImagesStatus,
            } = require('./.github/scripts/required-build-status.cjs')
            await evaluateBuildImagesStatus({ github, context, core })

      - name: Upload build status evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: required-ci-evidence
          path: ${{ runner.temp }}/required-ci-evidence.json
