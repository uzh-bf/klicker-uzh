name: Build Playwright artifacts
description: Build the shared Playwright artifact contract on either backend

inputs:
  route:
    description: Execution route reported in telemetry
    required: true
  mode:
    description: Canonical selector mode
    required: true
  cache-enabled:
    description: Whether restore-only Actions caches are enabled
    required: true

runs:
  using: composite
  steps:
    - name: Download canonical Playwright execution plan
      uses: actions/download-artifact@v4
      with:
        name: playwright-execution-plan

    - name: Validate canonical Playwright execution plan
      shell: bash
      env:
        EXPECTED_MODE: ${{ inputs.mode }}
      run: |
        node - <<'NODE'
        const fs = require('node:fs')
        const plan = JSON.parse(fs.readFileSync('playwright-execution-plan.json'))
        if (plan.mode !== process.env.EXPECTED_MODE) {
          throw new Error(`execution plan mode ${plan.mode} does not match ${process.env.EXPECTED_MODE}`)
        }
        if (plan.mode !== 'skip' && plan.shards.length !== plan.shardCount) {
          throw new Error('execution plan shard metadata is inconsistent')
        }
        NODE

    - name: Reserve trusted control path
      shell: bash
      run: |
        set -euo pipefail
        rm -rf -- "$GITHUB_WORKSPACE/.ci-control"
        test ! -e "$GITHUB_WORKSPACE/.ci-control" && test ! -L "$GITHUB_WORKSPACE/.ci-control"

    - name: Check out trusted cache contract
      uses: actions/checkout@v4
      with:
        repository: ${{ job.workflow_repository }}
        ref: ${{ job.workflow_sha }}
        path: .ci-control
        persist-credentials: false

    - name: Trust mounted workspace
      shell: bash
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Install Devrouter profile planner
      # Only a bounded plan resolves a profile; a full wave never pays for the
      # planner download.
      if: inputs.mode == 'selected'
      shell: bash
      run: bash .ci-control/.github/scripts/install-devrouter.sh

    - name: Resolve the minimum build graph
      # The resolver is the checkout's own profile runtime, so a bounded wave
      # builds exactly the applications its shards resolve at startup. Every
      # failure keeps the previous full graph.
      id: build-graph
      # Fail open to the complete graph: an unexpected resolver failure costs
      # build time, while a graph that is too small fails the shards.
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        # RUNNER_TEMP is the container-visible temp directory; runner.temp is
        # the host path and is not where this container writes.
        FILTERS_PATH="$RUNNER_TEMP/playwright-build-filters.txt"
        node .ci-control/.github/scripts/playwright-build-graph.cjs \
          --plan playwright-execution-plan.json \
          --root "$GITHUB_WORKSPACE" \
          --filters-path "$FILTERS_PATH" \
          --output "$GITHUB_OUTPUT" | tee "$RUNNER_TEMP/playwright-build-graph.json"
        {
          echo '### Playwright build graph'
          echo
          echo '```json'
          cat "$RUNNER_TEMP/playwright-build-graph.json"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Define node version
      uses: actions/setup-node@v4
      with:
        node-version-file: package.json

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11.5.0
        run_install: false

    - name: Compute cache contract
      id: cache-contract
      continue-on-error: true
      shell: bash
      run: node .ci-control/.github/scripts/playwright-cache-contract.cjs --root "$GITHUB_WORKSPACE"

    - name: Get pnpm store directory
      shell: bash
      run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

    - name: Restore pnpm cache
      if: inputs.cache-enabled == 'true' && steps.cache-contract.outcome == 'success'
      id: pnpm-cache
      continue-on-error: true
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.STORE_PATH }}
        key: playwright-${{ runner.os }}-${{ runner.arch }}-pnpm-${{ steps.cache-contract.outputs.dependency-fingerprint }}
        # The seed publishes only from v3 and its key embeds the full
        # dependency fingerprint, so any branch whose manifests differ
        # (v3-ai does) can never match exactly and installs from an empty
        # store. The pnpm store is content-addressed and verified against
        # the lockfile, so a near-match reuses compatible packages and only
        # fetches the remainder. Public readers cannot write this cache.
        restore-keys: |
          playwright-${{ runner.os }}-${{ runner.arch }}-pnpm-

    - name: Restore turbo build artifacts
      if: inputs.cache-enabled == 'true' && steps.cache-contract.outcome == 'success'
      id: turbo-cache
      continue-on-error: true
      uses: actions/cache/restore@v4
      with:
        path: .turbo
        key: playwright-${{ runner.os }}-${{ runner.arch }}-turbo-${{ steps.cache-contract.outputs.fingerprint }}-${{ github.sha }}
        restore-keys: |
          playwright-${{ runner.os }}-${{ runner.arch }}-turbo-${{ steps.cache-contract.outputs.fingerprint }}-

    - name: Install dependencies
      shell: bash
      # Runs from the trusted control checkout so a cached-store miss or a
      # transient native-binary download failure cannot fail the whole wave.
      run: bash .ci-control/.github/scripts/pnpm-install-retry.sh

    - name: Build the planned packages and apps
      id: build
      shell: bash
      run: |
        started=$(date +%s)
        set +e
        set -o pipefail
        status=0
        filters_path="$RUNNER_TEMP/playwright-build-filters.txt"
        if [ "$PLAYWRIGHT_BUILD_GRAPH" = 'bounded' ] && [ -s "$filters_path" ]; then
          # A bounded wave builds the union of the shard profiles: the same
          # filters each shard passes to `turbo run start:test`. Turbo also
          # builds their `build:test` dependencies, so the shared packages the
          # selected applications import stay in the artifact.
          mapfile -t BUILD_FILTERS < "$filters_path"
          PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH" \
            node .ci-control/.github/scripts/playwright-resource-sampler.cjs playwright-resources-build.jsonl \
            bash ./util/_with_local_test_origins.sh cross-env NODE_ENV=test turbo run build:test "${BUILD_FILTERS[@]}" --concurrency=4 2>&1 | tee turbo-build.log
          build_status=("${PIPESTATUS[@]}")
          if [ "${build_status[0]}" -ne 0 ] ||
            [ "${build_status[1]}" -ne 0 ]; then
            status=1
          fi
        else
          if [ "$PLAYWRIGHT_BUILD_GRAPH" = 'bounded' ]; then
            echo '::warning::a bounded plan arrived without usable build filters; building the complete graph'
          fi
          node .ci-control/.github/scripts/playwright-resource-sampler.cjs playwright-resources-prisma.jsonl pnpm run --filter @klicker-uzh/prisma build:test 2>&1 | tee turbo-build.log
          prisma_status=("${PIPESTATUS[@]}")
          node .ci-control/.github/scripts/playwright-resource-sampler.cjs playwright-resources-build.jsonl pnpm run build:test --concurrency=4 2>&1 | tee -a turbo-build.log
          build_status=("${PIPESTATUS[@]}")
          if [ "${prisma_status[0]}" -ne 0 ] ||
            [ "${prisma_status[1]}" -ne 0 ] ||
            [ "${build_status[0]}" -ne 0 ] ||
            [ "${build_status[1]}" -ne 0 ]; then
            status=1
          fi
        fi
        set -e
        echo "PLAYWRIGHT_DURATION_SECONDS=$(( $(date +%s) - started ))" >> "$GITHUB_ENV"
        exit "$status"
      env:
        PLAYWRIGHT_BUILD_GRAPH: ${{ steps.build-graph.outputs.mode }}
        APP_SECRET: abcd
        DATABASE_URL: postgres://klicker-prod:klicker@localhost:5432/klicker-prod
        NODE_ENV: test
        REDIS_HOST: localhost
        REDIS_PASS: ''
        REDIS_PORT: 6379
        REDIS_CACHE_HOST: localhost
        REDIS_CACHE_PORT: 6379
        REDIS_ASSESSMENT_PORT: 6379
        REDIS_ASSESSMENT_PASS: ''
        REDIS_ASSESSMENT_HOST: localhost
        APP_ORIGIN_API: http://127.0.0.1:3000
        APP_ORIGIN_AUTH: http://127.0.0.1:3010
        APP_ORIGIN_LTI: http://127.0.0.1:4000
        APP_ORIGIN_PWA: http://127.0.0.1:3001
        APP_ORIGIN_MANAGE: http://127.0.0.1:3002
        APP_ORIGIN_CONTROL: http://127.0.0.1:3003
        APP_ORIGIN_ASSESSMENT_API: http://127.0.0.1:3000
        APP_ORIGIN_ASSESSMENT_PWA: http://127.0.0.1:3001

    - name: Archive Next build outputs
      shell: bash
      run: |
        set -euo pipefail
        # A bounded wave only built the applications its profiles select, so
        # the archive carries the Next outputs that exist in this workspace.
        members=()
        for app in auth chat frontend-control frontend-manage frontend-pwa; do
          if [ -d "apps/$app/.next" ]; then
            members+=("apps/$app/.next")
          fi
        done

        if [ "${#members[@]}" -eq 0 ]; then
          # Every shard extracts this archive, so an archive that has no member
          # still has to stay readable.
          tar -cf playwright-next-builds.tar --files-from /dev/null
          exit 0
        fi

        exclusions=()
        for member in "${members[@]}"; do
          exclusions+=("--exclude=$member/cache" "--exclude=$member/standalone")
        done

        tar -cf playwright-next-builds.tar "${exclusions[@]}" "${members[@]}"

    - name: Upload Playwright build outputs
      uses: actions/upload-artifact@v4
      with:
        name: playwright-build-artifact
        path: |
          playwright-next-builds.tar
          apps/backend-docker/dist
          apps/hatchet-worker-general/dist
          apps/hatchet-worker-response-processor/dist
          apps/lti/dist
          apps/mcp-lecturer/dist
          apps/olat-api/dist
          apps/response-api/dist
          packages/*/dist
        retention-days: 1

    - name: Extract Turbo build telemetry
      if: always()
      continue-on-error: true
      shell: bash
      run: node .ci-control/.github/scripts/turbo-telemetry.cjs --log turbo-build.log

    - name: Write build telemetry
      if: always()
      continue-on-error: true
      shell: bash
      env:
        PLAYWRIGHT_TELEMETRY_PHASE: build
        PLAYWRIGHT_ROUTE: ${{ inputs.route }}
        PLAYWRIGHT_MODE: ${{ inputs.mode }}
        PLAYWRIGHT_BUILD_GRAPH_MODE: ${{ steps.build-graph.outputs.mode }}
        PLAYWRIGHT_BUILD_GRAPH_PROFILE: ${{ steps.build-graph.outputs.profile }}
        PLAYWRIGHT_BUILD_GRAPH_REASON: ${{ steps.build-graph.outputs.reason }}
        PLAYWRIGHT_CACHE_CONTRACT: ${{ steps.cache-contract.outputs.fingerprint }}
        PNPM_CACHE_HIT: ${{ steps.pnpm-cache.outputs.cache-hit }}
        PNPM_CACHE_KEY: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
        PNPM_CACHE_MATCHED_KEY: ${{ steps.pnpm-cache.outputs.cache-matched-key }}
        TURBO_CACHE_HIT: ${{ steps.turbo-cache.outputs.cache-hit }}
        TURBO_CACHE_KEY: ${{ steps.turbo-cache.outputs.cache-primary-key }}
        TURBO_CACHE_MATCHED_KEY: ${{ steps.turbo-cache.outputs.cache-matched-key }}
        PLAYWRIGHT_CONCLUSION: ${{ steps.build.outcome }}
      run: node .ci-control/.github/scripts/playwright-telemetry.cjs --output playwright-build-telemetry.json

    - name: Upload build telemetry
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: playwright-build-telemetry
        path: |
          playwright-build-telemetry.json
          playwright-resources-prisma.jsonl
          playwright-resources-build.jsonl
        if-no-files-found: ignore
        retention-days: 7
