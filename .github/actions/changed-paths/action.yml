name: Changed paths filter
description: >-
  Determine whether any changed file matches a path pattern. Uses a plain
  two-endpoint diff so it works on the default shallow checkout (a
  merge-base/three-dot diff would fail there). Fails open: if the diff cannot
  be computed, should_run is true. A pull_request edited event that only
  changed PR metadata (title or body) leaves the merge tree unchanged, so the
  suite may be skipped only when the prior status check for this head already
  succeeded; a prior failure, pending state, or API error re-runs the suite.

inputs:
  pattern:
    description: Extended regex (grep -E) matched against changed file paths
    required: true
  prior-check-name:
    description: >-
      Name of the always-reporting required-status context whose latest
      completed result on this head can validate a skip on a metadata-only
      edited event. Empty disables the skip entirely, and the calling workflow
      also needs "checks: read" for the lookup to be allowed.
    required: false
    default: ''
  records-path:
    description: >-
      Optional file path for the rename-aware records of the same changed set,
      as "git diff --name-status -z" output. Write it when a downstream
      classifier has to read the exact diff this action decided on: a rename or
      deletion reaches that classifier as such instead of as the destination
      path alone. An undeterminable diff writes nothing, which the consumer
      must read as an unproven change rather than as an empty one.
    required: false
    default: ''

outputs:
  should_run:
    description: '"true" if any changed file matches the pattern'
    value: ${{ steps.check.outputs.should_run }}
  skip_reason:
    description: 'Why the suite was skipped, when should_run is false on a metadata-only edit'
    value: ${{ steps.check.outputs.skip_reason }}
  records_path:
    description: 'Path of the written changed-path records, empty when none were written'
    value: ${{ steps.check.outputs.records_path }}

runs:
  using: composite
  steps:
    - id: check
      shell: bash
      env:
        PATTERN: ${{ inputs.pattern }}
        PRIOR_CHECK_NAME: ${{ inputs.prior-check-name }}
        RECORDS_PATH: ${{ inputs.records-path }}
        BASE_REF: ${{ github.event.pull_request.base.sha }}
        BEFORE_SHA: ${{ github.event.before }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        GITHUB_TOKEN: ${{ github.token }}
        ACTION: ${{ github.event.action }}
        EDITED_BASE_FROM: ${{ github.event.changes.base.from }}
      run: |
        # Rename-aware records for the exact endpoints the pattern matched on.
        # Only written when the caller asked for them and the diff was
        # determinable: a missing file is an unproven change to the consumer,
        # never an empty one.
        record_diff() {
          [ -n "${RECORDS_PATH:-}" ] || return 0
          if git diff --name-status -z "$1" "$2" >"$RECORDS_PATH"; then
            echo "records_path=$RECORDS_PATH" >>"$GITHUB_OUTPUT"
          else
            rm -f "$RECORDS_PATH"
          fi
        }
        PRIOR_SUCCESS=0
        MAY_SKIP=0
        if [ "$GITHUB_EVENT_NAME" = "pull_request" ] &&
          [ "$ACTION" = "edited" ] &&
          [ -z "$EDITED_BASE_FROM" ] &&
          [ -n "$PRIOR_CHECK_NAME" ]; then
          # A metadata-only edited event leaves base and head unchanged, so the
          # merge tree is identical to the tree the prior run tested. Skipping
          # is sound only when the required-status context already succeeded for
          # this head; a failure, pending state, or API error must re-run the
          # suite. Querying the terminal context rather than the suite job keeps
          # one stable name per workflow, so matrix-expanded job names are never
          # guessed. A base retarget carries changes.base.from and is never
          # metadata-only.
          MAY_SKIP=1
          if [[ "$BASE_REF" =~ ^[0-9a-f]{40}$ ]] &&
             [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            if API_BODY=$(curl -fsS \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?check_name=$PRIOR_CHECK_NAME&filter=latest&per_page=1"); then
              PRIOR_SUCCESS=$(API_BODY="$API_BODY" node -e '
                const body = JSON.parse(process.env.API_BODY)
                const run = (body.check_runs ?? []).find(
                  (item) => item.head_sha === process.env.HEAD_SHA
                )
                process.stdout.write(
                  run?.status === "completed" && run?.conclusion === "success"
                    ? "1"
                    : "0"
                )
              ' || echo 0)
            fi
          fi
        fi
        if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
          # Only shallow-fetch when the clone is already shallow. A full clone
          # (fetch-depth: 0) must retain its history for later merge-base
          # lookups. A --depth=1 fetch writes a shallow graft at the base ref;
          # on a stacked PR that ref is an ancestor of HEAD, so HEAD's own
          # history gets truncated and later merge-base lookups against
          # origin/v3 fail.
          if [ -f "$(git rev-parse --git-dir)/shallow" ]; then
            git fetch --depth=1 origin "$BASE_REF"
          else
            git fetch origin "$BASE_REF"
          fi
          diff=$(git diff --name-only "$BASE_REF" HEAD) || diff=""
          if [ -n "$diff" ]; then record_diff "$BASE_REF" HEAD; fi
        else
          # Compare the complete push, including earlier commits in a batch.
          # Missing/deleted initial refs fall back to running the suite below.
          if [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git fetch --depth=1 origin "$BEFORE_SHA" || true
            diff=$(git diff --name-only "$BEFORE_SHA" HEAD) || diff=""
            if [ -n "$diff" ]; then record_diff "$BEFORE_SHA" HEAD; fi
          else
            diff=""
          fi
        fi

        if [ -z "$diff" ]; then
          echo "Could not determine changed files; running to be safe."
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "Files changed:"
        echo "$diff"

        if echo "$diff" | grep -qE "$PATTERN"; then
          if [ "$MAY_SKIP" = "1" ] && [ "$PRIOR_SUCCESS" = "1" ]; then
            echo "Metadata-only edited event; prior completed success validates this unchanged tree."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=validated-prior-success" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi
        else
          echo "should_run=false" >> "$GITHUB_OUTPUT"
        fi
