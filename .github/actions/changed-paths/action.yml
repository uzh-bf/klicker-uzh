name: Changed paths filter
description: >-
  Determine whether any changed file matches a path pattern. Uses a plain
  two-endpoint diff so it works on the default shallow checkout (a
  merge-base/three-dot diff would fail there). Fails open: if the diff cannot
  be computed, should_run is true.

inputs:
  pattern:
    description: Extended regex (grep -E) matched against changed file paths
    required: true

outputs:
  should_run:
    description: '"true" if any changed file matches the pattern'
    value: ${{ steps.check.outputs.should_run }}

runs:
  using: composite
  steps:
    - id: check
      shell: bash
      env:
        PATTERN: ${{ inputs.pattern }}
        BASE_REF: ${{ github.base_ref }}
      run: |
        if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
          # Only shallow-fetch when the clone is already shallow. On a full
          # clone (fetch-depth: 0, as check-types needs) a --depth=1 fetch
          # writes a shallow graft at the base ref; on a stacked PR that ref
          # is an ancestor of HEAD, so HEAD's own history gets truncated and
          # later merge-base lookups against origin/v3 fail.
          if [ -f "$(git rev-parse --git-dir)/shallow" ]; then
            git fetch --depth=1 origin "$BASE_REF"
          else
            git fetch origin "$BASE_REF"
          fi
          diff=$(git diff --name-only "origin/$BASE_REF" HEAD) || diff=""
        else
          # Deepen the shallow clone so the previous commit is available
          git fetch --deepen=1 origin || true
          diff=$(git diff --name-only HEAD^ HEAD) || diff=""
        fi

        if [ -z "$diff" ]; then
          echo "Could not determine changed files; running to be safe."
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "Files changed:"
        echo "$diff"

        if echo "$diff" | grep -qE "$PATTERN"; then
          echo "should_run=true" >> "$GITHUB_OUTPUT"
        else
          echo "should_run=false" >> "$GITHUB_OUTPUT"
        fi
