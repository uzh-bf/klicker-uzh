# Grounded-answer diagnostic for answerable cases; always run the answerable
# profile separately, since the framework skips this metric with empty context.
- name: semantic_similarity
  modes: [ground-truth]
  threshold: 0.5
  criteria: "Determine how well the assistant's answer matches the expected answer in meaning (not wording)."
  evaluation_steps:
    - 'Identify the essential points in the expected answer (the information that must be present for an answer to be considered correct).'
    - "Check whether each essential point is present in the assistant's answer."
    - "Penalize missing essential points, contradictions between the assistant's answer and the expected answer."
    - 'Accept additional factual details only when supported by retrieval context and consistent with the reference; penalize unsupported claims and invented source attribution.'
    - 'Ignore stylistic differences, formatting, citations, and disclaimers unless they affect meaning.'
  evaluation_params:
    - INPUT
    - ACTUAL_OUTPUT
    - EXPECTED_OUTPUT
    - RETRIEVAL_CONTEXT

# Retrieval metrics diagnose the pipeline; they do not replace answer correctness.
- name: contextual_precision
  type: contextual_precision
  modes: [ground-truth]
  threshold: 0.7
  diagnostic: true
- name: contextual_recall
  type: contextual_recall
  modes: [ground-truth]
  threshold: 0.7
  diagnostic: true
- name: faithfulness
  type: faithfulness
  modes: [ground-truth, self-assessment]
  threshold: 0.7
  diagnostic: true
