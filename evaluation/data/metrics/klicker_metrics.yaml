- name: language_consistency
  modes: [self-assessment]
  threshold: 0.7
  criteria: 'Evaluate whether the assistant communicates in an appropriate and consistent language without inferring a language from ambiguous input.'
  evaluation_steps:
    - "Identify the user's language only when the input contains enough explicit linguistic evidence to support that judgment."
    - 'Do not infer English, German, or another language from a single greeting, interjection, name, abbreviation, emoji, symbol, code-switched fragment, or other language-ambiguous input.'
    - 'When the input is too short or ambiguous to establish a language, do not penalize the assistant for choosing a reasonable response language.'
    - "When the user's language is explicit, verify that the response generally matches it, while allowing standard technical terms, proper names, quotations, and necessary code or formulas."
    - 'Check for any inconsistent or mixed-language content. Some elements like course or original document names do not need to be translated. Assistant can also provide both original and translated names.'
    - 'If the response is in German, check if it follows Swiss German orthography rules: all “ß” must have been replaced with “ss”.'
  evaluation_params:
    - INPUT
    - ACTUAL_OUTPUT

