[project]
name = "klicker-uzh-routing-eval"
version = "0.0.1"
description = "Repeatable tier-distribution, latency, quality and cost analysis for the KlickerUZH chat Auto router."
authors = [{ name = "Roland Schlaefli", email = "roland.schlaefli@df.uzh.ch" }]
license = "AGPL-3.0"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx==0.28.1",
  "litellm==1.96.2",
  "openai==2.54.0",
  "pyyaml==6.0.3",
]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.15.18"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# The formatter owns code width; long Markdown table rows and CLI examples stay readable.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/routing_eval"]
