apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chart.fullname" . }}-secret-hatchet-worker-general
  labels:
    {{- include "chart.labels" . | nindent 4 }}
type: Opaque
stringData:
  HATCHET_CLIENT_TOKEN: {{ .Values.hatchet.client.token | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chart.fullname" . }}-secret-hatchet-worker-response-processor
  labels:
    {{- include "chart.labels" . | nindent 4 }}
type: Opaque
stringData:
  HATCHET_CLIENT_TOKEN: {{ .Values.hatchet.client.token | quote }}
  REDIS_HOST: {{ .Values.backendGraphql.redisExec.host | quote }}
  REDIS_PORT: {{ .Values.backendGraphql.redisExec.port | quote }}
  REDIS_TLS: {{ .Values.backendGraphql.redisExec.tls | quote }}
  REDIS_PASS: {{ .Values.backendGraphql.redisExec.pass | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chart.fullname" . }}-secret-hatchet-worker-response-processor-assessment
  labels:
    {{- include "chart.labels" . | nindent 4 }}
type: Opaque
stringData:
  HATCHET_CLIENT_TOKEN: {{ .Values.hatchet.client.token | quote }}
  REDIS_HOST: {{ .Values.assessment.backendGraphql.redisExec.host | quote }}
  REDIS_PORT: {{ .Values.assessment.backendGraphql.redisExec.port | quote }}
  REDIS_TLS: {{ .Values.assessment.backendGraphql.redisExec.tls | quote }}
  REDIS_PASS: {{ .Values.assessment.backendGraphql.redisExec.pass | quote }}
