heartbeats:
  dailyGroupScores: https://betteruptime.com/api/v1/heartbeat/xN8ytcTixyVXsWnNjk9ndimD

blobStorage:
  accountName: ''
  accessKey: ''

vapid:
  publicKey: ''
  privateKey: ''

cron:
  dailyGroupScores: "* * * * *" # runs every minute - overridden in deployment config
  pushNotifications: "*/5 * * * *" # runs every 5 minutes
  activityPublications: "*/5 * * * *" # runs every 5 minutes
  activityEndings: "*/5 * * * *" # runs every 5 minutes
  runningRandomGroups: "5 0 * * *" # running daily at midnight (UTC)
  finalRandomGroups: "10 0 * * *" # running daily at midnight (UTC)
  updateWeeklyTimelineEntries: "15 0 * * *" # running daily at midnight (UTC
  token: ""

auth:
  priorityClassName: staging-workload

  replicaCount: <path:keyvaultp19gA04dNy#APP_REPLICAS>
  image:
    repository: ghcr.io/uzh-bf/klicker-uzh/auth
    pullPolicy: Always
    tag: <path:keyvaultp19gA04dNy#APP-VERSION>
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  service:
    type: ClusterIP
    port: 3000

  ingress:
    enabled: true
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: 256m
      cert-manager.io/cluster-issuer: letsencrypt
    className: haproxy
    hosts:
      - host: auth.klicker-qa.example.df-app.ch
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - secretName: klicker-prod-frontend-auth-tls
        hosts:
          - auth.klicker-qa.example.df-app.ch

  strategy:
    type: RollingUpdate
    # type: Recreate

  resources:
    requests:
      cpu: 50m
      memory: 50Mi
    limits:
      cpu: 200m
      memory: 200Mi
  
  nodeSelector: {}

  tolerations: []

  affinity: {}

