backendGraphql:
  priorityClassName: staging-workload

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  replicaCount: <path:keyvaultp19gA04dNy#APP_REPLICAS>

  image:
    repository: ghcr.io/uzh-bf/klicker-uzh/backend-docker
    pullPolicy: Always
    tag: <path:keyvaultp19gA04dNy#APP-VERSION>

  service:
    type: ClusterIP
    port: 3000

  apiDomain: <path:keyvaultp19gA04dNy#API_DOMAIN>
  cookieDomain: <path:keyvaultp19gA04dNy#COOKIE_DOMAIN>
  databaseUrl: <path:keyvaultp19gA04dNy#DATABASE_URL>
  debug: true

  appManageSubdomain: <path:keyvaultp19gA04dNy#APP_MANAGE_SUBDOMAIN>
  appManageDomain: <path:keyvaultp19gA04dNy#APP_MANAGE_DOMAIN>
  appStudentSubdomain: <path:keyvaultp19gA04dNy#APP_STUDENT_SUBDOMAIN>
  appStudentDomain: <path:keyvaultp19gA04dNy#APP_STUDENT_DOMAIN>
  appControlSubdomain: <path:keyvaultp19gA04dNy#APP_CONTROL_SUBDOMAIN>
  appControlDomain: <path:keyvaultp19gA04dNy#APP_CONTROL_DOMAIN>

  notifications:
    url: <path:keyvaultp19gA04dNy#NOTIFICATION_URL>
    secret: <path:keyvaultp19gA04dNy#NOTIFICATION_SECRET>
    supportEmail: <path:keyvaultp19gA04dNy#NOTIFICATION_SUPPORT_EMAIL>

  vapid:
    publicKey: <path:keyvaultp19gA04dNy#VAPID_PUBLIC_KEY>
    privateKey: <path:keyvaultp19gA04dNy#VAPID_PRIVATE_KEY>

  redisCache:
    host: <path:keyvaultp19gA04dNy#REDIS_CACHE_HOST>
    port: <path:keyvaultp19gA04dNy#REDIS_CACHE_PORT>
    pass: <path:keyvaultp19gA04dNy#REDIS_CACHE_PASS>

  redisExec:
    host: <path:keyvaultp19gA04dNy#REDIS_HOST>
    port: <path:keyvaultp19gA04dNy#REDIS_PORT>
    tls: <path:keyvaultp19gA04dNy#REDIS_TLS>
    pass: <path:keyvaultp19gA04dNy#REDIS_PASS>

  sentryEnv: qa
  sentryDSN: <path:keyvaultp19gA04dNy#SENTRY_DSN>

  ingress:
    enabled: true
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: 256m
      cert-manager.io/cluster-issuer: letsencrypt
    className: haproxy
    hosts:
      - host: backend-sls.klicker-qa.example.df-app.ch
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - secretName: klicker-qa-backend-graphql-tls
        hosts:
          - backend-sls.klicker-qa.example.df-app.ch

  strategy:
    type: Recreate

  resources:
    requests:
      cpu: 50m
      memory: 50Mi
    limits:
      cpu: 200m
      memory: 200Mi
  
  nodeSelector: {}

  tolerations: []

  affinity: {}

