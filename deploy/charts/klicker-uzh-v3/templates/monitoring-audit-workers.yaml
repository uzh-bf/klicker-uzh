{{- if and .Values.assessmentAudit.enabled .Values.assessmentAudit.monitoring.enabled }}
{{- if or (le (int64 .Values.assessmentAudit.monitoring.deliveredUnsealedCapacityBytes) 0) (le (int64 .Values.assessmentAudit.monitoring.deliveredUnsealedGrowthBytesPerWeek) 0) }}
{{- fail "assessmentAudit.monitoring capacity and growth forecast must be positive when monitoring is enabled" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chart.fullname" . }}-assessment-audit-worker
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: assessment-audit-worker
spec:
  selector:
    {{- include "chart.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: assessment-audit-worker
  ports:
    - name: metrics
      port: 9464
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "chart.fullname" . }}-assessment-audit-worker
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: assessment-audit-worker
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.assessmentAudit.monitoring.interval }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chart.fullname" . }}-assessment-audit-media-policy-worker
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: assessment-audit-media-policy-worker
spec:
  selector:
    {{- include "chart.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: assessment-audit-media-policy-worker
  ports:
    - name: metrics
      port: 9464
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "chart.fullname" . }}-assessment-audit-media-policy-worker
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: assessment-audit-media-policy-worker
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.assessmentAudit.monitoring.interval }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "chart.fullname" . }}-assessment-audit-worker
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  groups:
    - name: assessment-audit-worker
      rules:
        - alert: AssessmentAuditMonitorHeartbeatMissing
          expr: absent(assessment_audit_monitor_last_success_timestamp_seconds{environment={{ .Values.assessmentAudit.environment | quote }},role="dispatcher"}) or (time() - max(assessment_audit_monitor_last_success_timestamp_seconds{environment={{ .Values.assessmentAudit.environment | quote }},role="dispatcher"}) > 180)
          for: 3m
          labels:
            severity: critical
            assessment_audit_route: {{ .Values.assessmentAudit.monitoring.alertRoutingLabel | quote }}
          annotations:
            summary: Assessment audit monitor heartbeat is absent or stale
        - alert: AssessmentAuditWorkerUnavailable
          expr: kube_deployment_status_replicas_available{namespace={{ .Release.Namespace | quote }},deployment={{ printf "%s-assessment-audit-worker" (include "chart.fullname" .) | quote }}} < 1
          for: 3m
          labels:
            severity: critical
            assessment_audit_route: {{ .Values.assessmentAudit.monitoring.alertRoutingLabel | quote }}
          annotations:
            summary: Assessment audit worker has no available replica
        - alert: AssessmentAuditMonitorCritical
          expr: max(assessment_audit_monitor_status{environment={{ .Values.assessmentAudit.environment | quote }},role="dispatcher"}) >= 2
          for: 1m
          labels:
            severity: critical
            assessment_audit_route: {{ .Values.assessmentAudit.monitoring.alertRoutingLabel | quote }}
          annotations:
            summary: Assessment audit monitor reports a critical signal
        - alert: AssessmentAuditMonitorWarning
          expr: max(assessment_audit_monitor_status{environment={{ .Values.assessmentAudit.environment | quote }},role="dispatcher"}) == 1
          for: 5m
          labels:
            severity: warning
            assessment_audit_route: {{ .Values.assessmentAudit.monitoring.alertRoutingLabel | quote }}
          annotations:
            summary: Assessment audit monitor reports a warning signal
        - alert: AssessmentAuditRequiredMediaCaptureFailure
          expr: max(assessment_audit_required_media_capture_failures{environment={{ .Values.assessmentAudit.environment | quote }},role="dispatcher"}) > 0
          for: 1m
          labels:
            severity: critical
            assessment_audit_route: {{ .Values.assessmentAudit.monitoring.alertRoutingLabel | quote }}
          annotations:
            summary: Assessment audit has a durable required media or baseline activation failure
        - alert: AssessmentAuditCoveredSubmissionWithoutTerminal
          expr: max(assessment_audit_covered_submissions_without_terminal{environment={{ .Values.assessmentAudit.environment | quote }},role="dispatcher"}) > 0 and max(assessment_audit_oldest_covered_submission_without_terminal_seconds{environment={{ .Values.assessmentAudit.environment | quote }},role="dispatcher"}) >= 300
          for: 1m
          labels:
            severity: critical
            assessment_audit_route: {{ .Values.assessmentAudit.monitoring.alertRoutingLabel | quote }}
          annotations:
            summary: Covered assessment submission has no terminal audit outcome
        - alert: AssessmentAuditDeliveredUnsealedCapacityLow
          expr: max(assessment_audit_delivered_unsealed_capacity_weeks_remaining{environment={{ .Values.assessmentAudit.environment | quote }},role="dispatcher"}) < 8
          for: 5m
          labels:
            severity: warning
            assessment_audit_route: {{ .Values.assessmentAudit.monitoring.alertRoutingLabel | quote }}
          annotations:
            summary: Assessment audit delivered-unsealed capacity forecast is below eight weeks
        - alert: AssessmentAuditDeliveredUnsealedCapacityCritical
          expr: max(assessment_audit_delivered_unsealed_capacity_weeks_remaining{environment={{ .Values.assessmentAudit.environment | quote }},role="dispatcher"}) < 4
          for: 1m
          labels:
            severity: critical
            assessment_audit_route: {{ .Values.assessmentAudit.monitoring.alertRoutingLabel | quote }}
          annotations:
            summary: Assessment audit delivered-unsealed capacity forecast is below four weeks
        - alert: AssessmentAuditMediaPolicyHeartbeatMissing
          expr: absent(assessment_audit_worker_started_timestamp_seconds{environment={{ .Values.assessmentAudit.environment | quote }},role="media-policy"}) or (max(assessment_audit_media_policy_last_success_timestamp_seconds{environment={{ .Values.assessmentAudit.environment | quote }},role="media-policy"}) == 0 and time() - max(assessment_audit_worker_started_timestamp_seconds{environment={{ .Values.assessmentAudit.environment | quote }},role="media-policy"}) > 129600) or (max(assessment_audit_media_policy_last_success_timestamp_seconds{environment={{ .Values.assessmentAudit.environment | quote }},role="media-policy"}) > 0 and time() - max(assessment_audit_media_policy_last_success_timestamp_seconds{environment={{ .Values.assessmentAudit.environment | quote }},role="media-policy"}) > 129600)
          for: 5m
          labels:
            severity: critical
            assessment_audit_route: {{ .Values.assessmentAudit.monitoring.alertRoutingLabel | quote }}
          annotations:
            summary: Assessment audit media-policy renewal is absent or stale
        - alert: AssessmentAuditMediaHorizonLow
          expr: min(assessment_audit_media_policy_minimum_horizon_days{environment={{ .Values.assessmentAudit.environment | quote }},role="media-policy"}) < 30 and max(assessment_audit_media_policy_last_success_timestamp_seconds{environment={{ .Values.assessmentAudit.environment | quote }},role="media-policy"}) > 0
          for: 5m
          labels:
            severity: critical
            assessment_audit_route: {{ .Values.assessmentAudit.monitoring.alertRoutingLabel | quote }}
          annotations:
            summary: Active assessment media has less than 30 days of immutable horizon
        - alert: AssessmentAuditMediaPolicyWorkerUnavailable
          expr: kube_deployment_status_replicas_available{namespace={{ .Release.Namespace | quote }},deployment={{ printf "%s-assessment-audit-media-policy-worker" (include "chart.fullname" .) | quote }}} < 1
          for: 3m
          labels:
            severity: critical
            assessment_audit_route: {{ .Values.assessmentAudit.monitoring.alertRoutingLabel | quote }}
          annotations:
            summary: Assessment audit media-policy worker has no available replica
{{- end }}
