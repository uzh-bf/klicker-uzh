{{- $fullName := include "chart.fullname" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart.fullname" . }}-config-hatchet-worker-general
  labels:
    {{- include "chart.labels" . | nindent 4 }}
data:
  HATCHET_CLIENT_TLS_STRATEGY: {{ .Values.hatchet.client.tlsStrategy | quote }}
  HATCHET_API_URL: {{ .Values.hatchet.client.apiUrl | quote }}
  # Days after Course.endDate before the scanner emits a finalization event.
  ANALYTICS_FINALIZE_GRACE_DAYS: '7'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart.fullname" . }}-config-hatchet-worker-response-processor
  labels:
    {{- include "chart.labels" . | nindent 4 }}
data:
  HATCHET_CLIENT_TLS_STRATEGY: {{ .Values.hatchet.client.tlsStrategy | quote }}
  HATCHET_API_URL: {{ .Values.hatchet.client.apiUrl | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart.fullname" . }}-config-hatchet-worker-response-processor-assessment
  labels:
    {{- include "chart.labels" . | nindent 4 }}
data:
  HATCHET_CLIENT_TLS_STRATEGY: {{ .Values.hatchet.client.tlsStrategy | quote }}
  HATCHET_API_URL: {{ .Values.hatchet.client.apiUrl | quote }}
  ASSESSMENT_MODE: 'true'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart.fullname" . }}-config-hatchet-worker-analytics
  labels:
    {{- include "chart.labels" . | nindent 4 }}
data:
  HATCHET_CLIENT_TLS_STRATEGY: {{ .Values.hatchet.client.tlsStrategy | quote }}
  HATCHET_API_URL: {{ .Values.hatchet.client.apiUrl | quote }}
  HATCHET_CLIENT_WORKER_HEALTHCHECK_ENABLED: 'true'
  HATCHET_CLIENT_WORKER_HEALTHCHECK_PORT: '8001'
