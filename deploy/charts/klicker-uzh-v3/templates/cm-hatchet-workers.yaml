{{- $fullName := include "chart.fullname" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart.fullname" . }}-config-hatchet-worker-general
  labels:
    {{- include "chart.labels" . | nindent 4 }}
data:
  HATCHET_HEALTH_PORT: {{ .Values.hatchet.workers.general.health.port | quote }}
  HATCHET_WORKFLOWS: {{ .Values.hatchet.workers.general.workflows | quote }}
  IMPORT_EXPORT_PACKAGE_STORAGE: {{ .Values.importExport.packageStorage | quote }}
  IMPORT_EXPORT_PACKAGE_TTL_HOURS: {{ .Values.importExport.packageTtlHours | quote }}
  IMPORT_EXPORT_AZURE_METADATA_TIMEOUT_MS: {{ .Values.importExport.timeouts.azureMetadataMs | quote }}
  IMPORT_EXPORT_AZURE_TRANSFER_TIMEOUT_MS: {{ .Values.importExport.timeouts.azureTransferMs | quote }}
  HATCHET_CLIENT_TLS_STRATEGY: {{ .Values.hatchet.client.tlsStrategy | quote }}
  HATCHET_API_URL: {{ .Values.hatchet.client.apiUrl | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart.fullname" . }}-config-hatchet-worker-response-processor
  labels:
    {{- include "chart.labels" . | nindent 4 }}
data:
  HATCHET_CLIENT_TLS_STRATEGY: {{ .Values.hatchet.client.tlsStrategy | quote }}
  HATCHET_API_URL: {{ .Values.hatchet.client.apiUrl | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart.fullname" . }}-config-hatchet-worker-response-processor-assessment
  labels:
    {{- include "chart.labels" . | nindent 4 }}
data:
  HATCHET_CLIENT_TLS_STRATEGY: {{ .Values.hatchet.client.tlsStrategy | quote }}
  HATCHET_API_URL: {{ .Values.hatchet.client.apiUrl | quote }}
  ASSESSMENT_MODE: 'true'
