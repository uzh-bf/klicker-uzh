{{- $fullName := include "chart.fullname" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart.fullname" . }}-config-hatchet-worker-general
  labels:
    {{- include "chart.labels" . | nindent 4 }}
data:
  CODEAPI_BASE_URL: {{ .Values.codeApi.baseUrl | quote }}
  CODEAPI_ALLOW_INSECURE_HTTP: {{ .Values.codeApi.allowInsecureHttp | quote }}
  CODEAPI_JWT_ALGORITHM: {{ .Values.codeApi.jwtAlgorithm | quote }}
  CODEAPI_JWT_TTL_SECONDS: {{ .Values.codeApi.jwtTtlSeconds | quote }}
  CODEAPI_REQUEST_TIMEOUT_MS: {{ .Values.codeApi.requestTimeoutMs | quote }}
  HATCHET_CLIENT_TLS_STRATEGY: {{ .Values.hatchet.client.tlsStrategy | quote }}
  HATCHET_API_URL: {{ .Values.hatchet.client.apiUrl | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart.fullname" . }}-config-hatchet-worker-response-processor
  labels:
    {{- include "chart.labels" . | nindent 4 }}
data:
  CODEAPI_BASE_URL: {{ .Values.codeApi.baseUrl | quote }}
  CODEAPI_ALLOW_INSECURE_HTTP: {{ .Values.codeApi.allowInsecureHttp | quote }}
  CODEAPI_JWT_ALGORITHM: {{ .Values.codeApi.jwtAlgorithm | quote }}
  CODEAPI_JWT_TTL_SECONDS: {{ .Values.codeApi.jwtTtlSeconds | quote }}
  CODEAPI_REQUEST_TIMEOUT_MS: {{ .Values.codeApi.requestTimeoutMs | quote }}
  HATCHET_CLIENT_TLS_STRATEGY: {{ .Values.hatchet.client.tlsStrategy | quote }}
  HATCHET_API_URL: {{ .Values.hatchet.client.apiUrl | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart.fullname" . }}-config-hatchet-worker-response-processor-assessment
  labels:
    {{- include "chart.labels" . | nindent 4 }}
data:
  CODEAPI_BASE_URL: {{ .Values.codeApi.baseUrl | quote }}
  CODEAPI_ALLOW_INSECURE_HTTP: {{ .Values.codeApi.allowInsecureHttp | quote }}
  CODEAPI_JWT_ALGORITHM: {{ .Values.codeApi.jwtAlgorithm | quote }}
  CODEAPI_JWT_TTL_SECONDS: {{ .Values.codeApi.jwtTtlSeconds | quote }}
  CODEAPI_REQUEST_TIMEOUT_MS: {{ .Values.codeApi.requestTimeoutMs | quote }}
  HATCHET_CLIENT_TLS_STRATEGY: {{ .Values.hatchet.client.tlsStrategy | quote }}
  HATCHET_API_URL: {{ .Values.hatchet.client.apiUrl | quote }}
  ASSESSMENT_MODE: 'true'
