{{- $fullName := include "chart.fullname" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart.fullname" . }}-config-backend-graphql
  labels:
    {{- include "chart.labels" . | nindent 4 }}
data:
  API_DOMAIN: {{ .Values.backendGraphql.apiDomain | quote }}
  APP_MANAGE_DOMAIN: {{ .Values.backendGraphql.appManageDomain | quote }}
  APP_STUDENT_DOMAIN: {{ .Values.backendGraphql.appStudentDomain | quote }}
  APP_CONTROL_DOMAIN: {{ .Values.backendGraphql.appControlDomain | quote }}
  APP_MANAGE_SUBDOMAIN: {{ .Values.backendGraphql.appManageSubdomain | quote }}
  APP_STUDENT_SUBDOMAIN: {{ .Values.backendGraphql.appStudentSubdomain | quote }}
  APP_CONTROL_SUBDOMAIN: {{ .Values.backendGraphql.appControlSubdomain | quote }}
  COOKIE_DOMAIN: {{ .Values.backendGraphql.cookieDomain | quote }}
  {{- if .Values.backendGraphql.debug }}
  DEBUG: {{ .Values.backendGraphql.debug | quote }}
  {{ end }}
  {{- if .Values.backendGraphql.kbIngestionDisabled }}
  # interim kill switch: refuses new KB content ingestion while reads/deletes/serving stay live
  KB_INGESTION_DISABLED: {{ .Values.backendGraphql.kbIngestionDisabled | quote }}
  {{ end }}
  {{- if .Values.backendGraphql.kbGraphDisabled }}
  # parked graph lifecycle: refuses new graph opt-ins and dispatches
  KB_GRAPH_DISABLED: {{ .Values.backendGraphql.kbGraphDisabled | quote }}
  {{ end }}
  {{- if .Values.heartbeats.dailyGroupScores }}
  HEARTBEAT_DAILY_GROUP_SCORES: {{ .Values.heartbeats.dailyGroupScores | quote }}
  {{ end }}
  {{- if and .Values.chat .Values.chat.modelRegistry }}
  # Shared with the chat pod (cm-chat.yaml) so the lecturer-facing model
  # allow-list offers exactly the models the chat app can actually serve.
  CHAT_MODEL_REGISTRY_JSON: {{ .Values.chat.modelRegistry | toJson | quote }}
  {{- end }}
  {{- if .Values.backendGraphql.betaSavedGroupId }}
  # Non-secret: the id of the GrowthBook saved group the beta opt-in writes to.
  # The write credential itself arrives separately through the optional
  # management Secret, which is why this belongs in the ConfigMap.
  GROWTHBOOK_BETA_SAVED_GROUP_ID: {{ .Values.backendGraphql.betaSavedGroupId | quote }}
  {{- end }}
  HATCHET_CLIENT_TLS_STRATEGY: {{ .Values.hatchet.client.tlsStrategy | quote }}
  # Deprecated - kept for backward compatibility during transition
  HATCHET_API_URL: {{ .Values.hatchet.client.apiUrl | quote }}
  {{- if .Values.backendGraphql.knowledgeGraph.host }}
  KB_FALKORDB_HOST: {{ .Values.backendGraphql.knowledgeGraph.host | quote }}
  KB_FALKORDB_PORT: {{ .Values.backendGraphql.knowledgeGraph.port | quote }}
  KB_FALKORDB_TLS: {{ .Values.backendGraphql.knowledgeGraph.tls | quote }}
  KB_FALKORDB_QUERY_TIMEOUT_MS: {{ .Values.backendGraphql.knowledgeGraph.queryTimeoutMs | quote }}
  {{- end }}
  {{- if or .Values.hatchet.kbGraph.workflowName .Values.backendGraphql.elementGeneration.enabled }}
  # Shared graph and element-generation semester quota ledger.
  KB_GRAPH_COST_CURRENCY: {{ required "backendGraphql.knowledgeGraph.cost.currency is required when graph or element generation is enabled" .Values.backendGraphql.knowledgeGraph.cost.currency | quote }}
  KB_GRAPH_STANDARD_ESTIMATE_MINOR_UNITS: {{ required "backendGraphql.knowledgeGraph.cost.standardEstimateMinorUnits is required when graph or element generation is enabled" .Values.backendGraphql.knowledgeGraph.cost.standardEstimateMinorUnits | quote }}
  KB_GRAPH_HIGH_ESTIMATE_MINOR_UNITS: {{ required "backendGraphql.knowledgeGraph.cost.highEstimateMinorUnits is required when graph or element generation is enabled" .Values.backendGraphql.knowledgeGraph.cost.highEstimateMinorUnits | quote }}
  KB_GRAPH_MAX_COST_MINOR_UNITS: {{ required "backendGraphql.knowledgeGraph.cost.maxCostMinorUnits is required when graph or element generation is enabled" .Values.backendGraphql.knowledgeGraph.cost.maxCostMinorUnits | quote }}
  KB_GRAPH_SEMESTER_QUOTA_MINOR_UNITS: {{ required "backendGraphql.knowledgeGraph.cost.semesterQuotaMinorUnits is required when graph or element generation is enabled" .Values.backendGraphql.knowledgeGraph.cost.semesterQuotaMinorUnits | quote }}
  KB_GRAPH_COST_PRICING_VERSION: {{ required "backendGraphql.knowledgeGraph.cost.pricingVersion is required when graph or element generation is enabled" .Values.backendGraphql.knowledgeGraph.cost.pricingVersion | quote }}
  KB_GRAPH_BILLING_MODE: {{ required "backendGraphql.knowledgeGraph.cost.billingMode is required when graph or element generation is enabled" .Values.backendGraphql.knowledgeGraph.cost.billingMode | quote }}
  {{- if .Values.backendGraphql.knowledgeGraph.cost.semesterKey }}
  KB_GRAPH_SEMESTER_KEY: {{ .Values.backendGraphql.knowledgeGraph.cost.semesterKey | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.backendGraphql.elementGeneration.enabled }}
  # Secret values KB_QUESTION_GENERATION_HATCHET_CLIENT_TOKEN and
  # KB_GENERATION_AZURE_STORAGE_CONNECTION_STRING come from backend-graphql.
  KB_GENERATION_HATCHET_CLIENT_HOST_PORT: {{ required "backendGraphql.elementGeneration.hatchetHostPort is required when element generation is enabled" .Values.backendGraphql.elementGeneration.hatchetHostPort | quote }}
  KB_GENERATION_HATCHET_CLIENT_SERVER_URL: {{ required "backendGraphql.elementGeneration.hatchetServerUrl is required when element generation is enabled" .Values.backendGraphql.elementGeneration.hatchetServerUrl | quote }}
  KB_GRAPH_ARTIFACT_CONTAINER: {{ required "backendGraphql.elementGeneration.graphArtifactContainer is required when element generation is enabled" .Values.backendGraphql.elementGeneration.graphArtifactContainer | quote }}
  KB_GRAPH_ARTIFACT_PREFIX: {{ required "backendGraphql.elementGeneration.graphArtifactPrefix is required when element generation is enabled" .Values.backendGraphql.elementGeneration.graphArtifactPrefix | quote }}
  KB_QUESTION_INPUT_CONTAINER: {{ required "backendGraphql.elementGeneration.inputContainer is required when element generation is enabled" .Values.backendGraphql.elementGeneration.inputContainer | quote }}
  KB_QUESTION_OUTPUT_CONTAINER: {{ required "backendGraphql.elementGeneration.outputContainer is required when element generation is enabled" .Values.backendGraphql.elementGeneration.outputContainer | quote }}
  KB_QUESTION_OUTPUT_PREFIX: {{ required "backendGraphql.elementGeneration.outputPrefix is required when element generation is enabled" .Values.backendGraphql.elementGeneration.outputPrefix | quote }}
  KB_ELEMENT_GENERATION_QUESTION_COST_MINOR_UNITS: {{ required "backendGraphql.elementGeneration.cost.questionMinorUnits is required when element generation is enabled" .Values.backendGraphql.elementGeneration.cost.questionMinorUnits | quote }}
  KB_ELEMENT_GENERATION_FLASHCARD_COST_MINOR_UNITS: {{ required "backendGraphql.elementGeneration.cost.flashcardMinorUnits is required when element generation is enabled" .Values.backendGraphql.elementGeneration.cost.flashcardMinorUnits | quote }}
  KB_ELEMENT_GENERATION_FLASHCARD_RETRY_COST_MINOR_UNITS: {{ required "backendGraphql.elementGeneration.cost.flashcardRetryMinorUnits is required when element generation is enabled" .Values.backendGraphql.elementGeneration.cost.flashcardRetryMinorUnits | quote }}
  KB_ELEMENT_GENERATION_COST_PRICING_VERSION: {{ required "backendGraphql.elementGeneration.cost.pricingVersion is required when element generation is enabled" .Values.backendGraphql.elementGeneration.cost.pricingVersion | quote }}
  {{- end }}
