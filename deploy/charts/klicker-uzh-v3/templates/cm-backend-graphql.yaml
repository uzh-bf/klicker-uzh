{{- $fullName := include "chart.fullname" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart.fullname" . }}-config-backend-graphql
  labels:
    {{- include "chart.labels" . | nindent 4 }}
data:
  API_DOMAIN: {{ .Values.backendGraphql.apiDomain | quote }}
  APP_MANAGE_DOMAIN: {{ .Values.backendGraphql.appManageDomain | quote }}
  APP_STUDENT_DOMAIN: {{ .Values.backendGraphql.appStudentDomain | quote }}
  APP_CONTROL_DOMAIN: {{ .Values.backendGraphql.appControlDomain | quote }}
  APP_MANAGE_SUBDOMAIN: {{ .Values.backendGraphql.appManageSubdomain | quote }}
  APP_STUDENT_SUBDOMAIN: {{ .Values.backendGraphql.appStudentSubdomain | quote }}
  APP_CONTROL_SUBDOMAIN: {{ .Values.backendGraphql.appControlSubdomain | quote }}
  COOKIE_DOMAIN: {{ .Values.backendGraphql.cookieDomain | quote }}
  {{- if .Values.backendGraphql.betaSavedGroupId }}
  GROWTHBOOK_BETA_SAVED_GROUP_ID: {{ .Values.backendGraphql.betaSavedGroupId | quote }}
  {{- end }}
  {{- if .Values.backendGraphql.debug }}
  DEBUG: {{ .Values.backendGraphql.debug | quote }}
  {{ end }}
  IMPORT_EXPORT_ENABLED: {{ .Values.importExport.enabled | quote }}
  IMPORT_EXPORT_PRIVATE_PREVIEW_ONLY: {{ .Values.importExport.privatePreviewOnly | quote }}
  IMPORT_EXPORT_PACKAGE_STORAGE: {{ .Values.importExport.packageStorage | quote }}
  IMPORT_EXPORT_PACKAGE_TTL_HOURS: {{ .Values.importExport.packageTtlHours | quote }}
  IMPORT_EXPORT_PACKAGE_RATE_LIMIT_WINDOW_SECONDS: {{ .Values.importExport.rateLimitWindowSeconds | quote }}
  IMPORT_EXPORT_PACKAGE_PREVIEW_RATE_LIMIT: {{ .Values.importExport.rateLimits.preview | quote }}
  IMPORT_EXPORT_PACKAGE_EXPORT_RATE_LIMIT: {{ .Values.importExport.rateLimits.export | quote }}
  IMPORT_EXPORT_PACKAGE_UPLOAD_RATE_LIMIT: {{ .Values.importExport.rateLimits.upload | quote }}
  IMPORT_EXPORT_PACKAGE_VALIDATE_RATE_LIMIT: {{ .Values.importExport.rateLimits.validate | quote }}
  IMPORT_EXPORT_PACKAGE_IMPORT_RATE_LIMIT: {{ .Values.importExport.rateLimits.import | quote }}
  IMPORT_EXPORT_PACKAGE_CONCURRENCY_LEASE_TTL_MS: {{ .Values.importExport.concurrency.leaseTtlMs | quote }}
  IMPORT_EXPORT_PACKAGE_PREVIEW_CONCURRENCY: {{ .Values.importExport.concurrency.previewPerUser | quote }}
  IMPORT_EXPORT_PACKAGE_PREVIEW_GLOBAL_CONCURRENCY: {{ .Values.importExport.concurrency.previewGlobal | quote }}
  IMPORT_EXPORT_PACKAGE_UPLOAD_CONCURRENCY: {{ .Values.importExport.concurrency.uploadPerUser | quote }}
  IMPORT_EXPORT_PACKAGE_UPLOAD_GLOBAL_CONCURRENCY: {{ .Values.importExport.concurrency.uploadGlobal | quote }}
  IMPORT_EXPORT_PACKAGE_VALIDATE_CONCURRENCY: {{ .Values.importExport.concurrency.validatePerUser | quote }}
  IMPORT_EXPORT_PACKAGE_VALIDATE_GLOBAL_CONCURRENCY: {{ .Values.importExport.concurrency.validateGlobal | quote }}
  IMPORT_EXPORT_PACKAGE_IMPORT_CONCURRENCY: {{ .Values.importExport.concurrency.importPerUser | quote }}
  IMPORT_EXPORT_PACKAGE_IMPORT_GLOBAL_CONCURRENCY: {{ .Values.importExport.concurrency.importGlobal | quote }}
  IMPORT_EXPORT_PACKAGE_EXPORT_CONCURRENCY: {{ .Values.importExport.concurrency.exportPerUser | quote }}
  IMPORT_EXPORT_PACKAGE_EXPORT_GLOBAL_CONCURRENCY: {{ .Values.importExport.concurrency.exportGlobal | quote }}
  IMPORT_EXPORT_UPLOAD_BODY_TIMEOUT_MS: {{ .Values.importExport.timeouts.uploadBodyMs | quote }}
  IMPORT_EXPORT_AZURE_METADATA_TIMEOUT_MS: {{ .Values.importExport.timeouts.azureMetadataMs | quote }}
  IMPORT_EXPORT_AZURE_TRANSFER_TIMEOUT_MS: {{ .Values.importExport.timeouts.azureTransferMs | quote }}
  {{- if .Values.heartbeats.dailyGroupScores }}
  HEARTBEAT_DAILY_GROUP_SCORES: {{ .Values.heartbeats.dailyGroupScores | quote }}
  {{ end }}
  {{- if and .Values.chat .Values.chat.modelRegistry }}
  # Shared with the chat pod (cm-chat.yaml) so the lecturer-facing model
  # allow-list offers exactly the models the chat app can actually serve.
  CHAT_MODEL_REGISTRY_JSON: {{ .Values.chat.modelRegistry | toJson | quote }}
  {{- end }}
  HATCHET_CLIENT_TLS_STRATEGY: {{ .Values.hatchet.client.tlsStrategy | quote }}
  # Deprecated - kept for backward compatibility during transition
  HATCHET_API_URL: {{ .Values.hatchet.client.apiUrl | quote }}
