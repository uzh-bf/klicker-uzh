# Assessment Frontend PDB
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "chart.fullname" . }}-frontend-assessment
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend-assessment
spec:
  minAvailable: 2
  selector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend-assessment
---
# Assessment Worker PDB
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "chart.fullname" . }}-hatchet-worker-response-processor-assessment
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: hatchet-worker-response-processor-assessment
spec:
  minAvailable: {{ .Values.hatchet.workers.responseProcessorAssessment.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: hatchet-worker-response-processor-assessment
---
# Assessment Backend GraphQL PDB
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
