apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}-response-api
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: response-api
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  revisionHistoryLimit: 5
  {{- with .Values.responseApi.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if not .Values.responseApi.autoscaling.enabled }}
  replicas: {{ .Values.responseApi.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: response-api
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/cm-response-api.yaml") . | sha256sum }}
        release: {{ .Chart.AppVersion }}
      {{- with .Values.responseApi.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "chart.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: response-api
    spec:
      priorityClassName: {{ include "chart.fullname" . }}-{{ .Values.responseApi.priorityClassName }}
      {{- with .Values.responseApi.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.responseApi.podSecurityContext | nindent 8 }}
      containers:
        - name: response-api
          securityContext:
            {{- toYaml .Values.responseApi.securityContext | nindent 12 }}
          image: "{{ .Values.responseApi.image.repository }}:{{ .Values.responseApi.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.responseApi.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 7078
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            # Standard response admission checks the durable course deletion
            # state in the same database as GraphQL. Reference the established
            # backend Secret directly so rollout cannot depend on duplicating
            # DATABASE_URL into the response-api Secret.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "chart.fullname" . }}-secret-backend-graphql
                  key: DATABASE_URL
          envFrom:
            - configMapRef:
                name: {{ include "chart.fullname" . }}-config-global
            - configMapRef:
                name: {{ include "chart.fullname" . }}-config-response-api
            - secretRef:
                name: {{ include "chart.fullname" . }}-secret-response-api
            - secretRef:
                name: {{ include "chart.fullname" . }}-secret-growthbook
                optional: true
          # TODO: add liveness and readiness probes to container
          # livenessProbe:
          #   httpGet:
          #     path: /healthz
          #     port: http
          #   initialDelaySeconds: 600
          # readinessProbe:
          #   httpGet:
          #     path: /healthz
          #     port: http
          resources:
            {{- toYaml .Values.responseApi.resources | nindent 12 }}
      {{- with .Values.responseApi.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.responseApi.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.responseApi.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
