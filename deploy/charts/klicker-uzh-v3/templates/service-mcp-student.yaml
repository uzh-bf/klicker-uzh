{{- if .Values.mcpStudent.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chart.fullname" . }}-mcp-student
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  type: {{ .Values.mcpStudent.service.type }}
  ports:
    - port: {{ .Values.mcpStudent.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "chart.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-student
{{- end }}
