{{- if .Values.frontendPWA.autoscaling.enabled }}
{{- if le (int .Values.frontendPWA.autoscaling.targetCPUUtilizationPercentage) 0 }}
{{- fail "frontendPWA.autoscaling.targetCPUUtilizationPercentage must be greater than zero when autoscaling is enabled" }}
{{- end }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "chart.fullname" . }}-frontend-pwa
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "chart.fullname" . }}-frontend-pwa
  minReplicas: {{ .Values.frontendPWA.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.frontendPWA.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.frontendPWA.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
