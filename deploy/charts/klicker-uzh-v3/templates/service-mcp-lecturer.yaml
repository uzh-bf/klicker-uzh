{{- if .Values.mcpLecturer.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chart.fullname" . }}-mcp-lecturer
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  type: {{ .Values.mcpLecturer.service.type }}
  ports:
    - port: {{ .Values.mcpLecturer.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "chart.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-lecturer
{{- end }}
