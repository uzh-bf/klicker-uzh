{{- if and .Values.mcpStudent.enabled .Values.mcpStudent.autoscaling.enabled -}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "chart.fullname" . }}-mcp-student
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "chart.fullname" . }}-mcp-student
  minReplicas: {{ .Values.mcpStudent.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.mcpStudent.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.mcpStudent.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.mcpStudent.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.mcpStudent.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.mcpStudent.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
