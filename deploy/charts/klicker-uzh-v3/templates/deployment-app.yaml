apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}-frontend-pwa
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend-pwa
spec:
  revisionHistoryLimit: 5
  {{- with .Values.frontendPWA.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if and (hasKey .Values.frontendPWA "replicaCount") (not .Values.frontendPWA.autoscaling.enabled) }}
  replicas: {{ .Values.frontendPWA.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend-pwa
  template:
    metadata:
      annotations:
        {{- include "chart.frontendPWAPodAnnotations" . | nindent 8 }}
      labels:
        {{- include "chart.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend-pwa
    spec:
      {{- include "chart.frontendPWAPodSpec" . | nindent 6 }}
      {{- with .Values.frontendPWA.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontendPWA.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontendPWA.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if .Values.frontendPWA.burst.enabled }}
{{- $burst := .Values.frontendPWA.burst }}
{{- if .Values.frontendPWA.autoscaling.enabled }}
{{- fail "frontendPWA.burst.enabled cannot be combined with frontendPWA.autoscaling.enabled" }}
{{- end }}
{{- if le (int $burst.targetCPUUtilizationPercentage) 0 }}
{{- fail "frontendPWA.burst.targetCPUUtilizationPercentage must be greater than zero when the burst tier is enabled" }}
{{- end }}
{{- if lt (int $burst.minReplicas) 1 }}
{{- fail "frontendPWA.burst.minReplicas must be at least 1 when the burst tier is enabled" }}
{{- end }}
{{- if lt (int $burst.maxReplicas) (int $burst.minReplicas) }}
{{- fail "frontendPWA.burst.maxReplicas must be greater than or equal to frontendPWA.burst.minReplicas" }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}-frontend-pwa-burst
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend-pwa
    klicker.uzh.ch/tier: burst
spec:
  revisionHistoryLimit: 5
  {{- with .Values.frontendPWA.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  # The tier label keeps baseline pods out of this selector; the baseline
  # selector cannot gain the label because selectors are immutable, so it also
  # matches burst pods. The shared component label lets the PWA Service and
  # disruption budget cover both tiers.
  selector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend-pwa
      klicker.uzh.ch/tier: burst
  template:
    metadata:
      annotations:
        {{- include "chart.frontendPWAPodAnnotations" . | nindent 8 }}
      labels:
        {{- include "chart.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend-pwa
        klicker.uzh.ch/tier: burst
    spec:
      {{- include "chart.frontendPWAPodSpec" . | nindent 6 }}
      terminationGracePeriodSeconds: {{ $burst.terminationGracePeriodSeconds }}
      # Burst pods run only on spot nodes. The baseline node scheduling values
      # are not inherited because they could place burst pods on regular
      # capacity or omit the spot taint tolerations.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.azure.com/scalesetpriority
                    operator: In
                    values:
                      - spot
      tolerations:
        - key: asyncspot
          operator: Equal
          value: reserved
          effect: NoSchedule
        - key: kubernetes.azure.com/scalesetpriority
          operator: Equal
          value: spot
          effect: NoSchedule
{{- end }}
