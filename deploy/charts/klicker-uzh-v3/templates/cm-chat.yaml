{{- $fullName := include "chart.fullname" . -}}
{{- $chatTelemetry := .Values.chat.telemetry | default dict -}}
{{- if and $chatTelemetry.baseUrl (not (hasPrefix "https://" $chatTelemetry.baseUrl)) -}}
{{- fail "chat.telemetry.baseUrl must use https://" -}}
{{- end -}}
{{- $chatTelemetryEnabled := false -}}
{{- if and $chatTelemetry (hasKey $chatTelemetry "enabled") -}}
{{- $chatTelemetryEnabled = $chatTelemetry.enabled -}}
{{- end -}}
{{- $langfuseRelease := .Values.global.imageTag | default .Values.chat.image.tag | default .Chart.AppVersion -}}
{{- with .Values.chat.podAnnotations -}}
{{- $langfuseRelease = index . "rollout.klicker.uzh.ch/release" | default $langfuseRelease -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart.fullname" . }}-config-chat
  labels:
    {{- include "chart.labels" . | nindent 4 }}
data:
  OPENAI_BASE_URL: {{ .Values.chat.openai.baseUrl | quote }}
  CHAT_OPENAI_STORE_RESPONSES: {{ .Values.chat.openai.storeResponses | default false | quote }}
  CHAT_ENABLE_AI_TELEMETRY: {{ $chatTelemetryEnabled | quote }}
  LANGFUSE_RELEASE: {{ $langfuseRelease | quote }}
  {{- if $chatTelemetry.environment }}
  LANGFUSE_TRACING_ENVIRONMENT: {{ $chatTelemetry.environment | quote }}
  {{- end }}
  {{- if $chatTelemetry.baseUrl }}
  LANGFUSE_BASE_URL: {{ $chatTelemetry.baseUrl | quote }}
  {{- end }}
  CHAT_ACCOUNT_USAGE_ENFORCEMENT_ENABLED: {{ .Values.chat.accountUsageEnforcementEnabled | default false | quote }}
  DOC_QUERY_SCOPE_ISSUER: {{ .Values.chat.docQueryScope.issuer | quote }}
  DOC_QUERY_SCOPE_AUDIENCE: {{ .Values.chat.docQueryScope.audience | quote }}
  DOC_QUERY_SCOPE_KID: {{ .Values.chat.docQueryScope.keyId | quote }}
  {{- if .Values.chat.lifecycleWritersEnabled }}
  CHAT_TURN_LIFECYCLE_WRITES_ENABLED: "true"
  {{- end }}
  {{- if .Values.chat.modelRegistry }}
  CHAT_MODEL_REGISTRY_JSON: {{ .Values.chat.modelRegistry | toJson | quote }}
  {{- end }}
  {{- if and .Values.chat.automaticModels .Values.chat.automaticModels.primaryId }}
  CHAT_PRIMARY_MODEL_ID: {{ .Values.chat.automaticModels.primaryId | quote }}
  {{- end }}
  {{- if and .Values.chat.automaticModels .Values.chat.automaticModels.fallbackId }}
  CHAT_FALLBACK_MODEL_ID: {{ .Values.chat.automaticModels.fallbackId | quote }}
  {{- end }}
  {{- if .Values.chat.allowedFrameAncestors }}
  ALLOWED_FRAME_ANCESTORS: {{ .Values.chat.allowedFrameAncestors | quote }}
  {{- end }}
  {{- if .Values.mcpStudent.enabled }}
  {{- $mcpStudentPath := printf "/%s" (trimPrefix "/" .Values.mcpStudent.path) }}
  MCP_STUDENT_SCHEME: {{ .Values.mcpStudent.service.scheme | default "http" | quote }}
  MCP_STUDENT_HOST: {{ printf "%s-mcp-student" $fullName | quote }}
  MCP_STUDENT_PORT: {{ .Values.mcpStudent.service.port | quote }}
  MCP_STUDENT_PATH: {{ $mcpStudentPath | quote }}
  {{- end }}
  {{- if .Values.mcpLecturer.enabled }}
  {{- $mcpLecturerPath := printf "/%s" (trimPrefix "/" .Values.mcpLecturer.path) }}
  MCP_LECTURER_SCHEME: {{ .Values.mcpLecturer.service.scheme | default "http" | quote }}
  MCP_LECTURER_HOST: {{ printf "%s-mcp-lecturer" $fullName | quote }}
  MCP_LECTURER_PORT: {{ .Values.mcpLecturer.service.port | quote }}
  MCP_LECTURER_PATH: {{ $mcpLecturerPath | quote }}
  {{- end }}
