{{- $fullName := include "chart.fullname" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chart.fullname" . }}-config-chat
  labels:
    {{- include "chart.labels" . | nindent 4 }}
data:
  OPENAI_BASE_URL: {{ .Values.chat.openai.baseUrl | quote }}
  CHAT_OPENAI_STORE_RESPONSES: {{ .Values.chat.openai.storeResponses | default false | quote }}
  {{- if .Values.chat.modelRegistry }}
  CHAT_MODEL_REGISTRY_JSON: {{ .Values.chat.modelRegistry | toJson | quote }}
  {{- end }}
  {{- if and .Values.chat.automaticModels .Values.chat.automaticModels.primaryId }}
  CHAT_PRIMARY_MODEL_ID: {{ .Values.chat.automaticModels.primaryId | quote }}
  {{- end }}
  {{- if and .Values.chat.automaticModels .Values.chat.automaticModels.fallbackId }}
  CHAT_FALLBACK_MODEL_ID: {{ .Values.chat.automaticModels.fallbackId | quote }}
  {{- end }}
  {{- if .Values.chat.allowedFrameAncestors }}
  ALLOWED_FRAME_ANCESTORS: {{ .Values.chat.allowedFrameAncestors | quote }}
  {{- end }}
  {{- if .Values.mcpStudent.enabled }}
  {{- $mcpStudentScheme := .Values.mcpStudent.service.scheme | default "http" }}
  {{- $mcpStudentPath := printf "/%s" (trimPrefix "/" .Values.mcpStudent.path) }}
  MCP_STUDENT_URL: {{ printf "%s://%s-mcp-student:%v%s" $mcpStudentScheme $fullName .Values.mcpStudent.service.port $mcpStudentPath | quote }}
  {{- end }}
  {{- if .Values.mcpLecturer.enabled }}
  {{- $mcpLecturerScheme := .Values.mcpLecturer.service.scheme | default "http" }}
  {{- $mcpLecturerPath := printf "/%s" (trimPrefix "/" .Values.mcpLecturer.path) }}
  MCP_LECTURER_URL: {{ printf "%s://%s-mcp-lecturer:%v%s" $mcpLecturerScheme $fullName .Values.mcpLecturer.service.port $mcpLecturerPath | quote }}
  {{- end }}
