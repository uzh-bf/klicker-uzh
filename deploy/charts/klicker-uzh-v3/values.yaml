hatchet:
  client:
    token: ""
    tlsStrategy: "none"
    apiUrl: ""
    tenantId: ""
    hostPort: ""
  workers:
    general:
      replicaCount: 1
      priorityClassName: production-workload
      image:
        repository: ghcr.io/uzh-bf/klicker-uzh/hatchet-worker-general
        pullPolicy: Always
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
      autoscaling:
        enabled: false
        minReplicas: 1
        maxReplicas: 3
        targetCPUUtilizationPercentage: 80
        targetMemoryUtilizationPercentage: 80
      nodeSelector: {}
      tolerations: []
      affinity: {}

    responseProcessor:
      replicaCount: 1
      priorityClassName: production-workload
      image:
        repository: ghcr.io/uzh-bf/klicker-uzh/hatchet-worker-response-processor
        pullPolicy: Always
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
      autoscaling:
        enabled: false
        minReplicas: 1
        maxReplicas: 3
        targetCPUUtilizationPercentage: 80
        targetMemoryUtilizationPercentage: 80
      nodeSelector: {}
      tolerations: []
      affinity: {}

    responseProcessorAssessment:
      replicaCount: 1
      priorityClassName: production-workload
      image:
        repository: ghcr.io/uzh-bf/klicker-uzh/hatchet-worker-response-processor
        pullPolicy: Always
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
      autoscaling:
        enabled: false
        minReplicas: 1
        maxReplicas: 3
        targetCPUUtilizationPercentage: 80
        targetMemoryUtilizationPercentage: 80
      nodeSelector: {}
      tolerations: []
      affinity: {}

    # Dedicated Python worker for the learning-analytics recompute pipeline.
    # Resource requests are higher than the Node-only workers because embedding
    # and UMAP/HDBSCAN run in-process during script 10. One pod and one Hatchet
    # slot keep database pressure bounded until staging measurements justify
    # more concurrency.
    analytics:
      replicaCount: 1
      priorityClassName: production-workload
      # A cold rollout prevents the retiring TypeScript bridge and the native
      # Python worker from owning the same Hatchet event during cutover.
      strategy:
        type: Recreate
      # A task can run for up to 60 minutes. Let the SDK drain the active task
      # before Kubernetes sends SIGKILL, with one minute for worker cleanup.
      terminationGracePeriodSeconds: 3660
      # Full rebuilds require an explicit maintenance-window values override.
      allowFull: false
      image:
        repository: ghcr.io/uzh-bf/klicker-uzh/hatchet-worker-analytics
        pullPolicy: Always
      podAnnotations:
        prometheus.io/scrape: 'true'
        prometheus.io/path: /metrics
        prometheus.io/port: '8001'
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          memory: 4Gi
      autoscaling:
        enabled: false
        minReplicas: 1
        maxReplicas: 1
        targetCPUUtilizationPercentage: 80
        targetMemoryUtilizationPercentage: 80
      nodeSelector: {}
      tolerations: []
      affinity: {}

