mcpStudent:
  enabled: true
  priorityClassName: production-workload

  replicaCount: 1

  path: /mcp
  questionRefTtlSeconds: 1200

  secret:
    name: ''
    appSecretKey: APP_SECRET
    # Key of the dedicated MCP token signing secret inside the same secret.
    # Empty means the service falls back to APP_SECRET, which is today the only
    # working setting: the practice tools forward the caller's own MCP token to
    # the backend GraphQL API, and the backend verifies incoming bearer tokens
    # with APP_SECRET alone. Pointing this at a genuinely different value
    # therefore breaks practice lookup, retrieval, and submission until that
    # forwarded call mints its own backend token instead.
    jwtSecretKey: ''

  image:
    repository: ghcr.io/uzh-bf/klicker-uzh/mcp-student
    pullPolicy: Always

  service:
    type: ClusterIP
    scheme: http
    port: 7080

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  nodeSelector: {}

  tolerations: []

  affinity: {}

  podSecurityContext: {}

  securityContext: {}

mcpLecturer:
  enabled: true
  priorityClassName: production-workload

  replicaCount: 1

  path: /mcp

  secret:
    appSecretName: ''
    appSecretKey: APP_SECRET
    # Key of the dedicated MCP token signing secret inside the app secret.
    # Empty means the service falls back to APP_SECRET; set it only once the
    # cluster secret actually carries the key. This service reads the database
    # directly and forwards no token onward, so the value may differ from
    # APP_SECRET without breaking anything downstream.
    jwtSecretKey: ''
    databaseName: ''
    databaseUrlKey: DATABASE_URL

  image:
