heartbeats:
  dailyGroupScores: https://betteruptime.com/api/v1/heartbeat/xN8ytcTixyVXsWnNjk9ndimD

global:
  appOrigins:
    api: 'https://api.klicker-qa.bf-app.ch'
    auth: 'https://auth.klicker-qa.bf-app.ch'
    lti: 'https://lti.klicker-qa.bf-app.ch'
    pwa: 'https://pwa.klicker-qa.bf-app.ch'
    manage: 'https://manage.klicker-qa.bf-app.ch'
    control: 'https://control.klicker-qa.bf-app.ch'
    assessmentApi: 'https://assessment-api.klicker-qa.bf-app.ch'
    assessmentPwa: 'https://assessment.klicker-qa.bf-app.ch'

hatchet:
  client:
    tlsStrategy: 'none'
    apiUrl: 'http://hatchet-qa-api:8080'
    hostPort: 'hatchet-grpc:7070'
  workers:
    general:
      replicaCount: 1
      priorityClassName: staging-workload
      image:
        repository: ghcr.io/uzh-bf/klicker-uzh/hatchet-worker-general
        pullPolicy: Always

    responseProcessor:
      replicaCount: 1
      priorityClassName: staging-workload
      image:
        repository: ghcr.io/uzh-bf/klicker-uzh/hatchet-worker-response-processor
        pullPolicy: Always

    responseProcessorAssessment:
      replicaCount: 1
      priorityClassName: staging-workload
      image:
        repository: ghcr.io/uzh-bf/klicker-uzh/hatchet-worker-response-processor
        pullPolicy: Always

auth:
  priorityClassName: staging-workload

  autoscaling:
    enabled: false

  ingress:
    hosts:
      - host: auth.klicker-qa.bf-app.ch
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - secretName: klicker-qa-frontend-auth-tls
        hosts:
          - auth.klicker-qa.bf-app.ch

  strategy:
    type: RollingUpdate
    # type: Recreate

  resources:
    requests:
      cpu: 50m
      memory: 50Mi
    limits:
      cpu: 200m
      memory: 200Mi

chat:
  priorityClassName: staging-workload

  autoscaling:
    enabled: false

  ingress:
    hosts:
      - host: chat.klicker-qa.bf-app.ch
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - secretName: klicker-qa-frontend-chat-tls
        hosts:
          - chat.klicker-qa.bf-app.ch

  strategy:
    type: RollingUpdate
    # type: Recreate

  resources:
    requests:
      cpu: 50m
      memory: 50Mi
    limits:
      cpu: 200m
      memory: 200Mi

frontendPWA:
  priorityClassName: staging-workload

  autoscaling:
    enabled: false

  image:
    tag: deploy-hatchet

  ingress:
    hosts:
      - host: pwa.klicker-qa.bf-app.ch
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - secretName: klicker-qa-frontend-pwa-tls
        hosts:
          - pwa.klicker-qa.bf-app.ch

  strategy:
    type: Recreate

  resources:
    requests:
      cpu: 50m
      memory: 50Mi
    limits:
      cpu: 200m
      memory: 200Mi

frontendManage:
  priorityClassName: staging-workload

  autoscaling:
    enabled: false

  ingress:
    hosts:
      - host: manage.klicker-qa.bf-app.ch
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - secretName: klicker-qa-frontend-manage-tls
        hosts:
          - manage.klicker-qa.bf-app.ch

  strategy:
    type: Recreate

  resources:
    requests:
      cpu: 50m
      memory: 50Mi
    limits:
      cpu: 200m
      memory: 200Mi

frontendControl:
  priorityClassName: staging-workload

  autoscaling:
    enabled: false

  ingress:
    hosts:
      - host: control.klicker-qa.bf-app.ch
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - secretName: klicker-qa-frontend-control-tls
        hosts:
          - control.klicker-qa.bf-app.ch

  strategy:
    type: Recreate

  resources:
    requests:
      cpu: 50m
      memory: 50Mi
    limits:
      cpu: 200m
      memory: 200Mi

backendGraphql:
  priorityClassName: staging-workload

  autoscaling:
    enabled: false

  appManageSubdomain: manage
  appStudentSubdomain: pwa
  appControlSubdomain: control

  ingress:
    hosts:
      - host: backend-sls.klicker-qa.bf-app.ch
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - secretName: klicker-qa-backend-graphql-tls
        hosts:
          - backend-sls.klicker-qa.bf-app.ch

  strategy:
    type: Recreate

  resources:
    requests:
      cpu: 50m
      memory: 50Mi
    limits:
      cpu: 200m
      memory: 200Mi

olatApi:
  priorityClassName: staging-workload

  autoscaling:
    enabled: false

  ingress:
    hosts:
      - host: olat-api.klicker-qa.bf-app.ch
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - secretName: klicker-qa-olat-api-tls
        hosts:
          - olat-api.klicker-qa.bf-app.ch

  strategy:
    type: Recreate

  resources:
    requests:
      cpu: 50m
      memory: 50Mi
    limits:
      cpu: 200m
      memory: 200Mi

lti:
  priorityClassName: staging-workload

  ingress:
    hosts:
      - host: lti.klicker-qa.bf-app.ch
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - secretName: klicker-qa-lti-tls
        hosts:
          - lti.klicker-qa.bf-app.ch

responseApi:
  corsAllowedOrigins: 'https://pwa.klicker-qa.bf-app.ch'

  priorityClassName: staging-workload

  replicaCount: 1

  image:
    repository: ghcr.io/uzh-bf/klicker-uzh/response-api
    pullPolicy: Always

  autoscaling:
    enabled: false

  ingress:
    hosts:
      - host: response-api.klicker-qa.bf-app.ch
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - secretName: klicker-qa-response-api-tls
        hosts:
          - response-api.klicker-qa.bf-app.ch

  strategy:
    type: Recreate

  resources:
    requests:
      cpu: 50m
      memory: 50Mi
    limits:
      cpu: 200m
      memory: 200Mi

redis:
  priorityClassName: staging-workload
  architecture: standalone
  auth:
    enabled: false

assessment:
  frontendPWA:
    priorityClassName: staging-workload

    autoscaling:
      enabled: false

    image:
      repository: ghcr.io/uzh-bf/klicker-uzh/frontend-assessment
      pullPolicy: Always

    ingress:
      hosts:
        - host: assessment.klicker-qa.bf-app.ch
          paths:
            - path: /
              pathType: ImplementationSpecific
      tls:
        - secretName: klicker-qa-frontend-assessment-tls
          hosts:
            - assessment.klicker-qa.bf-app.ch

    strategy:
      type: Recreate

    resources:
      requests:
        cpu: 50m
        memory: 50Mi
      limits:
        cpu: 200m
        memory: 200Mi

  backendGraphql:
    priorityClassName: staging-workload

    autoscaling:
      enabled: false

    appManageSubdomain: manage
    appStudentSubdomain: assessment
    appControlSubdomain: control

    # Enable dual Redis mode for parallel testing
    dualRedisMode: true

    # Preserve Redis data after quiz ends for comparison
    preserveRedisForComparison: true

    ingress:
      hosts:
        - host: assessment-api.klicker-qa.bf-app.ch
          paths:
            - path: /
              pathType: ImplementationSpecific
      tls:
        - secretName: klicker-qa-backend-assessment-tls
          hosts:
            - assessment-api.klicker-qa.bf-app.ch

    strategy:
      type: Recreate

    resources:
      requests:
        cpu: 50m
        memory: 50Mi
      limits:
        cpu: 200m
        memory: 200Mi

  responseApi:
    corsAllowedOrigins: 'https://assessment.klicker-qa.bf-app.ch'

    priorityClassName: staging-workload

    replicaCount: 1

    autoscaling:
      enabled: false

    ingress:
      hosts:
        - host: response-api-assessment.klicker-qa.bf-app.ch
          paths:
            - path: /
              pathType: ImplementationSpecific
      tls:
        - secretName: klicker-qa-response-api-assessment-tls
          hosts:
            - response-api-assessment.klicker-qa.bf-app.ch

    strategy:
      type: Recreate

    resources:
      requests:
        cpu: 50m
        memory: 50Mi
      limits:
        cpu: 200m
        memory: 200Mi
