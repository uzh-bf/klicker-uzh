heartbeats:
  dailyGroupScores: https://betteruptime.com/api/v1/heartbeat/xN8ytcTixyVXsWnNjk9ndimD

hatchet:
  client:
    tlsStrategy: 'none'
  workers:
    general:
      replicaCount: 1
      priorityClassName: staging-workload
      image:
        repository: ghcr.io/uzh-bf/klicker-uzh/hatchet-worker-general
        tag: deploy-hatchet
        pullPolicy: Always

    responseProcessor:
      replicaCount: 1
      priorityClassName: staging-workload
      image:
        repository: ghcr.io/uzh-bf/klicker-uzh/hatchet-worker-response-processor
        tag: deploy-hatchet
        pullPolicy: Always

auth:
  priorityClassName: staging-workload

  autoscaling:
    enabled: false

  ingress:
    hosts:
      - host: auth.klicker-qa.bf-app.ch
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - secretName: klicker-prod-frontend-auth-tls
        hosts:
          - auth.klicker-qa.bf-app.ch

  strategy:
    type: RollingUpdate
    # type: Recreate

  resources:
    requests:
      cpu: 50m
      memory: 50Mi
    limits:
      cpu: 200m
      memory: 200Mi

