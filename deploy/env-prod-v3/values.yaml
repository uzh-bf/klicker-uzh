  priorityClassName: production-workload

  replicaCount: 2

  image:
    repository: ghcr.io/uzh-bf/klicker-uzh/response-api
    pullPolicy: Always

  autoscaling:
    enabled: false

  ingress:
    hosts:
      - host: chat.klicker.uzh.ch
        paths:
          - path: /
            pathType: ImplementationSpecific
      - host: response-api.klicker.uzh.ch
        paths:
