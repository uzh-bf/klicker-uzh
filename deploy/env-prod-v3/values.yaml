heartbeats:
  dailyGroupScores: https://betteruptime.com/api/v1/heartbeat/xN8ytcTixyVXsWnNjk9ndimD

auth:
  priorityClassName: production-workload

  autoscaling:
    enabled: false

  ingress:
    className: haproxy
    hosts:
      - host: auth.klicker-prod.prd.example.df-app.ch
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - secretName: klicker-prod-frontend-auth-tls
        hosts:
          - auth.klicker-prod.prd.example.df-app.ch

  strategy:
    type: RollingUpdate
    # type: Recreate

  resources:
    requests:
      cpu: 50m
      memory: 50Mi
    limits:
      cpu: 200m
      memory: 200Mi

