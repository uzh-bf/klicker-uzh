            pathType: ImplementationSpecific
    tls:
      - secretName: klicker-prod-response-api-tls
        hosts:
          - chat.klicker.uzh.ch
          - response-api.klicker.uzh.ch

  strategy:
    type: Recreate

  resources:
    requests:
      cpu: 50m
      memory: 50Mi
    limits:
      cpu: 200m
      memory: 200Mi

redis:
  auth:
