heartbeats:
  dailyGroupScores: https://betteruptime.com/api/v1/heartbeat/xN8ytcTixyVXsWnNjk9ndimD

aiGeneration:
  url: 'http://10.8.2.146:8000/ai/generate'

  priorityClassName: staging-workload

  autoscaling:
    enabled: false

  ingress:
    hosts:
      - host: ai-generation.klicker-mp.bf-app.ch
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - secretName: klicker-mp-ai-generation-tls
        hosts:
          - ai-generation.klicker-mp.bf-app.ch

  strategy:
    type: RollingUpdate
    # type: Recreate

  resources:
    requests:
      cpu: 50m
      memory: 50Mi
    limits:
      cpu: 200m
      memory: 200Mi

