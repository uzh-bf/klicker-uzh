dfDomain: df-app.ch

heartbeats:
  dailyGroupScores: https://betteruptime.com/api/v1/heartbeat/xN8ytcTixyVXsWnNjk9ndimD

global:
  appOrigins:
    api: 'https://api.klicker.prd.df-app.ch'
    auth: 'https://auth.klicker.prd.df-app.ch'
    lti: 'https://lti.klicker.prd.df-app.ch'
    pwa: 'https://pwa.klicker.prd.df-app.ch'
    manage: 'https://manage.klicker.prd.df-app.ch'
    control: 'https://control.klicker.prd.df-app.ch'
    assessmentApi: 'https://assessment-api.klicker.prd.df-app.ch'
    assessmentPwa: 'https://assessment.klicker.prd.df-app.ch'

hatchet:
  client:
    tlsStrategy: 'none'
    apiUrl: 'http://hatchet-qa-api:8080'
  workers:
    general:
      replicaCount: 2
      priorityClassName: production-workload
      image:
        repository: ghcr.io/uzh-bf/klicker-uzh/hatchet-worker-general-prd-arm
        pullPolicy: Always
        tag: v3-clean-argocd
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - hatchet-worker-general
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: hatchet-worker-general
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: hatchet-worker-general

    responseProcessor:
      replicaCount: 4
      priorityClassName: production-workload
      image:
        repository: ghcr.io/uzh-bf/klicker-uzh/hatchet-worker-response-processor-prd-arm
        pullPolicy: Always
        tag: v3-clean-argocd
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - hatchet-worker-response-processor
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: hatchet-worker-response-processor
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: hatchet-worker-response-processor

    responseProcessorAssessment:
      replicaCount: 4
      priorityClassName: production-workload
      image:
        repository: ghcr.io/uzh-bf/klicker-uzh/hatchet-worker-response-processor-prd-arm
        pullPolicy: Always
        tag: v3-clean-argocd
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - hatchet-worker-response-processor-assessment
                topologyKey: kubernetes.io/hostname
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: klickerasm
                    operator: In
                    values:
                      - reserved
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: hatchet-worker-response-processor-assessment
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: hatchet-worker-response-processor-assessment
      tolerations:
        - key: klickerasm
          operator: Equal
          value: reserved
          effect: NoSchedule

auth:
  priorityClassName: production-workload

  replicaCount: 3

  autoscaling:
    enabled: false

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - auth
            topologyKey: kubernetes.io/hostname

  image:
    repository: ghcr.io/uzh-bf/klicker-uzh/auth-prd-arm
    pullPolicy: Always
    tag: v3-clean-argocd

  ingress:
    annotations:
      cert-manager.io/cluster-issuer: k8s-crt-mgr-iss-prd-apps-default
    className: haproxy
    hosts:
      - host: auth.klicker.prd.df-app.ch
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - secretName: klicker-frontend-auth-tls
        hosts:
          - auth.klicker.prd.df-app.ch

  strategy:
    type: RollingUpdate
    # type: Recreate

  resources:
    requests:
      cpu: 50m
      memory: 50Mi
    limits:
      cpu: 200m
      memory: 200Mi

