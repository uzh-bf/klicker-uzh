chat:
  allowedFrameAncestors: 'https://*.klicker.uzh.ch https://lms.uzh.ch https://*.olat.uzh.ch https://elearning.klicker.uzh.ch https://*.df-app.ch'
  priorityClassName: production-workload

  openai:
    baseUrl: 'http://litellm.prd-litellm.svc.cluster.local:4000/v1'
    storeResponses: true

  telemetry:
    enabled: false

  replicaCount: 1

  autoscaling:
    enabled: false

  automaticModels:
    primaryId: auto
    fallbackId: gpt-4.1-mini

  modelRegistry:
    # "Auto" routes through the LiteLLM auto-router, which self-selects the
    # tier per request (SIMPLE=gpt-5.6-luna-medium, MEDIUM=gpt-5.6-luna-high,
    # COMPLEX=gpt-5.6-luna-xhigh, REASONING=gpt-5.6-sol-medium; match_threshold
    # 0.55). It is a normal selectable model (fallback: false) and is also the
    # global automatic-model primary. Chatbots using automatic model selection
    # therefore use Auto by default; explicit model selections remain respected.
    # A chatbot can be pinned to Auto-only via its DB columns
    # (modelSelection=false + allowedModelIds=["auto"]).
    # cost mirrors the gpt-5.6-luna tier (the typical COMPLEX route); REASONING
    # (gpt-5.6-sol-medium) is rare. Tune if the routed mix shifts.
    - id: auto
      deploymentId: klickeruzh/azure/auto-router
      name: Auto
      description: Automatic model selection (routes to the best model per request)
      supportsImageAttachments: true
      usesResponsesApi: true
      fallback: false
      cost:
        input: 1.25
        output: 10.0
    - id: gpt-4.1
      deploymentId: klickeruzh/azure/gpt-4.1
      name: GPT-4.1
      description: OpenAI model
      supportsImageAttachments: true
      fallback: false
      cost:
        input: 2.0
        output: 8.0
    - id: gpt-5.1
      deploymentId: klickeruzh/azure/gpt-5.1
      name: GPT-5.1
      description: OpenAI reasoning model
      supportsImageAttachments: true
      supportsReasoning: true
      supportedReasoningEfforts:
        - none
        - minimal
        - low
        - medium
        - high
      fallback: false
      cost:
        input: 1.25
        output: 10.0
    - id: gpt-5.4
      deploymentId: klickeruzh/azure/gpt-5.4
      name: GPT-5.4
      description: OpenAI reasoning model
      supportsImageAttachments: true
      supportsReasoning: true
      supportedReasoningEfforts:
        - minimal
        - low
        - medium
        - high
        - xhigh
      fallback: false
      cost:
        input: 1.25
        output: 10.0
    - id: gpt-5.5
      deploymentId: klickeruzh/azure/gpt-5.5
      name: GPT-5.5
      description: OpenAI reasoning model
      supportsImageAttachments: true
      supportsReasoning: true
      supportedReasoningEfforts:
        - none
        - minimal
        - low
        - medium
        - high
        - xhigh
      fallback: false
      cost:
        input: 5.0
        output: 30.0
    - id: gpt-4.1-mini
      deploymentId: klickeruzh/azure/gpt-4.1-mini
      name: GPT-4.1 Mini
      description: Small OpenAI model
      supportsImageAttachments: true
      fallback: true
      cost:
        input: 0.4
        output: 1.6

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - chat
            topologyKey: kubernetes.io/hostname
  image:
    repository: ghcr.io/uzh-bf/klicker-uzh/chat-arm
    pullPolicy: IfNotPresent
    tag: v3.4.0-alpha.70

  ingress:
    annotations:
      cert-manager.io/cluster-issuer: k8s-crt-mgr-iss-prd-apps-default
    className: haproxy
    hosts:
      - host: chat.klicker.uzh.ch
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - secretName: klicker-frontend-chat-tls
        hosts:
          - chat.klicker.uzh.ch

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  resources:
    requests:
      cpu: 50m
      memory: 250Mi
    limits:
      cpu: 200m
      memory: 1Gi

