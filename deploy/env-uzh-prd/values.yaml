              topologyKey: kubernetes.io/hostname
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: klickerasm
                  operator: In
                  values:
                    - reserved
    tolerations:
      - key: klickerasm
        operator: Equal
        value: reserved
        effect: NoSchedule

    image:
      repository: ghcr.io/uzh-bf/klicker-uzh/response-api-arm
      pullPolicy: IfNotPresent
      tag: v3.4.0-alpha.70

    ingress:
      className: haproxy
      annotations:
        cert-manager.io/cluster-issuer: k8s-crt-mgr-iss-prd-apps-default
      hosts:
        - host: assessment-response-api.klicker.uzh.ch
          paths:
            - path: /
              pathType: ImplementationSpecific
      tls:
        - secretName: klicker-response-api-assessment-tls
          hosts:
            - assessment-response-api.klicker.uzh.ch

    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
        maxSurge: 1

    resources:
      requests:
        cpu: 50m
        memory: 50Mi
      limits:
        memory: 512Mi

# Migration hook image: only the repo is pinned; the tag auto-tracks the
# backendGraphql image tag above (see chart job-migrate.yaml).
#
# DISABLED UNTIL THE FIRST POST-HOOK RELEASE. No migrator image exists for any
# release tag cut before this feature landed, so while backendGraphql.image.tag
# still points at such a tag the hook would fail on ImagePullBackOff and abort
# every prd sync — including a rollback to an older tag. Flip this to true in the
# same commit that bumps the prd image tags to the first release whose CI built
# `backend-docker-migrator-arm`. Until then prd migrations stay manual
# (`prisma:deploy:prod`). Rolling back to a pre-hook tag requires setting this
# back to false. See docs/data-and-migrations.md → Recovering a failed hook.
migrator:
  enabled: true
  priorityClassName: production-workload
  image:
    repository: ghcr.io/uzh-bf/klicker-uzh/backend-docker-migrator-arm
    pullPolicy: IfNotPresent
