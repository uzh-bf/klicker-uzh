          memory: 64Mi
        limits:
          memory: 512Mi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - hatchet-worker-response-processor
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: hatchet-worker-response-processor
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: hatchet-worker-response-processor

    responseProcessorAssessment:
      replicaCount: 4
      priorityClassName: production-workload
      image:
        repository: ghcr.io/uzh-bf/klicker-uzh/hatchet-worker-response-processor-arm
        pullPolicy: IfNotPresent
        tag: v3.4.0-alpha.70
      resources:
        requests:
