        pullPolicy: Always
        tag: v3
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - hatchet-worker-response-processor
                topologyKey: kubernetes.io/hostname

    responseProcessorAssessment:
      replicaCount: 1
      priorityClassName: staging-workload
      podAnnotations:
        rollout.klicker.uzh.ch/release: 'v3.4.0-alpha.64'
      image:
        repository: ghcr.io/uzh-bf/klicker-uzh/hatchet-worker-response-processor-arm
        pullPolicy: Always
        tag: v3
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - hatchet-worker-response-processor-assessment
                topologyKey: kubernetes.io/hostname
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: klickerasm
                    operator: In
                    values:
                      - reserved
      tolerations:
        - key: klickerasm
          operator: Equal
          value: reserved
          effect: NoSchedule

