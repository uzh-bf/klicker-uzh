chat:
  allowedFrameAncestors: 'https://*.df-app.ch https://*.olat.uzh.ch https://lms.uzh.ch'
  priorityClassName: staging-workload
  podAnnotations:
    rollout.klicker.uzh.ch/release: 'v3.4.0-alpha.64'

  openai:
    baseUrl: 'http://litellm.stg-litellm.svc.cluster.local:4000/v1'
    storeResponses: true

  telemetry:
    enabled: false

  automaticModels:
    primaryId: gpt-5.5
    fallbackId: gpt-4.1-mini

  modelRegistry:
    # "Auto" routes through the LiteLLM complexity-router, which self-selects the
    # tier per request (SIMPLE=gpt-4.1, MEDIUM=gpt-5.4-low, COMPLEX=gpt-5.4-medium,
    # REASONING=gpt-5.5-low). It is a normal selectable model (fallback: false), so
    # it does NOT change automatic selection for existing chatbots — they still
    # default to gpt-5.5. A chatbot can be pinned to Auto-only via its DB columns
    # (modelSelection=false + allowedModelIds=["auto"]); see the vorkurs chatbot.
    # cost mirrors the gpt-5.4 tier (the typical COMPLEX route); REASONING (gpt-5.5)
    # is rare. Tune if the routed mix shifts.
    - id: auto
      deploymentId: klickeruzh/azure/complexity-router
      name: Auto
      description: Automatic model selection (routes to the best model per request)
      supportsImageAttachments: true
      fallback: false
      cost:
        input: 1.25
        output: 10.0
    - id: gpt-4.1
      deploymentId: klickeruzh/azure/gpt-4.1
      name: GPT-4.1
      description: OpenAI model
      supportsImageAttachments: true
      fallback: false
      cost:
        input: 2.0
        output: 8.0
    - id: gpt-5.1
      deploymentId: klickeruzh/azure/gpt-5.1
      name: GPT-5.1
      description: OpenAI reasoning model
      supportsImageAttachments: true
      supportsReasoning: true
      supportedReasoningEfforts:
        - none
        - minimal
        - low
        - medium
        - high
      fallback: false
      cost:
        input: 1.25
        output: 10.0
    - id: gpt-5.4
      deploymentId: klickeruzh/azure/gpt-5.4
      name: GPT-5.4
      description: OpenAI reasoning model
      supportsImageAttachments: true
      supportsReasoning: true
      supportedReasoningEfforts:
        - minimal
        - low
        - medium
        - high
        - xhigh
      fallback: false
      cost:
        input: 1.25
        output: 10.0
    - id: gpt-5.5
      deploymentId: klickeruzh/azure/gpt-5.5
      name: GPT-5.5
      description: OpenAI reasoning model
      supportsImageAttachments: true
      supportsReasoning: true
      supportedReasoningEfforts:
        - minimal
        - low
        - medium
        - high
        - xhigh
      fallback: false
      cost:
        input: 5.0
        output: 30.0
    - id: gpt-4.1-mini
      deploymentId: klickeruzh/azure/gpt-4.1-mini
      name: GPT-4.1 Mini
      description: Small OpenAI model
      supportsImageAttachments: true
      fallback: true
      cost:
        input: 0.4
        output: 1.6

  replicaCount: 1

  autoscaling:
    enabled: false

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - chat
            topologyKey: kubernetes.io/hostname

  image:
    repository: ghcr.io/uzh-bf/klicker-uzh/chat-arm
    pullPolicy: Always
    tag: v3

  ingress:
    annotations:
      cert-manager.io/cluster-issuer: k8s-crt-mgr-iss-stg-apps-default
    className: haproxy
    hosts:
      - host: chat.klicker.stg.df-app.ch
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - secretName: klicker-frontend-chat-tls
        hosts:
          - chat.klicker.stg.df-app.ch

  strategy:
    type: RollingUpdate
    # type: Recreate

  resources:
    requests:
      cpu: 50m
      memory: 50Mi
    limits:
      cpu: 200m
      memory: 200Mi

