chat:
  allowedFrameAncestors: 'https://*.df-app.ch https://*.olat.uzh.ch https://lms.uzh.ch'
  priorityClassName: staging-workload
  podAnnotations:
    rollout.klicker.uzh.ch/release: '09da961233ce'

  openai:
    baseUrl: 'http://litellm.stg-litellm.svc.cluster.local:4000/v1'
    storeResponses: true

  telemetry:
    enabled: false

  automaticModels:
    primaryId: auto
    fallbackId: gpt-5.6-luna

  modelRegistry:
    # "Auto" routes through the LiteLLM auto-router, which self-selects the
    # tier per request (SIMPLE=gpt-5.6-luna-medium, MEDIUM=gpt-5.6-luna-high,
    # COMPLEX=gpt-5.6-luna-xhigh, REASONING=gpt-5.6-sol-medium; match_threshold
    # 0.55). It is a normal selectable model (fallback: false) and is also the
    # global automatic-model primary. Chatbots using automatic model selection
    # therefore use Auto by default; explicit model selections remain respected.
    # A chatbot can be pinned to Auto-only via its DB columns
    # (modelSelection=false + allowedModelIds=["auto"]); see the vorkurs chatbot.
    # The accounting rate is the accepted rounded blend for an observed
    # generation mix of about 90% Luna and 10% Sol. Classifier and embedding
    # overhead remain outside the registry's selected-model token fields.
    - id: auto
      deploymentId: klickeruzh/azure/auto-router
      name: Auto
      description: Automatic model selection (routes to the best model per request)
      supportsImageAttachments: true
      usesResponsesApi: true
      fallback: false
      usageClass: ADVANCED
      maxOutputTokens: 4096
      cost:
        input: 1.0
        output: 5.0
    - id: gpt-5.6-luna
      deploymentId: klickeruzh/azure/gpt-5.6-luna
      name: GPT-5.6 Luna
      description: OpenAI reasoning model
      supportsImageAttachments: true
      supportsReasoning: true
      supportedReasoningEfforts:
        - low
        - medium
        - high
        - xhigh
      fallback: true
      usageClass: BASE
      maxOutputTokens: 4096
      cost:
        input: 0.2
        output: 1.2
    - id: gpt-4.1
      deploymentId: klickeruzh/azure/gpt-4.1
      name: GPT-4.1
      description: OpenAI model
      supportsImageAttachments: true
      fallback: false
      usageClass: ADVANCED
      maxOutputTokens: 4096
      cost:
        input: 2.0
        output: 8.0
    - id: gpt-5.1
      deploymentId: klickeruzh/azure/gpt-5.1
      name: GPT-5.1
      description: OpenAI reasoning model
      supportsImageAttachments: true
      supportsReasoning: true
      supportedReasoningEfforts:
        - none
        - minimal
        - low
        - medium
        - high
      fallback: false
      usageClass: ADVANCED
      maxOutputTokens: 4096
      cost:
        input: 1.25
        output: 10.0
    - id: gpt-5.4
      deploymentId: klickeruzh/azure/gpt-5.4
      name: GPT-5.4
      description: OpenAI reasoning model
      supportsImageAttachments: true
      supportsReasoning: true
      supportedReasoningEfforts:
        - minimal
        - low
        - medium
        - high
        - xhigh
      fallback: false
      usageClass: ADVANCED
      maxOutputTokens: 4096
      cost:
        input: 2.5
        output: 15.0
    - id: gpt-5.5
      deploymentId: klickeruzh/azure/gpt-5.5
      name: GPT-5.5
      description: OpenAI reasoning model
      supportsImageAttachments: true
      supportsReasoning: true
      supportedReasoningEfforts:
        - minimal
        - low
        - medium
        - high
        - xhigh
      fallback: false
      usageClass: ADVANCED
      maxOutputTokens: 4096
      cost:
        input: 5.0
        output: 30.0
    - id: gpt-4.1-mini
      deploymentId: klickeruzh/azure/gpt-4.1-mini
      name: GPT-4.1 Mini
      description: Small OpenAI model
      supportsImageAttachments: true
      fallback: false
      usageClass: ADVANCED
      maxOutputTokens: 4096
      cost:
        input: 0.4
        output: 1.6

  replicaCount: 1

  autoscaling:
    enabled: false

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - chat
            topologyKey: kubernetes.io/hostname

  image:
    repository: ghcr.io/uzh-bf/klicker-uzh/chat-arm
    pullPolicy: Always
    tag: v3-ai

  ingress:
    annotations:
      cert-manager.io/cluster-issuer: k8s-crt-mgr-iss-stg-apps-default
    className: haproxy
    hosts:
      - host: chat.klicker.stg.df-app.ch
        paths:
