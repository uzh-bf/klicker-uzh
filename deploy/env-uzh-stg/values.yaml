      memory: 50Mi
    limits:
      cpu: 200m
      memory: 200Mi

assessment:
  frontendPWA:
    priorityClassName: staging-workload

    autoscaling:
      enabled: false

    image:
      repository: ghcr.io/uzh-bf/klicker-uzh/frontend-assessment
      tag: clean-argocd

    ingress:
      className: haproxy
      annotations:
        cert-manager.io/cluster-issuer: k8s-crt-mgr-iss-stg-apps-default
      hosts:
        - host: assessment.klicker-qa.stg.df-app.ch
          paths:
            - path: /
              pathType: ImplementationSpecific
      tls:
        - secretName: klicker-qa-frontend-assessment-tls
          hosts:
            - assessment.klicker-qa.stg.df-app.ch

    strategy:
      type: Recreate

    resources:
      requests:
        cpu: 50m
        memory: 50Mi
      limits:
        cpu: 200m
        memory: 200Mi

  backendGraphql:
    priorityClassName: staging-workload

    autoscaling:
      enabled: false

    image:
      tag: clean-argocd

    appManageSubdomain: manage
    appStudentSubdomain: assessment
    appControlSubdomain: control

    debug: true
    apiDomain: backend-sls.klicker-qa.stg.df-app.ch
    appManageDomain: manage.klicker-qa.stg.df-app.ch
    appStudentDomain: assessment.klicker-qa.stg.df-app.ch
    appControlDomain: control.klicker-qa.stg.df-app.ch
    cookieDomain: .klicker-qa.stg.df-app.ch

    # Enable dual Redis mode for parallel testing
    dualRedisMode: true

    # Preserve Redis data after quiz ends for comparison
    preserveRedisForComparison: true

    ingress:
      className: haproxy
      annotations:
        cert-manager.io/cluster-issuer: k8s-crt-mgr-iss-stg-apps-default
      hosts:
        - host: assessment-api.klicker-qa.stg.df-app.ch
          paths:
            - path: /
              pathType: ImplementationSpecific
      tls:
        - secretName: klicker-qa-backend-assessment-tls
          hosts:
            - assessment-api.klicker-qa.stg.df-app.ch

    strategy:
      type: Recreate

    resources:
      requests:
        cpu: 50m
        memory: 50Mi
      limits:
        cpu: 200m
        memory: 200Mi

  responseApi:
    corsAllowedOrigins: 'https://assessment.klicker-qa.stg.df-app.ch'

    priorityClassName: staging-workload

    replicaCount: 1

    autoscaling:
      enabled: false

    image:
      tag: clean-argocd

    ingress:
      className: haproxy
      annotations:
        cert-manager.io/cluster-issuer: k8s-crt-mgr-iss-stg-apps-default
      hosts:
        - host: response-api-assessment.klicker-qa.stg.df-app.ch
          paths:
            - path: /
              pathType: ImplementationSpecific
      tls:
        - secretName: klicker-qa-response-api-assessment-tls
          hosts:
            - response-api-assessment.klicker-qa.stg.df-app.ch

    strategy:
      type: Recreate

    resources:
      requests:
        cpu: 50m
        memory: 50Mi
      limits:
        cpu: 200m
        memory: 200Mi
