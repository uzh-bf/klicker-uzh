  name: OLAT UZH
  authEndpoint: https://exp.olat.uzh.ch/lti/auth
  tokenEndpoint: https://exp.olat.uzh.ch/lti/token
  keysEndpoint: https://exp.olat.uzh.ch/lti/keys
