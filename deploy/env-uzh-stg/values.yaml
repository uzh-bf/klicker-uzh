      podAnnotations:
        rollout.klicker.uzh.ch/release: '09da961233ce'
      image:
        repository: ghcr.io/uzh-bf/klicker-uzh/hatchet-worker-response-processor-arm
        pullPolicy: Always
        tag: v3-ai
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - hatchet-worker-response-processor-assessment
                topologyKey: kubernetes.io/hostname
        nodeAffinity:
