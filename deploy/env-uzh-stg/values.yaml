dfDomain: stg.df-app.ch

heartbeats:
  dailyGroupScores: https://betteruptime.com/api/v1/heartbeat/xN8ytcTixyVXsWnNjk9ndimD

global:
  appOrigins:
    api: 'https://api.klicker-qa.stg.df-app.ch'
    auth: 'https://auth.klicker-qa.stg.df-app.ch'
    lti: 'https://lti.klicker-qa.stg.df-app.ch'
    pwa: 'https://pwa.klicker-qa.stg.df-app.ch'
    manage: 'https://manage.klicker-qa.stg.df-app.ch'
    control: 'https://control.klicker-qa.stg.df-app.ch'
    assessmentApi: 'https://assessment-api.klicker-qa.stg.df-app.ch'
    assessmentPwa: 'https://assessment.klicker-qa.stg.df-app.ch'

hatchet:
  client:
    tlsStrategy: 'none'
    apiUrl: 'http://hatchet-qa-api:8080'
  workers:
    general:
      replicaCount: 1
      priorityClassName: staging-workload
      image:
        repository: ghcr.io/uzh-bf/klicker-uzh/hatchet-worker-general
        pullPolicy: Always
        tag: clean-argocd

    responseProcessor:
      replicaCount: 1
      priorityClassName: staging-workload
      image:
        repository: ghcr.io/uzh-bf/klicker-uzh/hatchet-worker-response-processor
        pullPolicy: Always
        tag: clean-argocd

auth:
  priorityClassName: staging-workload

  autoscaling:
    enabled: false

  image:
    tag: clean-argocd

  ingress:
    annotations:
      cert-manager.io/cluster-issuer: k8s-crt-mgr-iss-stg-apps-default
    className: haproxy
    hosts:
      - host: auth.klicker-qa.stg.df-app.ch
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - secretName: klicker-frontend-auth-tls
        hosts:
          - auth.klicker-qa.stg.df-app.ch

  strategy:
    type: RollingUpdate
    # type: Recreate

  resources:
    requests:
      cpu: 50m
      memory: 50Mi
    limits:
      cpu: 200m
      memory: 200Mi

