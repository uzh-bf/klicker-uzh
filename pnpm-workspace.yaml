packages:
  - apps/*
  - packages/*
  - cypress
  - playwright

# Delay automated dependency resolution for newly published packages by 14 days
# to reduce exposure to compromised releases. Manual emergency exceptions should
# be exact package/version selectors reviewed with the matching package.json bump.
minimumReleaseAge: 20160
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: true
minimumReleaseAgeExclude:
  # Exact security fix exception; published 2026-05-26, inside the 14-day window.
  - tmp@0.2.6

overrides:
  '@apollo/server@>=4.2.0 <4.13.0': 4.13.0
  '@babel/plugin-transform-modules-systemjs@>=7.12.0 <=7.29.3': 7.29.4
