packages:
  - apps/*
  - packages/*
  - playwright

# Do not let pnpm repair stale links before the host launcher can control the
# exact stop, install, and runtime-reconciliation order.
verifyDepsBeforeRun: error

# Delay automated dependency resolution for newly published packages by 14 days
# to reduce exposure to compromised releases. Manual emergency exceptions should
# be exact package/version selectors reviewed with the matching package.json bump.
minimumReleaseAge: 20160
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExclude:
  # Reviewed Next.js 16.3.4 release train; keep the 14-day policy for other releases.
  - 'next@16.3.4'
  - 'eslint-config-next@16.3.4'
  - '@next/env@16.3.4'
  - '@next/eslint-plugin-next@16.3.4'
  - '@next/swc-darwin-x64@16.3.4'
  - '@next/swc-darwin-arm64@16.3.4'
  - '@next/swc-linux-x64-gnu@16.3.4'
  - '@next/swc-linux-x64-musl@16.3.4'
  - '@next/swc-win32-x64-msvc@16.3.4'
  - '@next/swc-linux-arm64-gnu@16.3.4'
  - '@next/swc-linux-arm64-musl@16.3.4'
  - '@next/swc-win32-arm64-msvc@16.3.4'
  # Internal UZH design-system release: the exact 4.1.8 consumer bump is
  # reviewed and verified in this PR.
  - '@uzh-bf/design-system@4.1.8'
  # U1 (student-chat-v3-production-readiness-plan): reviewed assistant-ui 0.14
  # bump, apps/chat/package.json. Transitive assistant-ui deps pulled in below.
  - '@assistant-ui/react@0.14.27'
  - '@assistant-ui/react-markdown@0.14.6'
  - '@assistant-ui/core@0.2.21'
  - '@assistant-ui/tap@0.9.4'
  - 'assistant-cloud@0.1.35'
  - 'assistant-stream@0.3.26'
  - 'nanoid@6.0.0'
  - 'safe-content-frame@0.0.23'
  # U2 (student-chat-v3-production-readiness-plan): reviewed Vercel AI SDK 7
  # bump, apps/chat/package.json (ai, @ai-sdk/openai, @ai-sdk/mcp). Transitive
  # @ai-sdk deps pulled in below.
  # U3 (vorkurs-chatbot-sdk-fix): the exact reviewed patch train is unioned
  # with the prior U2 versions because the first package-name rule wins.
  - 'ai@7.0.37||7.0.52'
  - '@ai-sdk/openai@4.0.20||4.0.30'
  - '@ai-sdk/mcp@2.0.16||2.0.25'
  - '@ai-sdk/gateway@4.0.28||4.0.41'
  - '@ai-sdk/provider-utils@5.0.12||5.0.21'
  - '@ai-sdk/provider@4.0.5'

overrides:
  # Every entry left here still changes the resolution of the locked graph: a
  # dependency range resolves below the patched release, or the entry pins a
  # line for lockstep/consolidation reasons. The 2026-09-14/15 image-scan batch
  # was re-audited on 2026-09-19 against the locked graph and the registry: the
  # lifts for axios 1.x, brace-expansion, browserslist, fast-uri,
  # fast-xml-parser, form-data, @grpc/grpc-js, ip-address, nanoid, protobufjs,
  # sharp, systeminformation, tmp, validator and ws now resolve at or above
  # their patched release without the pin, so they were dropped rather than
  # kept as stale drift. Re-audit with the klicker-dependency-overrides skill
  # before adding or removing an entry.
  #
  # The coverage provider is loaded by the workspace's vitest 3.2.4 and refuses
  # to run against a different version, so both are pinned to that same
  # release in lockstep instead of floating to the newest matching 3.2.x.
  '@vitest/coverage-v8': 3.2.4
  'vitest': 3.2.4
  # azure identity, msal-node and adal-node ask for axios ^0.21.1, an island
  # below the patched 0.32.0 line.
  'axios@<=0.31.1': 0.32.0
  # react-email 3.0.7 pins glob 10.3.4 and next 15.1.2; next 15.5.24 in turn
  # pins postcss 8.4.31, and styled-components 6.1.19 pins postcss 8.4.49.
  'glob@>=10.2.0 <10.5.0': 10.5.0
  'next@>=15.0.0 <15.5.24': 15.5.24
  'postcss@>=8.0.0 <8.5.18': 8.5.18
  # prisma 7.8.0 pins mysql2 3.15.3 and ltijs-sequelize asks for ^2.2.5.
  'mysql2@<3.22.0': 3.22.0
  # express 4.21.2 pins path-to-regexp 0.1.12.
  'path-to-regexp@>=0.1.0 <0.1.13': 0.1.13
  # @graphql-codegen/plugin-helpers asks for lodash ~4.17.0, below 4.18.1.
  'lodash@>=4.17.0 <4.18.1': 4.18.1
  # These advisories have no fix inside the older major line, so the pin has to
  # cross it: deepmerge-ts is consumed by Prisma config loading (exact 7.1.5),
  # nodemailer by the transactional email transport while @auth/core and
  # next-auth peer at ^7.0.7, and propagator-jaeger only by the OpenTelemetry
  # tracing setup of the Hatchet SDK (sdk-trace-node 1.26.0).
  'deepmerge-ts@>=7.0.0 <8.0.0': 8.0.0
  'nodemailer@>=6.0.0 <9.1.0': 9.1.0
  '@opentelemetry/propagator-jaeger@>=1.0.0 <2.9.0': 2.9.0
  # The next-intl peer-context hash includes @babel/core; a 7.28.3/7.28.6 split
  # gave packages/shared-components and the frontends different translation
  # contexts. Consolidate the patch line so every importer resolves one copy.
  '@babel/core@>=7.28.0 <7.29.0': 7.28.6

packageExtensions:
  # The published stylesheet imports this plugin, but 4.1.8 lists it only as a devDependency.
  '@uzh-bf/design-system@4.1.8':
    dependencies:
      '@tailwindcss/aspect-ratio': 0.4.2
  'recharts@2.15.3':
    peerDependencies:
      '@types/react': '*'

ignoredBuiltDependencies:
  - '@microsoft/teamsapp-cli'
  # Devrouter's Docker transport can use these optional native SSH helpers, but
  # profile planning has no Docker or SSH path and must not build them in CI.
  - cpu-features
  - keytar
  # Transitive of fastmcp -> mcp-proxy -> pipenet. Its install script refreshes a
  # public-suffix list we never consult; neither MCP service uses pipenet.
  - tldjs
  - ssh2

onlyBuiltDependencies:
  - '@apollo/protobufjs'
  - '@hatchet-dev/typescript-sdk'
  - '@prisma/client'
  - '@prisma/engines'
  - '@swc/core'
  - '@tailwindcss/oxide'
  - azure-functions-core-tools
  - core-js
  - core-js-pure
  - esbuild
  - prisma
  - protobufjs
  - sharp
  - unrs-resolver

allowBuilds:
  '@apollo/protobufjs': true
  '@hatchet-dev/typescript-sdk': true
  '@microsoft/teamsapp-cli': false
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  '@tailwindcss/oxide': true
  azure-functions-core-tools: true
  core-js: true
  core-js-pure: true
  cpu-features: false
  esbuild: true
  keytar: false
  prisma: true
  protobufjs: true
  sharp: true
  ssh2: false
  tldjs: false
  unrs-resolver: true
