packages:
  - apps/*
  - packages/*
  - playwright

# Do not let pnpm repair stale links before the host launcher can control the
# exact stop, install, and runtime-reconciliation order.
verifyDepsBeforeRun: error

# Delay automated dependency resolution for newly published packages by 14 days
# to reduce exposure to compromised releases. Manual emergency exceptions should
# be exact package/version selectors reviewed with the matching package.json bump.
minimumReleaseAge: 20160
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExclude:
  # Reviewed security fix for CVE-2026-93749 (indexed source map DoS): bounds
  # section offsets plus a CSP-safe sort fallback, same sole maintainer, no
  # install scripts. Drop once it ages past the 14-day window.
  - 'source-map-js@1.2.2'
  # Reviewed security fixes for the 2026-10-06 backend image scan: sharp
  # 0.35.5 (GHSA-wq5f-xc86-pv6w) and the MCP SDK 1.31.0 (CVE-2026-104850,
  # GHSA-6qxp-vccf-f47h). Drop once both age past the 14-day window.
  - 'sharp@0.35.5'
  # Platform binaries published with that sharp release.
  - '@img/sharp-darwin-arm64@0.35.5'
  - '@img/sharp-darwin-x64@0.35.5'
  - '@img/sharp-freebsd-wasm32@0.35.5'
  - '@img/sharp-libvips-darwin-arm64@1.3.4'
  - '@img/sharp-libvips-darwin-x64@1.3.4'
  - '@img/sharp-libvips-linux-arm64@1.3.4'
  - '@img/sharp-libvips-linux-arm@1.3.4'
  - '@img/sharp-libvips-linux-ppc64@1.3.4'
  - '@img/sharp-libvips-linux-riscv64@1.3.4'
  - '@img/sharp-libvips-linux-s390x@1.3.4'
  - '@img/sharp-libvips-linux-x64@1.3.4'
  - '@img/sharp-libvips-linuxmusl-arm64@1.3.4'
  - '@img/sharp-libvips-linuxmusl-x64@1.3.4'
  - '@img/sharp-linux-arm64@0.35.5'
  - '@img/sharp-linux-arm@0.35.5'
  - '@img/sharp-linux-ppc64@0.35.5'
  - '@img/sharp-linux-riscv64@0.35.5'
  - '@img/sharp-linux-s390x@0.35.5'
  - '@img/sharp-linux-x64@0.35.5'
  - '@img/sharp-linuxmusl-arm64@0.35.5'
  - '@img/sharp-linuxmusl-x64@0.35.5'
  - '@img/sharp-wasm32@0.35.5'
